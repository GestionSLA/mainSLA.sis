name: Bot ITEC - Cargar y lotear

on:
  workflow_dispatch:
    inputs:
      caja_id:
        description: 'ID interno de la caja (Supabase)'
        required: true
      numero_caja:
        description: 'Número de caja'
        required: true
      material:
        description: 'Código de material de las SIMs'
        required: true
      sim_desde:
        description: 'ICCID desde'
        required: true
      sim_hasta:
        description: 'ICCID hasta'
        required: true
      cantidad:
        description: 'Cantidad total de SIMs de la caja'
        required: true

jobs:
  cargar:
    runs-on: self-hosted   # misma PC que el Bot NEXO
    timeout-minutes: 15
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Instalar dependencias
        run: |
          py -3.12 -m pip install playwright requests
          py -3.12 -m playwright install chromium

      - name: Ejecutar bot ITEC (Etapas 1 y 2)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          CAJA_ID: ${{ github.event.inputs.caja_id }}
          NUMERO_CAJA: ${{ github.event.inputs.numero_caja }}
          MATERIAL: ${{ github.event.inputs.material }}
          SIM_DESDE: ${{ github.event.inputs.sim_desde }}
          SIM_HASTA: ${{ github.event.inputs.sim_hasta }}
          CANTIDAD: ${{ github.event.inputs.cantidad }}
          PYTHONIOENCODING: "utf-8"
        run: py -3.12 bot_nexo/bot_itec_cargar.py

      - name: Subir capturas de pantalla y log técnico (siempre, para poder diagnosticar)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capturas-itec-${{ github.event.inputs.numero_caja }}-${{ github.run_id }}
          path: |
            bot_nexo/capturas_itec/*.png
            bot_nexo/log_fallos_itec.txt
          retention-days: 14
          if-no-files-found: ignore
