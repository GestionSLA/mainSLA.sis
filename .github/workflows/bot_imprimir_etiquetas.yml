name: Bot Imprimir Etiquetas

on:
  workflow_dispatch:
    inputs:
      caja_id:
        description: 'ID interno de la caja (Supabase)'
        required: true
      numero_caja:
        description: 'Número de caja'
        required: true

jobs:
  imprimir:
    runs-on: self-hosted   # misma PC del runner, donde está conectada la Brother QL-800
    timeout-minutes: 30    # puede ser bastante si son 500 etiquetas seguidas
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Instalar dependencias
        run: |
          py -3.12 -m pip install brother_ql pillow requests pyusb

      - name: Ejecutar bot de impresión de etiquetas
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          CAJA_ID: ${{ github.event.inputs.caja_id }}
          NUMERO_CAJA: ${{ github.event.inputs.numero_caja }}
          PYTHONIOENCODING: "utf-8"
        run: py -3.12 bot_nexo/bot_imprimir_etiquetas.py

      - name: Subir log técnico (siempre, para poder diagnosticar)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: log-etiquetas-${{ github.event.inputs.numero_caja }}-${{ github.run_id }}
          path: bot_nexo/log_fallos_etiquetas.txt
          retention-days: 14
          if-no-files-found: ignore
