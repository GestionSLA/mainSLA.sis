name: Bot Caminantes - Recaudado diario (planilla)

on:
  workflow_dispatch: {}   # el disparo diario ya no es por cron propio — lo
                          # dispara bot_caminantes_walkerstock (Bot 1) al
                          # terminar con éxito. Esto queda para pruebas
                          # manuales o disparo directo desde GestionSLA.

jobs:
  recaudado:
    runs-on: ubuntu-latest   # no toca portales de Claro — no necesita self-hosted
    timeout-minutes: 10
    steps:
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: pip install gspread google-auth requests tzdata

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Ejecutar bot de recaudado
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GOOGLE_SHEETS_CREDENTIALS: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS }}
          PYTHONIOENCODING: "utf-8"
          PYTHONUTF8: "1"
        run: python caminantes/bot_caminantes_recaudado.py
