name: Bot Caminantes - Catalogo y Stock (WalkerStock)

on:
  workflow_dispatch: {}
  schedule:
    - cron: '0 18 * * *'   # 15:00 Argentina (UTC-3) = 18:00 UTC

permissions:
  contents: read
  actions: write   # necesario para poder disparar bot_caminantes_entregado y bot_caminantes_recaudado

jobs:
  walkerstock:
    runs-on: self-hosted   # ITEC bloquea por IP el acceso desde la nube de GitHub
                            # (mismo motivo que NEXO/Webcom) — confirmado empíricamente:
                            # en ubuntu-latest la página nunca respondía (timeout total).
    timeout-minutes: 30
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Asegurar que pip esté disponible
        run: python -m ensurepip --upgrade

      - name: Instalar dependencias
        run: |
          python -m pip install playwright requests
          python -m playwright install chromium

      - name: Ejecutar bot
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PYTHONIOENCODING: "utf-8"
          PYTHONUTF8: "1"
        run: python caminantes/bot_caminantes_walkerstock.py

      - name: Subir capturas (siempre, para diagnóstico)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capturas-caminantes-walkerstock-${{ github.run_id }}
          path: |
            caminantes/capturas_caminantes/*.png
            caminantes/capturas_caminantes/*.html
          retention-days: 14
          if-no-files-found: ignore
