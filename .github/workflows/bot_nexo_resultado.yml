name: Bot NEXO - Revisar resultados

on:
  schedule:
    - cron: '*/15 * * * *'   # cada 15 minutos
  workflow_dispatch:          # permite dispararlo a mano para probar, o para forzar
    inputs:                   # una recuperación manual por GLP puntual
      archivo:
        description: 'Recuperación manual — nombre de archivo tal cual figura en NEXO (dejar vacío para la corrida normal)'
        required: false
        default: ''
      desde:
        description: 'Recuperación manual — Fecha Desde (YYYY-MM-DD)'
        required: false
        default: ''
      hasta:
        description: 'Recuperación manual — Fecha Hasta (YYYY-MM-DD, máximo 15 días desde "desde")'
        required: false
        default: ''

permissions:
  contents: write   # necesario para poder borrar los CSV ya procesados de nexo_uploads/

jobs:
  revisar:
    # Antes corría en ubuntu-latest (nube) — funcionaba porque solo hacía IMAP.
    # Ahora también entra a NEXO con Playwright para la recuperación por GLP, y
    # eso SOLO funciona desde la red de Claro (mismo motivo que bot_nexo_subir.py
    # ya tiene documentado: NEXO bloquea el acceso desde la nube de GitHub).
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Configurar Python (no depende del Python instalado en la PC/servicio)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Asegurar que pip esté disponible
        run: python -m ensurepip --upgrade

      - name: Instalar dependencias
        run: |
          python -m pip install requests playwright
          python -m playwright install chromium

      - name: Ejecutar bot de resultados
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PYTHONIOENCODING: "utf-8"
          RECUPERAR_ARCHIVO: ${{ github.event.inputs.archivo }}
          RECUPERAR_DESDE: ${{ github.event.inputs.desde }}
          RECUPERAR_HASTA: ${{ github.event.inputs.hasta }}
        run: python bot_nexo/bot_nexo_resultado.py

      - name: Subir capturas de la recuperación por GLP (si hubo alguna, para diagnóstico)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capturas-recuperacion-nexo-${{ github.run_id }}
          path: bot_nexo/capturas_recuperacion/*.png
          retention-days: 14
          if-no-files-found: ignore
