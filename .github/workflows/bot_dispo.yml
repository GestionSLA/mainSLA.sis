name: Bot Dispo — Actualizar Disponibilidad SAP

on:
  workflow_dispatch:  # Manual desde GestionSLA o GitHub
  schedule:
    # Lunes a viernes 7:00 AM Argentina (UTC-3 → 10:00 UTC)
    - cron: '0 10 * * 1-5'

jobs:
  actualizar-disponibilidad:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python setup
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: |
          pip install playwright requests
          playwright install chromium --with-deps

      - name: Ejecutar bot Dispo
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY_SECRET }}
        run: python bot_dispo.py

      - name: Resultado
        if: always()
        run: echo "✅ Bot Dispo finalizado"
