name: Bot Dispo — Actualizar Disponibilidad SAP

on:
  workflow_dispatch:
  schedule:
    # 7:00 a 16:00 hora Argentina (UTC-3), cada 1:30hs — mismos días de
    # siempre (lunes a viernes). Dos líneas porque cron no tiene forma
    # nativa de expresar un paso de 1.5hs, así que se listan los 7
    # horarios exactos directamente:
    #   07:00, 08:30, 10:00, 11:30, 13:00, 14:30, 16:00 (hora Argentina)
    - cron: '0 10,13,16,19 * * 1-5'   # 07:00, 10:00, 13:00, 16:00 ART
    - cron: '30 11,14,17 * * 1-5'     # 08:30, 11:30, 14:30 ART

jobs:
  actualizar-disponibilidad:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python setup
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: |
          pip install playwright requests
          playwright install chromium --with-deps

      - name: Ejecutar bot Dispo
        env:
          SUPABASE_KEY_SECRET: ${{ secrets.SUPABASE_KEY_SECRET }}
        run: python bot_dispo.py

      - name: Guardar estado OK en Supabase
        if: success()
        env:
          SUPABASE_KEY_SECRET: ${{ secrets.SUPABASE_KEY_SECRET }}
        run: |
          python -c "
          import os,json,urllib.request
          url='https://iebfyjbkmjuicrrbezbi.supabase.co/rest/v1/configuracion?id=eq.global'
          key=os.environ['SUPABASE_KEY_SECRET']
          data=json.dumps({'dispo_bot_estado':'ok','dispo_bot_mensaje':'Completado correctamente'}).encode()
          req=urllib.request.Request(url,data=data,method='PATCH',headers={'apikey':key,'Authorization':'Bearer '+key,'Content-Type':'application/json','Prefer':'return=minimal'})
          urllib.request.urlopen(req,timeout=10)
          print('Estado OK guardado')
          "

      - name: Guardar estado ERROR en Supabase
        if: failure()
        env:
          SUPABASE_KEY_SECRET: ${{ secrets.SUPABASE_KEY_SECRET }}
        run: |
          python -c "
          import os,json,urllib.request
          url='https://iebfyjbkmjuicrrbezbi.supabase.co/rest/v1/configuracion?id=eq.global'
          key=os.environ['SUPABASE_KEY_SECRET']
          data=json.dumps({'dispo_bot_estado':'error','dispo_bot_mensaje':'El bot falló — ver GitHub Actions para detalles'}).encode()
          req=urllib.request.Request(url,data=data,method='PATCH',headers={'apikey':key,'Authorization':'Bearer '+key,'Content-Type':'application/json','Prefer':'return=minimal'})
          urllib.request.urlopen(req,timeout=10)
          print('Estado ERROR guardado')
          " || true
