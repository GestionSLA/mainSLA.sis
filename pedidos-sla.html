<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PedidosSLA — Solicitud de Equipos</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --azul:#6366f1;--azul-s:#ede9fe;--verde:#16a34a;--verde-s:#dcfce7;
      --amarillo:#d97706;--amarillo-s:#fef3c7;--rojo:#dc2626;--rojo-s:#fee2e2;
      --morado:#9333ea;--morado-s:#ede9fe;
      --gris-100:#f1f5f9;--gris-200:#e2e8f0;--gris-400:#94a3b8;--gris-600:#475569;--gris-900:#0f172a;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Nunito',sans-serif;background:#f8fafc;color:var(--gris-900);min-height:100vh}
    .header{background:linear-gradient(135deg,#6366f1,#8b5cf6);color:white;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(99,102,241,.3)}
    .header h1{font-size:17px;font-weight:800}
    .header .pv-info{font-size:12px;opacity:.85}
    .btn-logout{background:rgba(255,255,255,.2);border:none;color:white;padding:6px 12px;border-radius:6px;cursor:pointer;font-size:12px;font-family:inherit}
    .login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#6366f1,#8b5cf6);padding:20px}
    .login-card{background:white;border-radius:16px;padding:32px;width:100%;max-width:380px;box-shadow:0 20px 60px rgba(0,0,0,.2);text-align:center}
    .login-card .logo{font-size:40px;margin-bottom:8px}
    .login-card h2{font-size:22px;font-weight:800;margin-bottom:4px}
    .login-card p{font-size:13px;color:var(--gris-400);margin-bottom:24px}
    .form-group{margin-bottom:16px;text-align:left}
    .form-group label{font-size:12px;font-weight:700;color:var(--gris-600);display:block;margin-bottom:4px}
    .form-group input{width:100%;padding:10px 14px;border:1.5px solid var(--gris-200);border-radius:8px;font-size:15px;font-family:inherit;outline:none}
    .form-group input:focus{border-color:var(--azul)}
    .btn{width:100%;padding:12px;border:none;border-radius:8px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit}
    .btn-primary{background:var(--azul);color:white}
    .btn-primary:disabled{opacity:.6;cursor:not-allowed}
    .error-msg{color:var(--rojo);font-size:12px;margin-top:8px;display:none}
    .main{max-width:700px;margin:0 auto;padding:20px}
    .card{background:white;border-radius:12px;box-shadow:0 2px 12px rgba(0,0,0,.08);margin-bottom:16px;overflow:hidden}
    .card-header{padding:14px 18px;border-bottom:1px solid var(--gris-100);font-weight:700;font-size:15px}
    .card-body{padding:16px 18px}
    .badge{display:inline-block;padding:4px 12px;border-radius:20px;font-size:12px;font-weight:700}
    .badge-nuevo{background:var(--amarillo-s);color:var(--amarillo)}
    .badge-transito{background:#e0f2fe;color:#0891b2}
    .badge-demorado{background:var(--rojo-s);color:var(--rojo)}
    .badge-parcial{background:var(--morado-s);color:var(--morado)}
    .badge-recibido{background:var(--verde-s);color:var(--verde)}
    .dispo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;margin-bottom:16px}
    .dispo-item{border:1.5px solid var(--gris-200);border-radius:10px;padding:12px;transition:all .15s}
    .dispo-item.sel{border-color:var(--azul);background:var(--azul-s)}
    .dispo-item .nombre{font-size:12px;font-weight:700;margin-bottom:2px}
    .dispo-item .marca{font-size:11px;color:var(--gris-400);margin-bottom:8px}
    .qty-ctrl{display:flex;align-items:center;gap:8px;margin-top:8px}
    .qty-btn{width:28px;height:28px;border:1px solid var(--gris-200);border-radius:6px;background:white;cursor:pointer;font-size:15px;font-weight:700}
    .qty-num{font-size:14px;font-weight:800;min-width:20px;text-align:center}
    .obs-input{width:100%;padding:10px 12px;border:1.5px solid var(--gris-200);border-radius:8px;font-size:13px;font-family:inherit;resize:vertical;min-height:70px;outline:none}
    .obs-input:focus{border-color:var(--azul)}
    .pedido-row{padding:12px 0;border-bottom:1px solid var(--gris-100)}
    .pedido-row:last-child{border-bottom:none}
    .empty{text-align:center;padding:32px;color:var(--gris-400)}
    .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1e293b;color:white;padding:10px 20px;border-radius:8px;font-size:13px;font-weight:600;z-index:9999;animation:fi .2s;box-shadow:0 4px 20px rgba(0,0,0,.2)}
    @keyframes fi{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
    .loading{text-align:center;padding:40px;color:var(--gris-400)}
    .spinner{width:32px;height:32px;border:3px solid var(--gris-200);border-top-color:var(--azul);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px}
    @keyframes spin{to{transform:rotate(360deg)}}
    .tabs{display:flex;gap:4px;margin-bottom:16px;background:var(--gris-100);padding:4px;border-radius:10px}
    .tab-btn{flex:1;padding:8px;border:none;background:transparent;border-radius:7px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;color:var(--gris-600)}
    .tab-btn.active{background:white;color:var(--azul);box-shadow:0 1px 4px rgba(0,0,0,.1)}
    .btn-sm{padding:8px 18px;font-size:13px;border-radius:6px;border:none;cursor:pointer;font-family:inherit;font-weight:700}
    .btn-verde{background:var(--verde);color:white}
    .btn-verde:disabled{opacity:.5;cursor:not-allowed}
    .nro-sap{font-family:monospace;font-size:12px;font-weight:700;color:#0891b2}
  </style>
</head>
<body>

<div id="login-screen" class="login-screen">
  <div class="login-card">
    <div class="logo">📦</div>
    <h2>PedidosSLA</h2>
    <p>Ingresá tu número de entidad para acceder</p>
    <div class="form-group">
      <label>Número de Entidad</label>
      <input type="text" id="inp-entidad" placeholder="Ej: 100001"
        onkeydown="if(event.key==='Enter') iniciarSesion()" />
    </div>
    <button class="btn btn-primary" id="btn-login" onclick="iniciarSesion()">Ingresar</button>
    <p class="error-msg" id="login-error">Entidad no encontrada. Verificá el número.</p>
  </div>
</div>

<div id="app-screen" style="display:none">
  <div class="header">
    <div>
      <h1>📦 PedidosSLA</h1>
      <div class="pv-info" id="pv-nombre-header">—</div>
    </div>
    <button class="btn-logout" onclick="cerrarSesion()">Salir</button>
  </div>
  <div class="main">
    <div id="app-loading" class="loading"><div class="spinner"></div><p>Cargando...</p></div>
    <div id="app-content" style="display:none"></div>
  </div>
</div>

<script>
const SB_URL = 'https://iebfyjbkmjuicrrbezbi.supabase.co';
const SB_KEY = 'sb_publishable_zi7bb1bTdazL5dwGu7-t8w_xp-MoPnl';
let PV_ACTUAL=null, DISPO=[], DISPO_FECHA=null, SELECCION={}, PEDIDOS_PV=[], VISTA='pedidos', MARCA_FILTRO='';

async function sbGet(t,f=''){
  const r=await fetch(SB_URL+'/rest/v1/'+t+f,{headers:{apikey:SB_KEY,Authorization:'Bearer '+SB_KEY}});
  if(!r.ok)throw new Error(await r.text());return r.json();
}
async function sbPost(t,d){
  const r=await fetch(SB_URL+'/rest/v1/'+t,{method:'POST',
    headers:{apikey:SB_KEY,Authorization:'Bearer '+SB_KEY,'Content-Type':'application/json',Prefer:'return=representation'},
    body:JSON.stringify(d)});
  if(!r.ok)throw new Error(await r.text());return r.json();
}

function toast(msg,tipo='ok'){
  const t=document.createElement('div');t.className='toast';
  t.style.background=tipo==='error'?'#dc2626':tipo==='warn'?'#d97706':'#1e293b';
  t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),3000);
}

async function iniciarSesion(){
  const entidad=document.getElementById('inp-entidad').value.trim();
  if(!entidad)return;
  const btn=document.getElementById('btn-login');
  const err=document.getElementById('login-error');
  btn.disabled=true;btn.textContent='Verificando...';err.style.display='none';
  try{
    const pvs=await sbGet('puntos_venta','?select=*');
    const pv=pvs.find(p=>(p.entidades||[]).some(e=>String(e).trim()===entidad)||String(p.entidad_id||'').trim()===entidad);
    if(!pv){err.style.display='block';btn.disabled=false;btn.textContent='Ingresar';return;}
    PV_ACTUAL={...pv,entidad_login:entidad};
    sessionStorage.setItem('pv_actual',JSON.stringify(PV_ACTUAL));
    document.getElementById('login-screen').style.display='none';
    document.getElementById('app-screen').style.display='block';
    document.getElementById('pv-nombre-header').textContent=pv.nombre+' · Entidad '+entidad;
    await cargarApp();
  }catch(e){err.textContent='Error de conexión.';err.style.display='block';btn.disabled=false;btn.textContent='Ingresar';}
}

function cerrarSesion(){
  sessionStorage.removeItem('pv_actual');PV_ACTUAL=null;DISPO=[];SELECCION={};PEDIDOS_PV=[];
  document.getElementById('app-screen').style.display='none';
  document.getElementById('login-screen').style.display='flex';
  document.getElementById('inp-entidad').value='';
}

async function cargarApp(){
  document.getElementById('app-loading').style.display='block';
  document.getElementById('app-content').style.display='none';
  try{
    const todos=await sbGet('pedidos','?select=*&order=fecha_pedido.desc');
    const hoy=new Date();
    PEDIDOS_PV=todos.filter(p=>p.punto_venta_id===PV_ACTUAL.id).map(p=>{
      if(p.estado==='transito'&&p.fecha_transito){
        const ft=new Date(p.fecha_transito.split('/').reverse().join('-'));
        if(Math.floor((hoy-ft)/86400000)>=5)return{...p,estado:'demorado'};
      }return p;
    });
    // Cargar disponibilidad del bot Dispo desde configuracion
    try {
      const cfg=await sbGet('configuracion','?id=eq.global&select=dispo_materiales,dispo_ultima_actualizacion');
      if(cfg&&cfg[0]&&cfg[0].dispo_materiales){
        DISPO=JSON.parse(cfg[0].dispo_materiales);
        DISPO_FECHA=cfg[0].dispo_ultima_actualizacion||null;
      } else {
        DISPO=[];DISPO_FECHA=null;
      }
    } catch(e){ DISPO=[];DISPO_FECHA=null; }
    renderApp();
  }catch(e){toast('Error: '+e.message,'error');}
  finally{document.getElementById('app-loading').style.display='none';document.getElementById('app-content').style.display='block';}
}

function renderApp(){
  const activos=PEDIDOS_PV.filter(p=>['nuevo','transito','demorado'].includes(p.estado)).length;
  document.getElementById('app-content').innerHTML=`
    <div class="tabs">
      <button class="tab-btn ${VISTA==='pedidos'?'active':''}" onclick="cambiarVista('pedidos')">
        📋 Mis Pedidos${activos?'<span style="background:var(--rojo);color:white;border-radius:10px;padding:1px 6px;font-size:10px;margin-left:4px">'+activos+'</span>':''}
      </button>
      <button class="tab-btn ${VISTA==='nuevo'?'active':''}" onclick="cambiarVista('nuevo')">➕ Nuevo Pedido</button>
    </div>
    <div id="vista-contenido"></div>`;
  renderVista();
}

function cambiarVista(v){
  VISTA=v;if(v==='nuevo')SELECCION={};
  document.querySelectorAll('.tab-btn').forEach((b,i)=>b.classList.toggle('active',i===(v==='pedidos'?0:1)));
  renderVista();
}

function renderVista(){
  document.getElementById('vista-contenido').innerHTML=VISTA==='pedidos'?renderMisPedidos():renderNuevoPedido();
}

function renderMisPedidos(){
  if(!PEDIDOS_PV.length)return'<div class="empty"><div style="font-size:36px">📭</div><p>No tenés pedidos todavía.</p></div>';
  const EST={nuevo:{l:'🟡 Pedido nuevo',c:'badge-nuevo'},transito:{l:'🔵 En tránsito',c:'badge-transito'},
    demorado:{l:'🔴 Demorado',c:'badge-demorado'},parcial:{l:'⚠️ Parcial',c:'badge-parcial'},recibido:{l:'✅ Recibido',c:'badge-recibido'}};
  return'<div class="card"><div class="card-body" style="padding:0 18px">'+PEDIDOS_PV.map(p=>{
    const est=EST[p.estado]||EST.nuevo;
    const items=JSON.parse(p.items||'[]');
    const total=items.reduce((s,i)=>s+(i.cantidad||0),0);
    return`<div class="pedido-row">
      <div style="display:flex;justify-content:space-between;align-items:flex-start">
        <div>
          <div style="font-weight:700;font-size:13px;margin-bottom:3px">${total} equipo${total!==1?'s':''} solicitado${total!==1?'s':''}</div>
          <div style="font-size:11px;color:var(--gris-400)">${p.fecha_pedido||'—'}</div>
          ${p.nro_pedido_sap?'<div class="nro-sap" style="margin-top:3px">Nro SAP: '+p.nro_pedido_sap+'</div>':''}
          ${p.observaciones?'<div style="font-size:11px;color:var(--gris-400);margin-top:2px">'+p.observaciones+'</div>':''}
        </div>
        <span class="badge ${est.c}">${est.l}</span>
      </div>
      ${items.length?'<div style="margin-top:8px;display:flex;flex-wrap:wrap;gap:4px">'+items.map(i=>{
          const agotado = i.agotado;
          return '<span style="background:'+(agotado?'var(--rojo-s)':'var(--gris-100)')+';border-radius:20px;padding:2px 8px;font-size:11px;'+(agotado?'text-decoration:line-through;color:var(--rojo)':'')+'">'+
            i.nombre+' × '+i.cantidad+(agotado?' 🔴 Agotado':'')+
          '</span>';
        }).join('')+'</div>':''}
      ${p.observaciones_admin&&p.estado==='parcial'?'<div style="margin-top:6px;padding:6px 10px;background:var(--morado-s);border-radius:6px;font-size:11px;color:var(--morado)">⚠️ '+p.observaciones_admin+'</div>':''}
    </div>`;
  }).join('')+'</div></div>';
}

function renderNuevoPedido(){
  const total=Object.values(SELECCION).reduce((s,q)=>s+q,0);

  // Alerta de disponibilidad
  let alertaDispo = '';
  if (DISPO_FECHA) {
    const horas = (new Date() - new Date(DISPO_FECHA)) / 3600000;
    if (horas >= 6) {
      alertaDispo = `<div style="padding:10px 14px;background:var(--rojo-s);border:1px solid var(--rojo);border-radius:8px;font-size:12px;color:var(--rojo);margin-bottom:12px">
        🔴 <strong>Atención:</strong> La disponibilidad puede diferir significativamente. Fue actualizada hace ${Math.floor(horas)} horas.
      </div>`;
    } else if (horas >= 3) {
      alertaDispo = `<div style="padding:10px 14px;background:var(--amarillo-s);border:1px solid var(--amarillo);border-radius:8px;font-size:12px;color:var(--amarillo);margin-bottom:12px">
        🟡 <strong>Aviso:</strong> Puede haber diferencias con la disponibilidad real. Actualizada hace ${Math.floor(horas)} horas.
      </div>`;
    }
  }

  // Marcas únicas para filtro
  const marcas = [...new Set(DISPO.map(m=>m.marca).filter(Boolean))].sort();
  const dispoFiltrada = MARCA_FILTRO
    ? DISPO.filter(m => m.marca === MARCA_FILTRO)
    : DISPO;

  const fechaDispo = DISPO_FECHA
    ? '<span style="font-size:11px;color:var(--gris-400)">📅 ' + new Date(DISPO_FECHA).toLocaleString('es-AR') + '</span>'
    : '<span style="font-size:11px;color:var(--amarillo)">⚠️ Sin actualizar</span>';

  return`
    ${alertaDispo}
    <div class="card" style="margin-bottom:12px">
      <div class="card-header" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">
        <span>📋 Equipos disponibles</span>
        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
          ${fechaDispo}
          ${marcas.length ? `<select onchange="MARCA_FILTRO=this.value;renderVista()"
            style="padding:4px 8px;border:1px solid var(--gris-200);border-radius:6px;font-size:12px;font-family:inherit">
            <option value="">Todas las marcas</option>
            ${marcas.map(m=>`<option value="${m}" ${MARCA_FILTRO===m?'selected':''}>${m}</option>`).join('')}
          </select>` : ''}
        </div>
      </div>
      <div class="card-body">
        ${!dispoFiltrada.length
          ? '<p style="color:var(--gris-400);font-size:13px;text-align:center;padding:16px 0">No hay equipos disponibles' + (MARCA_FILTRO ? ' para esta marca.' : '. Esperá que el administrador actualice.') + '</p>'
          : '<div class="dispo-grid">'+dispoFiltrada.map(m=>{
              const q=SELECCION[m.id||m.codigo]||0;
              const id=m.id||m.codigo;
              return`<div class="dispo-item ${q>0?'sel':''}" id="di-${id}">
                <div class="nombre">${m.nombre||m.codigo}</div>
                <div class="marca">${m.marca||'—'} · ${m.codigo}</div>
                <div class="qty-ctrl">
                  <button class="qty-btn" onclick="setQty('${id}',${q-1},'${(m.nombre||m.codigo).replace(/'/g,"\\'")}')">−</button>
                  <input type="number" min="0" value="${q}"
                    style="width:40px;text-align:center;border:1px solid var(--gris-200);border-radius:4px;font-size:13px;font-weight:800;padding:2px"
                    onchange="setQty('${id}',parseInt(this.value)||0,'${(m.nombre||m.codigo).replace(/'/g,"\\'")}');this.value=SELECCION['${id}']||0" />
                  <button class="qty-btn" onclick="setQty('${id}',${q+1},'${(m.nombre||m.codigo).replace(/'/g,"\\'")}')">+</button>
                </div>
              </div>`;
            }).join('')+'</div>'
        }
      </div>
    </div>
    <div class="card">
      <div class="card-header">💬 Observaciones (opcional)</div>
      <div class="card-body">
        <textarea class="obs-input" id="obs-pedido" placeholder="Ej: Urgente, faltan equipos en local..."></textarea>
        <div style="margin-top:12px;display:flex;justify-content:space-between;align-items:center">
          <span style="font-size:13px;color:var(--gris-400)">${total>0?total+' equipo'+(total!==1?'s':'')+' seleccionado'+(total!==1?'s':''):'Sin equipos seleccionados'}</span>
          <button class="btn-sm btn-verde" onclick="enviarPedido()" ${total===0||!DISPO.length?'disabled':''}>📤 Enviar pedido</button>
        </div>
      </div>
    </div>`;
}

function setQty(id,q,nombre){
  if(q<0)return;
  if(q===0)delete SELECCION[id];else SELECCION[id]=q;
  renderVista();
}

async function enviarPedido(){
  const items=Object.entries(SELECCION).map(([id,cantidad])=>{
    const m=DISPO.find(x=>x.id===id);
    return{material_id:id,nombre:m?.nombre||id,codigo:m?.codigo||id,cantidad};
  });
  if(!items.length){toast('Seleccioná al menos un equipo','warn');return;}
  const obs=document.getElementById('obs-pedido')?.value.trim()||'';
  const hoy=new Date().toLocaleDateString('es-AR');
  try{
    await sbPost('pedidos',{
      id:'PED-'+Date.now(),
      fecha_pedido:hoy,
      punto_venta_id:PV_ACTUAL.id,
      punto_venta_nombre:PV_ACTUAL.nombre,
      entidad_id:PV_ACTUAL.entidad_login,
      estado:'nuevo',
      items:JSON.stringify(items),
      observaciones:obs,
      creado_por:'PedidosSLA',
    });
    SELECCION={};
    toast('✅ Pedido enviado correctamente');
    await cargarApp();
    cambiarVista('pedidos');
  }catch(e){toast('Error: '+e.message,'error');}
}

window.onload=()=>{
  const s=sessionStorage.getItem('pv_actual');
  if(s){
    PV_ACTUAL=JSON.parse(s);
    document.getElementById('login-screen').style.display='none';
    document.getElementById('app-screen').style.display='block';
    document.getElementById('pv-nombre-header').textContent=PV_ACTUAL.nombre+' · Entidad '+PV_ACTUAL.entidad_login;
    cargarApp();
  }
};
</script>
</body>
</html>
