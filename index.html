async function limpiarTabla(cual) {
  const LABELS = {
    'legajos':            'todos los legajos / SDS',
    'vendedores':         'todos los vendedores',
    'legajos+vendedores': 'todos los legajos Y vendedores',
  };
  const label = LABELS[cual] || cual;
  if (!confirm(`⚠️ ATENCIÓN\n\nSe eliminarán ${label} de forma permanente.\nEsta acción NO se puede deshacer.\n\n¿Confirmás?`)) return;
  if (!confirm(`¿Estás seguro? Se borrarán ${label}.`)) return;

  // Popup flotante — permite seguir navegando mientras trabaja
  const popup = document.createElement('div');
  popup.id = 'popup-limpiar';
  popup.style.cssText = `
    position:fixed;bottom:20px;right:20px;z-index:9999;
    background:white;border-radius:12px;padding:16px 20px;
    box-shadow:0 4px 24px rgba(0,0,0,.18);min-width:300px;
    border-left:4px solid var(--acento);font-size:13px;
  `;
  popup.innerHTML = `
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
      <span style="font-weight:700;color:var(--acento)">🗑️ Limpiando ${cual}...</span>
      <button onclick="this.closest('#popup-limpiar').style.display='none'"
        style="background:none;border:none;cursor:pointer;color:var(--gris-500);font-size:16px">✕</button>
    </div>
    <div style="background:var(--gris-200);border-radius:4px;height:6px;overflow:hidden;margin-bottom:8px">
      <div id="limpiar-bar" style="background:var(--acento);height:100%;width:0%;transition:width .3s;border-radius:4px"></div>
    </div>
    <p id="limpiar-txt" style="color:var(--gris-600);margin:0">Iniciando...</p>
  `;
  document.body.appendChild(popup);

  const tablas = cual === 'legajos+vendedores' ? ['legajos','vendedores'] : [cual];
  let totalGlobal = 0, procesadosGlobal = 0;

  try {
    // Contar total primero
    for (const tabla of tablas) {
      const regs = CACHE[tabla] || await dbGet(tabla);
      totalGlobal += regs.length;
    }

    for (const tabla of tablas) {
      const registros = CACHE[tabla] || await dbGet(tabla);
      for (const r of registros) {
        await SB.delete(tabla, r.id, SB_TOKEN);
        procesadosGlobal++;
        const pct = totalGlobal ? Math.round((procesadosGlobal / totalGlobal) * 100) : 0;
        const bar = document.getElementById('limpiar-bar');
        const txt = document.getElementById('limpiar-txt');
        if (bar) bar.style.width = pct + '%';
        if (txt) txt.textContent = `${tabla}: ${procesadosGlobal} de ${totalGlobal} (${pct}%)`;
        if (procesadosGlobal % 10 === 0) await new Promise(r => setTimeout(r, 10));
      }
      dbInvalidate(tabla);
      await dbGet(tabla);
    }

    const bar = document.getElementById('limpiar-bar');
    const txt = document.getElementById('limpiar-txt');
    if (bar) { bar.style.width = '100%'; bar.style.background = 'var(--verde)'; }
    if (txt) txt.textContent = `✅ Completado — ${procesadosGlobal} registros eliminados`;
    if (popup) popup.style.borderLeftColor = 'var(--verde)';
    toast(`✅ ${label} eliminado(s)`);
    setTimeout(() => popup?.remove(), 5000);

    // Actualizar la vista del estado en Sistemas si sigue visible
    const estadoEl = document.getElementById('limpiar-estado');
    if (estadoEl) estadoEl.innerHTML = `
      <div style="padding:10px 14px;background:var(--verde-suave);border:1px solid var(--verde);border-radius:8px;font-size:13px;color:var(--verde)">
        ✅ ${label} eliminado(s) correctamente — ${procesadosGlobal} registros borrados.
      </div>`;

  } catch(e) {
    const txt = document.getElementById('limpiar-txt');
    if (txt) txt.textContent = `❌ Error: ${e.message}`;
    if (popup) popup.style.borderLeftColor = 'var(--acento)';
    toast('Error al limpiar: ' + e.message, 'error');
    console.error('limpiarTabla error:', e);
  }
}

let botPollingInterval = null;

async function correrBotConProgreso() {
  const cfg = await getConfigSistemasAMX();
  if (!cfg.ghUser || !cfg.ghRepo || !cfg.ghToken) {
    toast('Configurá GitHub en Configuración → Sistemas AMX', 'error'); return;
  }
  // Primero sincronizar credenciales
  await sincronizarConfigConGitHub();
  // Disparar workflow
  const r = await fetch(
    `https://api.github.com/repos/${cfg.ghUser}/${cfg.ghRepo}/actions/workflows/sync-sap.yml/dispatches`,
    { method: 'POST',
      headers: { 'Authorization': `Bearer ${cfg.ghToken}`, 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json' },
      body: JSON.stringify({ ref: 'main' }) }
  );
  if (r.status === 204) {
    toast('Bot iniciado ✓ — monitoreando progreso...');
    setTimeout(() => verProgresoBotEnVivo(), 3000); // esperar que arranque
  } else {
    toast('Error al iniciar el bot', 'error');
  }
}

async function verProgresoBotEnVivo() {
  const cfg = await getConfigSistemasAMX();
  if (!cfg.ghUser || !cfg.ghRepo || !cfg.ghToken) {
    toast('Configurá GitHub en Configuración → Sistemas AMX', 'error'); return;
  }
  const container = document.getElementById('bot-progreso-container');
  if (container) container.style.display = 'block';
  actualizarProgresoBotEnVivo(cfg);
  // Polling cada 8 segundos
  if (botPollingInterval) clearInterval(botPollingInterval);
  botPollingInterval = setInterval(() => actualizarProgresoBotEnVivo(cfg), 8000);
}

async function actualizarProgresoBotEnVivo(cfg) {
  const logEl    = document.getElementById('bot-log-vivo');
  const estadoEl = document.getElementById('bot-estado-run');
  try {
    // Obtener el último run
    const runsR = await fetch(
      `https://api.github.com/repos/${cfg.ghUser}/${cfg.ghRepo}/actions/workflows/sync-sap.yml/runs?per_page=1`,
      { headers: { 'Authorization': `Bearer ${cfg.ghToken}`, 'Accept': 'application/vnd.github+json' } }
    );
    if (!runsR.ok) return;
    const runsData = await runsR.json();
    const run = runsData.workflow_runs?.[0];
    if (!run) { if (logEl) logEl.textContent = 'No hay corridas recientes.'; return; }

    const status    = run.status;       // queued, in_progress, completed
    const conclusion= run.conclusion;   // success, failure, null
    const inicio    = new Date(run.created_at).toLocaleString('es-AR');
    const duracion  = run.updated_at
      ? Math.round((new Date(run.updated_at) - new Date(run.created_at)) / 1000) + 's'
      : '—';

    const iconos  = { queued: '⏳', in_progress: '🔄', completed: conclusion === 'success' ? '✅' : '❌' };
    const labels  = { queued: 'En cola...', in_progress: 'Corriendo...', completed: conclusion === 'success' ? 'Completado' : 'Falló' };
    if (estadoEl) estadoEl.textContent = `${iconos[status] || '—'} ${labels[status] || status} · Run #${run.run_number} · Iniciado: ${inicio} · Duración: ${duracion}`;

    // Si terminó, detenemos el polling
    if (status === 'completed') {
      detenerProgresoBotEnVivo();
      if (conclusion === 'success') {
        if (logEl) logEl.innerHTML = `<span style="color:#4ADE80">✅ Bot completado exitosamente el ${inicio}.\nDuración: ${duracion}.\n\nHacé click en "Actualizar Stock SAP" para importar los datos al sistema.</span>`;
      } else {
        if (logEl) logEl.innerHTML = `<span style="color:#F87171">❌ El bot falló. Verificá los logs en:\n<a href="${run.html_url}" target="_blank" style="color:#60A5FA">${run.html_url}</a></span>`;
      }
      return;
    }

    // Si está corriendo, obtener los jobs para ver los steps
    const jobsR = await fetch(
      `https://api.github.com/repos/${cfg.ghUser}/${cfg.ghRepo}/actions/runs/${run.id}/jobs`,
      { headers: { 'Authorization': `Bearer ${cfg.ghToken}`, 'Accept': 'application/vnd.github+json' } }
    );
    if (!jobsR.ok) return;
    const jobsData = await jobsR.json();
    const job = jobsData.jobs?.[0];
    if (!job) return;

    const steps = job.steps || [];
    const logLines = steps.map(s => {
      const icon = s.status === 'completed'
        ? (s.conclusion === 'success' ? '✅' : '❌')
        : s.status === 'in_progress' ? '🔄' : '⏸️';
      return `${icon} ${s.name}`;
    });

    if (logEl) {
      logEl.innerHTML = logLines.map(l =>
        `<div style="padding:2px 0;color:${l.startsWith('✅') ? '#4ADE80' : l.startsWith('❌') ? '#F87171' : l.startsWith('🔄') ? '#FCD34D' : '#94A3B8'}">${l}</div>`
      ).join('');
      logEl.scrollTop = logEl.scrollHeight;
    }

  } catch(e) {
    if (logEl) logEl.textContent = 'Error al consultar GitHub: ' + e.message;
  }
}

function detenerProgresoBotEnVivo() {
  if (botPollingInterval) { clearInterval(botPollingInterval); botPollingInterval = null; }
}

let realtimeWS = null;

function iniciarRealtime() {
  if (!SB_TOKEN) return;
  if (realtimeWS) realtimeWS.close();

  const wsUrl = `wss://iebfyjbkmjuicrrbezbi.supabase.co/realtime/v1/websocket?apikey=${SUPABASE_KEY}&vsn=1.0.0`;
  realtimeWS = new WebSocket(wsUrl);

  const indicador = document.getElementById('realtime-indicator');

  realtimeWS.onopen = () => {
    _setRealtimeEstado(true);
    // Autenticar
    realtimeWS.send(JSON.stringify({
      topic: 'realtime:*',
      event: 'phx_join',
      payload: { user_token: SB_TOKEN },
      ref: '1',
    }));
    // Suscribirse a cambios en las tablas principales
    ['dispositivos','remitos','cuentas_corrientes','materiales','puntos_venta','legajos','pedidos'].forEach((tabla, i) => {
      realtimeWS.send(JSON.stringify({
        topic: `realtime:public:${tabla}`,
        event: 'phx_join',
        payload: { config: { broadcast: { self: false }, presence: { key: '' } } },
        ref: String(i + 2),
      }));
    });
  };

  realtimeWS.onmessage = (evt) => {
    try {
      const msg = JSON.parse(evt.data);
      if (['INSERT','UPDATE','DELETE','postgres_changes'].includes(msg.event)) {
        const tabla = msg.topic?.replace('realtime:public:', '');
        if (tabla && TABLA_MAP[tabla]) {
          dbInvalidate(tabla);
          dbGet(tabla).then(() => {
            const paginasAfectadas = {
              dispositivos: ['stock','comodatos'],
              remitos: ['remitos'],
              cuentas_corrientes: ['cuentas'],
              materiales: ['materiales'],
              puntos_venta: ['puntos-venta'],
              legajos: ['legajos'],
            };
            const paginaActual = document.getElementById('page-title')?.textContent;
            const afecta = paginasAfectadas[tabla] || [];
            if (afecta.some(p => PAGINAS[p]?.titulo === paginaActual)) {
              toast(`📡 Datos actualizados (${tabla})`);
              const paginaKey = Object.keys(PAGINAS).find(k => PAGINAS[k].titulo === paginaActual);
              if (paginaKey) setTimeout(() => navegar(paginaKey), 300);
            }
          });
        }

        // Pedidos: actualizar badge y notificar si es pedido nuevo
        if (tabla === 'pedidos') {
          dbInvalidate('pedidos');
          dbGet('pedidos').then(() => {
            actualizarBadgePedidos();
            // Notificar solo en INSERT de pedido nuevo
            if (msg.event === 'INSERT') {
              const pv = msg.payload?.record?.punto_venta_nombre || 'un PV';
              const items = (() => { try { return JSON.parse(msg.payload?.record?.items||'[]'); } catch { return []; } })();
              const total = items.reduce((s,i) => s+(i.cantidad||0), 0);
              toast(`🛒 Nuevo pedido de ${pv} — ${total} equipo${total!==1?'s':''}`, 'info');
              // Si estamos en pedidos, refrescar la vista
              const paginaActual = document.getElementById('page-title')?.textContent;
              if (PAGINAS['pedidos']?.titulo === paginaActual) {
                setTimeout(() => navegar('pedidos'), 300);
              }
            }
          });
        }
      }
    } catch(e) { /* ignorar mensajes no JSON */ }
  };

  realtimeWS.onerror = () => {
    _setRealtimeEstado(false);
  };

  realtimeWS.onclose = () => {
    _setRealtimeEstado(false);
    if (SB_TOKEN) setTimeout(iniciarRealtime, 5000);
  };
}

function _setRealtimeEstado(online) {
  const indicador = document.getElementById('realtime-indicator');
  const dot       = document.getElementById('realtime-dot');
  const txt       = document.getElementById('realtime-text');
  if (!indicador) return;
  indicador.style.display = 'flex';
  if (online) {
    indicador.style.color = 'var(--verde)';
    if (dot) { dot.style.background = 'var(--verde)'; dot.style.animation = 'pulse-dot 2s infinite'; }
    if (txt) txt.textContent = 'En vivo';
    notifQuitarMensaje('_offline');
  } else {
    indicador.style.color = 'var(--acento)';
    if (dot) { dot.style.background = 'var(--acento)'; dot.style.animation = 'none'; }
    if (txt) txt.textContent = 'Offline';
    notifAgregarMensaje('_offline', '⚠️ Sin conexión — los datos pueden no estar actualizados', 'var(--acento)', false);
  }
}

// Detectar cambios de conexión del navegador
window.addEventListener('online',  () => { if (SB_TOKEN) iniciarRealtime(); });
window.addEventListener('offline', () => { _setRealtimeEstado(false); });

function detenerRealtime() {
  if (realtimeWS) {
    realtimeWS.onclose = null;
    realtimeWS.close();
    realtimeWS = null;
  }
}
</script>
</body>
