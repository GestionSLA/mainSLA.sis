    </div>
    <div class="tabla-wrapper" id="sap-conc-tabla">
      ${tablaStockConciliado(stock)}
    </div>
  `;
}

function tablaStockConciliado(items) {
  if (!items.length) return `<div class="empty-state"><p>Sin resultados</p></div>`;

  // Valores mostrados por columna (para el filtro tipo Excel)
  const valOf = {
    serial:         s => s.serial || '—',
    material:       s => s.material || '—',
    texto:          s => s.texto || '—',
    dias:           s => (parseInt(s.dias) || 0) + 'd',
    fec_antiguedad: s => s.fec_antiguedad || '—',
    origen:         s => s.origen === 'reingreso' ? 'Reingreso' : 'Disponible',
    precio:         s => '$' + (s.precio || 0).toLocaleString('es-AR'),
  };
  Object.keys(valOf).forEach(col => _registrarValoresColumna('stock-conciliado', col, items.map(valOf[col])));

  const filtrados = items.filter(s => {
    const fila = {};
    Object.keys(valOf).forEach(col => fila[col] = valOf[col](s));
    return _pasaFiltrosColumna('stock-conciliado', fila);
  });
  if (!filtrados.length) return `<div class="empty-state"><p>Sin resultados con los filtros de columna aplicados</p></div>`;

  const items2 = _sortLista(filtrados, 'stock-conciliado', {
    serial:         s => s.serial||'',
    material:       s => s.material||'',
    texto:          s => s.texto||'',
    dias:           s => parseInt(s.dias)||0,
    fec_antiguedad: s => s.fec_antiguedad||'',
    origen:         s => s.origen||'',
    precio:         s => parseFloat(s.precio||0),
  });

  return `
    <table>
      <thead>
        <tr>
          ${_thCol('stock-conciliado','serial','IMEI / Serial')}
          ${_thCol('stock-conciliado','material','Material')}
          ${_thCol('stock-conciliado','texto','Descripción')}
          ${_thCol('stock-conciliado','dias','Días')}
          ${_thCol('stock-conciliado','dias','Vencimiento')}
          ${_thCol('stock-conciliado','fec_antiguedad','Fecha Antig.')}
          ${_thCol('stock-conciliado','origen','Origen')}
          ${_thCol('stock-conciliado','precio','Precio')}
        </tr>
      </thead>
      <tbody>
        ${items2.map(s => {
          const dias = parseInt(s.dias) || 0;
          const sem = semaforoDias(dias);
          const diasParaVencer = Math.max(0, 140 - dias);
          const origenBadge = s.origen === 'reingreso'
            ? `<span class="badge badge-naranja">Reingreso</span>`
            : `<span class="badge badge-gris">Disponible</span>`;
          return `<tr>
            <td style="font-family:monospace;font-size:11px;font-weight:700">${s.serial}</td>
            <td style="font-family:monospace;font-size:11px">${s.material}</td>
            <td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${s.texto}">${s.texto}</td>
            <td><span style="font-weight:700;color:${sem.color}">${dias}d</span></td>
            <td>
              <span style="display:inline-flex;align-items:center;padding:3px 8px;border-radius:20px;font-size:11px;font-weight:600;background:${sem.bg};color:${sem.color};border:1px solid ${sem.border}">${sem.label}</span>
              <span style="font-size:10px;color:var(--gris-500);margin-left:4px">${dias < 140 ? diasParaVencer + 'd para facturar' : ''}</span>
            </td>
            <td style="font-size:11px;color:var(--gris-500)">${s.fec_antiguedad || '—'}</td>
            <td>${origenBadge}</td>
            <td style="text-align:right">$${(s.precio || 0).toLocaleString('es-AR')}</td>
          </tr>`;
        }).join('')}
      </tbody>
    </table>
  `;
}

function filtrarStockConciliado() {
  const b = (document.getElementById('sap-conc-search')?.value || '').toLowerCase();
  const origen = document.getElementById('sap-conc-origen')?.value || '';
  let items = DB.get('stock_sap_conciliado') || [];
  if (b) items = items.filter(s =>
    s.serial?.toLowerCase().includes(b) ||
    s.material?.toLowerCase().includes(b) ||
    s.texto?.toLowerCase().includes(b)
  );
  if (origen) items = items.filter(s => s.origen === origen);
  document.getElementById('sap-conc-tabla').innerHTML = tablaStockConciliado(items);
}

function abrirDetallePV(pvId) {
  const disp = CACHE['dispositivos'] || DB.get('dispositivos') || [];
  const pvs  = CACHE['puntos_venta'] || DB.get('puntos_venta') || [];
  const pv   = pvs.find(p=>p.id===pvId);
  const equiposPV = disp.filter(d => d.punto_venta_id===pvId && d.estado==='disponible')
    .sort((a,b) => (parseInt(b.dias_antiguedad)||0) - (parseInt(a.dias_antiguedad)||0));

  const hoy = new Date();

  function calcVencimiento(d) {
    const dias = parseInt(d.dias_antiguedad) || 0;
    const restantes = Math.max(0, 140 - dias);
    if (restantes === 0) return { label: 'Vencido', color: '#dc2626' };
    if (restantes <= 20) return { label: `${restantes}d para vencer`, color: '#dc2626' };
    if (restantes <= 40) return { label: `${restantes}d para vencer`, color: '#d97706' };
    return { label: `${restantes}d`, color: '#16a34a' };
  }

  const filas = equiposPV.map(d => {
    const dias = parseInt(d.dias_antiguedad) || 0;
    const sem  = semaforoDias(dias);
    const venc = calcVencimiento(d);
    return '<tr>'
      + '<td style="font-family:monospace;font-size:11px">' + (d.material||'—') + '</td>'
      + '<td style="font-family:monospace;font-size:11px;font-weight:700">' + (d.nro_serie||'—') + '</td>'
      + '<td style="font-size:12px">' + (d.texto||'—') + '</td>'
      + '<td style="font-size:12px">' + (d.marca||'—') + '</td>'
      + '<td style="text-align:center;font-weight:700;color:' + sem.color + '">' + dias + 'd</td>'
      + '<td style="text-align:center"><span style="font-size:11px;font-weight:600;color:' + venc.color + '">' + venc.label + '</span></td>'
      + '<td style="font-size:11px;color:var(--gris-500)">' + (d.fecha_ingreso||d.fec_antiguedad||'—') + '</td>'
      + '</tr>';
  }).join('');

  const det = document.getElementById('stock-pv-detalle');
  det.innerHTML = '<div class="card" style="margin-top:8px;border:2px solid var(--azul)">'
    + '<div class="card-header" style="background:var(--azul-suave);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">'
    + '<h3 style="color:var(--azul)">📍 '+(pv?.nombre||pvId)+' — '+equiposPV.length+' equipo'+(equiposPV.length!==1?'s':'')+'</h3>'
    + '<div style="display:flex;gap:8px">'
    + '<button class="btn btn-secondary" onclick="document.getElementById(\'stock-pv-detalle\').innerHTML=\'\'">✕ Cerrar</button>'
    + '</div>'
    + '</div>'
    + '<div class="card-body" style="padding:0"><div class="tabla-wrapper">'
    + '<table><thead><tr>'
    + '<th>Material</th><th>IMEI</th><th>Equipo</th><th>Marca</th><th style="text-align:center">Días</th><th style="text-align:center">Vencimiento</th><th>Ingreso</th>'
    + '</tr></thead><tbody>' + filas + '</tbody></table>'
    + '</div></div></div>';
  det.scrollIntoView({behavior:'smooth', block:'start'});
}

// ── Vencimientos como pestaña de Stock ──────────────────────────────────────
function renderVencimientosEnStock() {
  const dispositivos = CACHE['dispositivos'] || DB.get('dispositivos') || [];
  const hoy = new Date();
  const items = dispositivos
    .filter(d => d.estado === 'disponible' && d.fecha_ingreso)
    .map(d => {
      const p = d.fecha_ingreso.split('/');
      const fi = p.length === 3 ? new Date(p[2], p[1]-1, p[0]) : new Date(d.fecha_ingreso);
      const dias = isNaN(fi) ? 0 : Math.floor((hoy - fi) / 86400000);
      return { ...d, dias_en_stock: dias };
    })
    .sort((a,b) => b.dias_en_stock - a.dias_en_stock);

  if (!items.length) return '<div class="empty-state"><p>No hay equipos con fecha de ingreso registrada.</p></div>';

  const venc90 = items.filter(i => i.dias_en_stock >= 90).length;
  const venc80 = items.filter(i => i.dias_en_stock >= 80 && i.dias_en_stock < 90).length;

  return `
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px">
      <div class="stat-card rojo" style="padding:12px 14px"><div class="label">Vencidos (+90 días)</div><div class="valor" style="font-size:22px">${venc90}</div></div>
      <div class="stat-card amarillo" style="padding:12px 14px"><div class="label">Por vencer (80-90 días)</div><div class="valor" style="font-size:22px">${venc80}</div></div>
      <div class="stat-card azul" style="padding:12px 14px"><div class="label">Total en seguimiento</div><div class="valor" style="font-size:22px">${items.length}</div></div>
    </div>
    <div class="tabla-wrapper">
      <table>
        <thead><tr><th>IMEI</th><th>Descripción</th><th>PV</th><th style="text-align:center">Días en stock</th><th style="text-align:center">Alerta</th></tr></thead>
        <tbody>
          ${items.map(d => {
            const dias  = d.dias_en_stock;
            const color = dias >= 90 ? 'var(--acento)' : dias >= 80 ? 'var(--amarillo)' : 'var(--verde)';
            const bg    = dias >= 90 ? '#fff1f2' : dias >= 80 ? '#fffbeb' : '';
            const etiq  = dias >= 90 ? '🔴 Vencido' : dias >= 80 ? '🟡 Por vencer' : '🟢 OK';
            return '<tr style="background:'+bg+'">'
              + '<td style="font-family:monospace;font-size:11px">'+(d.nro_serie||'—')+'</td>'
              + '<td style="font-size:12px">'+(d.texto||'—')+'</td>'
              + '<td style="font-size:12px">'+(d.punto_venta_nombre||'—')+'</td>'
              + '<td style="text-align:center;font-weight:700;color:'+color+'">'+dias+'</td>'
              + '<td style="text-align:center;font-size:12px">'+etiq+'</td></tr>';
          }).join('')}
        </tbody>
      </table>
    </div>
  `;
}

async function confirmarRemitoDesdeTransito(nroPedido) {
  const nroRemito = document.getElementById('trans-rem-nro').value.trim();
  const pvId = document.getElementById('trans-rem-pv').value;
  if (!nroRemito || !pvId) { toast('Completá número de remito y punto de venta', 'error'); return; }

  const pvs = await dbGet('puntos_venta');
  const pv = pvs.find(p => p.id === pvId);
  const equipos = (DB.get('equipos_sap_transito') || []).filter(e => e.nro_pedido === nroPedido);
  const hoy = new Date().toLocaleDateString('es-AR');

  const nuevosDisp = equipos.map(e => ({
    id: DB.genId(), nro_serie: e.serial, material: e.material,
    texto: e.texto, marca: detectarMarcaPorPrefijo(e.texto),
    precio: e.precio || 0, estado: 'disponible',
    punto_venta_id: pvId, punto_venta_nombre: pv?.nombre || '',
    nro_remito: nroRemito, nro_pedido: nroPedido,
    centro: e.centro || '', fecha_ingreso: hoy,
  }));

  const total = equipos.reduce((s, e) => s + (e.precio || 0), 0);

  await SB.insert('dispositivos', nuevosDisp, SB_TOKEN);
  await SB.insert('remitos', [{
    id: DB.genId(), nro_remito: nroRemito, nro_pedido: nroPedido, tipo: 'ingreso',
    punto_venta_id: pvId, punto_venta_nombre: pv?.nombre || '',
    fecha: hoy, cantidad_items: equipos.length, total, estado: 'procesado',
  }], SB_TOKEN);

  // Eliminar estos equipos de la tabla de tránsito en Supabase
  const transito = DB.get('equipos_sap_transito') || [];
  const idsEliminar = transito.filter(e => e.nro_pedido === nroPedido).map(e => e.id);
  for (const eid of idsEliminar) {
    await SB.delete('equipos_sap_transito', eid, SB_TOKEN);
  }

  dbInvalidate('dispositivos');
  dbInvalidate('remitos');
  dbInvalidate('equipos_sap_transito');

  // Marcar el pedido como recibido si existe en el módulo Pedidos
  await marcarPedidoRecibido(nroPedido);

  toast(`Remito ${nroRemito} generado con ${equipos.length} equipo(s) del pedido ${nroPedido}`);
  cerrarModal('modal-remito-transito');
  navegar('stock');
}

function tablaStock(dispositivos, estadoBadge, estadoLabel) {
  if (!estadoBadge) {
    estadoBadge = { disponible: 'badge-verde', vendido: 'badge-gris', transferido: 'badge-azul', no_sap: 'badge-rojo', reservado: 'badge-rojo', homologado: 'badge-morado' };
    estadoLabel = { disponible: 'Disponible', vendido: 'Vendido', transferido: 'Transferido', no_sap: 'NO SAP', reservado: 'NO SAP', homologado: 'Homologado' };
  }
  if (!dispositivos.length) return `<div class="empty-state"><svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path d="M20 7H4a2 2 0 00-2 2v10a2 2 0 002 2h16a2 2 0 002-2V9a2 2 0 00-2-2z"/><path d="M16 3H8l-2 4h12l-2-4z"/></svg><p>No se encontraron equipos</p></div>`;

  // Valores mostrados por columna (para el filtro tipo Excel)
  const valOf = {
    imei:   d => d.nro_serie || '—',
    modelo: d => d.texto || '—',
    marca:  d => d.marca || '—',
    pv:     d => d.punto_venta_nombre || '—',
    remito: d => d.nro_remito || '—',
    fecha:  d => d.fecha_ingreso || '—',
    precio: d => '$' + (d.precio || 0).toLocaleString('es-AR'),
    estado: d => estadoLabel[d.estado] || d.estado || '—',
  };
  Object.keys(valOf).forEach(col => _registrarValoresColumna('stock-general', col, dispositivos.map(valOf[col])));

  // Aplicar filtros de columna seleccionados
  const filtrados = dispositivos.filter(d => {
    const fila = {};
    Object.keys(valOf).forEach(col => fila[col] = valOf[col](d));
    return _pasaFiltrosColumna('stock-general', fila);
  });
  if (!filtrados.length) return `<div class="empty-state"><p>Sin resultados con los filtros de columna aplicados</p></div>`;

  const sorted = _sortLista(filtrados, 'stock-general', {
    imei:   d => d.nro_serie||'',
    modelo: d => d.texto||'',
    marca:  d => d.marca||'',
    pv:     d => d.punto_venta_nombre||'',
    remito: d => d.nro_remito||'',
    fecha:  d => d.fecha_ingreso||'',
    precio: d => parseFloat(d.precio||0),
    estado: d => d.estado||'',
  });
  return `
    <table>
      <thead>
        <tr>
          ${_thCol('stock-general','imei','IMEI / Serie')}
          ${_thCol('stock-general','modelo','Modelo')}
          ${_thCol('stock-general','marca','Marca')}
          ${_thCol('stock-general','pv','Punto de Venta')}
          ${_thCol('stock-general','remito','Remito')}
          ${_thCol('stock-general','fecha','Ingreso')}
          ${_thCol('stock-general','precio','Precio')}
          ${_thCol('stock-general','estado','Estado')}
        </tr>
      </thead>
      <tbody>
        ${sorted.map(d => `
          <tr>
            <td style="font-family:monospace;font-size:12px;font-weight:600">${d.nro_serie}</td>
            <td>${d.texto}</td>
            <td>${d.marca || '—'}</td>
            <td>${d.punto_venta_nombre || '—'}</td>
            <td style="font-family:monospace;font-size:12px">${d.nro_remito || '—'}</td>
            <td>${d.fecha_ingreso || '—'}</td>
            <td>$${(d.precio || 0).toLocaleString('es-AR')}</td>
            <td><span class="badge ${estadoBadge[d.estado] || 'badge-gris'}">${estadoLabel[d.estado] || d.estado}</span></td>
          </tr>
        `).join('')}
      </tbody>
    </table>
  `;
}

function filtrarStock() {
  const busqueda = (document.getElementById('stock-search')?.value || '').toLowerCase();
  const estadoFiltro = document.getElementById('stock-filtro-estado')?.value || '';
  const pvFiltro = document.getElementById('stock-filtro-pv')?.value || '';

  let dispositivos = CACHE['dispositivos'] || DB.get('dispositivos') || [];

  // Ocultar vendidos por default salvo que el switch esté activo
  if (!_mostrarVendidos && !estadoFiltro) {
    dispositivos = dispositivos.filter(d => d.estado !== 'vendido');
  }

  if (busqueda) dispositivos = dispositivos.filter(d =>
    d.nro_serie?.toLowerCase().includes(busqueda) ||
    d.texto?.toLowerCase().includes(busqueda) ||
    d.nro_remito?.toLowerCase().includes(busqueda) ||
    d.marca?.toLowerCase().includes(busqueda)
  );
  if (estadoFiltro) dispositivos = dispositivos.filter(d => d.estado === estadoFiltro);
  if (pvFiltro) dispositivos = dispositivos.filter(d => d.punto_venta_id === pvFiltro);

  const estadoBadge = { disponible:'badge-verde', vendido:'badge-gris', transferido:'badge-azul', no_sap:'badge-rojo', reservado:'badge-rojo', homologado:'badge-morado' };
  const estadoLabel = { disponible:'Disponible', vendido:'Vendido', transferido:'Transferido', no_sap:'NO SAP', reservado:'NO SAP', homologado:'Homologado' };
  document.getElementById('stock-tabla').innerHTML = tablaStock(dispositivos, estadoBadge, estadoLabel);
}

async function guardarRemito() {
  const nro      = document.getElementById('rem-nro')?.value.trim();
  const nroPedido= document.getElementById('rem-pedido')?.value.trim() || '';
  const pvId     = document.getElementById('rem-pv')?.value;
  const pvs      = CACHE['puntos_venta'] || [];
  const pv       = pvs.find(p => p.id === pvId);

  const filasValidas = remitoManualFilas.filter(f => f.material.trim() && contarSeries(f.series) > 0);

  if (!nro || !pvId || !filasValidas.length) { toast('Completá remito, punto de venta y al menos un material con un IMEI', 'error'); return; }

  // Detectar materiales nuevos antes de guardar
  const itemsParaDetectar = filasValidas.map(f => ({ material: f.material, texto: f.material }));
  const matsNuevos = detectarMaterialesNuevos(itemsParaDetectar);
  if (matsNuevos.length) {
    mostrarAvisoMaterialesNuevos('aviso-materiales-nuevos', matsNuevos);
    toast(`⚠️ Hay ${matsNuevos.length} material(es) nuevo(s). Podés guardarlos desde el aviso amarillo.`, 'warning');
    // No bloqueamos el guardado — el usuario puede guardar igual y registrar los materiales después
  }

  const hoy = new Date().toLocaleDateString('es-AR');
  const nuevosDisp = [];
  let total = 0;
  let cantidadEquipos = 0;

  for (const f of filasValidas) {
    const mat    = buscarMaterialPorCodigo(f.material);
    const precio = mat?.precio || 0;
    const series = f.series.split('\n').map(s => s.trim()).filter(Boolean);
    for (const serie of series) {
      total += precio;
      cantidadEquipos++;
      nuevosDisp.push({
        id: DB.genId(), nro_serie: serie, material: f.material.trim(),
        texto: f.descripcion || mat?.nombre || 'Equipo ingresado', marca: mat?.marca || detectarMarcaPorPrefijo(f.descripcion || '') || '',
        precio, estado: 'disponible', punto_venta_id: pvId,
        punto_venta_nombre: pv?.nombre || '', nro_remito: nro,
        nro_pedido: nroPedido, fecha_ingreso: hoy,
      });
    }
  }

  await sbUpsertMany('dispositivos', nuevosDisp);
  await sbUpsert('remitos', {
    id: DB.genId(), nro_remito: nro, nro_pedido: nroPedido, tipo: 'ingreso',
    punto_venta_id: pvId, punto_venta_nombre: pv?.nombre || '',
    fecha: hoy, cantidad_items: cantidadEquipos, total, estado: 'procesado',
  });
  dbInvalidate('dispositivos');
  dbInvalidate('remitos');
  await Promise.all([dbGet('dispositivos'), dbGet('remitos')]);
  toast(`Remito ${nro} guardado con ${cantidadEquipos} equipo(s)`);
  irARemitos('historial');
}

async function procesarTransferencia() {
  const origenId = document.getElementById('trans-origen').value;
  const destinoId = document.getElementById('trans-destino').value;
  const series = document.getElementById('trans-series').value.split('\n').map(s => s.trim()).filter(Boolean);
  const pvs = await dbGet('puntos_venta');
  const destino = pvs.find(p => p.id === destinoId);

  if (!origenId || !destinoId || !series.length) { toast('Completá todos los campos', 'error'); return; }
  if (origenId === destinoId) { toast('El origen y destino no pueden ser iguales', 'error'); return; }

  const dispositivos = await dbGet('dispositivos');
  let transferidos = 0;
  for (const serie of series) {
    const disp = dispositivos.find(d => d.nro_serie === serie && d.punto_venta_id === origenId);
    if (disp) {
      await SB.update('dispositivos', disp.id, {
        punto_venta_id: destinoId,
        punto_venta_nombre: destino?.nombre || '',
        estado: 'disponible',
      }, SB_TOKEN);
      transferidos++;
    }
  }
  dbInvalidate('dispositivos');
  toast(`${transferidos} equipo(s) transferido(s) correctamente`);
  document.getElementById('trans-series').value = '';
}

function renderCuentas(pvSeleccionado) {
  const pvs = DB.get('puntos_venta').filter(p => !p.es_deposito);
  const movimientos = DB.get('cuentas_corrientes');

  if (pvSeleccionado) {
    const pv = pvs.find(p => p.id === pvSeleccionado);
    const movsPV = movimientos.filter(m => m.punto_venta_id === pvSeleccionado);

function guardarMovimiento(pvId) {
  const tipo = document.getElementById('mov-tipo').value;
  const importe = parseFloat(document.getElementById('mov-importe').value) || 0;
  const concepto = document.getElementById('mov-concepto').value.trim();
  const imei = document.getElementById('mov-imei').value.trim();
  const sds = document.getElementById('mov-sds').value.trim();

  if (!concepto || !importe) { toast('Completá concepto e importe', 'error'); return; }

  const cuentas = DB.get('cuentas_corrientes');
  const anteriores = cuentas.filter(c => c.punto_venta_id === pvId);
  const saldoAnterior = anteriores.length ? anteriores[anteriores.length - 1].saldo_acumulado : 0;
  const pvs = DB.get('puntos_venta');
  const pv = pvs.find(p => p.id === pvId);

  cuentas.push({
    id: DB.genId(), punto_venta_id: pvId, punto_venta_nombre: pv?.nombre || '',
    tipo, concepto, importe, imei, numero_sds: sds,
    saldo_acumulado: tipo === 'haber' ? saldoAnterior + importe : saldoAnterior - importe,
    fecha: new Date().toLocaleDateString('es-AR'),
  });
  DB.set('cuentas_corrientes', cuentas);
  toast('Movimiento registrado');
  cerrarModal('modal-movimiento');
  document.getElementById('page-content').innerHTML = renderCuentas(pvId);
}

// ── Detección de fechas basura/fuera de rango (ej: "julio de 1905") ─────────
const _ANIO_MIN_VALIDO = 2015;
const _ANIO_MAX_VALIDO = new Date().getFullYear() + 1;

function _anioDeLegajo(campoStr) {
  if (!campoStr) return null;
  const m = String(campoStr).match(/(\d{4})/);
  return m ? parseInt(m[1]) : null;
}

function detectarLegajosFechaSospechosa() {
  const legajos = CACHE['legajos'] || [];
  return legajos.filter(l => {
    const anioVenta = _anioDeLegajo(l.fecha_venta);
    const anioActiv = _anioDeLegajo(l.fecha_activacion);
    const sospechoso = a => a !== null && (a < _ANIO_MIN_VALIDO || a > _ANIO_MAX_VALIDO);
    return sospechoso(anioVenta) || sospechoso(anioActiv);
  });
}

function revisarFechasSospechosas() {
  const sospechosos = detectarLegajosFechaSospechosa();
  const modal = document.createElement('div');
  modal.className = 'modal-overlay';
  modal.id = 'modal-fechas-sospechosas';
  modal.innerHTML = `
    <div class="modal" style="max-width:640px">
      <div class="modal-header">
        <h3>⚠️ Legajos con fecha fuera de rango</h3>
        <button class="btn btn-icon btn-secondary" onclick="cerrarModal('modal-fechas-sospechosas')">✕</button>
      </div>
      <div class="modal-body">
        ${!sospechosos.length ? `
          <div class="empty-state"><p>✅ No se encontraron legajos con fechas fuera de rango (años ${_ANIO_MIN_VALIDO}-${_ANIO_MAX_VALIDO}).</p></div>
        ` : `
          <p style="font-size:12px;color:var(--gris-500);margin-bottom:12px">
            Se encontraron ${sospechosos.length} legajo(s) con fecha_venta o fecha_activación fuera del rango ${_ANIO_MIN_VALIDO}-${_ANIO_MAX_VALIDO}
            (probablemente datos basura de un error de conversión al importar). Por cada uno podés <strong>vaciar la fecha</strong>

async function vaciarFechaLegajo(id) {
  const legajos = CACHE['legajos'] || [];
  const l = legajos.find(x => x.id === id);
  if (!l) return;
  if (!confirm('¿Vaciar la fecha de venta/activación de este legajo? El resto de los datos se conserva.')) return;
  const datos = { ...l, fecha_venta: '', fecha_activacion: '' };
  await sbUpsert('legajos', datos);
  dbInvalidate('legajos');
  await dbGet('legajos');
  toast('Fecha vaciada ✓');
  document.getElementById(`fila-sosp-${id}`)?.remove();
  navegar('legajos');
}

async function eliminarLegajoSospechoso(id) {
  if (!confirm('⚠️ ¿Eliminar este legajo por completo? Esta acción no se puede deshacer.')) return;
  await SB.delete('legajos', id, SB_TOKEN);
  dbInvalidate('legajos');
  await dbGet('legajos');
  toast('Legajo eliminado ✓');
  document.getElementById(`fila-sosp-${id}`)?.remove();
  navegar('legajos');
}

function filtrarLegajos() {
  const busq    = (document.getElementById('legajo-search')?.value || '').toLowerCase();
  const pvFil   = document.getElementById('legajo-filtro-pv')?.value || '';
  const pgFil   = document.getElementById('legajo-filtro-pago')?.value || '';
  const vendFil = document.getElementById('legajo-filtro-vendedor')?.value || '';
  const tipoFil = document.getElementById('legajo-filtro-tipo')?.value || '';
  let leg = CACHE['legajos'] || [];

  if (busq) leg = leg.filter(l =>
    l.sds_id?.toLowerCase().includes(busq)     ||
    l.numero_sds?.toLowerCase().includes(busq) ||
    l.imei?.toLowerCase().includes(busq)       ||
    l.dni?.toLowerCase().includes(busq)        ||
    l.apellido?.toLowerCase().includes(busq)   ||
    l.vendedor?.toLowerCase().includes(busq)   ||
    l.linea?.toLowerCase().includes(busq)
  );
  if (pvFil)   leg = leg.filter(l => l.punto_venta_id === pvFil);
  if (pgFil)   leg = leg.filter(l => l.tipo_pago === pgFil);
  if (vendFil) leg = leg.filter(l => l.vendedor === vendFil);
  if (tipoFil) leg = leg.filter(l => l.tipo_sds === tipoFil);

  const fechaDesde = document.getElementById('legajo-filtro-fecha-desde')?.value || '';
  const fechaHasta = document.getElementById('legajo-filtro-fecha-hasta')?.value || '';
  if (fechaDesde || fechaHasta) {
    leg = leg.filter(l => {
      const fechaStr = l.fecha_activacion || l.fecha_venta || '';
      if (!fechaStr) return false;
      let iso = '';
      if (/^\d{4}-\d{2}/.test(fechaStr)) iso = fechaStr.slice(0,10);
      else if (/^\d{2}\/\d{2}\/\d{4}/.test(fechaStr)) {
        const p = fechaStr.split('/');
        iso = `${p[2].slice(0,4)}-${p[1]}-${p[0]}`;
      }
      if (!iso) return true;
      if (fechaDesde && iso < fechaDesde) return false;
      if (fechaHasta && iso > fechaHasta) return false;
      return true;
    });
  }

  document.getElementById('legajos-tabla').innerHTML = tablaLegajos(leg);
}

}



async function guardarCorreccionLegajo(legajoId) {
  const leg = (CACHE['legajos'] || []).find(l => l.id === legajoId);
  if (!leg) return;

  const pvs = CACHE['puntos_venta'] || [];
  const cambios = {};

  // DNI Vendedor
  const dniVend = document.getElementById('edit-vendedor_dni')?.value.trim();
  if (dniVend) cambios.vendedor_dni = dniVend;

  // IMEI
  const imei = document.getElementById('edit-imei')?.value.trim();
  if (imei) cambios.imei = imei;

  // Punto de Venta
  const pvId = document.getElementById('edit-punto_venta_id')?.value;
  if (pvId) {
    const pv = pvs.find(p => p.id === pvId);
    cambios.punto_venta_id     = pvId;
    cambios.punto_venta_nombre = pv?.nombre || '';
    cambios.pv_detectado_id    = pvId;
    cambios.pv_detectado_nombre= pv?.nombre || '';
  }

  if (!Object.keys(cambios).length) {
    toast('No hay cambios para guardar', 'warn');
    return;
  }

  // Re-evaluar si necesita control después de la corrección
  const legActualizado = { ...leg, ...cambios };
  const planes = CACHE['planes_promociones'] || [];
  const spn    = planes.find(p => p.tipo === 'spn' && p.codigo === String(legActualizado.spn_codigo||'').trim());
  const requiereImei = spn ? spn.requiere_imei : tipoRequiereImei(legActualizado.tipo_sds);
  const disp   = CACHE['dispositivos'] || [];
  const dispMatch = legActualizado.imei ? disp.find(d => d.nro_serie === legActualizado.imei) : null;

  const sigueEnError = !legActualizado.vendedor_dni
    || !legActualizado.punto_venta_id
    || (requiereImei && (!legActualizado.imei || legActualizado.imei === '999999999999556'))
    || (requiereImei && !dispMatch);

  cambios.necesita_control = sigueEnError;
  cambios.ctrl_motivo = !legActualizado.vendedor_dni ? 'sin_vendedor'
    : !legActualizado.punto_venta_id ? 'sin_pv'
    : requiereImei && (!legActualizado.imei || legActualizado.imei === '999999999999556') ? 'sin_imei'
    : requiereImei && !dispMatch ? 'imei_no_en_stock' : '';

  try {
    await sbUpsert('legajos', { ...leg, ...cambios });
    // Actualizar caché
    const idx = (CACHE['legajos']||[]).findIndex(l => l.id === legajoId);
    if (idx >= 0) CACHE['legajos'][idx] = { ...leg, ...cambios };
    dbInvalidate('legajos');
    cerrarModal('modal-detalle-legajo');
    toast(sigueEnError ? '✅ Guardado — aún tiene datos faltantes' : '✅ Legajo corregido y liberado de Control SDS');
    // Refrescar la vista
    switchTabLegajos('control');
  } catch(e) {
    toast('Error al guardar: ' + e.message, 'error');
  }
}

async function importarDesdeWebcom() {
  const cfgW = await getConfigWebcom();
  if (!cfgW.jsonUrl) {
    toast('Configurá la URL del resumen JSON en Configuración → Sistemas AMX → Webcom', 'error');
    return;
  }

  // Modal de progreso con botón cerrar siempre visible
  const modal = document.createElement('div');
  modal.className = 'modal-overlay';
  modal.id = 'modal-webcom-import';
  modal.innerHTML = `
    <div class="modal" style="max-width:480px">
      <div class="modal-header" style="display:flex;justify-content:space-between;align-items:center">
        <h3>🤖 Importar desde bot Webcom</h3>
        <button class="btn btn-sm btn-secondary" onclick="document.getElementById('modal-webcom-import')?.remove()">✕</button>
      </div>
      <div class="modal-body">
        <div style="padding:8px 12px;background:var(--azul-suave);border-radius:6px;font-size:12px;color:var(--azul);margin-bottom:10px">
          📅 Período a importar: <strong>${cfgW.fechaDesde ? cfgW.fechaDesde.split('-').reverse().join('/') : '—'}</strong>
          → <strong>${cfgW.fechaHasta ? cfgW.fechaHasta.split('-').reverse().join('/') : '—'}</strong>
        </div>
        <div id="webcom-import-log" style="background:#0F172A;border-radius:8px;padding:12px 14px;font-family:monospace;font-size:12px;color:#94A3B8;min-height:120px;max-height:280px;overflow-y:auto;line-height:1.8">
          Conectando con el repositorio...
        </div>
      </div>
    </div>`;
  document.body.appendChild(modal);

  function log(msg, color) {
    const el = document.getElementById('webcom-import-log');
    if (el) el.innerHTML += '<br><span style="color:'+(color||'#94A3B8')+'">'+msg+'</span>';
  }

  try {
    const ARCHIVOS = {
      solicitudes:  'solicitudes',
      solicitantes: 'solicitantes',
      terminales:   'terminales',
      pagos:        'pagos',
      reportes:     'reportes',
      venta_equipo: 'venta',
      partidas:     'partidas',
    };

    // Repo privado — usar GitHub Contents API con token
    const ghUser = 'GestionSLA';
    const ghRepo = cfgW.repo || 'bot-webcom';
    const headers = cfgW.ghToken
      ? { 'Authorization': 'token ' + cfgW.ghToken, 'Accept': 'application/vnd.github.v3.raw' }
      : {};
    if (!cfgW.ghToken) log('⚠️ Sin token GitHub configurado en Sistemas AMX → Webcom', '#f59e0b');

    // Base URL usando la API de contenidos de GitHub (soporta repos privados con token)
    const apiBase = `https://api.github.com/repos/${ghUser}/${ghRepo}/contents/data/`;

    // Base URL de los JSONs
    const base = cfgW.jsonUrl.replace('webcom_resumen.json', '');

    // Descargar los 6 JSONs
    importadorState.sheets = {};
    let totalReg = 0;
    let errores  = 0;

    for (const [archivo, key] of Object.entries(ARCHIVOS)) {
      log('⏳ Descargando ' + archivo + '.json...');
      const url = apiBase + archivo + '.json';
      try {
        const res = await fetch(url, { headers });
        if (!res.ok) {
          log('⚠️ ' + archivo + ' — HTTP ' + res.status, '#f59e0b');
          errores++;
          continue;
        }
        // La API de GitHub devuelve el contenido en base64 o raw según el header Accept
        let datos;
        const ct = res.headers.get('content-type') || '';
        if (ct.includes('json') && !ct.includes('raw')) {
          // Respuesta de la API → decodificar base64
          const meta = await res.json();
          const decoded = atob(meta.content.replace(/\n/g, ''));
          datos = JSON.parse(decoded);
        } else {
          // Raw content directo
          datos = await res.json();
        }
        totalReg += datos.length;
        const sheetHeaders = datos.length > 0 ? Object.keys(datos[0]) : [];
        const sheetData    = datos.map(row => sheetHeaders.map(h => row[h] ?? ''));
        importadorState.sheets[key] = { headers: sheetHeaders, data: sheetData };
        log('✅ ' + archivo + ' — ' + datos.length + ' registros', '#4ADE80');
      } catch(fetchErr) {
        log('❌ ' + archivo + ' — ' + fetchErr.message, '#f87171');
        errores++;
      }
    }

    if (errores === Object.keys(ARCHIVOS).length) {
      log('\n❌ No se pudo descargar ningún archivo.', '#f87171');
      log('   Verificá el token en Configuración → Sistemas AMX → Webcom', '#f87171');
      return;
    }

    log('\n📋 Total: ' + totalReg + ' registros' + (errores ? ' (' + errores + ' archivos con error)' : ''), '#4ADE80');
    log('🔄 Cruzando archivos y armando legajos...');
    await new Promise(r => setTimeout(r, 800));

    // Cerrar modal y procesar con filtro de fechas
    document.getElementById('modal-webcom-import')?.remove();
    procesarWebcom(cfgW.fechaDesde, cfgW.fechaHasta);

  } catch(e) {
    log('❌ Error: ' + e.message, '#f87171');
    console.error('importarDesdeWebcom error:', e);
  }
}

async function importarLegajosJSON(file) {
  if (!file) return;
  mostrarIndicadorSync('📂 Procesando JSON...');
  try {
    const texto   = await file.text();
    const datos   = JSON.parse(texto);
    const pvs     = CACHE['puntos_venta'] || [];
    const disps   = CACHE['dispositivos'] || [];

    const legajos = datos.map(d => {
      // Resolver punto de venta por entidad
      let pvMatch = null;
      if (d.entidad_pv) {
        pvMatch = pvs.find(p =>
          (p.entidades || []).some(e => String(e) === String(d.entidad_pv))
        );
      }

      // Marcar equipo como vendido si el IMEI existe en nuestro stock
      const dispMatch = d.imei ? disps.find(di => di.nro_serie === d.imei) : null;

      return {
        id:                DB.genId(),
        sds_id:            d.sds_id || '',
        numero_sds:        d.sds_id || '',
        dni:               d.dni || '',
        cuit:              d.cuit || '',
        apellido:          d.apellido || '',
        nombre:            d.nombre || '',
        telefono:          d.telefono || '',
        domicilio:         d.domicilio || '',
        nro_domicilio:     d.nro_domicilio || '',
        ciudad:            d.ciudad || '',
        cond_iva:          d.cond_iva || '',
        linea:             d.linea || '',
        nro_cuenta:        d.nro_cuenta || '',
        fecha_activacion:  d.fecha_activacion || '',
        imei:              d.imei || '',
        sim:               d.sim || '',
        modelo:            d.modelo || '',
        cod_producto:      d.cod_producto || '',
        agencia:           d.agencia || '',
        subagente:         d.subagente || '',
        vendedor_dni:      d.vendedor_dni || '',
        tipo_venta:        d.tipo_venta || '',
        entidad_pv:        d.entidad_pv || '',
        punto_venta_id:    pvMatch?.id || '',
        punto_venta_nombre:pvMatch?.nombre || '',
        tipo_pago:         d.tipo_pago || '',
        entidad_pago:      d.entidad_pago || '',
        forma_pago:        d.forma_pago || '',
        cuotas:            d.cuotas || '',
        importe:           d.importe || 0,
        cod_autorizacion:  d.cod_autorizacion || '',
        bill_number:       d.bill_number || '',
        estado:            d.estado || '',
        equipo_id:         dispMatch?.id || '',
        equipo_vendido:    dispMatch ? true : false,
      };
    });

    // Marcar equipos como vendidos en Supabase
    const vendidos = legajos.filter(l => l.equipo_id);
    let marcados = 0;
    for (const l of vendidos) {
      const disp = disps.find(d => d.id === l.equipo_id);
      if (disp && disp.estado !== 'vendido') {
        await sbUpsert('dispositivos', { ...disp, estado: 'vendido' });
        marcados++;
      }
    }

    // Guardar legajos en Supabase
    await sbUpsertMany('legajos', legajos);
    dbInvalidate('legajos');
    dbInvalidate('dispositivos');
    await Promise.all([dbGet('legajos'), dbGet('dispositivos')]);

    mostrarIndicadorSync(`✅ ${legajos.length} legajos importados. ${marcados} equipos marcados como vendidos.`, 'ok');
    toast(`✅ ${legajos.length} legajos importados, ${marcados} equipos vendidos`);
    navegar('legajos');

  } catch(e) {
    mostrarIndicadorSync('❌ Error al importar: ' + e.message, 'error');
    toast('Error: ' + e.message, 'error');
  }
}

function cargarXLSX() {
  return new Promise((resolve, reject) => {
    if (window.XLSX) { resolve(); return; }
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    s.onload = resolve;
    s.onerror = () => reject(new Error('No se pudo cargar la librería XLSX'));
    document.head.appendChild(s);
  });
}

// Convierte fecha Excel (serial numérico o string) a DD/MM/YYYY HH:MM
function parseFechaExcel(val) {
  if (!val || val === '') return '';
  const str = String(val).trim();

  // Formato ISO: YYYY-MM-DD o YYYY-MM-DD HH:MM:SS (fechas del bot Webcom)
  if (/^\d{4}-\d{2}-\d{2}/.test(str)) {
    const [fecha, hora] = str.split(' ');
    const [yyyy, mm, dd] = fecha.split('-');
    return `${dd}/${mm}/${yyyy}${hora ? ' ' + hora.substring(0,5) : ''}`;
  }

  // Ya es fecha legible con formato DD/MM/YY o DD/MM/YYYY
  if (/^\d{1,2}\/\d{1,2}\/\d{2,4}/.test(str)) {
    // Normalizar a DD/MM/YYYY
    const parts = str.split(' ');
    const dateParts = parts[0].split('/');
    if (dateParts[2]?.length === 2) dateParts[2] = '20' + dateParts[2];
    return dateParts.join('/') + (parts[1] ? ' ' + parts[1].substring(0,5) : '');
  }

  // Formato MM/DD/YYYY (de Solicitudes: "7/25/2026 4:58:23 PM")
  if (/^\d{1,2}\/\d{1,2}\/\d{4}/.test(str)) {
    const parts = str.split(' ');
    const [mm, dd, yyyy] = parts[0].split('/');
    let hora = parts[1] ? parts[1].substring(0,5) : '';
    if (parts[2] === 'PM' && hora) {
      const [h, m] = hora.split(':');
      const h24 = (parseInt(h) % 12) + 12;
      hora = `${h24}:${m}`;
    }
    return `${dd.padStart(2,'0')}/${mm.padStart(2,'0')}/${yyyy}${hora ? ' ' + hora : ''}`;
  }

  // Número serial Excel (ej: 46228.7072106482)
  const num = parseFloat(str);
  if (!isNaN(num) && num > 1000) {
    // Excel epoch: 1 = 1/1/1900, con bug de 1900 bisiesto
    const d = new Date((num - 25569) * 86400 * 1000);
    const anioDetectado = d.getUTCFullYear();
    // Solo aceptar si cae en un rango de años plausible para el negocio.
    // Evita que números que NO son fechas (ids, cantidades, etc.) se conviertan
    // en fechas basura como "julio de 1905" (num chico mal interpretado como serial Excel).
    if (!isNaN(d.getTime()) && anioDetectado >= 2015 && anioDetectado <= 2035) {
      const dd  = String(d.getUTCDate()).padStart(2,'0');
      const mm  = String(d.getUTCMonth()+1).padStart(2,'0');
      const yyyy = anioDetectado;
      const hh  = String(d.getUTCHours()).padStart(2,'0');
      const min = String(d.getUTCMinutes()).padStart(2,'0');
      return `${dd}/${mm}/${yyyy} ${hh}:${min}`;
    }
  }

  return str; // devolver tal cual si no se pudo parsear
}

async function procesarExcel5() {
  const archivos = {
    rep:   document.getElementById('xl-Reportes')?.files[0],
    solic: document.getElementById('xl-Solicitudes')?.files[0],
    sant:  document.getElementById('xl-Solicitantes')?.files[0],
    venta: document.getElementById('xl-Venta')?.files[0],
    term:  document.getElementById('xl-Terminales')?.files[0],
    pagos: document.getElementById('xl-Pagos')?.files[0],
  };

  const cargados = Object.values(archivos).filter(Boolean).length;
  if (!cargados) { toast('Seleccioná al menos un archivo', 'error'); return; }

  const estadoEl = document.getElementById('sds-import-estado');

  const progreso = (paso, total, msg) => {
    const pct = total ? Math.round((paso / total) * 100) : 0;
    if (!estadoEl) return;
    estadoEl.innerHTML = `
      <div style="padding:10px 12px;background:var(--azul-suave);border:1px solid var(--azul);border-radius:8px;font-size:12px;color:var(--azul)">
        <div style="display:flex;justify-content:space-between;margin-bottom:6px">
          <span>🔄 ${msg}</span>
          <span style="font-weight:700">${pct}%</span>
        </div>
        <div style="background:#dbeafe;border-radius:4px;height:6px;overflow:hidden">
          <div style="background:var(--azul);height:100%;width:${pct}%;transition:width .3s"></div>
        </div>
      </div>`;
  };

  try {
    progreso(1, 10, 'Cargando librería Excel...');
    await cargarXLSX();

    const leer = async (file, nombre) => {
      if (!file) return [];
      progreso(null, null, `Leyendo ${nombre}...`);
      const buf = await file.arrayBuffer();
      const wb  = XLSX.read(buf, { type: 'array' });
      const ws  = wb.Sheets[wb.SheetNames[0]];
      return XLSX.utils.sheet_to_json(ws, { defval: '' });
    };

    const clean = rows => rows.map(r => {
      const o = {};
      for (const [k,v] of Object.entries(r))
        o[k.trim()] = String(v === null || v === undefined ? '' : v).trim().replace(/^(nan|None)$/,'');
      return o;
    // Filtrar filas vacías o que sean metadatos del archivo ("Filtros aplicados:")
    }).filter(r => {
      const vals = Object.values(r);
      const primera = vals[0] || '';
      if (primera.toLowerCase().includes('filtros aplicados')) return false;
      if (vals.every(v => !v || v === '')) return false;
      return true;
    });

    const toFloat = v => { try { return parseFloat(String(v).replace(',','.').replace(/[^0-9.-]/g,'')) || 0; } catch { return 0; } };

    progreso(1, 10, 'Leyendo Reportes (1/6)...');
    const rep   = clean(await leer(archivos.rep,   'Reportes'));
    progreso(2, 10, 'Leyendo Solicitudes (2/6)...');
    const solic = clean(await leer(archivos.solic,  'Solicitudes'));
    progreso(3, 10, 'Leyendo Solicitantes (3/6)...');
    const sant  = clean(await leer(archivos.sant,   'Solicitantes'));
    progreso(4, 10, 'Leyendo Venta de Equipo (4/6)...');
    const venta = clean(await leer(archivos.venta,  'Venta de Equipo'));
    progreso(5, 10, 'Leyendo Terminales (5/6)...');
    const term  = clean(await leer(archivos.term,   'Terminales'));
    progreso(6, 10, 'Leyendo Pagos (6/6)...');
    const pagos = clean(await leer(archivos.pagos,  'Pagos'));

    progreso(7, 10, `Cruzando datos (${solic.length} SDS + ${venta.length} CATER)...`);
    await new Promise(r => setTimeout(r, 30));

    // Índices
    const idx_term_imei = Object.fromEntries(term.map(r => [r['IMEI'], r]).filter(([k]) => k));
    const idx_term_id   = Object.fromEntries(term.map(r => [r['ID'],   r]).filter(([k]) => k));
    const idx_sant = Object.fromEntries(sant.map(r => [r['Srf Id'], r]).filter(([k]) => k));
    const idx_rep  = Object.fromEntries(rep.map(r => [r['SDS'], r]).filter(([k]) => k));

    const pagos_sds = {}, pagos_bill = {};
    for (const p of pagos) {
      if (p['Id Sds'])      pagos_sds[p['Id Sds']]       = (pagos_sds[p['Id Sds']]       || []).concat(p);
      if (p['Bill Number']) pagos_bill[p['Bill Number']]  = (pagos_bill[p['Bill Number']]  || []).concat(p);
    }

    const agg = lista => {
      if (!lista?.length) return {};
      return {
        tipo_pago:        [...new Set(lista.map(p=>p['Tipo Pago']).filter(Boolean))].join(' / '),
        entidad_pago:     [...new Set(lista.map(p=>p['Entidad Pago']).filter(Boolean))].join(' / '),
        forma_pago:       lista[0]['Forma Pago'] || '',
        cuotas:           lista[0]['Cuotas'] || '',
        cod_autorizacion: lista[0]['Cod Aut'] || '',
        bill_number:      lista[0]['Bill Number'] || '',
        importe:          lista.reduce((s,p) => s + toFloat(p['Importe']), 0),
      };
    };

    const pvs  = CACHE['puntos_venta'] || [];
    const disp = CACHE['dispositivos'] || [];

    // ── FICHAS SDS ──
    const fichas_sds = solic.map(s => {
      const srf_id  = s['Srf Id'] || '';
      const form    = s['Srf Form Number'] || '';
      const rep_d   = idx_rep[form] || {};
      const sant_d  = idx_sant[srf_id] || {};

      // Buscar en Terminales por Srf Id (columna ID) — fuente más confiable del IMEI
      // Reportes puede no tener el registro si no procesó esa SDS
      const term_by_id = idx_term_id[srf_id] || {};

      // IMEI: prioridad Terminales (por ID) > Reportes > Srf Equipment Receipt del archivo
      const imei_rep   = rep_d['IMEI'] || '';
      const imei_term  = term_by_id['IMEI'] || '';
      const imei_raw   = s['Srf Equipment Receipt'] || '';
      // Srf Equipment Receipt = "000000000000" significa sin IMEI
      const imei_sol   = (imei_raw && imei_raw !== '000000000000') ? imei_raw : '';
      const imei       = imei_term || imei_rep || imei_sol || '';

      // term_d para modelo/cod: por IMEI si existe, sino por ID
      const term_d  = (imei && idx_term_imei[imei]) || term_by_id || {};

      const nim     = rep_d['Nim'] || s['Srf Cellular Number3'] || '';
      const pago_d  = agg(pagos_sds[srf_id]);
      const titular = rep_d['Titular'] || '';
      const [ape_r='', nom_r=''] = titular.includes(',') ? titular.split(',',2).map(x=>x.trim()) : [titular,''];
      // Entidad correcta: Entidad Id de Solicitudes o Solicitantes (NO de Reportes que trae el padre)
      const entidadVenta = s['Entidad Id'] || sant_d['Entidad Id'] || term_d['Entidad'] || '';
      const pvMatch   = pvs.find(p => (p.entidades||[]).some(e => String(e) === String(entidadVenta)));
      const dispMatch = imei ? disp.find(d => d.nro_serie === imei) : null;
      // Fecha de activación: Terminales > Reportes > Solicitudes > Solicitantes
      const fechaRaw  = term_by_id['Fecha-Activación'] || rep_d['Fecha-Activ'] || s['Srf Activation Date'] || sant_d['Srf Activation Date'] || '';
      const fechaActiv = parseFechaExcel(fechaRaw);
      const spnCodigo  = s['Srf Spn Spc Id'] || '';
      const planCodigo = s['Srf Rpl Id'] || '';
      const clasificacion = clasificarSDS(spnCodigo, pvMatch, imei, dispMatch);
      return {
        id: DB.genId(),
        // sds_id = número REAL de SDS (Srf Form Number, ej: "34592098SEC")
        sds_id:        form || rep_d['SDS'] || '',
        // identificador = Srf Id, clave interna de cruce entre archivos
        identificador: srf_id,
        sds_form:      form, fuente: 'SDS',
        dni:           sant_d['Srf Identification Number']||'',
        cuit:          sant_d['Srf Cuit']||'',
        apellido:      sant_d['Srf Client Last Name']||ape_r,
        nombre:        sant_d['Srf Client First Name']||nom_r,
        telefono:      sant_d['Srf Client Phone']||'',
        domicilio:     sant_d['Srf Billing Street']||'',
        nro_domicilio: sant_d['Srf Billing Number']||'',
        ciudad:        sant_d['Srf Billing City']||sant_d['Geu Description']||rep_d['Ciudad-POS']||'',
        cond_iva:      sant_d['Srf Vat Id']||'',
        linea:         nim,
        nse:           rep_d['NSE']||s['Srf Hex Esn']||'',
        nro_cuenta:    rep_d['Cuenta']||s['Srf Account Number1']||'',
        fecha_activacion: fechaActiv,
        fecha_venta:   parseFechaExcel(rep_d['Fecha-Venta']||''),
        imei,
        sim:           rep_d['NSE']||s['Srf Hex Esn']||'',
        // Modelo: Terminales (por ID o IMEI) > Reportes > Solicitudes
        modelo:        term_d['Descripción']||rep_d['Equipo']||s['Srf Pro Id']||'',
        cod_producto:  term_d['Cod. Producto']||s['Srf Pro Id']||'',
        agencia:       s['Agente']||'',
        subagente:     s['Subagente']||'',
        vendedor:      rep_d['Vendedor'] || '',
        vendedor_dni:  rep_d['DNI Vendedor']||s['Srf Vendedor Dni']||'',
        coordinador:   rep_d['Coordinador']||'',
        store:         rep_d['Store']||s['Usp Id Mav']||'',
        tipo_venta:    s['Pro Type']||'',
        entidad_pv:    entidadVenta,
        punto_venta_id:     pvMatch?.id||'',
        punto_venta_nombre: pvMatch?.nombre||'',
        tipo_pago:          pago_d.tipo_pago||rep_d['Forma-pago']||'',
        entidad_pago:       pago_d.entidad_pago||'',
        forma_pago:         pago_d.forma_pago||rep_d['Forma-pago']||'',
        cuotas:             pago_d.cuotas||'',
        importe:            pago_d.importe||0,
        cod_autorizacion:   pago_d.cod_autorizacion||'',
        bill_number:        pago_d.bill_number||'',
        estado:        s['Decode Srf Est Id']||'',
        bloque:        rep_d['Bloque']||s['Srf Blc Block Code']||'',
        mercado:       rep_d['Mercado']||s['Blc Mkc Market Code']||'',
        plan:          rep_d['Plan']||s['Srf Spn Spc Id']||'',
        promocion:     rep_d['Promoción']||s['Srf Rpl Id']||'',
        presuspendida: rep_d['Presuspendida']||'',
        equipo_id:     dispMatch?.id||'',
        equipo_vendido: !!dispMatch,
        tipo_sds:      clasificacion.tipo_sds,
        spn_codigo:    spnCodigo,
        spn_desc:      clasificacion.spn_desc,
        plan_codigo:   planCodigo,
        necesita_control: !pvMatch
          || (clasificacion.requiere_imei && (!imei || imei === '999999999999556' || !dispMatch)),
        ctrl_motivo: !pvMatch ? 'sin_pv'
          : clasificacion.requiere_imei && (!imei || imei === '999999999999556') ? 'sin_imei'
          : clasificacion.requiere_imei && !dispMatch ? 'imei_no_en_stock' : '',
        pv_detectado_id:     pvMatch?.id||'',
        pv_detectado_nombre: pvMatch?.nombre||'',
        monto_eft:'', monto_ch:'', monto_tc:'', monto_td:'',
        partida_importe: partidasIdx[String(pago_d.bill_number||'')]?.['IMPORTE_RENDICION'] || null,
        partida_estado:  partidasIdx[String(pago_d.bill_number||'')]?.['ESTADO'] || '',
        partida_fecha:   partidasIdx[String(pago_d.bill_number||'')]?.['FECHA'] || '',
        partida_rendida: false,
      };
    });

    // ── FICHAS CATER ──
    const fichas_cater = venta.map(v => {
      const imei    = v['IMEI'] || '';
      const bill    = v['Bill-Number'] || '';
      const term_d  = (imei && idx_term_imei[imei]) || idx_term_id[v['Id Sds']||''] || {};
      const pago_d  = agg(pagos_bill[bill]);
      const pvMatch   = pvs.find(p => (p.entidades||[]).some(e => String(e) === String(v['Entidad Hija']||'')));
      const dispMatch = imei ? disp.find(d => d.nro_serie === imei) : null;
      // CATER no tiene código SPN — clasificar con contexto disponible
      const clasCater = clasificarSDS('', pvMatch, imei, dispMatch);
      return {
        id: DB.genId(),
        sds_id: v['Cater Sds Id']||'',
        identificador: v['Id Sds']||v['ID']||v['Cater Sds Id']||'',
        sds_form: '', fuente: 'CATER',
        dni:'', cuit:'', apellido: v['Apellido']||'', nombre: v['Nombre']||'',
        telefono:'', domicilio:'', nro_domicilio:'', ciudad:'', cond_iva: v['Cond-IVA']||'',
        linea: v['Nim']||'', nse:'', nro_cuenta: v['Cuenta']||'',
        fecha_activacion: parseFechaExcel(v['Fecha-Migracion']||''),
        fecha_venta: parseFechaExcel(v['Fecha-Migracion']||''),
        imei, sim: v['SIM']||'',
        modelo: v['Pro Model']||term_d['Descripción']||'', cod_producto: term_d['Cod. Producto']||'',
        agencia: v['Agencia']||'', subagente:'', vendedor:'', vendedor_dni: v['DNI-Vendedor']||'',
        coordinador:'', store:'', tipo_venta: v['TipoVenta']||'',
        entidad_pv: v['Entidad Hija']||'',
        punto_venta_id: pvMatch?.id||'', punto_venta_nombre: pvMatch?.nombre||'',
        tipo_pago: pago_d.tipo_pago||v['Forma-Pago Description']||'',
        entidad_pago: pago_d.entidad_pago||'', forma_pago: pago_d.forma_pago||v['Forma-Pago']||'',
        cuotas: pago_d.cuotas||'', importe: pago_d.importe||toFloat(v['Monto-Partida'])||0,
        cod_autorizacion: pago_d.cod_autorizacion||'', bill_number: bill,
        // CATER no tiene DNI de cliente — usar nro de cuenta como referencia
        dni: v['Cuenta'] || '',
        nro_cuenta: v['Cuenta'] || '',
        estado: term_d['Estado ID']||'', bloque:'', mercado:'', plan:'', promocion:'', presuspendida:'',
        equipo_id: dispMatch?.id||'', equipo_vendido: !!dispMatch,
        tipo_sds: clasCater.tipo_sds, spn_codigo:'', spn_desc:'', plan_codigo:'',
        // necesita_control si: falta vendedor_dni, falta PV, o falta CATER SDS id, o imei no en stock
        necesita_control: !v['DNI-Vendedor'] || !pvMatch || !v['Cater Sds Id'] || (clasCater.requiere_imei && (!imei || !dispMatch)),
        ctrl_motivo: !v['DNI-Vendedor'] ? 'sin_vendedor'
          : !pvMatch ? 'sin_pv'
          : !v['Cater Sds Id'] ? 'sin_sds'
          : clasCater.requiere_imei && !imei ? 'sin_imei'
          : clasCater.requiere_imei && !dispMatch ? 'imei_no_en_stock' : '',
        pv_detectado_id: pvMatch?.id||'', pv_detectado_nombre: pvMatch?.nombre||'',
        monto_eft: v['Eft']||'', monto_ch: v['Ch']||'', monto_tc: v['Tc']||'', monto_td: v['Td']||'',
      };
    });

    // ── Deduplicar dentro del mismo lote de archivos ──────────────
    // Prioridad: ficha con más datos (Reportes tiene más campos completos)
    // Si dos fichas tienen el mismo sds_id, quedarse con la que tiene IMEI o más datos
    const todasDedup = (() => {
      const mapaDedup = new Map();
      for (const f of [...fichas_sds, ...fichas_cater]) {
        const key = f.sds_id || f.identificador || f.id;
        if (!key) continue;
        if (!mapaDedup.has(key)) {
          mapaDedup.set(key, f);
        } else {
          const existente = mapaDedup.get(key);
          // Ganar: la que tiene más campos completos (más datos de Reportes)
          const puntosNueva     = [f.imei, f.modelo, f.vendedor, f.linea, f.punto_venta_id].filter(Boolean).length;
          const puntosExistente = [existente.imei, existente.modelo, existente.vendedor, existente.linea, existente.punto_venta_id].filter(Boolean).length;
          if (puntosNueva > puntosExistente) mapaDedup.set(key, f);
        }
      }
      return [...mapaDedup.values()];
    })();
    const duplicadosInternos = (fichas_sds.length + fichas_cater.length) - todasDedup.length;
    if (duplicadosInternos > 0) console.log(`[Import] ${duplicadosInternos} duplicados internos eliminados`);

    const todas = todasDedup;

    progreso(8, 10, 'Comparando contra base de datos...');
    await new Promise(r => setTimeout(r, 30));

    // ── Detectar códigos SPN y Plan nuevos ────────────────────────
    const planesConocidos = CACHE['planes_promociones'] || [];
    const spnsConocidos   = new Set(planesConocidos.filter(p=>p.tipo==='spn').map(p=>p.codigo));
    const planesConocidosSet = new Set(planesConocidos.filter(p=>p.tipo==='plan').map(p=>p.codigo));

    const spnsNuevos  = [...new Set(todas.map(f=>f.spn_codigo).filter(Boolean))].filter(c => !spnsConocidos.has(c));
    const planesNuevos = [...new Set(todas.map(f=>f.plan_codigo).filter(Boolean))].filter(c => !planesConocidosSet.has(c));

    // Si hay códigos nuevos, mostrar modal de configuración primero
    if (spnsNuevos.length || planesNuevos.length) {
      window._importPendiente = { ...window._importPendiente, todas, disp, spnsNuevos, planesNuevos };
      await mostrarModalCodigosNuevos(spnsNuevos, planesNuevos, todas, disp);
      return;
    }
    await new Promise(r => setTimeout(r, 30));

    // ── Detectar nuevas vs existentes con cambios ──────────────────
    const legajosExistentes = CACHE['legajos'] || await dbGet('legajos');
    const idxExistentes = Object.fromEntries(legajosExistentes.map(l => [l.sds_id, l]));

    // Campos clave a comparar para detectar cambios
    const CAMPOS_CLAVE = ['imei','modelo','punto_venta_id','punto_venta_nombre',
      'vendedor','vendedor_dni','fecha_activacion','linea','nro_cuenta',
      'tipo_pago','importe','entidad_pv','estado'];

    const nuevas   = todas.filter(f => f.sds_id && !idxExistentes[f.sds_id]);
    const cambios  = []; // { nueva, vieja, diferencias[] }

    for (const f of todas.filter(x => x.sds_id && idxExistentes[x.sds_id])) {
      const vieja = idxExistentes[f.sds_id];
      const diffs = CAMPOS_CLAVE.filter(k => {
        const vNew = String(f[k]||'').trim();
        const vOld = String(vieja[k]||'').trim();
        return vNew && vOld !== vNew; // solo si hay dato nuevo y es diferente
      });
      if (diffs.length > 0) cambios.push({ nueva: f, vieja, diferencias: diffs });
    }

    progreso(9, 10, `${nuevas.length} nuevas · ${cambios.length} con cambios...`);
    await new Promise(r => setTimeout(r, 30));

    // Si hay cambios, mostrar modal de preview antes de continuar
    if (cambios.length > 0 || nuevas.length === 0) {
      // Guardar estado para que los botones del modal puedan acceder
      window._importPendiente = { nuevas, cambios, disp, marcados: 0 };
      mostrarModalPreviewImport(nuevas, cambios);
      return; // El modal se encarga de llamar a confirmarImportacion()
    }

    // Sin cambios — solo nuevas, guardar directo
    await _ejecutarImportacion(nuevas, [], disp);

  } catch(e) {
    if (estadoEl) estadoEl.innerHTML = `<div style="padding:10px;background:var(--acento-suave);border:1px solid var(--acento);border-radius:8px;font-size:12px;color:var(--acento)">❌ Error: ${e.message}</div>`;
    toast('Error: ' + e.message, 'error');
    console.error('procesarExcel5:', e);
  }
}

async function guardarCodigosYContinuar() {
  const { spnsNuevos = [], planesNuevos = [] } = window._importPendiente || {};

  const nuevosPlanes = [];

  for (const c of spnsNuevos) {
    nuevosPlanes.push({
      id:            DB.genId(),
      codigo:        c,
      tipo:          'spn',
      descripcion:   document.getElementById(`spn-desc-${c}`)?.value.trim() || '',
      categoria:     document.getElementById(`spn-cat-${c}`)?.value || 'otro',
      requiere_imei: document.getElementById(`spn-imei-${c}`)?.value === 'true',
      activo:        true,
    });
  }

  for (const c of planesNuevos) {
    nuevosPlanes.push({
      id:            DB.genId(),
      codigo:        c,
      tipo:          'plan',
      descripcion:   document.getElementById(`plan-desc-${c}`)?.value.trim() || '',
      categoria:     'otro',
      requiere_imei: true,
      activo:        true,
    });
  }

  cerrarModal('modal-codigos-nuevos');

  if (nuevosPlanes.length) {
    try {
      await sbUpsertMany('planes_promociones', nuevosPlanes);
      dbInvalidate('planes_promociones');
      await dbGet('planes_promociones');
      toast(`✅ ${nuevosPlanes.length} códigos guardados`);
    } catch(e) {
      toast('Error al guardar códigos: ' + e.message, 'error');
    }
  }

  await continuarImportSinCodigos();
}

async function continuarImportSinCodigos() {
  cerrarModal('modal-codigos-nuevos');
  const { todas, disp } = window._importPendiente || {};
  if (!todas) return;

  // Continuar con el flujo normal de comparación
  const legajosExistentes = CACHE['legajos'] || await dbGet('legajos');
  const idxExistentes = Object.fromEntries(legajosExistentes.map(l => [l.sds_id, l]));
  const CAMPOS_CLAVE = ['imei','modelo','punto_venta_id','punto_venta_nombre',
    'vendedor','vendedor_dni','fecha_activacion','linea','nro_cuenta',
    'tipo_pago','importe','entidad_pv','estado','tipo_sds'];

  const nuevas  = todas.filter(f => f.sds_id && !idxExistentes[f.sds_id]);
  const cambios = [];
  for (const f of todas.filter(x => x.sds_id && idxExistentes[x.sds_id])) {
    const vieja = idxExistentes[f.sds_id];
    const diffs = CAMPOS_CLAVE.filter(k => {
      const vNew = String(f[k]||'').trim();
      const vOld = String(vieja[k]||'').trim();
      return vNew && vOld !== vNew;
    });
    if (diffs.length > 0) cambios.push({ nueva: f, vieja, diferencias: diffs });
  }

  if (cambios.length > 0 || nuevas.length === 0) {
    window._importPendiente = { ...window._importPendiente, nuevas, cambios };
    mostrarModalPreviewImport(nuevas, cambios);
    return;
  }
  await _ejecutarImportacion(nuevas, [], disp);
}

async function confirmarImportacion() {
  const { nuevas, cambios, disp } = window._importPendiente || {};
  if (!nuevas && !cambios) return;

  // Leer checkboxes ANTES de cerrar el modal
  const seleccionados = new Set(
    [...document.querySelectorAll('.chk-actualizar:checked')]
      .map(c => c.dataset.sds)
  );
  const todosMarcados = document.querySelectorAll('.chk-actualizar').length;
  // Si no hay checkboxes visibles (todos seleccionados por defecto), actualizar todos
  const aActualizar = todosMarcados > 0
    ? cambios.filter(c => seleccionados.has(c.nueva.sds_id))
    : cambios;

  cerrarModal('modal-preview-import');

  const estadoEl = document.getElementById('sds-import-estado');
  if (estadoEl) estadoEl.innerHTML = `<div style="padding:10px;background:var(--azul-suave);border:1px solid var(--azul);border-radius:8px;font-size:12px;color:var(--azul)">🔄 Guardando ${nuevas.length} nuevas + ${aActualizar.length} actualizaciones...</div>`;

  await _ejecutarImportacion(nuevas, aActualizar, disp);
}

// Normaliza un legajo para que tenga EXACTAMENTE las mismas claves
// Supabase PGRST102: todos los objetos del batch deben tener las mismas claves
const LEGAJO_SCHEMA = {
  id:'', sds_id:'', identificador:'', sds_form:'', fuente:'',
  dni:'', cuit:'', apellido:'', nombre:'', telefono:'',
  domicilio:'', nro_domicilio:'', ciudad:'', cond_iva:'',
  linea:'', nse:'', nro_cuenta:'', fecha_activacion:'', fecha_venta:'',
  fecha:'', // fecha general
  imei:'', sim:'', modelo:'', marca:'', cod_producto:'',
  agencia:'', subagente:'', vendedor:'', vendedor_dni:'',
  coordinador:'', store:'', tipo_venta:'', entidad_pv:'',
  punto_venta_id:'', punto_venta_nombre:'',
  tipo_pago:'', entidad_pago:'', forma_pago:'', cuotas:'',
  importe:0, cod_autorizacion:'', bill_number:'',
  estado:'', bloque:'', mercado:'', plan:'', promocion:'', presuspendida:'',
  monto_eft:'', monto_ch:'', monto_tc:'', monto_td:'',
  equipo_id:'', equipo_vendido:false,
  tipo_sds:'', spn_codigo:'', spn_desc:'', plan_codigo:'',
  necesita_control:false, ctrl_motivo:'',
  pv_detectado_id:'', pv_detectado_nombre:'',
  datos:'', numero_sds:'', plan_desc:'',
  created_at: null,
};
function normalizarLegajo(l) {
  const out = { ...LEGAJO_SCHEMA };
  for (const k of Object.keys(LEGAJO_SCHEMA)) {
    if (l[k] !== undefined && l[k] !== null) out[k] = l[k];
  }
  // Preservar created_at si existe
  if (l.created_at) out.created_at = l.created_at;
  return out;
}

async function _ejecutarImportacion(nuevas, aActualizar, disp) {
  const estadoEl = document.getElementById('sds-import-estado');

  const progreso = (paso, total, msg) => {
    if (!estadoEl) return;
    const pct = total ? Math.round((paso / total) * 100) : 0;
    estadoEl.innerHTML = `
      <div style="padding:10px 12px;background:var(--azul-suave);border:1px solid var(--azul);border-radius:8px;font-size:12px;color:var(--azul)">
        <div style="display:flex;justify-content:space-between;margin-bottom:6px">
          <span>🔄 ${msg}</span>
          <span style="font-weight:700">${pct}%</span>
        </div>
        <div style="background:#dbeafe;border-radius:4px;height:6px">
          <div style="background:var(--azul);height:100%;width:${pct}%;transition:width .3s;border-radius:4px"></div>
        </div>
      </div>`;
  };

  const dispCache = disp || CACHE['dispositivos'] || [];
  let marcados = 0;
  const LOTE = 50; // registros por lote
  let paso = 0;
  const total = (nuevas?.length || 0) + (aActualizar?.length || 0) + 2;

  // ── 1. Guardar nuevas en lotes ─────────────────────────────────
  if (nuevas?.length) {
    progreso(paso, total, `Guardando ${nuevas.length} legajos nuevos...`);

    // Marcar equipos vendidos de las nuevas
    for (const l of nuevas.filter(x => x.equipo_id)) {
      const d = dispCache.find(x => x.id === l.equipo_id);
      if (d && d.estado !== 'vendido') {
        await sbUpsert('dispositivos', { ...d, estado: 'vendido' });
        marcados++;
      }
    }

    // Guardar en lotes — normalizar claves antes de enviar
    for (let i = 0; i < nuevas.length; i += LOTE) {
      const lote = nuevas.slice(i, i + LOTE).map(normalizarLegajo);
      progreso(paso + i, total, `Guardando nuevas ${i+1}–${Math.min(i+LOTE, nuevas.length)} de ${nuevas.length}...`);
      await sbUpsertMany('legajos', lote);
      await new Promise(r => setTimeout(r, 20));
    }
    paso += nuevas.length;
  }

  // ── 2. Actualizar existentes en lotes ─────────────────────────
  if (aActualizar?.length) {
    progreso(paso, total, `Actualizando ${aActualizar.length} registros existentes...`);

    // Construir registros merged
    const legajosActuales = CACHE['legajos'] || [];
    const idxActuales = Object.fromEntries(legajosActuales.map(l => [l.sds_id, l]));

    const registrosAGuardar = aActualizar.map(c => {
      const existente = idxActuales[c.nueva.sds_id] || {};
      return { ...existente, ...c.nueva, id: existente.id || c.nueva.id };
    });

    // Marcar equipos vendidos si cambió el IMEI
    for (const c of aActualizar) {
      if (c.nueva.imei && c.nueva.imei !== c.vieja?.imei) {
        const d = dispCache.find(x => x.nro_serie === c.nueva.imei);
        if (d && d.estado !== 'vendido') {
          await sbUpsert('dispositivos', { ...d, estado: 'vendido' });
          marcados++;
        }
      }
    }

    // Guardar en lotes — normalizar claves antes de enviar
    for (let i = 0; i < registrosAGuardar.length; i += LOTE) {
      const lote = registrosAGuardar.slice(i, i + LOTE).map(normalizarLegajo);
      progreso(paso + i, total, `Actualizando ${i+1}–${Math.min(i+LOTE, registrosAGuardar.length)} de ${registrosAGuardar.length}...`);
      await sbUpsertMany('legajos', lote);
      await new Promise(r => setTimeout(r, 20));
    }
    paso += aActualizar.length;
  }

  // ── 3. Sincronizar vendedores ──────────────────────────────────
  progreso(paso + 1, total, 'Sincronizando vendedores...');
  const todasLasFichas = [...(nuevas||[]), ...(aActualizar||[]).map(c=>c.nueva)];
  const resVend = await sincronizarVendedoresDesdeImport(todasLasFichas);

  // ── 4. Limpiar duplicados post-import ──────────────────────────
  progreso(total - 1, total, 'Verificando integridad...');
  const dupElim = await limpiarDuplicadosPostImport(nuevas||[]);
  if (dupElim > 0) toast(`🗑️ ${dupElim} duplicados eliminados automáticamente`, 'warning');

  // ── 5. Refrescar cache ─────────────────────────────────────────
  progreso(total - 1, total, 'Actualizando datos locales...');
  dbInvalidate('legajos'); dbInvalidate('dispositivos');
  await Promise.all([dbGet('legajos'), dbGet('dispositivos')]);

  progreso(total, total, 'Completado');

  // ── 5. Resultado final ─────────────────────────────────────────
  const conImei    = (nuevas||[]).filter(f => f.imei && f.imei !== '999999999999556').length;
  const actualizados = aActualizar?.length || 0;
  const msgActual  = actualizados > 0 ? ` · <strong>${actualizados}</strong> actualizadas` : '';
  const msgVend    = resVend.nuevos ? ` · ${resVend.nuevos} vendedores nuevos` : '';

  if (estadoEl) estadoEl.innerHTML = `
    <div style="padding:10px 12px;background:var(--verde-suave);border:1px solid var(--verde);border-radius:8px;font-size:12px;color:var(--verde)">
      <p style="font-weight:700;margin-bottom:4px">✅ Importación completada</p>
      <p style="margin:0">
        ${(nuevas||[]).length} nuevas · ${conImei} con IMEI · ${marcados} equipos vendidos${msgActual}${msgVend}
      </p>
    </div>`;

  toast(`✅ ${(nuevas||[]).length} nuevas${actualizados ? ` · ${actualizados} actualizadas` : ''}`);

  // Guardar fecha de última importación en Supabase
  const ahoraImport = new Date().toISOString();
  const hoyStr = ahoraImport.slice(0, 10); // YYYY-MM-DD
  try {
    await fetch(`${SUPABASE_URL}/rest/v1/configuracion?id=eq.global`, {
      method: 'PATCH',
      headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SB_TOKEN||SUPABASE_KEY}`, 'Content-Type': 'application/json', 'Prefer': 'return=minimal' },
      body: JSON.stringify({
        webcom_ultima_importacion: ahoraImport,
        webcom_fecha_desde: hoyStr,
        webcom_fecha_hasta: hoyStr,
        webcom_bot_estado: 'ok',
        webcom_bot_mensaje: 'Importación exitosa desde GestionSLA',
      }),
    });
    CACHE['_cfg_sistemas'] = CACHE['_cfg_sistemas'] || {};
    CACHE['_cfg_sistemas'].webcomUltimaImportacion = ahoraImport;
  } catch(e) {}

  setTimeout(() => { cerrarModal('modal-import-sds'); navegar('legajos'); }, 2000);
}

// ── Helper: extrae 'YYYY-MM' de fecha_venta (formato DD/MM/YYYY[ HH:MM]) ────
function fechaVentaAMes(fechaStr) {
  if (!fechaStr) return '';
  const s = String(fechaStr).trim();
  // Formato ISO: YYYY-MM-DD o YYYY-MM-DDTHH:MM:SS
  if (/^\d{4}-\d{2}/.test(s)) return s.slice(0,7);
  // Formato DD/MM/YYYY o DD/MM/YYYY HH:MM:SS
  const p = s.split('/');
  if (p.length >= 3) {
    const anio = p[2].split(' ')[0].split('T')[0];
    const mes  = p[1].padStart(2,'0');
    if (anio.length === 4) return anio + '-' + mes;
  }
  return '';
}

function fechaVentaOMes(legajo) {
  // Usar fecha_venta primero, luego fecha_activacion como fallback
  return fechaVentaAMes(legajo.fecha_venta) || fechaVentaAMes(legajo.fecha_activacion) || '';
}

let tableroMesFiltro  = '';     // 'YYYY-MM' o '' para todas
let tableroMes2Filtro = '';     // segundo mes para comparación
let tableroModo       = 'mes';  // 'mes' | 'todos' | 'comparar'

// ══════════════════════════════════════════════════════════════
// TABLERO DE VENTAS — REWORK COMPLETO
// ══════════════════════════════════════════════════════════════

let _tv = {
  modo:        'mes',
  mes1:        '',
  mes2:        '',
  fechaDesde:  '',
  fechaHasta:  '',
  pvFiltro:    '',
  tab:         'operaciones',
  excluirSPN:  true,
};
let _tvData = { base: [], base2: null }; // caché global para evitar "base is not defined"

function renderTableroVentas() {
  const legajos = CACHE['legajos'] || [];
  const pvs     = CACHE['puntos_venta'] || [];

  const hoy          = new Date();
  const mesActualKey = hoy.getFullYear()+'-'+String(hoy.getMonth()+1).padStart(2,'0');
  if (!_tv.mes1) _tv.mes1 = mesActualKey;

  const mesesDisp = [...new Set(legajos.filter(l=>l.sds_id).map(l=>fechaVentaOMes(l)).filter(m=>/^\d{4}-\d{2}$/.test(m)))].sort().reverse();
  if (_tv.modo === 'comparar' && !_tv.mes2) _tv.mes2 = mesesDisp.find(m => m !== _tv.mes1) || mesesDisp[1] || '';

  // Filtro por fecha
  function filtrarPorFecha(lista) {
    return lista.filter(l => {
      const m = fechaVentaOMes(l);
      if (!m) return false;
      if (_tv.modo === 'mes' || _tv.modo === 'comparar') return m === _tv.mes1;
      if (_tv.modo === 'rango') {
        if (_tv.fechaDesde && m < _tv.fechaDesde.slice(0,7)) return false;
        if (_tv.fechaHasta && m > _tv.fechaHasta.slice(0,7)) return false;
        return true;
      }
      return true;
    }).filter(l => l.sds_id);
  }

  // Filtro PV
  function filtrarPV(lista) {
    if (!_tv.pvFiltro) return lista;
    return lista.filter(l => l.punto_venta_id === _tv.pvFiltro);
  }

  // Filtro SPN excluidos
  function filtrarSPN(lista) {
    if (!_tv.excluirSPN) return lista;
    const planes = CACHE['planes_promociones'] || [];
    return lista.filter(l => {
      const spnCod = String(l.spn_codigo||'').trim();
      if (!spnCod) return true;
      const plan = planes.find(p => p.tipo === 'spn' && String(p.codigo||'').trim() === spnCod);
      return !plan?.excluir_del_tablero;
    });
  }

  const base  = filtrarSPN(filtrarPV(filtrarPorFecha(legajos)));
  const base2 = _tv.modo === 'comparar'
    ? filtrarSPN(filtrarPV(legajos.filter(l => fechaVentaOMes(l) === _tv.mes2 && l.sds_id)))
    : null;

  // Guardar en global para onclick
  _tvData = { base, base2 };

  // ── Agrupar por PV (usando punto_venta_id) ─────────────────────
  function agruparPorPV(lista) {
    const m = {};
    for (const l of lista) {
      const pvId  = l.punto_venta_id || '_sin';
      const pvNom = l.punto_venta_nombre || pvs.find(p=>p.id===l.punto_venta_id)?.nombre || 'Sin PV';
      if (!m[pvId]) m[pvId] = { id: pvId, nombre: pvNom, total: 0, tipos: {}, efect: 0, conEquipo: 0, entidades: {} };
      m[pvId].total++;
      m[pvId].tipos[l.tipo_sds||'otro'] = (m[pvId].tipos[l.tipo_sds||'otro']||0)+1;
      const ef = parseFloat(l.partida_importe||l.monto_eft||0) ||
                 (parseFloat(l.importe||0)>0 && (l.forma_pago||'').toUpperCase().includes('EFECT') ? parseFloat(l.importe) : 0);
      m[pvId].efect += ef;
      if (l.imei && l.imei !== '999999999999556') m[pvId].conEquipo++;
      // Agrupar por entidad dentro del PV
      const ent = l.entidad_pv || '_sin_ent';
      if (!m[pvId].entidades[ent]) m[pvId].entidades[ent] = { id: ent, vendedor: l.vendedor||'Sin nombre', dni: l.vendedor_dni||'', total: 0, tipos: {} };
      m[pvId].entidades[ent].total++;
      m[pvId].entidades[ent].tipos[l.tipo_sds||'otro'] = (m[pvId].entidades[ent].tipos[l.tipo_sds||'otro']||0)+1;
    }
    return Object.values(m).sort((a,b) => b.total - a.total);
  }

  const rankPVs  = agruparPorPV(base);
  const rankPVs2 = base2 ? agruparPorPV(base2) : null;

  // ── KPIs ──────────────────────────────────────────────────────
  const totalOp   = base.length;

  const totalEfect = base.reduce((s,l) => s + (parseFloat(l.partida_importe||l.monto_eft||0) ||
    (parseFloat(l.importe||0)>0 && (l.forma_pago||'').toUpperCase().includes('EFECT') ? parseFloat(l.importe) : 0)), 0);
  const opConEfect = base.filter(l => parseFloat(l.partida_importe||l.monto_eft||0)>0 ||
    (parseFloat(l.importe||0)>0 && (l.forma_pago||'').toUpperCase().includes('EFECT'))).length;

  const delta = base2 !== null ? totalOp - (base2?.length||0) : null;
  const totalEfect2 = base2 ? base2.reduce((s,l) => s + (parseFloat(l.partida_importe||l.monto_eft||0) ||
    (parseFloat(l.importe||0)>0 && (l.forma_pago||'').toUpperCase().includes('EFECT') ? parseFloat(l.importe) : 0)), 0) : 0;

  // ── Helpers ────────────────────────────────────────────────────
  function labelMes(k) {
    if (!k || !/^\d{4}-\d{2}$/.test(k)) return '—';
    return new Date(k+'-15').toLocaleDateString('es-AR',{month:'long',year:'numeric'});
  }
  function barraH(val, max, color='#6366f1', h=14) {
    const pct = max>0 ? Math.max(2,Math.round((val/max)*100)) : 0;
    return `<div style="background:var(--gris-100);border-radius:4px;height:${h}px;flex:1;overflow:hidden"><div style="width:${pct}%;height:100%;background:${color};border-radius:4px;transition:width .4s"></div></div>`;
  }
  function badgeTipo(tipo, n) {
    const c={venta:'#6366f1',portabilidad:'#16a34a',linea_nueva:'#7c3aed',ctc:'#ea580c',otro:'#6b7280'};
    const l={venta:'Venta',portabilidad:'Port.',linea_nueva:'L.Nueva',ctc:'CTC',otro:'Otro'};
    return n>0?`<span style="background:${c[tipo]||'#888'}18;color:${c[tipo]||'#888'};border-radius:4px;padding:1px 6px;font-size:10px;font-weight:700;margin-right:2px">${l[tipo]||tipo}: ${n}</span>`:'';
  }

  // ── Ranking equipos ────────────────────────────────────────────
  const rankEquipos = (() => {
    const m = {};
    for (const l of conEquipo) {

      if (!m[mod]) m[mod] = { modelo: mod, marca: l.marca||'', total: 0 };

  // ══════════════════════════════════════════════════════════════
  // HTML

  return `

            ${m==='mes'?'📅 Mes':m==='rango'?'📆 Rango':'📊 Comparar'}
          </button>`).join('')}
      </div>
      ${_tv.modo!=='rango'?`

        style="padding:6px 10px;border:1.5px solid var(--gris-300);border-radius:6px;font-size:12px;outline:none;background:white" />`:''}
      ${_tv.modo==='comparar'?`

      <input type="month" value="${_tv.mes2}" min="${mesesDisp[mesesDisp.length-1]||''}" max="${mesesDisp[0]||''}"
        onchange="_tv.mes2=this.value;navegar('tablero-ventas')"
        style="padding:6px 10px;border:1.5px solid var(--azul);border-radius:6px;font-size:12px;outline:none;background:white" />`:''}
      ${_tv.modo==='rango'?`
      <input type="date" value="${_tv.fechaDesde}" onchange="_tv.fechaDesde=this.value;navegar('tablero-ventas')"
        style="padding:6px 8px;border:1.5px solid var(--gris-300);border-radius:6px;font-size:12px;outline:none" />
      <span style="color:var(--gris-400)">→</span>
      <input type="date" value="${_tv.fechaHasta}" onchange="_tv.fechaHasta=this.value;navegar('tablero-ventas')"
        style="padding:6px 8px;border:1.5px solid var(--gris-300);border-radius:6px;font-size:12px;outline:none" />`:''}
      <select onchange="_tv.pvFiltro=this.value;navegar('tablero-ventas')"
        style="padding:6px 10px;border:1.5px solid var(--gris-300);border-radius:6px;font-size:12px;outline:none;background:white">
        <option value="">Todos los PV</option>
        ${pvs.map(p=>`<option value="${p.id}" ${_tv.pvFiltro===p.id?'selected':''}>${p.nombre}</option>`).join('')}
      </select>
      ${_tv.pvFiltro||_tv.fechaDesde||_tv.fechaHasta?`
      <button onclick="_tv.pvFiltro='';_tv.fechaDesde='';_tv.fechaHasta='';navegar('tablero-ventas')"
