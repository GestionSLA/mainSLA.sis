async function guardarDiferenciaControl(legajoId) {
  const leg    = (CACHE['legajos'] || []).find(l => l.id === legajoId);
  if (!leg) return;

  const pvs    = CACHE['puntos_venta'] || [];
  const disp   = CACHE['dispositivos'] || [];
  const imeiNuevo = document.getElementById('diff-imei')?.value.trim() || leg.imei || '';
  const pvId      = document.getElementById('diff-pv')?.value || leg.punto_venta_id || '';
  const matCod    = document.getElementById('diff-material')?.value || leg.cod_producto || '';
  const modeloNew = document.getElementById('diff-modelo')?.value.trim() || leg.modelo || '';
  const pv        = pvs.find(p => p.id === pvId);

  // Si hay IMEI nuevo y existe en el stock, marcar ese dispositivo como vendido
  let equipo_id = leg.equipo_id || '';
  if (imeiNuevo && imeiNuevo !== leg.imei) {
    const dispMatch = disp.find(d => d.nro_serie === imeiNuevo);
    if (dispMatch) {
      equipo_id = dispMatch.id;
      if (dispMatch.estado !== 'vendido') {
        await sbUpsert('dispositivos', { ...dispMatch, estado: 'vendido' });
      }
    }
  }

  const actualizado = {
    ...leg,
    imei:              imeiNuevo,
    punto_venta_id:    pvId,
    punto_venta_nombre: pv?.nombre || leg.punto_venta_nombre || '',
    cod_producto:      matCod,
    modelo:            modeloNew,
    equipo_id,
    equipo_vendido:    !!equipo_id,
    necesita_control:  false,
  };

  await sbUpsert('legajos', actualizado);
  dbInvalidate('legajos');
  dbInvalidate('dispositivos');
  await Promise.all([dbGet('legajos'), dbGet('dispositivos')]);
  cerrarModal('modal-ingresar-diferencia');
  toast('✅ Diferencia resuelta');
  navegar('legajos');
}

// Lee un archivo Excel y devuelve { headers, data }
function leerExcel(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const XLSX = window.XLSX;
        const wb = XLSX.read(e.target.result, { type: 'array', cellDates: false });
        const ws = wb.Sheets[wb.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '' });
        if (rows.length < 2) { resolve({ headers: [], data: [] }); return; }
        const headers = rows[0].map(h => String(h).trim());
        const data = rows.slice(1).filter(r => r.some(c => c !== ''));
        resolve({ headers, data });
      } catch(err) { reject(err); }
    };
    reader.onerror = reject;
    reader.readAsArrayBuffer(file);
  });
}

function parsearFechaExcel(valor) {
  if (!valor) return '';
  if (typeof valor === 'number') {
    // Serial de Excel
    const epoch = new Date(1899, 11, 30);
    const d = new Date(epoch.getTime() + valor * 86400000);
    return d.toLocaleDateString('es-AR');
  }
  const s = String(valor).trim();
  if (/^\d{2}\/\d{2}\/\d{4}$/.test(s)) return s;
  const iso = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (iso) return `${iso[3]}/${iso[2]}/${iso[1]}`;
  return s;
}

function findCol(headers, ...candidatos) {
  const norm = s => String(s || '').trim().toLowerCase();
  for (const c of candidatos) {
    const idx = headers.findIndex(h => norm(h) === norm(c));
    if (idx !== -1) return idx;
  }
  for (const c of candidatos) {
    const idx = headers.findIndex(h => norm(h).includes(norm(c)));
    if (idx !== -1) return idx;
  }
  return -1;
}

function detectarMarca(texto) {
  const t = (texto || '').toUpperCase();
  if (t.includes('SAMSUNG')) return 'Samsung';
  if (t.includes('APPLE') || t.includes('IPHONE')) return 'Apple';
  if (t.includes('MOTOROLA') || t.includes('MOTO')) return 'Motorola';
  if (t.includes('XIAOMI') || t.includes('REDMI')) return 'Xiaomi';
  if (t.includes('LG')) return 'LG';
  if (t.includes('HUAWEI')) return 'Huawei';
  if (t.includes('TCL')) return 'TCL';
  if (t.includes('NOKIA')) return 'Nokia';
  if (t.includes('ZTE')) return 'ZTE';
  if (t.includes('ALCATEL')) return 'Alcatel';
  return '';
}

// Detecta marca por prefijo del código de material (estándar Claro AMX)
function detectarMarcaPorPrefijo(nombreOCodigo) {
  const t = (nombreOCodigo || '').toUpperCase().trim();
  // Primero por prefijo exacto al inicio (más preciso)
  if (t.startsWith('SMG'))  return 'Samsung';
  if (t.startsWith('SAM'))  return 'Samsung';
  if (t.startsWith('MOT'))  return 'Motorola';
  if (t.startsWith('HUA'))  return 'Huawei';
  if (t.startsWith('HOR'))  return 'Honor';
  if (t.startsWith('TCL'))  return 'TCL';
  if (t.startsWith('APP'))  return 'Apple';
  if (t.startsWith('NOK'))  return 'Nokia';
  if (t.startsWith('ZTE'))  return 'ZTE';
  if (t.startsWith('LGE'))  return 'LG';
  if (t.startsWith('XIA'))  return 'Xiaomi';
  if (t.startsWith('USI'))  return 'SIM Card';
  // Fallback por includes
  if (t.includes('USIM'))   return 'SIM Card';
  if (t.includes('SAMSUNG'))return 'Samsung';
  if (t.includes('MOTOROLA'))return 'Motorola';
  if (t.includes('HUAWEI')) return 'Huawei';
  return detectarMarca(nombreOCodigo);
}

// Busca un material por código en el cache
function buscarMaterialPorCodigo(codigo) {
  if (!codigo) return null;
  const mats = CACHE['materiales'] || [];
  return mats.find(m => m.codigo === codigo.trim()) || null;
}

// Detecta materiales nuevos (no están en el catálogo) dado un array de items
// Cada item debe tener: { material, texto } 
// Devuelve array de { codigo, nombre, marca } sin duplicados
function detectarMaterialesNuevos(items) {
  const existentes = new Set((CACHE['materiales'] || []).map(m => m.codigo));
  const vistos = new Set();
  const nuevos = [];
  for (const it of items) {
    const cod = (it.material || '').trim();
    if (!cod || existentes.has(cod) || vistos.has(cod)) continue;
    vistos.add(cod);
    nuevos.push({
      codigo: cod,
      nombre: it.texto || it.nombre || cod,
      marca:  detectarMarcaPorPrefijo(it.texto || it.nombre || cod),
      precio: it.precio || 0,
    });
  }
  return nuevos;
}

        </button>
      </div>
    </div>
  `;
  document.body.appendChild(modal);
}

function actualizarMarcaNuevo(i) {

async function guardarMaterial(id) {
  const codigo = document.getElementById('mat-codigo')?.value.trim();
  const nombre = document.getElementById('mat-nombre')?.value.trim();
  if (!codigo) { toast('El código es requerido', 'error'); return; }
  if (!nombre)  { toast('El nombre es requerido', 'error'); return; }
  const marca  = detectarMarcaPorPrefijo(nombre);
  const precio = parseFloat(document.getElementById('mat-precio')?.value) || 0;
  const notas  = document.getElementById('mat-notas')?.value.trim() || '';
  const datos  = { id: id || DB.genId(), codigo, nombre, marca, precio, notas };
  await sbUpsert('materiales', datos);
  dbInvalidate('materiales');
  await dbGet('materiales');
  toast('Material guardado ✓');
  cerrarModal('modal-material');
  navegar('materiales');
}

async function eliminarMaterial(id) {
  if (!confirm('¿Eliminar este material del catálogo?')) return;
  await SB.delete('materiales', id, SB_TOKEN);
  dbInvalidate('materiales');
  await dbGet('materiales');
  toast('Material eliminado');
  navegar('materiales');
}

async function guardarMaterialesNuevosDetectados(count) {
  const nuevos = [];
  for (let i = 0; i < count; i++) {
    const codigo = document.getElementById(`mat-nuevo-codigo-${i}`)?.value.trim();
    const nombre = document.getElementById(`mat-nuevo-nombre-${i}`)?.value.trim();
    const precio = parseFloat(document.getElementById(`mat-nuevo-precio-${i}`)?.value) || 0;
    if (!codigo) continue;
    nuevos.push({ id: DB.genId(), codigo, nombre: nombre || codigo, marca: detectarMarcaPorPrefijo(nombre || codigo), precio, notas: 'Detectado automáticamente' });
  }
  if (!nuevos.length) return;
  await sbUpsertMany('materiales', nuevos);
  dbInvalidate('materiales');
  await dbGet('materiales');
  cerrarModal('modal-mats-nuevos');
  toast(`✅ ${nuevos.length} material(es) guardado(s) en el catálogo`);
}

async function cargarRemitoExcel(file) {
  if (!file) return;
  if (!window.XLSX) await cargarXLSX();
  const preview = document.getElementById('remito-preview');
  if (!preview) return;
  preview.innerHTML = '<p style="color:var(--gris-500);font-size:13px">⏳ Leyendo archivo...</p>';

  try {
    const sheet = await leerExcel(file);
    const { headers, data } = sheet;

    // Detectar columnas
    const iSerie  = findCol(headers,'Nro.Serie','NRO.SERIE','IMEI','Serie','serial','nro_serie');
    const iTexto  = findCol(headers,'Texto','TEXTO','texto','Descripcion','modelo','Descripción');
    const iMat    = findCol(headers,'Material','MATERIAL','material','Cod.Material','Cod Material');
    const iPrecio = findCol(headers,'Precio','PRECIO','precio','Valor','Importe','importe');
    const iFec    = findCol(headers,'Fec.Antig','Fecha.Antig','fec_antiguedad','FEC.ANTIG','Fecha Antiguedad');
    const iPedido = findCol(headers,'Nro.Pedido','NRO.PEDIDO','nro_pedido','Pedido','Nro Pedido','nro pedido');

    // Parsear filas
    const items = data.map(row => ({
      nro_serie:     String(row[iSerie]  ?? '').trim(),
      texto:         String(row[iTexto]  ?? '').trim(),
      material:      String(row[iMat]    ?? '').trim(),
      precio:        parseFloat(row[iPrecio]) || 0,
      fec_antiguedad:iFec !== -1 ? parsearFechaExcel(row[iFec]) : '',
      nro_pedido:    iPedido !== -1 ? String(row[iPedido] ?? '').trim() : '',
    })).filter(it => /^\d{10,19}$/.test(it.nro_serie));

    if (!items.length) {
      preview.innerHTML = '<p style="color:var(--acento);font-size:13px">No se encontraron IMEIs válidos en el archivo.</p>';
      return;
    }

    // Agrupar por número de pedido

      const k = it.nro_pedido || '(sin número de pedido)';

    // Verificar cuáles pedidos ya están en stock

    const dispSet = new Set((CACHE['dispositivos'] || []).map(d => d.nro_serie));
    const pvs     = CACHE['puntos_venta'] || [];

      </div>

      <div id="pedidos-panel" style="display:flex;flex-direction:column;gap:12px;margin-bottom:14px">
        ${pedidoKeys.map((k, i) => {
          const its      = pedidoMap[k];

              <div style="background:${yaEnStock ? '#fee2e2' : 'var(--gris-100)'};padding:10px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap">
                ${yaEnStock

                       <label for="chk-pedido-${i}" style="font-weight:700;font-size:13px;cursor:pointer">

  } catch(e) {

async function importarRemitoExcelPorPedido(pedidoKeys, pedidoIdx) {
  const pedidoMap = window._remitoExcelData;
  if (!pedidoMap) { toast('No hay datos para importar', 'error'); return; }

  const pvs  = CACHE['puntos_venta'] || [];
  const hoy  = new Date().toLocaleDateString('es-AR');
  const disp = CACHE['dispositivos'] || [];
  const dispSet = new Set(disp.map(d => d.nro_serie));

  let totalImportados = 0;
  const errores = [];

  for (const k of pedidoKeys) {
    const i   = pedidoIdx[k];
    const chk = document.getElementById(`chk-pedido-${i}`);

    // Si no tiene checkbox (ya en stock) o está desmarcado, saltar
    if (!chk || !chk.checked) continue;

    const pvId     = document.getElementById(`pv-pedido-${i}`)?.value;
    const nroRemito= document.getElementById(`rem-pedido-${i}`)?.value.trim();

    if (!pvId)      { errores.push(`Pedido ${k}: falta punto de venta`); continue; }
    if (!nroRemito) { errores.push(`Pedido ${k}: falta número de remito`); continue; }

    const pv  = pvs.find(p => p.id === pvId);
    const its = pedidoMap[k].filter(it => !dispSet.has(it.nro_serie)); // solo los que no están en stock

    if (!its.length) { errores.push(`Pedido ${k}: todos los equipos ya están en stock`); continue; }

    // Crear dispositivos
    const nuevosDisp = its.map(it => ({
      id:               DB.genId(),
      nro_serie:        it.nro_serie,
      texto:            it.texto || '',
      material:         it.material || '',
      marca:            detectarMarcaPorPrefijo(it.texto || it.material || ''),
      precio:           it.precio || 0,
      estado:           'disponible',
      punto_venta_id:   pvId,
      punto_venta_nombre: pv?.nombre || '',
      nro_remito:       nroRemito,
      nro_pedido:       k === '(sin número de pedido)' ? '' : k,
      fecha_ingreso:    hoy,
      fec_antiguedad:   it.fec_antiguedad || '',
      dias_antiguedad:  it.fec_antiguedad ? calcularDiasDesde(it.fec_antiguedad) : 0,
    }));

    await sbUpsertMany('dispositivos', nuevosDisp);
    await sbUpsert('remitos', {
      id:                DB.genId(),
      nro_remito:        nroRemito,
      nro_pedido:        k === '(sin número de pedido)' ? '' : k,
      tipo:              'ingreso',
      punto_venta_id:    pvId,
      punto_venta_nombre: pv?.nombre || '',
      fecha:             hoy,
      cantidad_items:    nuevosDisp.length,
      total:             nuevosDisp.reduce((s,d) => s + d.precio, 0),
      estado:            'procesado',
    });

    totalImportados += nuevosDisp.length;
  }

  dbInvalidate('dispositivos'); dbInvalidate('remitos');
  await Promise.all([dbGet('dispositivos'), dbGet('remitos')]);

  if (errores.length) {
    toast(`⚠️ ${totalImportados} equipos importados. Errores: ${errores.join(' | ')}`, 'warning');
  } else {
    toast(`✅ ${totalImportados} equipos importados correctamente`);
  }

  // Detectar materiales nuevos tras importar
  const todosItems = Object.values(pedidoMap).flat();
  const matsNuevos = detectarMaterialesNuevos(todosItems.map(it => ({ material: it.material, texto: it.texto, precio: it.precio })));
  if (matsNuevos.length) mostrarAvisoMaterialesNuevos('aviso-mat-excel', matsNuevos);

  irARemitos('historial');
}

async function procesarWebcom(fechaDesde = '', fechaHasta = '') {
  const { solicitudes, solicitantes, terminales, pagos, reportes, venta, partidas } = importadorState.sheets;
  if (!solicitudes) { toast('Falta algún archivo', 'error'); return; }

  // Indexar partidas por BILL para pisar importes
  const partidasIdx = {};
  if (partidas) {
    sheetToRows(partidas).forEach(p => {
      if (p['BILL']) partidasIdx[String(p['BILL']).trim()] = p;
    });
  }

  // Filtro de fechas — solo importar legajos dentro del rango configurado
  const fdDesde = fechaDesde ? new Date(fechaDesde + 'T00:00:00') : null;
  const fdHasta = fechaHasta ? new Date(fechaHasta + 'T23:59:59') : null;

  function dentroDeRango(fechaStr) {
    if (!fdDesde && !fdHasta) return true;
    const iso = (() => {
      if (!fechaStr) return '';
      if (/^\d{4}-\d{2}/.test(fechaStr)) return fechaStr.slice(0,10);
      const p = fechaStr.split('/');
      if (p.length >= 3) return p[2].slice(0,4) + '-' + p[1].padStart(2,'0') + '-' + p[0].padStart(2,'0');
      return '';
    })();
    if (!iso) return true; // sin fecha → incluir
    const fecha = new Date(iso + 'T12:00:00');
    if (fdDesde && fecha < fdDesde) return false;
    if (fdHasta && fecha > fdHasta) return false;
    return true;
  }

  // Convertir sheets {headers, data} a arrays de objetos — igual que XLSX.sheet_to_json
  function sheetToRows(sheet) {
    if (!sheet) return [];
    let headers = sheet.headers;
    let data    = sheet.data;
    // Solo desplazar si el primer header es un número Y la primera fila de data
    // contiene los headers reales (strings con nombres de columna conocidos)
    if (headers.length > 0 && /^\d+$/.test(String(headers[0]).trim()) && data.length > 0) {
      const primeraFila = data[0];
      // Verificar que la primera fila de data son strings que parecen headers (no datos)
      const parecenHeaders = primeraFila.filter(v => v && /^[A-Za-z]/.test(String(v))).length > primeraFila.length / 2;
      if (parecenHeaders) {
        headers = primeraFila.map(v => String(v ?? '').trim());
        data    = data.slice(1);
      }
    }
    return data.map(row => {
      const obj = {};
      headers.forEach((h, i) => { obj[h] = String(row[i] ?? '').trim(); });
      return obj;
    }).filter(r => {
      const vals = Object.values(r);
      const primera = vals[0] || '';
      if (primera.toLowerCase().includes('filtros aplicados')) return false;
      return !vals.every(v => !v || v === '');
    });
  }

  const rep   = sheetToRows(reportes);
  const solic = sheetToRows(solicitudes);
  const sant  = sheetToRows(solicitantes);
  const term  = sheetToRows(terminales);
  const pags  = sheetToRows(pagos);
  const vents = sheetToRows(venta);

  // A partir de acá — EXACTAMENTE la misma lógica que procesarExcel5
  const toFloat = v => { try { return parseFloat(String(v).replace(',','.').replace(/[^0-9.-]/g,'')) || 0; } catch { return 0; } };

  const idx_term_imei = Object.fromEntries(term.map(r => [r['IMEI'], r]).filter(([k]) => k));
  const idx_term_id   = Object.fromEntries(term.map(r => [r['ID'],   r]).filter(([k]) => k));
  const idx_sant = Object.fromEntries(sant.map(r => [r['Srf Id'], r]).filter(([k]) => k));
  const idx_rep  = Object.fromEntries(rep.map(r => [r['SDS'], r]).filter(([k]) => k));

  const pagos_sds = {}, pagos_bill = {};
  for (const p of pags) {
    if (p['Id Sds'])      pagos_sds[p['Id Sds']]       = (pagos_sds[p['Id Sds']]       || []).concat(p);
    if (p['Bill Number']) pagos_bill[p['Bill Number']]  = (pagos_bill[p['Bill Number']]  || []).concat(p);
  }

  const agg = lista => {
    if (!lista?.length) return {};
    return {
      tipo_pago:        [...new Set(lista.map(p=>p['Tipo Pago']).filter(Boolean))].join(' / '),
      entidad_pago:     [...new Set(lista.map(p=>p['Entidad Pago']).filter(Boolean))].join(' / '),
      forma_pago:       lista[0]['Forma Pago'] || '',
      cuotas:           lista[0]['Cuotas'] || '',
      cod_autorizacion: lista[0]['Cod Aut'] || '',
      bill_number:      lista[0]['Bill Number'] || '',
      importe:          lista.reduce((s,p) => s + toFloat(p['Importe']), 0),
    };
  };

  const pvs  = CACHE['puntos_venta'] || DB.get('puntos_venta') || [];
  const disp = CACHE['dispositivos'] || DB.get('dispositivos') || [];

  // ── FICHAS SDS ──
  const fichas_sds = solic.map(s => {
    const srf_id  = s['Srf Id'] || '';
    const form    = s['Srf Form Number'] || '';
    const rep_d   = idx_rep[form] || {};
    const sant_d  = idx_sant[srf_id] || {};
    const term_by_id = idx_term_id[srf_id] || {};
    const imei_rep   = rep_d['IMEI'] || '';
    const imei_term  = term_by_id['IMEI'] || '';
    const imei_raw   = s['Srf Equipment Receipt'] || '';
    const imei_sol   = (imei_raw && imei_raw !== '000000000000') ? imei_raw : '';
    const imei       = imei_term || imei_rep || imei_sol || '';
    const term_d  = (imei && idx_term_imei[imei]) || term_by_id || {};
    const nim     = rep_d['Nim'] || s['Srf Cellular Number3'] || '';
    const pago_d  = agg(pagos_sds[srf_id]);
    const titular = rep_d['Titular'] || '';
    const [ape_r='', nom_r=''] = titular.includes(',') ? titular.split(',',2).map(x=>x.trim()) : [titular,''];
    const entidadVenta = s['Entidad Id'] || sant_d['Entidad Id'] || term_d['Entidad'] || '';
    const pvMatch   = pvs.find(p => (p.entidades||[]).some(e => String(e) === String(entidadVenta)));
    const dispMatch = imei ? disp.find(d => d.nro_serie === imei) : null;
    const fechaRaw  = term_by_id['Fecha-Activación'] || rep_d['Fecha-Activ'] || s['Srf Activation Date'] || sant_d['Srf Activation Date'] || '';
    const fechaActiv = parseFechaExcel(fechaRaw);
    const spnCodigo  = s['Srf Spn Spc Id'] || '';
    const planCodigo = s['Srf Rpl Id'] || '';
    const clasificacion = clasificarSDS(spnCodigo, pvMatch, imei, dispMatch);
    return {
      id: DB.genId(),
      sds_id:        form || rep_d['SDS'] || '',
      identificador: srf_id,
      sds_form:      form, fuente: 'SDS',
      dni:           sant_d['Srf Identification Number']||'',
      cuit:          sant_d['Srf Cuit']||'',
      apellido:      sant_d['Srf Client Last Name']||ape_r,
      nombre:        sant_d['Srf Client First Name']||nom_r,
      telefono:      sant_d['Srf Client Phone']||'',
      domicilio:     sant_d['Srf Billing Street']||'',
      nro_domicilio: sant_d['Srf Billing Number']||'',
      ciudad:        sant_d['Srf Billing City']||sant_d['Geu Description']||rep_d['Ciudad-POS']||'',
      cond_iva:      sant_d['Srf Vat Id']||'',
      linea:         nim,
      nse:           rep_d['NSE']||s['Srf Hex Esn']||'',
      nro_cuenta:    rep_d['Cuenta']||s['Srf Account Number1']||'',
      fecha_activacion: fechaActiv,
      fecha_venta:   parseFechaExcel(rep_d['Fecha-Venta']||''),
      imei,
      sim:           rep_d['NSE']||s['Srf Hex Esn']||'',
      modelo:        term_d['Descripción']||rep_d['Equipo']||s['Srf Pro Id']||'',
      cod_producto:  term_d['Cod. Producto']||s['Srf Pro Id']||'',
      agencia:       s['Agente']||'',
      subagente:     s['Subagente']||'',
      vendedor:      rep_d['Vendedor']||'',
      vendedor_dni:  rep_d['DNI Vendedor']||s['Srf Vendedor Dni']||'',
      coordinador:   rep_d['Coordinador']||'',
      store:         rep_d['Store']||s['Usp Id Mav']||'',
      tipo_venta:    s['Pro Type']||'',
      entidad_pv:    entidadVenta,
      punto_venta_id:     pvMatch?.id||'',
      punto_venta_nombre: pvMatch?.nombre||'',
      tipo_pago:          pago_d.tipo_pago||rep_d['Forma-pago']||'',
      entidad_pago:       pago_d.entidad_pago||'',
      forma_pago:         pago_d.forma_pago||rep_d['Forma-pago']||'',
      cuotas:             pago_d.cuotas||'',
      importe:            pago_d.importe||0,
      cod_autorizacion:   pago_d.cod_autorizacion||'',
      bill_number:        pago_d.bill_number||'',
      estado:        s['Decode Srf Est Id']||'',
      bloque:        rep_d['Bloque']||s['Srf Blc Block Code']||'',
      mercado:       rep_d['Mercado']||s['Blc Mkc Market Code']||'',
      plan:          rep_d['Plan']||s['Srf Spn Spc Id']||'',
      promocion:     rep_d['Promoción']||s['Srf Rpl Id']||'',
      presuspendida: rep_d['Presuspendida']||'',
      equipo_id:     dispMatch?.id||'',
      equipo_vendido: !!dispMatch,
      tipo_sds:      clasificacion.tipo_sds,
      spn_codigo:    spnCodigo,
      spn_desc:      clasificacion.spn_desc,

  // Unir fichas SDS + CATER, aplicar filtro de fechas, normalizar y mostrar preview

async function mostrarPreviewImportWebcom(fichas) {
  const cfgW = await getConfigWebcom();
  const existentes  = DB.get('legajos') || [];
  const existIds    = new Set(existentes.map(l => l.identificador));
  const nuevas      = fichas.filter(l => !existIds.has(l.identificador));
  const aActualizar = fichas.filter(l =>  existIds.has(l.identificador));
  const conProblema = fichas.filter(l => l.necesita_control);
  const sinPV       = fichas.filter(l => !l.punto_venta_id);

  // Detectar rango de fechas de los archivos — convertir a ISO para comparar correctamente
  const fechasISO = fichas
    .map(l => {
      const f = l.fecha_activacion || l.fecha_venta || '';
      return fechaVentaAMes(f) ? f : ''; // solo fechas válidas
    })
    .filter(Boolean)
    .map(f => {
      // Convertir DD/MM/YYYY a YYYY-MM-DD para comparación
      if (/^\d{4}-\d{2}/.test(f)) return f.slice(0,10);
      const p = f.split('/');
      if (p.length >= 3) return p[2].slice(0,4) + '-' + p[1].padStart(2,'0') + '-' + p[0].padStart(2,'0');
      return '';
    })
    .filter(Boolean);

  const fechaMinISO = fechasISO.length ? fechasISO.reduce((a,b) => a<b?a:b) : '';
  const fechaMaxISO = fechasISO.length ? fechasISO.reduce((a,b) => a>b?a:b) : '';
  // Convertir a formato legible DD/MM/YYYY
  const isoADDMMYYYY = iso => iso ? iso.split('-').reverse().join('/') : '—';
  const fechaMinStr = isoADDMMYYYY(fechaMinISO);
  const fechaMaxStr = isoADDMMYYYY(fechaMaxISO);

  const modal = document.createElement('div');
  modal.className = 'modal-overlay';
  modal.id = 'modal-preview-webcom';
  modal.innerHTML = `

          </div>

            <div class="valor" style="font-size:22px">${conProblema.length}</div>
          </div>
        </div>
        ${sinPV.length ? `<div style="padding:8px 12px;background:var(--amarillo-suave);border-radius:6px;font-size:12px;color:var(--amarillo);margin-bottom:12px">⚠️ ${sinPV.length} legajos sin PV detectado</div>` : ''}
        <div style="padding:8px 12px;background:var(--azul-suave);border-radius:6px;font-size:12px;color:var(--azul);margin-bottom:12px">
          📅 Período de los archivos: <strong>${fechaMinStr}</strong> → <strong>${fechaMaxStr}</strong>
          ${cfgW.ultimaImportacion ? '<br>✅ Última importación exitosa: <strong>' + new Date(cfgW.ultimaImportacion).toLocaleString('es-AR') + '</strong>' : ''}
        </div>
        <div id="preview-webcom-estado" style="font-size:12px;color:var(--gris-500)">Revisá el resumen antes de confirmar.</div>

function calcularDiasDesde(fechaStr) {
  if (!fechaStr) return 0;
  let partes;
  if (fechaStr.includes('/')) partes = fechaStr.split('/');
  else if (fechaStr.includes('-')) partes = fechaStr.split('-').reverse();
  else return 0;
  if (partes.length !== 3) return 0;
  const [d, m, a] = partes.map(Number);
  const fecha = new Date(a, m - 1, d);
  const hoy = new Date();
  hoy.setHours(0, 0, 0, 0);
  return Math.floor((hoy - fecha) / 86400000);
}

}

function semaforoDias(dias) {
  const { diasFondo, diasSalida } = getConfigPlazos();
  const urgente    = diasSalida + 40;  // 40 días sobre el salida = facturado
  const facturado  = diasSalida + 60;
  if (dias >= facturado) return { color: '#7f1d1d', bg: '#fef2f2', border: '#fca5a5', label: '🔴 FACTURADO', orden: 0 };
  if (dias >= urgente)   return { color: '#92400e', bg: '#fff7ed', border: '#fdba74', label: '🟠 URGENTE', orden: 1 };
  if (dias >= diasFondo) return { color: '#854d0e', bg: '#fefce8', border: '#fde047', label: '🟡 FONDO GARANTÍA', orden: 2 };
  if (dias >= 50)        return { color: '#1e40af', bg: '#eff6ff', border: '#93c5fd', label: '🔵 En Plazo', orden: 3 };
  return { color: '#166534', bg: '#f0fdf4', border: '#86efac', label: '🟢 OK', orden: 4 };
}

function renderComodatos() {
  const dispositivos = DB.get('dispositivos').filter(d =>
    d.estado === 'disponible'
  );

  // Calcular días para cada uno
  const conDias = dispositivos.map(d => {
    const dias = d.fec_antiguedad ? calcularDiasDesde(d.fec_antiguedad) :
                 d.fecha_ingreso ? calcularDiasDesde(d.fecha_ingreso) : 0;
    return { ...d, diasReales: dias };
  }).sort((a, b) => b.diasReales - a.diasReales);

  // Estadísticas por semáforo
  const grupos = { facturado: 0, urgente: 0, fondoGarantia: 0, enPlazo: 0, ok: 0 };
  for (const d of conDias) {
    if (d.diasReales >= 140) grupos.facturado++;
    else if (d.diasReales >= 110) grupos.urgente++;
    else if (d.diasReales >= 80) grupos.fondoGarantia++;
    else if (d.diasReales >= 50) grupos.enPlazo++;
    else grupos.ok++;
  }

  return `
    <div style="background:linear-gradient(135deg,#1a1a1a,#3a0000);border-radius:12px;padding:18px 20px;margin-bottom:20px;color:white">
      <p style="font-size:12px;opacity:.6;margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px">Sincronización — Fondo de Garantía y Salida de Consignación — Claro AMX</p>
      <p style="font-size:13px;opacity:.85">Los equipos en consignación tienen <strong>80 días</strong> antes de entrar a Fondo de Garantía y <strong>140 días</strong> antes de ser facturados. Vendelos antes.</p>
    </div>

    <!-- Semáforo resumen -->
    <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:20px">
      ${[
        { label: 'FACTURADO', dias: '≥140d', val: grupos.facturado, sem: semaforoDias(140) },
        { label: 'URGENTE', dias: '110-139d', val: grupos.urgente, sem: semaforoDias(115) },
        { label: 'FONDO GARANTÍA', dias: '80-109d', val: grupos.fondoGarantia, sem: semaforoDias(85) },
        { label: 'EN PLAZO', dias: '50-79d', val: grupos.enPlazo, sem: semaforoDias(60) },
        { label: 'OK', dias: '<50d', val: grupos.ok, sem: semaforoDias(10) },
      ].map(g => `
        <div style="background:${g.sem.bg};border:1px solid ${g.sem.border};border-radius:10px;padding:14px;text-align:center">
          <div style="font-size:22px;font-weight:800;color:${g.sem.color}">${g.val}</div>
          <div style="font-size:10px;font-weight:700;color:${g.sem.color};margin-top:3px">${g.label}</div>
          <div style="font-size:10px;color:${g.sem.color};opacity:.7">${g.dias}</div>
        </div>
      `).join('')}
    </div>

    <!-- Filtros -->
    <div style="display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;align-items:center">
      <select id="comodato-filtro" onchange="filtrarComodatos()" style="padding:8px 12px;border:1.5px solid var(--gris-300);border-radius:6px;font-size:13px;outline:none;background:white">
        <option value="">Todos los estados</option>
        <option value="140">🔴 Facturado (≥140 días)</option>
        <option value="110">🟠 Urgente (≥110 días)</option>
        <option value="80">🟡 Fondo Garantía (≥80 días)</option>
        <option value="50">🔵 En Plazo (≥50 días)</option>
      </select>
      <select id="comodato-pv" onchange="filtrarComodatos()" style="padding:8px 12px;border:1.5px solid var(--gris-300);border-radius:6px;font-size:13px;outline:none;background:white">
        <option value="">Todos los PV</option>
        ${DB.get('puntos_venta').map(pv => `<option value="${pv.id}">${pv.nombre}</option>`).join('')}
      </select>
      <span style="font-size:12px;color:var(--gris-500);margin-left:4px">${conDias.length} equipos en seguimiento</span>
    </div>

    <!-- Tabla -->
    <div class="tabla-wrapper" id="comodatos-tabla">
      ${tablaComodatos(conDias)}
    </div>
  `;
}

function tablaComodatos(items) {
  if (!items.length) return `<div class="empty-state"><p>No hay equipos en comodato activos</p></div>`;
  return `
    <table>
      <thead>
        <tr>
          <th>Estado</th>
          <th>Días</th>
          <th>IMEI</th>
          <th>Descripción</th>
          <th>Marca</th>
          <th>Punto de Venta</th>
          <th>Fec. Antigüedad</th>
          <th>Vence en</th>
        </tr>
      </thead>
      <tbody>
        ${items.map(d => {
          const sem = semaforoDias(d.diasReales);
          const diasParaVencer = Math.max(0, 140 - d.diasReales);
          const diasParaFondo = Math.max(0, 80 - d.diasReales);
          return `
            <tr style="background:${sem.bg}10">
              <td>
                <span style="display:inline-flex;align-items:center;padding:3px 8px;border-radius:20px;font-size:11px;font-weight:600;background:${sem.bg};color:${sem.color};border:1px solid ${sem.border}">
                  ${sem.label}
                </span>
              </td>
              <td><strong style="font-size:15px;color:${sem.color}">${d.diasReales}</strong><span style="font-size:10px;color:var(--gris-500)"> días</span></td>
              <td style="font-family:monospace;font-size:11px;font-weight:600">${d.nro_serie}</td>
              <td>${d.texto}</td>
              <td>${d.marca || '—'}</td>
              <td>${d.punto_venta_nombre || '—'}</td>
              <td>${d.fec_antiguedad || d.fecha_ingreso || '—'}</td>
              <td style="font-size:11px">
                ${d.diasReales >= 140
                  ? `<span style="color:#7f1d1d;font-weight:700">¡Facturado!</span>`
                  : d.diasReales >= 80
                  ? `<span style="color:#92400e;font-weight:700">${diasParaVencer}d para facturar</span>`
                  : `<span style="color:var(--gris-500)">${diasParaFondo}d para fondo • ${diasParaVencer}d para facturar</span>`
                }
              </td>
            </tr>
          `;
        }).join('')}
      </tbody>
    </table>
  `;
}

function filtrarComodatos() {
  const filtroMin = parseInt(document.getElementById('comodato-filtro')?.value || '0') || 0;
  const pvFiltro = document.getElementById('comodato-pv')?.value || '';
  let items = DB.get('dispositivos').filter(d => d.estado === 'disponible');
  items = items.map(d => ({
    ...d,
    diasReales: d.fec_antiguedad ? calcularDiasDesde(d.fec_antiguedad) :
                d.fecha_ingreso ? calcularDiasDesde(d.fecha_ingreso) : 0,
  }));
  if (filtroMin) items = items.filter(d => d.diasReales >= filtroMin);
  if (pvFiltro) items = items.filter(d => d.punto_venta_id === pvFiltro);
  items.sort((a, b) => b.diasReales - a.diasReales);
  document.getElementById('comodatos-tabla').innerHTML = tablaComodatos(items);
}

// ── Cronograma de Procesos SAP ───────────────────────────────────────────────
function renderCronogramaProcesos() {
  const stored = (() => {
    try { return JSON.parse(CACHE['_cfg_cronograma'] || '[]'); } catch { return []; }
  })();
  const { diasFondo, diasSalida, diasAviso } = getConfigPlazos();
  const hoy = new Date();
  const disp = CACHE['dispositivos'] || DB.get('dispositivos') || [];

  // Calcular alertas para cada fecha de proceso cargada
  const alertas = stored.map(proc => {
    const fechaProc = new Date(proc.fecha);
    const diasParaProc = Math.floor((fechaProc - hoy) / 86400000);
    const enFondoEnProc = disp.filter(d => {
      if (d.estado !== 'disponible') return false;
      const diasActuales = d.dias_antiguedad || 0;
      const diasEnFecha  = diasActuales + diasParaProc;
      return diasEnFecha >= diasFondo && diasEnFecha < diasSalida;
    });
    const salenEnProc = disp.filter(d => {
      if (d.estado !== 'disponible') return false;
      const diasActuales = d.dias_antiguedad || 0;
      const diasEnFecha  = diasActuales + diasParaProc;
      return diasEnFecha >= diasSalida;
    });
    return { ...proc, diasParaProc, enFondoEnProc, salenEnProc, fechaProc };
  }).sort((a,b) => a.fechaProc - b.fechaProc);

  return `
    <div class="card" style="margin-bottom:16px">
      <div class="card-header" style="display:flex;justify-content:space-between;align-items:center">
        <h3>📅 Cronograma de Procesos Claro AMX</h3>
      </div>
      <div class="card-body">
        <p style="font-size:12px;color:var(--gris-500);margin-bottom:14px">
          Ingresá las fechas en que Claro corre los procesos de Fondo de Garantía y Salida de Consignación.
          El sistema calculará qué equipos entran en cada proceso con ${diasAviso} días de anticipación.
        </p>
        <div style="display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap">
          <input type="date" id="cron-nueva-fecha"
            style="padding:8px 12px;border:1.5px solid var(--gris-300);border-radius:6px;font-size:13px" />
          <select id="cron-nuevo-tipo" style="padding:8px 12px;border:1.5px solid var(--gris-300);border-radius:6px;font-size:13px;background:white">
            <option value="fondo">Fondo de Garantía</option>
            <option value="salida">Salida de Consignación</option>
            <option value="ambos">Ambos procesos</option>
          </select>
          <button class="btn btn-primary" onclick="agregarFechaCronograma()">+ Agregar fecha</button>
        </div>

        ${alertas.length ? `
          <div style="display:flex;flex-direction:column;gap:12px">
            ${alertas.map((proc, idx) => {
              const vencido = proc.diasParaProc < 0;
              const urgente = proc.diasParaProc >= 0 && proc.diasParaProc <= diasAviso;
              const color   = vencido ? 'var(--acento)' : urgente ? 'var(--amarillo)' : 'var(--azul)';
              const bg      = vencido ? '#fff1f2' : urgente ? '#fffbeb' : '#eff6ff';
              const etiq    = vencido
                ? '🔴 Proceso vencido'
                : urgente
                  ? '🟡 Próximo (' + proc.diasParaProc + ' días)'
                  : '🔵 En ' + proc.diasParaProc + ' días';

              return '<div style="border:1px solid '+color+'30;border-radius:10px;overflow:hidden">'
                + '<div style="background:'+bg+';padding:10px 16px;display:flex;justify-content:space-between;align-items:center">'
                + '<div>'
                + '<p style="font-weight:700;color:'+color+';margin:0;font-size:13px">'
                + proc.fecha.split('-').reverse().join('/') + ' — '
                + (proc.tipo==='fondo'?'Fondo de Garantía':proc.tipo==='salida'?'Salida de Consignación':'Fondo + Salida')
                + '</p>'
                + '<p style="font-size:11px;color:'+color+';margin:0;opacity:.8">'+etiq+'</p>'
                + '</div>'
                + '<button class="btn btn-sm btn-secondary" style="color:var(--acento)" onclick="eliminarFechaCronograma('+idx+')">✕</button>'
                + '</div>'
                + '<div style="padding:12px 16px;display:flex;gap:20px;flex-wrap:wrap">'
                + (proc.enFondoEnProc.length ? '<div><p style="font-size:11px;font-weight:700;color:var(--amarillo);margin-bottom:6px">🟡 Entran a Fondo de Garantía ('+proc.enFondoEnProc.length+')</p>'
                  + proc.enFondoEnProc.slice(0,5).map(d => '<p style="font-size:11px;color:var(--gris-600);margin:2px 0">'+d.nro_serie+' — '+(d.texto||'')+(d.punto_venta_nombre?' · '+d.punto_venta_nombre:'')+'</p>').join('')
                  + (proc.enFondoEnProc.length>5?'<p style="font-size:10px;color:var(--gris-400)">...y '+(proc.enFondoEnProc.length-5)+' más</p>':'')
                  + '</div>' : '')
                + (proc.salenEnProc.length ? '<div><p style="font-size:11px;font-weight:700;color:var(--acento);margin-bottom:6px">🔴 Salen de Consignación ('+proc.salenEnProc.length+')</p>'
                  + proc.salenEnProc.slice(0,5).map(d => '<p style="font-size:11px;color:var(--gris-600);margin:2px 0">'+d.nro_serie+' — '+(d.texto||'')+(d.punto_venta_nombre?' · '+d.punto_venta_nombre:'')+'</p>').join('')
                  + (proc.salenEnProc.length>5?'<p style="font-size:10px;color:var(--gris-400)">...y '+(proc.salenEnProc.length-5)+' más</p>':'')
                  + '</div>' : '')
                + (!proc.enFondoEnProc.length && !proc.salenEnProc.length
                  ? '<p style="font-size:12px;color:var(--verde)">✅ Sin equipos en riesgo para esta fecha</p>' : '')
                + '</div></div>';
            }).join('')}
          </div>
        ` : '<div class="empty-state" style="padding:32px"><p>No hay fechas de proceso cargadas. Agregá la próxima fecha del proceso de Claro.</p></div>'}
      </div>
    </div>
  `;
}

async function agregarFechaCronograma() {
  const fecha = document.getElementById('cron-nueva-fecha')?.value;
  const tipo  = document.getElementById('cron-nuevo-tipo')?.value;
  if (!fecha) { toast('Seleccioná una fecha', 'error'); return; }
  const stored = (() => { try { return JSON.parse(CACHE['_cfg_cronograma'] || '[]'); } catch { return []; } })();
  if (stored.some(p => p.fecha === fecha && p.tipo === tipo)) { toast('Esa fecha y tipo ya están cargados', 'warning'); return; }
  stored.push({ fecha, tipo });
  await guardarCronogramaEnSupabase(stored);
  document.getElementById('conc-tab-cronograma').innerHTML = renderCronogramaProcesos();
  toast('✅ Fecha agregada');
}

async function eliminarFechaCronograma(idx) {
  const stored = (() => { try { return JSON.parse(CACHE['_cfg_cronograma'] || '[]'); } catch { return []; } })();
  stored.sort((a,b) => new Date(a.fecha)-new Date(b.fecha));
  stored.splice(idx, 1);
  await guardarCronogramaEnSupabase(stored);
  document.getElementById('conc-tab-cronograma').innerHTML = renderCronogramaProcesos();
  toast('✅ Fecha eliminada');
}

async function guardarCronogramaEnSupabase(cronograma) {
  const json = JSON.stringify(cronograma);
  CACHE['_cfg_cronograma'] = json;
  try {
    await sbUpsert('configuracion', { id: 'global', cronograma_procesos: json });
  } catch(e) {
    toast('Error al guardar cronograma: ' + e.message, 'error');
  }
}

function mapearResultadoBot(data) {
  return data.map(r => {
    const serial = String(r.Serial || r.serial || '').trim();
    return {
      id:             serial, // el IMEI es único y siempre presente (filtrado más abajo)
      serial,
      material:       String(r.Material    || r.material    || '').trim(),
      texto:          String(r.Texto       || r.texto       || '').trim(),
      centro:         String(r.Centro      || r.centro      || '').trim(),
      precio:         parseFloat(String(r.Precio || r.precio || '0').replace(/[^\d.-]/g,'')) || 0,
      dias:           parseInt(String(r.Dias_Antiguedad || r.dias || '0').replace(/[^\d-]/g,'')) || 0,
      semaforo:       String(r.Semaforo    || r.semaforo    || '').trim(),
      fec_antiguedad: String(r.Fecha_Antiguedad || r.fec_antiguedad || '').trim(),
      nro_pedido:     String(r.Nro_Pedido  || r.nro_pedido  || '').trim(),
      categoria:      r.Categoria === 'Stock en Tránsito' ? 'Stock en Tránsito' : 'Stock actual',
      origen:         r.Origen || r.origen || (r.Categoria === 'Stock en Tránsito' ? 'transito' : 'principal'),
    };
  }).filter(r => r.serial.length > 5);
}

function mostrarEstadoBot(html, tipo) {
  const el = document.getElementById('bot-estado');
  if (!el) return;
  const colores = { info: 'azul', ok: 'verde', error: 'rojo', warn: 'amarillo' };
  const c = colores[tipo] || 'azul';
  el.innerHTML = `<div style="background:var(--${c}-suave);border:1px solid var(--${c});border-radius:8px;padding:10px 14px;font-size:13px;color:var(--${c});display:flex;align-items:center;gap:8px">${html}</div>`;
}

async function importarStockSAP() {
  // Obtener URL del JSON desde la configuración guardada en Supabase
  const cfg = await getConfigSistemasAMX();
  const jsonUrl = cfg.jsonUrl || '';
  if (!jsonUrl) {
    toast('Configurá la URL del JSON en Configuración → Sistemas AMX', 'error');
    mostrarEstadoBot('❌ Falta la URL del JSON. Configurala en <strong>Configuración → Sistemas AMX</strong>.', 'error');
    return;
  }

  const btn = document.getElementById('btn-importar-sap');
  if (btn) btn.disabled = true;
  mostrarEstadoBot('🔄 Descargando datos del bot...', 'info');

  try {
    const resp = await fetch(`${jsonUrl}?t=${Date.now()}`, { cache: 'no-store' });
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    const json = await resp.json();

    if (json.status === 'error') {
      mostrarEstadoBot(`❌ El último corrido del bot falló: ${json.mensaje}`, 'error');
      if (btn) btn.disabled = false;
      return;
    }

    const inventarioSAP = mapearResultadoBot(json.data || []);
    if (!inventarioSAP.length) {
      mostrarEstadoBot('⚠️ El archivo no tiene registros todavía. Esperá a que corra el workflow de GitHub Actions.', 'warn');
      if (btn) btn.disabled = false;
      return;
    }

    // Separar conciliado vs tránsito
    const stockConciliado = inventarioSAP.filter(s => s.origen !== 'transito');
    const equiposTransito = inventarioSAP.filter(s => s.origen === 'transito');

    mostrarEstadoBot(`🔄 Guardando ${inventarioSAP.length} registros en la base de datos...`, 'info');

    // Guardar en Supabase en lotes
    const LOTE = 50;
    if (stockConciliado.length) {
      dbInvalidate('stock_sap_conciliado');
      for (let i = 0; i < stockConciliado.length; i += LOTE) {
        await sbUpsertMany('stock_sap_conciliado', stockConciliado.slice(i, i + LOTE));
      }
    }
    // ── Tránsito SAP: ACUMULA, no reemplaza ─────────────────────────────────
    // El bot solo agrega pedidos nuevos. Los existentes se mantienen hasta que
    // el usuario los ingrese con "Generar Remito" o los descarte manualmente.
    // Razón: Claro saca un pedido de "tránsito" al entregarlo físicamente,
    // por lo que el bot ya no lo ve — pero nosotros debemos mantenerlo hasta confirmar recepción.
    if (equiposTransito.length) {
      const transitoActual = CACHE['equipos_sap_transito'] || await dbGet('equipos_sap_transito');
      const serialesExistentes = new Set(transitoActual.map(e => e.serial).filter(Boolean));
      const pedidosExistentes  = new Set(transitoActual.map(e => e.nro_pedido).filter(Boolean));
      // Solo agregar los que NO existen ya (por serial)
      const nuevosTransito = equiposTransito.filter(e => !serialesExistentes.has(e.serial));
      if (nuevosTransito.length) {
        for (let i = 0; i < nuevosTransito.length; i += LOTE) {
          await sbUpsertMany('equipos_sap_transito', nuevosTransito.slice(i, i + LOTE));
        }
        dbInvalidate('equipos_sap_transito');
        await dbGet('equipos_sap_transito');
      }
      const msgTransito = nuevosTransito.length
        ? ` · ${nuevosTransito.length} nuevo${nuevosTransito.length!==1?'s':''} en tránsito`
        : ' · tránsito sin cambios (acumulado)';
      mostrarEstadoBot(`🔄 Tránsito SAP actualizado${msgTransito}`, 'info');
    }

    // ── Paso 3: Detectar NO SAP y Homologados por fecha ─────────────────────────
    mostrarEstadoBot('🔄 Detectando equipos NO SAP y homologaciones por fecha...', 'info');
    const { diasSalida } = getConfigPlazos();
    // Índice rápido de seriales SAP
    const sapMap = {};
    for (const s of inventarioSAP) if (s.serial) sapMap[s.serial] = s;
    const dispActuales = CACHE['dispositivos'] || await dbGet('dispositivos');
    const dispActualizarFull  = [];
    const noSapMarcados       = [];
    const homologadosMarcados = [];
    let actualizados = 0;

    for (const d of dispActuales) {
      const sap = sapMap[d.nro_serie];
      if (sap) {
        // Está en SAP: actualizar días, fecha y precio
        const cambios = { ...d,
          dias_antiguedad: sap.dias,
          fec_antiguedad: sap.fec_antiguedad || d.fec_antiguedad,
        };
        if (sap.precio && sap.precio !== d.precio) cambios.precio = sap.precio;
        // Homologar por fecha solo si sigue disponible (no pisar no_sap ni homologado ya marcados)
        if (d.estado === 'disponible' && sap.dias >= diasSalida) {
          cambios.estado = 'homologado';
          homologadosMarcados.push(d);
        }
        dispActualizarFull.push(cambios);
        actualizados++;
      } else if (d.nro_serie) {
        // No está en SAP: solo marcar no_sap si sigue disponible
        // No pisar homologado ni no_sap existente
        if (d.estado === 'disponible') {
          dispActualizarFull.push({ ...d, estado: 'no_sap' });
          noSapMarcados.push(d);
        }
        // Si ya es homologado o no_sap → no hacer nada, dejar como está
      }
    }

    if (dispActualizarFull.length) {
      for (let i = 0; i < dispActualizarFull.length; i += LOTE) {
        await sbUpsertMany('dispositivos', dispActualizarFull.slice(i, i + LOTE));
      }
      dbInvalidate('dispositivos');
      await dbGet('dispositivos');
    }

    // ── Paso 4: Sincronizar materiales desde SAP ──────────────────────────────
    mostrarEstadoBot('🔄 Sincronizando materiales desde SAP...', 'info');
    const matsActuales = CACHE['materiales'] || await dbGet('materiales');
    const matsMap = Object.fromEntries(matsActuales.map(m => [m.codigo, m]));
    const matsNuevosMap    = {};   // deduplicados por codigo
    const matsActualizarMap = {};  // deduplicados por codigo

    for (const s of inventarioSAP) {
      if (!s.material || !s.texto) continue;
      const existente = matsMap[s.material];
      const marcaDetectada = detectarMarcaPorPrefijo(s.texto);

      if (!existente) {
        // Material nuevo — guardar solo el primero encontrado por código
        if (!matsNuevosMap[s.material]) {
          matsNuevosMap[s.material] = {
            id:     DB.genId(),
            codigo: s.material,
            nombre: s.texto,
            marca:  marcaDetectada,
            precio: s.precio || 0,
          };
        }
      } else {
        // Existente: actualizar marca si falta o precio si cambió
        const necesitaUpdate = (!existente.marca && marcaDetectada)
          || (s.precio && existente.precio !== s.precio);
        if (necesitaUpdate && !matsActualizarMap[s.material]) {
          matsActualizarMap[s.material] = {
            ...existente,
            marca:  existente.marca || marcaDetectada,
            precio: s.precio || existente.precio || 0,
          };
        }
      }
    }

    const matsNuevos     = Object.values(matsNuevosMap);
    const matsActualizar = Object.values(matsActualizarMap);

    if (matsNuevos.length) {
      for (let i = 0; i < matsNuevos.length; i += LOTE)
        await sbUpsertMany('materiales', matsNuevos.slice(i, i + LOTE));
    }
    if (matsActualizar.length) {
      for (let i = 0; i < matsActualizar.length; i += LOTE)
        await sbUpsertMany('materiales', matsActualizar.slice(i, i + LOTE));
    }
    if (matsNuevos.length || matsActualizar.length) {
      dbInvalidate('materiales');
      await dbGet('materiales');
    }

    // Refrescar cache SAP
    await Promise.all([dbGet('stock_sap_conciliado'), dbGet('equipos_sap_transito')]);

    const fecha = json.actualizado ? new Date(json.actualizado).toLocaleString('es-AR') : '—';
    const msgNoSap  = noSapMarcados.length      ? ` · <strong style="color:var(--acento)">${noSapMarcados.length} NO SAP</strong>` : '';
    const msgHomol  = homologadosMarcados.length ? ` · <strong style="color:#7c3aed">${homologadosMarcados.length} Homologados</strong>` : '';
    const msgMats   = matsNuevos.length          ? ` · <strong style="color:var(--verde)">${matsNuevos.length} materiales nuevos</strong>` : '';
    mostrarEstadoBot(`✅ ${inventarioSAP.length} registros SAP (${stockConciliado.length} conciliado · ${equiposTransito.length} en tránsito · ${fecha}). ${actualizados} equipos actualizados${msgNoSap}${msgHomol}${msgMats}.`, 'ok');

    // Guardar fecha/hora de última sincronización y estado del bot SAP
    const ahora = new Date().toISOString();
    CACHE['_ultima_sync_sap'] = ahora;
    try {
      const r = await fetch(`${SUPABASE_URL}/rest/v1/configuracion?id=eq.global`, {
        method: 'PATCH',
        headers: {
          'apikey': SUPABASE_KEY,
          'Authorization': `Bearer ${SB_TOKEN || SUPABASE_KEY}`,
          'Content-Type': 'application/json',
          'Prefer': 'return=minimal',
        },
        body: JSON.stringify({
          ultima_sync: ahora,
          sap_bot_estado: 'ok',
          sap_bot_mensaje: `${inventarioSAP.length} registros SAP · ${stockConciliado.length} conciliados`,
        }),
      });
      if (!r.ok) console.warn('ultima_sync error:', r.status, await r.text());
      else console.log('ultima_sync guardada OK:', ahora);
    } catch(e) { console.warn('ultima_sync error:', e); }

    // Mostrar tabla
    document.getElementById('bot-tabla-resultado').innerHTML = `
      <div class="tabla-wrapper" style="max-height:320px;overflow-y:auto">
        <table>
          <thead><tr><th>Serial / IMEI</th><th>Material</th><th>Descripción</th><th>Centro</th><th>Días</th><th>Origen</th><th>Categoría</th><th style="text-align:right">Precio</th></tr></thead>
          <tbody>
            ${inventarioSAP.map(s => {
              const sem = semaforoDias(s.dias);
              const origenBadge = s.origen === 'reingreso' ? '<span class="badge badge-naranja">Reingreso</span>' :
                                   s.origen === 'transito' ? '<span class="badge badge-azul">Tránsito</span>' :
                                   '<span class="badge badge-gris">Principal</span>';
              return `<tr>
                <td style="font-family:monospace;font-size:11px;font-weight:600">${s.serial}</td>
                <td style="font-family:monospace;font-size:11px">${s.material}</td>
                <td>${s.texto}</td>
                <td>${s.centro}</td>
                <td><span style="color:${sem.color};font-weight:600">${s.dias}d</span></td>
                <td>${origenBadge}</td>
                <td>${s.categoria}</td>
                <td style="text-align:right">$${s.precio.toLocaleString('es-AR')}</td>
              </tr>`;
            }).join('')}
          </tbody>
        </table>
      </div>
    `;

    // Ejecutar conciliación automáticamente
    ejecutarConciliacion(inventarioSAP);
    btn.disabled = false;

  } catch (e) {
    let msg = e.message;
    if (msg.includes('import') || msg.includes('is not valid JSON') || msg.includes('Unexpected token')) {
      msg = 'La URL apunta a un archivo que no es JSON (posiblemente el script .py del bot). '
          + 'En Configuración → Sistemas AMX, la URL debe apuntar al archivo <strong>stock_sap.json</strong> generado por el bot, '
          + 'con formato: <code>https://raw.githubusercontent.com/usuario/repo/main/data/stock_sap.json</code>';
    }
    mostrarEstadoBot(`❌ ${msg}`, 'error');
    if (btn) btn.disabled = false;
  }
}

async function cargarInventarioSAP(file) {
  if (!file) return;
  if (!window.XLSX) await cargarXLSX();
  const info = document.getElementById('sap-info');
  info.innerHTML = '<p style="font-size:12px;color:var(--gris-500)">Leyendo archivo SAP...</p>';

  try {
    const sheet = await leerExcel(file);
    const { headers, data } = sheet;

    const iSerial  = findCol(headers, 'Serial', 'Nro.Serie', 'NRO.SERIE', 'IMEI', 'serie', 'serial');
    const iMat     = findCol(headers, 'Material', 'material', 'MATERIAL', 'Cod.Material');
    const iTexto   = findCol(headers, 'Texto', 'texto', 'TEXTO', 'Descripcion');
    const iCentro  = findCol(headers, 'Centro', 'centro', 'CENTRO');
    const iPrecio  = findCol(headers, 'Precio', 'precio', 'PRECIO', 'Valor');
    const iDias    = findCol(headers, 'Días Antigüedad', 'Dias', 'dias_antiguedad', 'Antigüedad');
    const iSem     = findCol(headers, 'Semáforo', 'Semaforo', 'semaforo', 'Estado');
    const iPedido  = findCol(headers, 'Nro.Pedido', 'nro_pedido', 'Pedido');
    const iCat     = findCol(headers, 'Categoría', 'Categoria', 'categoria', 'Tipo');

    const inventarioSAP = data.map(row => ({
      serial:  String(row[iSerial]  ?? '').trim(),
      material: String(row[iMat]   ?? '').trim(),
      texto:   String(row[iTexto]  ?? '').trim(),
      centro:  String(row[iCentro] ?? '').trim(),
      precio:  parseFloat(row[iPrecio])  || 0,
      dias:    parseInt(row[iDias])      || 0,
      semaforo: String(row[iSem]  ?? '').trim(),
      nro_pedido: String(row[iPedido] ?? '').trim(),
      categoria: String(row[iCat] ?? '').trim(),
    })).filter(r => r.serial.length > 5);

    // Guardar en DB
    DB.set('inventario_sap', inventarioSAP);

    info.innerHTML = `<div style="background:var(--verde-suave);border:1px solid #bbf7d0;border-radius:6px;padding:8px 12px;font-size:12px;color:var(--verde);font-weight:600">✅ ${inventarioSAP.length} registros SAP cargados</div>`;

    // Ejecutar conciliación
    ejecutarConciliacion(inventarioSAP);

  } catch(e) {
    info.innerHTML = `<p style="color:var(--rojo);font-size:12px">Error: ${e.message}</p>`;
  }
}

function ejecutarConciliacion(inventarioSAP) {
  const dispositivos = DB.get('dispositivos');
  const dispMap = {};
  for (const d of dispositivos) if (d.nro_serie) dispMap[d.nro_serie] = d;

  const sapMap = {};
  for (const s of inventarioSAP) if (s.serial) sapMap[s.serial] = s;

  // 1. En SAP pero NO en nuestro sistema
  const soloEnSAP = inventarioSAP.filter(s => !dispMap[s.serial]);

  // 2. En nuestro sistema pero NO en SAP (excluir homologados — es esperado que no estén)
  const soloEnLocal = dispositivos.filter(d =>
    d.estado === 'disponible' && !sapMap[d.nro_serie]
  );

  // 3. En ambos — verificar diferencias
  const diferencias = [];
  for (const sap of inventarioSAP) {
    const local = dispMap[sap.serial];
    if (!local) continue;
    const diffs = [];
    if (local.estado === 'vendido' && sap.semaforo !== 'vendido') diffs.push('Vendido local pero no en SAP');
    if (sap.dias > 140) diffs.push(`ALERTA: ${sap.dias} días — ya debería estar facturado`);
    else if (sap.dias > 80) diffs.push(`En Fondo de Garantía: ${sap.dias} días`);
    if (diffs.length) diferencias.push({ ...sap, local, diffs });
  }

  const resultado = document.getElementById('conciliacion-resultado');
  resultado.innerHTML = `
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px">
      <div class="stat-card rojo" style="padding:14px;text-align:center">
        <div class="label">Solo en SAP (falta en tu stock)</div>
        <div class="valor" style="font-size:24px">${soloEnSAP.length}</div>
        <div class="sub">Equipos a ingresar</div>
      </div>
      <div class="stat-card naranja" style="padding:14px;text-align:center">
        <div class="label">Solo en tu stock (no en SAP)</div>
        <div class="valor" style="font-size:24px">${soloEnLocal.length}</div>
        <div class="sub">Equipos a verificar</div>
      </div>
      <div class="stat-card amarillo" style="padding:14px;text-align:center">
        <div class="label">Diferencias detectadas</div>
        <div class="valor" style="font-size:24px">${diferencias.length}</div>
        <div class="sub">Requieren atención</div>
      </div>
    </div>

    ${soloEnSAP.length ? `
      <div class="card" style="margin-bottom:16px">
        <div class="card-header" style="background:var(--rojo-suave)">
          <h3 style="color:var(--rojo)">🔴 ${soloEnSAP.length} equipos en SAP que no están en tu sistema</h3>
        </div>
        <div class="card-body" style="padding:0">
          <div style="max-height:250px;overflow-y:auto">
            <table>
              <thead><tr><th>Serial / IMEI</th><th>Material</th><th>Descripción</th><th>Centro</th><th>Días</th><th style="text-align:right">Precio</th></tr></thead>
              <tbody>
                ${soloEnSAP.slice(0, 100).map(s => {
                  const sem = semaforoDias(s.dias);
                  return `<tr>
                    <td style="font-family:monospace;font-size:11px;font-weight:600">${s.serial}</td>
                    <td style="font-family:monospace;font-size:11px">${s.material}</td>
                    <td>${s.texto}</td>
                    <td>${s.centro}</td>
                    <td><span style="color:${sem.color};font-weight:600">${s.dias}d</span></td>
                    <td style="text-align:right">$${s.precio.toLocaleString('es-AR')}</td>
                  </tr>`;
                }).join('')}
              </tbody>
            </table>
          </div>
        </div>
      </div>
    ` : ''}

    ${soloEnLocal.length ? `
      <div class="card" style="margin-bottom:16px">
        <div class="card-header" style="background:#fff1f2;border-color:#fecdd3">
          <h3 style="color:var(--acento)">🔴 ${soloEnLocal.length} equipos en tu stock que NO están en SAP</h3>
          <p style="font-size:12px;color:var(--gris-600);margin-top:4px">
            Estos equipos probablemente ya fueron vendidos pero no llegaron en los archivos de importación.
          </p>
        </div>
        <div class="card-body">
          <div style="max-height:200px;overflow-y:auto;margin-bottom:12px">
            <table>
              <thead><tr><th>IMEI</th><th>Descripción</th><th>Punto de Venta</th><th>Remito</th><th>Ingreso</th></tr></thead>
              <tbody>
                ${soloEnLocal.slice(0, 100).map(d => `<tr>
                  <td style="font-family:monospace;font-size:11px;font-weight:600">${d.nro_serie}</td>
                  <td>${d.texto}</td>
                  <td>${d.punto_venta_nombre || '—'}</td>
                  <td style="font-family:monospace;font-size:11px">${d.nro_remito || '—'}</td>
                  <td>${d.fecha_ingreso || '—'}</td>
                </tr>`).join('')}
              </tbody>
            </table>
          </div>
          <button class="btn btn-primary" style="background:var(--acento);border-color:var(--acento)"
            onclick="marcarNoSAP(${JSON.stringify(soloEnLocal.map(d=>d.id))})">
            🔴 Marcar ${soloEnLocal.length} equipo${soloEnLocal.length!==1?'s':''} como NO SAP
          </button>
          <p style="font-size:11px;color:var(--gris-500);margin-top:6px">
            Los equipos NO SAP quedan excluidos del stock activo y de los vencimientos.
          </p>
        </div>
      </div>
    ` : ''}

    ${diferencias.length ? `
      <div class="card">
        <div class="card-header" style="background:var(--amarillo-suave)">
          <h3 style="color:var(--amarillo)">⚠️ ${diferencias.length} diferencias entre sistemas</h3>
        </div>
        <div class="card-body" style="padding:0">
          <table>
            <thead><tr><th>IMEI</th><th>Descripción</th><th>Días SAP</th><th>Diferencias detectadas</th></tr></thead>
            <tbody>
              ${diferencias.map(d => `<tr>
                <td style="font-family:monospace;font-size:11px;font-weight:600">${d.serial}</td>
                <td>${d.texto}</td>
                <td><strong style="color:${semaforoDias(d.dias).color}">${d.dias}d</strong></td>
                <td>${d.diffs.map(df => `<span class="badge badge-amarillo" style="margin-right:4px;font-size:10px">${df}</span>`).join('')}</td>
              </tr>`).join('')}
            </tbody>
          </table>
        </div>
      </div>
    ` : ''}

    ${!soloEnSAP.length && !soloEnLocal.length && !diferencias.length ? `
      <div style="background:var(--verde-suave);border:1px solid #bbf7d0;border-radius:10px;padding:24px;text-align:center">
        <div style="font-size:32px;margin-bottom:8px">✅</div>
        <p style="font-weight:700;color:var(--verde);font-size:16px">¡Stock conciliado! No hay diferencias.</p>
      </div>
    ` : ''}
  `;
}

async function marcarNoSAP(ids) {
  if (!ids.length) return;
  if (!confirm('¿Marcar ' + ids.length + ' equipo' + (ids.length!==1?'s':'') + ' como NO SAP?\n\nEstos quedarán excluidos del stock activo y de los vencimientos.')) return;
  const disp = CACHE['dispositivos'] || DB.get('dispositivos') || [];
  let marcados = 0;
  for (const id of ids) {
    const d = disp.find(x => x.id === id);
    if (!d) continue;
    await sbUpsert('dispositivos', { ...d, estado: 'no_sap' });
    marcados++;
  }
  dbInvalidate('dispositivos');
  await dbGet('dispositivos');
  toast('🔴 ' + marcados + ' equipo' + (marcados!==1?'s':'') + ' marcado' + (marcados!==1?'s':'') + ' como NO SAP');
  navegar('conciliacion');
}

let remitoManualFilas = [];

function inicializarFilasRemitoManual() {
  remitoManualFilas = [{ id: DB.genId(), material: '', descripcion: '', series: '' }];
  renderFilasRemitoManual();
}

function agregarFilaRemitoManual() {
  remitoManualFilas.push({ id: DB.genId(), material: '', descripcion: '', series: '' });
  renderFilasRemitoManual();
}

function quitarFilaRemitoManual(id) {
  if (remitoManualFilas.length <= 1) { toast('Debe quedar al menos una fila', 'warning'); return; }
  remitoManualFilas = remitoManualFilas.filter(f => f.id !== id);
  renderFilasRemitoManual();
}

function contarSeries(texto) {
  return (texto || '').split('\n').map(s => s.trim()).filter(Boolean).length;
}

function renderFilasRemitoManual() {
  const cont = document.getElementById('rem-manual-filas');
  if (!cont) return;
  cont.innerHTML = remitoManualFilas.map(f => {
    const mat      = buscarMaterialPorCodigo(f.material);
    const cantidad = contarSeries(f.series);
    const subtotal = mat?.precio ? mat.precio * cantidad : 0;
    const descVal  = f.descripcion || (mat ? mat.nombre : '');
    return `
      <tr data-fila-id="${f.id}">
        <td>
          <input type="text" value="${f.material}" placeholder="70013455"
            style="width:100%;font-family:monospace;border:1px solid var(--gris-300);border-radius:4px;padding:5px 7px;font-size:12px"
            oninput="actualizarFilaRemitoManual('${f.id}', 'material', this.value)" />
        </td>
        <td>
          <input type="text" id="desc-${f.id}" value="${descVal}"
            placeholder="Descripción del equipo"
            style="width:100%;border:1px solid var(--gris-300);border-radius:4px;padding:5px 7px;font-size:12px;color:var(--gris-800)"
            oninput="actualizarFilaRemitoManual('${f.id}', 'descripcion', this.value)" />
        </td>
        <td id="marca-${f.id}">${mat ? badgeMarca(mat.marca) : '<span class="badge badge-gris">—</span>'}</td>
        <td>
          <textarea rows="2" placeholder="354678901234567&#10;354678901234568"
            style="width:100%;font-family:monospace;border:1px solid var(--gris-300);border-radius:4px;padding:5px 7px;font-size:11px;resize:vertical"
            oninput="actualizarFilaRemitoManual('${f.id}', 'series', this.value)">${f.series}</textarea>
          <p id="cant-${f.id}" style="font-size:10px;color:var(--gris-500);margin-top:2px">${cantidad ? cantidad + ' IMEI(s)' : ''}</p>
        </td>
        <td id="precio-${f.id}" style="font-size:12px;text-align:right">
          ${mat?.precio ? '$' + Number(mat.precio).toLocaleString('es-AR') + (cantidad > 1 ? `<br><span style="font-size:10px;color:var(--gris-500)">Subt: $${subtotal.toLocaleString('es-AR')}</span>` : '') : '—'}
        </td>
        <td>
          <button type="button" onclick="quitarFilaRemitoManual('${f.id}')" style="background:none;border:none;color:var(--rojo);cursor:pointer;font-size:14px">✕</button>
        </td>
      </tr>
    `;
  }).join('');
}

function actualizarFilaRemitoManual(id, campo, valor) {
  const fila = remitoManualFilas.find(f => f.id === id);
  if (!fila) return;
  fila[campo] = valor;

  const mat      = buscarMaterialPorCodigo(fila.material);
  const cantidad = contarSeries(fila.series);
  const subtotal = mat?.precio ? mat.precio * cantidad : 0;

  if (campo === 'material') {
    // Auto-completar descripción solo si el usuario no la escribió manualmente
    const descEl = document.getElementById(`desc-${id}`);
    if (descEl && (!fila.descripcion || fila.descripcion === '')) {
      descEl.value = mat ? mat.nombre : '';
      fila.descripcion = mat ? mat.nombre : '';
    }
    document.getElementById(`marca-${id}`).innerHTML = mat ? badgeMarca(mat.marca) : '<span class="badge badge-gris">—</span>';
  }
  if (campo === 'series') {
    document.getElementById(`cant-${id}`).textContent = cantidad ? cantidad + ' IMEI(s)' : '';
  }
  document.getElementById(`precio-${id}`).innerHTML = mat?.precio
    ? '$' + Number(mat.precio).toLocaleString('es-AR') + (cantidad > 1 ? `<br><span style="font-size:10px;color:var(--gris-500)">Subt: $${subtotal.toLocaleString('es-AR')}</span>` : '')
    : '—';
}

function filtrarHistorialRemitos() {
  const buscNro    = (document.getElementById('hist-search-remito')?.value || '').toLowerCase().trim();
  const buscPedido = (document.getElementById('hist-search-pedido')?.value || '').toLowerCase().trim();
  const buscImei   = (document.getElementById('hist-search-imei')?.value || '').toLowerCase().trim();
  const tipoFiltro = document.getElementById('hist-filtro-tipo')?.value || '';

  let remitos = (CACHE['remitos'] || []).slice().reverse();

  if (buscNro)    remitos = remitos.filter(r => r.nro_remito?.toLowerCase().includes(buscNro));
  if (tipoFiltro) remitos = remitos.filter(r => r.tipo === tipoFiltro);

  if (buscPedido) {
    const dispositivos = CACHE['dispositivos'] || [];
    const remitosConPedido = new Set(
      dispositivos.filter(d => d.nro_pedido?.toLowerCase().includes(buscPedido)).map(d => d.nro_remito)
    );
    remitos = remitos.filter(r => remitosConPedido.has(r.nro_remito) || r.nro_pedido?.toLowerCase().includes(buscPedido));
  }

  let coincidenciasImei;
  if (buscImei) {
    const dispositivos = CACHE['dispositivos'] || [];
    const remitosConImei = new Set(
      dispositivos.filter(d => d.nro_serie?.toLowerCase().includes(buscImei)).map(d => d.nro_remito).filter(Boolean)
    );
    remitos = remitos.filter(r => remitosConImei.has(r.nro_remito));
    coincidenciasImei = remitosConImei.size;
  }

  document.getElementById('historial-tabla').innerHTML = tablaHistorialRemitos(remitos, coincidenciasImei);
}

async function guardarConfigSistemas() {
  const cfg = leerConfigDesdeFormulario();
  const estadoEl = document.getElementById('sync-sistemas-estado');
  if (estadoEl) estadoEl.innerHTML = '<div style="padding:8px 12px;background:var(--azul-suave);border:1px solid var(--azul);border-radius:6px;font-size:13px;color:var(--azul)">🔄 Guardando...</div>';
  try {
    // 1. Guardar en Supabase
    await setConfigSistemasAMX(cfg);

    // 2. Si hay token de GitHub, actualizar data/config.json en el repo
    //    para que el bot use los nuevos valores en el próximo run
    if (cfg.ghToken && cfg.ghUser && cfg.ghRepo) {
      try {
        mostrarSyncEstado('🔄 Guardando en Supabase y sincronizando config.json con GitHub...', 'info');
        await sincronizarConfigConGitHub(cfg);
        mostrarSyncEstado('✅ Configuración guardada y sincronizada con el bot correctamente.', 'ok');
        toast('Configuración guardada y sincronizada ✓');
      } catch(eGh) {
        mostrarSyncEstado(`✅ Guardado en Supabase. ⚠️ No se pudo sincronizar con GitHub: ${eGh.message}`, 'warn');
        toast('Guardado en Supabase (sin sincronizar GitHub)', 'warning');
      }
    } else {
      mostrarSyncEstado('✅ Configuración guardada correctamente.', 'ok');
      toast('Configuración guardada ✓');
    }
  } catch(e) {
    mostrarSyncEstado(`❌ Error al guardar: ${e.message}`, 'error');
    toast('Error al guardar: ' + e.message, 'error');
    console.error('guardarConfigSistemas error:', e);
  }
}

async function sincronizarConfigConGitHub(cfg) {
  // El bot lee data/config.json — path correcto
  const path   = 'data/config.json';
  const apiUrl = `https://api.github.com/repos/${cfg.ghUser}/${cfg.ghRepo}/contents/${path}`;
  const headers = {
    Authorization: `Bearer ${cfg.ghToken}`,
    Accept: 'application/vnd.github+json',
    'Content-Type': 'application/json',
  };

  // Contenido que el bot espera (claves que lee en cargar_config())
  const contenido = {
    sap_user:     cfg.sapUser     || '',
    sap_pass:     cfg.sapPass     || '',
    rango_inicio: cfg.rangoInicio || '',
    rango_fin:    cfg.rangoFin    || '',
    json_url:     cfg.jsonUrl     || '',
    actualizado:  new Date().toISOString(),
  };

  // Obtener SHA actual del archivo (necesario para actualizar)
  let sha = null;
  const getResp = await fetch(apiUrl, { headers });
  if (getResp.ok) {
    sha = (await getResp.json()).sha;
  } else if (getResp.status !== 404) {
    const err = await getResp.json().catch(() => ({}));
    throw new Error(err.message || `HTTP ${getResp.status} al leer config.json`);
  }

  // Subir el archivo
  const jsonStr      = JSON.stringify(contenido, null, 2);
  const base64Content = btoa(unescape(encodeURIComponent(jsonStr)));
  const body = {
    message: `Actualizar config bot SAP - ${new Date().toLocaleString('es-AR')}`,
    content: base64Content,
  };
  if (sha) body.sha = sha;

  const putResp = await fetch(apiUrl, {
    method: 'PUT', headers, body: JSON.stringify(body),
  });

  if (!putResp.ok) {
    const err = await putResp.json().catch(() => ({}));
    throw new Error(err.message || `HTTP ${putResp.status} al escribir config.json`);
  }
  return true;
}

async function getConfigSistemasAMX() {
  try {
    const rows = await SB.getAll('configuracion', SB_TOKEN);
    const cfg  = rows.find(r => r.id === 'global');
    if (!cfg) return {};
    // Cargar plazos al cache global (robusto ante columna inexistente)
    const plazosRaw = cfg.plazos_consignacion;
    if (plazosRaw) {
      try { CACHE['_cfg_plazos'] = JSON.parse(plazosRaw); } catch {}
    }
    // Cargar cronograma al cache global
    const cronRaw = cfg.cronograma_procesos;
    if (cronRaw) {
      // Puede venir como string JSON o ya parseado
      CACHE['_cfg_cronograma'] = typeof cronRaw === 'string' ? cronRaw : JSON.stringify(cronRaw);
    }
    // Cache para el dashboard — ANTES del return
    if (cfg.ultima_sync) CACHE['_ultima_sync_sap'] = cfg.ultima_sync;
    if (cfg.webcom_ultima_importacion) {
      CACHE['_cfg_sistemas'] = CACHE['_cfg_sistemas'] || {};
      CACHE['_cfg_sistemas'].webcomUltimaImportacion = cfg.webcom_ultima_importacion;
    }
    if (cfg.dashboard_pv_id) CACHE['_dashboard_pv_id'] = cfg.dashboard_pv_id;
    return {
      sapUser:     cfg.sap_user     || '',
      sapPass:     cfg.sap_pass     || '',
      rangoInicio: cfg.rango_inicio || '',
      rangoFin:    cfg.rango_fin    || '',
      ghUser:      cfg.gh_user      || '',
      ghRepo:      cfg.gh_repo      || '',
      ghToken:     cfg.gh_token     || '',
      jsonUrl:     cfg.json_url     || '',
      ultimaSync:  cfg.ultima_sync  || '',
    };
  } catch { return {}; }
}

async function setConfigSistemasAMX(cfg) {
  const datos = {
    id:           'global',
    sap_user:     cfg.sapUser     || '',
    sap_pass:     cfg.sapPass     || '',
    rango_inicio: cfg.rangoInicio || '',
    rango_fin:    cfg.rangoFin    || '',
    gh_user:      cfg.ghUser      || '',
    gh_repo:      cfg.ghRepo      || '',
    gh_token:     cfg.ghToken     || '',
    json_url:     cfg.jsonUrl     || '',
    actualizado:  new Date().toISOString(),
  };
  const r = await fetch(`${SUPABASE_URL}/rest/v1/configuracion`, {
    method: 'POST',
    headers: {
      'apikey':        SUPABASE_KEY,
      'Authorization': `Bearer ${SB_TOKEN}`,
      'Content-Type':  'application/json',
      'Prefer':        'resolution=merge-duplicates,return=minimal',
    },
    body: JSON.stringify(datos),
  });
  if (!r.ok) { const e = await r.text(); console.error('setConfigSistemasAMX error:', e); throw new Error(e); }
}

async function getConfigWebcom() {
  try {
    const rows = await SB.getAll('configuracion', SB_TOKEN);
    const cfg  = rows.find(r => r.id === 'global');
    if (!cfg) return {};
    // Fecha Desde: webcom_fecha_desde de Supabase tiene prioridad absoluta
    // Si no está seteado, usar última importación exitosa o 01/07/2026
    const ultimaImport = cfg.webcom_ultima_importacion || '';
    const fechaDesde = cfg.webcom_fecha_desde
      || (ultimaImport ? ultimaImport.slice(0,10) : '2026-07-01');
    const fechaHasta = new Date().toISOString().slice(0,10); // siempre hoy
    return {
      email:             cfg.webcom_email             || '',
      password:          cfg.webcom_password          || '',
      repo:              cfg.webcom_repo              || '',
      ghToken:           cfg.webcom_gh_token          || '',
      jsonUrl:           cfg.webcom_json_url          || '',
      ultimaImportacion: ultimaImport,
      fechaDesde,
      fechaHasta,
      cookiesResumen:    cfg.webcom_cookies_resumen
        ? JSON.parse(cfg.webcom_cookies_resumen)
        : null,
    };
  } catch { return {}; }
}

async function renderResumenWebcom(cfgW) {
  const jsonUrl = cfgW?.jsonUrl;
  if (!jsonUrl) {
    return '<p style="font-size:13px;color:var(--gris-500)">Configurá la URL del resumen JSON para ver el estado del bot.</p>';
  }
  try {
    // Usar API de GitHub para repos privados (evita CORS de raw.githubusercontent.com)
    const cfg = await getConfigSistemasAMX();
    const match = jsonUrl.match(/github\.com\/([^/]+)\/([^/]+)/);
    const ghUser = match ? match[1] : 'GestionSLA';
    const ghRepo = match ? match[2] : 'bot-webcom';
    const apiUrl = `https://api.github.com/repos/${ghUser}/${ghRepo}/contents/data/webcom_resumen.json`;
    const headers = { 'Accept': 'application/vnd.github.v3.raw' };
    if (cfg.ghToken) headers['Authorization'] = 'token ' + cfg.ghToken;

    const res = await fetch(apiUrl, { headers });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();

    const fecha    = data.actualizado ? new Date(data.actualizado).toLocaleString('es-AR') : '—';
    const inicio   = data.fecha_inicio || '—';
    const fin      = data.fecha_fin    || '—';
    const regs     = data.registros    || {};
    const errores  = data.errores      || {};
    const total    = Object.values(regs).reduce((a,b)=>a+b,0);
    const hayError = Object.keys(errores).length > 0;

    const LABELS = {
      venta_equipo: 'Venta de Equipo', terminales: 'Terminales GSM',
      solicitudes:  'Solicitudes',     solicitantes: 'Solicitantes de SDS',
      reportes:     'Reporte Activaciones', pagos: 'Pagos Asociados SDS',
    };

    return '<div style="display:flex;align-items:center;gap:10px;margin-bottom:12px">'
      + '<span style="font-size:20px">'+(hayError?'⚠️':'✅')+'</span>'
      + '<div>'
      + '<p style="font-weight:700;margin:0;font-size:13px">Última ejecución: '+fecha+'</p>'
      + '<p style="font-size:11px;color:var(--gris-500);margin:0">Rango: '+inicio+' → '+fin+' · '+total+' registros totales</p>'
      + '</div></div>'
      + '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px;margin-bottom:12px">'
      + Object.entries(regs).map(([k,n]) => {
          const err = errores[k];
          const color = err ? 'var(--acento)' : 'var(--verde)';
          const bg    = err ? '#fff1f2' : '#f0fdf4';
          return '<div style="background:'+bg+';border-radius:8px;padding:8px 12px">'
            + '<p style="font-size:10px;color:'+color+';font-weight:700;margin:0">'+( LABELS[k]||k).toUpperCase()+'</p>'
            + '<p style="font-size:20px;font-weight:800;color:'+color+';margin:0">'+(err?'❌':n)+'</p>'
            + (err?'<p style="font-size:10px;color:var(--acento);margin:0">'+err+'</p>':'')
            + '</div>';
        }).join('')
      + '</div>';
  } catch(e) {
    return '<p style="font-size:13px;color:var(--acento)">⚠️ No se pudo cargar el resumen: '+e.message+'</p>'
      + '<p style="font-size:11px;color:var(--gris-500)">Verificá que la URL del resumen JSON esté configurada correctamente.</p>';
  }
}

async function fetchWebcomJSON(nombre) {
  // Lee un JSON del repo privado del bot Webcom usando la API de GitHub (soporta repos privados)
  const cfgW = await getConfigWebcom();
  const cfg  = await getConfigSistemasAMX();
  if (!cfgW.jsonUrl) throw new Error('URL del resumen Webcom no configurada');

  // Extraer usuario y repo de la jsonUrl configurada
  // Ej: https://raw.githubusercontent.com/GestionSLA/bot-webcom/main/data/webcom_resumen.json
  const match = cfgW.jsonUrl.match(/github\.com\/([^/]+)\/([^/]+)/);
  const ghUser = match ? match[1] : 'GestionSLA';
  const ghRepo = match ? match[2] : (cfgW.repo || 'bot-webcom');

  const url = `https://api.github.com/repos/${ghUser}/${ghRepo}/contents/data/${nombre}.json`;
  const headers = { 'Accept': 'application/vnd.github.v3.raw' };
  if (cfg.ghToken) headers['Authorization'] = 'token ' + cfg.ghToken;

  const res = await fetch(url, { headers });
  if (!res.ok) throw new Error('HTTP ' + res.status + ' al leer ' + nombre);
  return await res.json();
}
