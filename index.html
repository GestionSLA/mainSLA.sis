<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistema de Gestión SLA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    /* Color principal del sistema: azul/violeta (antes rojo Claro) */
    --rojo: #4F46E5;
    --rojo-oscuro: #4338CA;
    --rojo-suave: #EEF2FF;
    /* Acento ocasional: rojo, reservado para alertas/criticidad */
    --acento: #DC2626;
    --acento-oscuro: #B91C1C;
    --acento-suave: #FEF2F2;
    --gris-900: #1E293B;
    --gris-800: #334155;
    --gris-700: #475569;
    --gris-500: #64748B;
    --gris-300: #CBD5E1;
    --gris-100: #F1F5F9;
    --blanco: #FFFFFF;
    --verde: #16A34A;
    --verde-suave: #F0FDF4;
    --amarillo: #CA8A04;
    --amarillo-suave: #FEFCE8;
    --azul: #2563EB;
    --azul-suave: #EFF6FF;
    --naranja: #7C3AED;
    --naranja-suave: #F5F3FF;
    --sombra: 0 2px 8px rgba(30,41,59,0.07);
    --sombra-md: 0 4px 16px rgba(30,41,59,0.12);
    --radio: 10px;
    --radio-sm: 6px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Nunito', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--gris-100);
    color: var(--gris-900);
    min-height: 100vh;
    font-size: 14px;
  }

  /* ── LOGIN ── */
  #login-screen {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, var(--gris-900) 0%, var(--gris-800) 60%, #3a0000 100%);
  }

  .login-card {
    background: var(--blanco);
    border-radius: 16px;
    padding: 40px 36px;
    width: 100%;
    max-width: 380px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
  }

  .login-logo {
    text-align: center;
    margin-bottom: 28px;
  }

  .login-logo .marca {
    display: inline-flex;
    align-items: center;
    gap: 10px;
  }

  .logo-circulo {
    width: 44px;
    height: 44px;
    background: var(--rojo);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-weight: 900;
    font-size: 18px;
    letter-spacing: -1px;
  }

  .login-logo h1 {
    font-size: 22px;
    font-weight: 800;
    color: var(--gris-900);
    letter-spacing: -0.5px;
  }

  .login-logo p {
    font-size: 11px;
    color: var(--gris-500);
    margin-top: 4px;
    text-align: center;
  }

  .form-group { margin-bottom: 16px; }
  .form-group label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: var(--gris-700);
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: 0.4px;
  }

  .form-group input, .form-group select, .form-group textarea {
    width: 100%;
    padding: 10px 12px;
    border: 1.5px solid var(--gris-300);
    border-radius: var(--radio-sm);
    font-size: 14px;
    color: var(--gris-900);
    background: var(--blanco);
    outline: none;
    transition: border-color 0.15s;
    font-family: inherit;
  }

  .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
    border-color: var(--rojo);
  }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 10px 18px;
    border-radius: var(--radio-sm);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    border: none;
    transition: all 0.15s;
    font-family: inherit;
    text-decoration: none;
  }

  .btn-primary {
    background: var(--rojo);
    color: white;
  }
  .btn-primary:hover { background: var(--rojo-oscuro); }

  .btn-secondary {
    background: var(--gris-100);
    color: var(--gris-700);
    border: 1.5px solid var(--gris-300);
  }
  .btn-secondary:hover { background: var(--gris-300); }

  .btn-success { background: var(--verde); color: white; }
  .btn-success:hover { background: #15803d; }

  .btn-outline {
    background: transparent;
    color: var(--rojo);
    border: 1.5px solid var(--rojo);
  }
  .btn-outline:hover { background: var(--rojo-suave); }

  .btn-full { width: 100%; }
  .btn-sm { padding: 6px 12px; font-size: 12px; }
  .btn-icon { padding: 7px; }

  .btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .error-msg {
    background: var(--rojo-suave);
    color: var(--rojo);
    border: 1px solid #fca5a5;
    border-radius: var(--radio-sm);
    padding: 10px 12px;
    font-size: 13px;
    margin-bottom: 14px;
  }

  /* ── LAYOUT PRINCIPAL ── */
  #app { display: none; height: 100vh; overflow: hidden; }

  .app-layout {
    display: flex;
    height: 100vh;
  }

  /* ── SIDEBAR ── */
  .sidebar {
    width: 240px;
    background: var(--gris-900);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
    overflow-y: auto;
  }

  .sidebar-brand {
    padding: 20px 16px 16px;
    border-bottom: 1px solid rgba(255,255,255,0.08);
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .sidebar-brand .logo-circulo {
    width: 36px;
    height: 36px;
    font-size: 15px;
    flex-shrink: 0;
  }

  .sidebar-brand-text h2 {
    color: white;
    font-size: 15px;
    font-weight: 800;
    letter-spacing: -0.3px;
  }

  .sidebar-brand-text p {
    color: rgba(255,255,255,0.4);
    font-size: 10px;
    margin-top: 1px;
  }

  .sidebar-user {
    padding: 12px 16px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .user-avatar {
    width: 30px;
    height: 30px;
    background: var(--rojo);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 12px;
    font-weight: 700;
    flex-shrink: 0;
  }

  .user-info p { color: rgba(255,255,255,0.85); font-size: 12px; font-weight: 600; }
  .user-info span { color: rgba(255,255,255,0.35); font-size: 10px; }

  .sidebar-nav { flex: 1; padding: 10px 8px; }

  .nav-section { margin-bottom: 2px; }

  .nav-section-toggle {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    padding: 10px 10px 10px 8px;
    background: none;
    border: none;
    cursor: pointer;
    color: rgba(255,255,255,0.4);
    font-size: 10.5px;
    font-weight: 800;
    letter-spacing: 1px;
    text-transform: uppercase;
    font-family: inherit;
    border-radius: 8px;
    transition: background 0.12s, color 0.12s;
  }

  .nav-section-toggle:hover {
    background: rgba(255,255,255,0.05);
    color: rgba(255,255,255,0.7);
  }

  .nav-section-toggle .chevron {
    transition: transform 0.18s ease;
    flex-shrink: 0;
  }

  .nav-section-toggle.collapsed .chevron {
    transform: rotate(-90deg);
  }

  .nav-section-body {
    display: flex;
    flex-direction: column;
    overflow: hidden;
    max-height: 600px;
    transition: max-height 0.22s ease;
  }

  .nav-section-body.collapsed {
    max-height: 0;
  }

  .nav-item {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 9px 10px;
    border-radius: 8px;
    cursor: pointer;
    color: rgba(255,255,255,0.55);
    font-size: 13px;
    font-weight: 500;
    transition: all 0.12s;
    margin-bottom: 1px;
    border: none;
    background: none;
    width: 100%;
    text-align: left;
    font-family: inherit;
  }

  .nav-item:hover {
    background: rgba(255,255,255,0.06);
    color: rgba(255,255,255,0.85);
  }

  .nav-item.active {
    background: var(--rojo);
    color: white;
  }

  .nav-item svg { width: 16px; height: 16px; flex-shrink: 0; }

  .sidebar-footer {
    padding: 12px 8px;
    border-top: 1px solid rgba(255,255,255,0.06);
  }

  /* ── CONTENIDO PRINCIPAL ── */
  .main-content {
    flex: 1;
    overflow-y: auto;
    background: var(--gris-100);
  }

  .page-header {
    background: var(--blanco);
    border-bottom: 1px solid #e5e7eb;
    padding: 16px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 10;
  }

  .page-header h1 {
    font-size: 18px;
    font-weight: 700;
    color: var(--gris-900);
  }

  .page-header p {
    font-size: 12px;
    color: var(--gris-500);
    margin-top: 2px;
  }

  .page-body { padding: 24px; }

  /* ── CARDS ── */
  .card {
    background: var(--blanco);
    border-radius: var(--radio);
    border: 1px solid #e5e7eb;
    box-shadow: var(--sombra);
  }

  .card-header {
    padding: 16px 20px;
    border-bottom: 1px solid #f0f0f0;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .card-header h3 { font-size: 14px; font-weight: 700; }
  .card-body { padding: 20px; }

  /* ── ESTADÍSTICAS ── */
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 14px;
    margin-bottom: 24px;
  }

  .stat-card {
    background: var(--blanco);
    border-radius: var(--radio);
    padding: 18px 20px;
    border: 1px solid #e5e7eb;
    box-shadow: var(--sombra);
  }

  .stat-card .label {
    font-size: 11px;
    font-weight: 600;
    color: var(--gris-500);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 8px;
  }

  .stat-card .valor {
    font-size: 26px;
    font-weight: 800;
    color: var(--gris-900);
    letter-spacing: -1px;
  }

  .stat-card .sub {
    font-size: 11px;
    color: var(--gris-500);
    margin-top: 4px;
  }

  .stat-card.rojo .valor { color: var(--rojo); }
  .stat-card.verde .valor { color: var(--verde); }
  .stat-card.azul .valor { color: var(--azul); }
  .stat-card.naranja .valor { color: var(--naranja); }

  /* ── TABLAS ── */
  .tabla-wrapper {
    overflow-x: auto;
    border-radius: var(--radio);
    border: 1px solid #e5e7eb;
    background: white;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }

  thead tr {
    background: var(--gris-100);
    border-bottom: 1px solid #e5e7eb;
  }

  th {
    padding: 10px 14px;
    text-align: left;
    font-size: 11px;
    font-weight: 700;
    color: var(--gris-500);
    text-transform: uppercase;
    letter-spacing: 0.4px;
    white-space: nowrap;
  }

  td {
    padding: 10px 14px;
    border-bottom: 1px solid #f5f5f5;
    color: var(--gris-800);
  }

  tr:last-child td { border-bottom: none; }
  tr:hover td { background: var(--gris-100); }

  /* ── BADGES ── */
  .badge {
    display: inline-flex;
    align-items: center;
    padding: 3px 8px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 600;
    white-space: nowrap;
  }

  .badge-verde { background: var(--verde-suave); color: var(--verde); }
  .badge-rojo { background: var(--rojo-suave); color: var(--rojo); }
  .badge-amarillo { background: var(--amarillo-suave); color: var(--amarillo); }
  .badge-azul { background: var(--azul-suave); color: var(--azul); }
  .badge-naranja { background: var(--naranja-suave); color: var(--naranja); }
  .badge-gris { background: var(--gris-100); color: var(--gris-500); border: 1px solid var(--gris-300); }

  /* ── BÚSQUEDA ── */
  .search-bar {
    position: relative;
    max-width: 360px;
  }

  .search-bar input {
    padding-left: 34px;
  }

  .search-bar svg {
    position: absolute;
    left: 10px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--gris-500);
    width: 15px;
    height: 15px;
    pointer-events: none;
  }

  /* ── MODAL ── */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .modal {
    background: var(--blanco);
    border-radius: 14px;
    width: 100%;
    max-width: 520px;
    max-height: 90vh;
    overflow-y: auto;
    box-shadow: var(--sombra-md);
  }

  .modal-header {
    padding: 18px 20px;
    border-bottom: 1px solid #f0f0f0;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .modal-header h3 { font-size: 15px; font-weight: 700; }
  .modal-body { padding: 20px; }
  .modal-footer {
    padding: 16px 20px;
    border-top: 1px solid #f0f0f0;
    display: flex;
    gap: 8px;
    justify-content: flex-end;
  }

  /* ── GRID FORM ── */
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .form-grid .full { grid-column: 1 / -1; }

  /* ── TOAST ── */
  #toast-container {
    position: fixed;
    top: 20px;
    right: 20px;
    z-index: 999;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .toast {
    background: var(--gris-900);
    color: white;
    padding: 12px 16px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 500;
    box-shadow: var(--sombra-md);
    display: flex;
    align-items: center;
    gap: 8px;
    animation: slideIn 0.2s ease;
    max-width: 320px;
  }

  .toast.success { background: var(--verde); }
  .toast.error { background: var(--rojo); }
  .toast.warning { background: var(--amarillo); }

  @keyframes pulse-dot {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.4; transform: scale(0.7); }
  }

  @keyframes slideIn {
    from { transform: translateX(40px); opacity: 0; }
    to { transform: translateX(0); opacity: 1; }
  }

  /* ── EMPTY STATE ── */
  .empty-state {
    text-align: center;
    padding: 48px 20px;
    color: var(--gris-500);
  }

  .empty-state svg { width: 48px; height: 48px; color: var(--gris-300); margin: 0 auto 12px; display: block; }
  .empty-state p { font-size: 14px; }

  /* ── TABS ── */
  .tabs {
    display: flex;
    gap: 2px;
    background: var(--gris-100);
    border-radius: 8px;
    padding: 3px;
    margin-bottom: 20px;
    width: fit-content;
  }

  .tab-btn {
    padding: 7px 16px;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    border: none;
    background: none;
    color: var(--gris-500);
    font-family: inherit;
    transition: all 0.12s;
  }

  .tab-btn.active {
    background: var(--blanco);
    color: var(--gris-900);
    font-weight: 600;
    box-shadow: var(--sombra);
  }

  /* ── DASHBOARD GRID ── */
  .dashboard-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }

  /* ── SEPARADOR ── */
  .divider { height: 1px; background: #f0f0f0; margin: 16px 0; }

  /* ── TOGGLE SIDEBAR MOBILE ── */
  .mobile-menu-btn {
    display: none;
    background: none;
    border: none;
    cursor: pointer;
    padding: 4px;
  }

  @media (max-width: 768px) {
    .sidebar { position: fixed; left: -240px; top: 0; height: 100%; z-index: 50; transition: left 0.25s; }
    .sidebar.open { left: 0; }
    .mobile-menu-btn { display: block; }
    .form-grid { grid-template-columns: 1fr; }
    .stats-grid { grid-template-columns: 1fr 1fr; }
    .dashboard-grid { grid-template-columns: 1fr; }
    .page-body { padding: 16px; }
  }
</style>
</head>
<body>

<!-- TOAST CONTAINER -->
<div id="toast-container"></div>

<!-- ══════════════════════════════════════════
     PANTALLA DE LOGIN
══════════════════════════════════════════ -->
<div id="login-screen">
  <div class="login-card">
    <div class="login-logo">
      <div class="marca">
        <div class="logo-circulo">GC</div>
        <div>
          <h1>Sistema de Gestión SLA</h1>
        </div>
      </div>
      <p>Sistema de Gestión — Agente Oficial Claro</p>
    </div>

    <div id="login-error" class="error-msg" style="display:none"></div>

    <div class="form-group">
      <label>Usuario</label>
      <input type="email" id="login-email" placeholder="tu@email.com" value="admin@gesticlaro.com" />
    </div>
    <div class="form-group">
      <label>Contraseña</label>
      <input type="password" id="login-pass" placeholder="••••••••" value="admin123" />
    </div>
    <button class="btn btn-primary btn-full" onclick="iniciarSesion()">Ingresar al sistema</button>

    <p style="text-align:center; font-size:11px; color:var(--gris-500); margin-top:16px;">
      Demo: admin@gesticlaro.com / admin123
    </p>
  </div>
</div>

<!-- ══════════════════════════════════════════
     APP PRINCIPAL
══════════════════════════════════════════ -->
<div id="app">
  <div class="app-layout">

    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <div class="logo-circulo">GC</div>
        <div class="sidebar-brand-text">
          <h2>Sistema de Gestión SLA</h2>
          <p>Agente Oficial Claro</p>
        </div>
      </div>

      <div class="sidebar-user">
        <div class="user-avatar" id="user-avatar">A</div>
        <div class="user-info">
          <p id="user-name">Administrador</p>
          <span id="user-role">Administrador</span>
        </div>
      </div>

      <nav class="sidebar-nav">
        <button class="nav-item active" onclick="navegar('dashboard')">
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
          Dashboard
        </button>

        <div class="nav-section">
          <button class="nav-section-toggle collapsed" onclick="toggleNavSection(this)">
            <span>Logística</span>
            <svg class="chevron" width="13" height="13" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
          </button>
          <div class="nav-section-body collapsed">
            <button class="nav-item" onclick="navegar('stock')">
              <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M20 7H4a2 2 0 00-2 2v10a2 2 0 002 2h16a2 2 0 002-2V9a2 2 0 00-2-2z"/><path d="M16 3H8l-2 4h12l-2-4z"/></svg>
              Stock
            </button>
            <button class="nav-item" onclick="navegar('remitos')">
              <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
              Remitos
            </button>
            <button class="nav-item" onclick="navegar('materiales')">
              <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 00-1-1.73l-7-4a2 2 0 00-2 0l-7 4A2 2 0 003 8v8a2 2 0 001 1.73l7 4a2 2 0 002 0l7-4A2 2 0 0021 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>
              Materiales
            </button>
          </div>
        </div>

        <div class="nav-section">
          <button class="nav-section-toggle collapsed" onclick="toggleNavSection(this)">
            <span>Administración</span>
            <svg class="chevron" width="13" height="13" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
          </button>

<script>
// ══════════════════════════════════════════
// BASE DE DATOS LOCAL (localStorage)
// ══════════════════════════════════════════

// ══════════════════════════════════════════
// SUPABASE — Configuración
// ══════════════════════════════════════════
const SUPABASE_URL = 'https://iebfyjbkmjuicrrbezbi.supabase.co';
const SUPABASE_KEY = 'sb_publishable_zi7bb1bTdazL5dwGu7-t8w_xp-MoPnl';

// Cliente liviano sin SDK — usa la REST API directamente
const SB = {
  headers(token) {
    const h = {
      'apikey': SUPABASE_KEY,
      'Content-Type': 'application/json',
      'Prefer': 'return=representation',
    };
    if (token) h['Authorization'] = `Bearer ${token}`;
    return h;
  },

  async getAll(tabla, token) {
    const r = await fetch(`${SUPABASE_URL}/rest/v1/${tabla}?select=*`, {
      headers: this.headers(token),
    });
    if (!r.ok) { console.error('SB.getAll error', tabla, await r.text()); return []; }
    return r.json();
  },

  async insert(tabla, data, token) {
    const body = Array.isArray(data) ? data : [data];
    const r = await fetch(`${SUPABASE_URL}/rest/v1/${tabla}`, {
      method: 'POST',
      headers: this.headers(token),
      body: JSON.stringify(body),
    });
    if (!r.ok) { console.error('SB.insert error', tabla, await r.text()); return null; }
    const res = await r.json();
    return Array.isArray(data) ? res : res[0];
  },

  async update(tabla, id, data, token) {
    const r = await fetch(`${SUPABASE_URL}/rest/v1/${tabla}?id=eq.${id}`, {
      method: 'PATCH',
      headers: this.headers(token),
      body: JSON.stringify(data),
    });
    if (!r.ok) { console.error('SB.update error', tabla, await r.text()); return null; }
    const res = await r.json();
    return res[0];
  },

  async delete(tabla, id, token) {
    const r = await fetch(`${SUPABASE_URL}/rest/v1/${tabla}?id=eq.${id}`, {
      method: 'DELETE',
      headers: { ...this.headers(token), 'Prefer': '' },
    });
    return r.ok;
  },

  async upsertAll(tabla, rows, token) {
    // Borra todo y reinsertar (para tablas SAP que se reemplazan completas)
    await fetch(`${SUPABASE_URL}/rest/v1/${tabla}?id=neq.00000000-0000-0000-0000-000000000000`, {
      method: 'DELETE',
      headers: { ...this.headers(token), 'Prefer': '' },
    });
    if (!rows.length) return;
    const r = await fetch(`${SUPABASE_URL}/rest/v1/${tabla}`, {
      method: 'POST',
      headers: { ...this.headers(token), 'Prefer': 'return=minimal' },
      body: JSON.stringify(rows),
    });
    if (!r.ok) console.error('SB.upsertAll error', tabla, await r.text());
  },

  async login(email, password) {
    const r = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`, {
      method: 'POST',
      headers: { 'apikey': SUPABASE_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password }),
    });
    if (!r.ok) return null;
    return r.json(); // { access_token, user, ... }
  },

  async logout(token) {
    await fetch(`${SUPABASE_URL}/auth/v1/logout`, {
      method: 'POST',
      headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${token}` },
    });
  },
};

// Cache local en memoria para no recargar Supabase en cada operación
// (se refresca al navegar entre módulos o al hacer cambios)
const CACHE = {};

// Mapeo de claves del sistema a nombres de tablas en Supabase
const TABLA_MAP = {
  'dispositivos':          'dispositivos',
  'remitos':               'remitos',
  'puntos_venta':          'puntos_venta',
  'usuarios':              'usuarios',
  'cuentas_corrientes':    'cuentas_corrientes',
  'legajos':               'legajos',
  'materiales':            'materiales',
  'vendedores':            'vendedores',
  'planes_promociones':    'planes_promociones',
  'stock_sap_conciliado':  'stock_sap_conciliado',
  'equipos_sap_transito':  'equipos_sap_transito',
  'inventario_sap':        'stock_sap_conciliado', // alias
};

async function dbGet(tabla) {
  const t = TABLA_MAP[tabla] || tabla;
  if (CACHE[tabla]) return CACHE[tabla];
  const data = await SB.getAll(t, SB_TOKEN);
  CACHE[tabla] = data;
  return data;
}

function dbInvalidate(tabla) {
  delete CACHE[tabla];
}

// Upsert de un registro individual (crea o actualiza por id)
async function sbUpsert(tabla, registro) {
  if (!SB_TOKEN) return null;
  const t = TABLA_MAP[tabla] || tabla;
  const r = await fetch(`${SUPABASE_URL}/rest/v1/${t}`, {
    method: 'POST',
    headers: {
      'apikey': SUPABASE_KEY,
      'Authorization': `Bearer ${SB_TOKEN}`,
      'Content-Type': 'application/json',
      'Prefer': 'resolution=merge-duplicates,return=representation',
    },
    body: JSON.stringify(registro),
  });
  if (!r.ok) { const e = await r.text(); console.error('sbUpsert error', tabla, e); throw new Error(e); }
  const res = await r.json();
  return Array.isArray(res) ? res[0] : res;
}

// Upsert de múltiples registros (en chunks de 200)
async function sbUpsertMany(tabla, registros) {
  if (!SB_TOKEN || !registros.length) return;
  const t = TABLA_MAP[tabla] || tabla;
  const CHUNK = 200;
  for (let i = 0; i < registros.length; i += CHUNK) {
    const chunk = registros.slice(i, i + CHUNK);
    const r = await fetch(`${SUPABASE_URL}/rest/v1/${t}`, {
      method: 'POST',
      headers: {
        'apikey': SUPABASE_KEY,
        'Authorization': `Bearer ${SB_TOKEN}`,
        'Content-Type': 'application/json',
        'Prefer': 'resolution=merge-duplicates,return=minimal',
      },
      body: JSON.stringify(chunk),
    });
    if (!r.ok) { const e = await r.text(); console.error('sbUpsertMany error', tabla, e); throw new Error(e); }
  }
}

const DB = {
  get(key) {
    return CACHE[key] || [];
  },
  set(key, val) {
    CACHE[key] = val;
    // Sincroniza en background usando upsert por registro (no DELETE+INSERT)
    if (TABLA_MAP[key] && SB_TOKEN) {
      sbUpsertMany(key, val).catch(e => console.error('DB.set sync error', key, e.message));
    }
  },
  genId() {
    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
      const r = Math.random() * 16 | 0;
      return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
    });
  },
};

// Carga las tablas principales desde Supabase al iniciar sesión
// Indicador flotante de sincronización
function mostrarIndicadorSync(msg, tipo = 'loading') {
  let el = document.getElementById('sync-indicator');
  if (!el) {
    el = document.createElement('div');
    el.id = 'sync-indicator';
    el.style.cssText = `
      position:fixed;bottom:20px;right:20px;z-index:9999;
      background:#1E293B;color:white;border-radius:10px;
      padding:10px 16px;font-size:13px;font-family:Nunito,sans-serif;
      display:flex;align-items:center;gap:10px;
      box-shadow:0 4px 20px rgba(0,0,0,0.3);
      transition:opacity .3s;
    `;
    document.body.appendChild(el);
  }
  const icons = { loading: '⏳', ok: '✅', error: '❌' };
  el.innerHTML = `<span>${icons[tipo] || '⏳'}</span><span>${msg}</span>`;
  el.style.opacity = '1';
  el.style.display = 'flex';
  if (tipo !== 'loading') {
    setTimeout(() => {
      el.style.opacity = '0';
      setTimeout(() => { el.style.display = 'none'; }, 300);
    }, 2500);
  }
}

function ocultarIndicadorSync() {
  const el = document.getElementById('sync-indicator');
  if (el) { el.style.opacity = '0'; setTimeout(() => { el.style.display = 'none'; }, 300); }
}

async function cargarDatosIniciales() {
  const tablasACargar = ['puntos_venta','dispositivos','remitos','materiales',
    'usuarios','cuentas_corrientes','legajos','stock_sap_conciliado','equipos_sap_transito',
    'vendedores','planes_promociones'];
  mostrarIndicadorSync('Sincronizando datos con Supabase...');
  try {
    await Promise.all(tablasACargar.map(t => dbGet(t).catch(() => { CACHE[t] = []; })));
    mostrarIndicadorSync(`Datos listos (${(CACHE['dispositivos']||[]).length} equipos, ${(CACHE['remitos']||[]).length} remitos)`, 'ok');
  } catch(e) {
    mostrarIndicadorSync('Error al sincronizar datos', 'error');
  }
}

// Refresca datos desde Supabase sin cerrar sesión
async function refrescarDatos() {
  const tablasACargar = ['puntos_venta','dispositivos','remitos','materiales',
    'usuarios','cuentas_corrientes','legajos','stock_sap_conciliado','equipos_sap_transito',
    'vendedores','planes_promociones'];
  tablasACargar.forEach(t => dbInvalidate(t));
  await cargarDatosIniciales();
  // Recargar la vista actual
  const titulo = document.getElementById('page-title')?.textContent;
  const paginaKey = Object.keys(PAGINAS).find(k => PAGINAS[k]?.titulo === titulo);
  if (paginaKey) navegar(paginaKey);
}


// Token de sesión activo (se setea al hacer login)
let SB_TOKEN = null;
let usuarioActual = null;

// ══════════════════════════════════════════
// AUTH — Supabase Auth
// ══════════════════════════════════════════

async function iniciarSesion() {
  const email = document.getElementById('login-email').value.trim().toLowerCase();
  const pass  = document.getElementById('login-pass').value;
  const err   = document.getElementById('login-error');
  const btn   = document.querySelector('#login-screen .btn-primary');

  if (!email || !pass) { mostrarErrorLogin('Completá email y contraseña.'); return; }

  // Mostrar pantalla de "buscando usuario"
  err.style.background  = 'var(--azul-suave)';
  err.style.color       = 'var(--azul)';
  err.style.border      = '1px solid var(--azul)';
  err.style.borderRadius= '6px';
  err.style.padding     = '8px 12px';
  err.textContent = '🔍 Verificando credenciales...';
  err.style.display = 'block';
  if (btn) { btn.disabled = true; btn.textContent = 'Verificando...'; }

  try {
    // 1. Login con credenciales maestras para obtener token de Supabase
    //    (estas credenciales son internas, nunca se muestran al usuario)
    const MASTER_EMAIL = 'producto@usbsrl.com.ar';
    const MASTER_PASS  = 'Moreno3527';
    const session = await SB.login(MASTER_EMAIL, MASTER_PASS);

    if (!session || !session.access_token) {
      mostrarErrorLogin('Error de conexión con el servidor. Intentá de nuevo.');
      if (btn) { btn.disabled = false; btn.textContent = 'Ingresar al sistema'; }
      return;
    }

    SB_TOKEN = session.access_token;

    // 2. Buscar el usuario en la tabla usuarios
    const todos = await SB.getAll('usuarios', SB_TOKEN);
    const usuario = todos.find(u =>
      u.correo?.toLowerCase() === email && u.activo !== false
    );

    if (!usuario) {
      mostrarErrorLogin('Usuario no encontrado. Verificá el email ingresado.');
      SB_TOKEN = null;
      if (btn) { btn.disabled = false; btn.textContent = 'Ingresar al sistema'; }
      return;
    }

    // 3. Verificar contraseña
    if (usuario.pass !== pass) {
      mostrarErrorLogin('Contraseña incorrecta.');
      SB_TOKEN = null;
      if (btn) { btn.disabled = false; btn.textContent = 'Ingresar al sistema'; }
      return;
    }

    // 4. Login exitoso
    usuarioActual = {
      id:     usuario.id,
      nombre: usuario.nombre || email.split('@')[0],
      correo: email,
      rol:    usuario.rol || 'Operador',
    };

    err.style.display = 'none';
    mostrarCargando('Cargando datos...');
    await cargarDatosIniciales();

    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    document.getElementById('user-name').textContent  = usuarioActual.nombre;
    document.getElementById('user-role').textContent  = usuarioActual.rol;
    document.getElementById('user-avatar').textContent= usuarioActual.nombre[0].toUpperCase();
    document.getElementById('header-fecha').textContent = new Date().toLocaleDateString('es-AR',
      { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
    iniciarRealtime();
    navegar('dashboard');

  } catch(e) {
    mostrarErrorLogin('Error de conexión: ' + e.message);
    SB_TOKEN = null;
    if (btn) { btn.disabled = false; btn.textContent = 'Ingresar al sistema'; }
  }
}

function mostrarErrorLogin(msg) {
  const err = document.getElementById('login-error');
  if (!err) return;
  err.style.background   = 'var(--acento-suave)';
  err.style.color        = 'var(--acento)';
  err.style.border       = '1px solid var(--acento)';
  err.style.borderRadius = '6px';
  err.style.padding      = '8px 12px';
  err.textContent = msg;
  err.style.display = 'block';
  const btn = document.querySelector('#login-screen .btn-primary');
  if (btn) { btn.disabled = false; btn.textContent = 'Ingresar al sistema'; }
}

function mostrarCargando(msg) {
  const el = document.getElementById('login-error');
  if (el) { el.textContent = msg; el.style.display = 'block'; el.style.color = 'var(--azul)'; el.style.background = 'var(--azul-suave)'; el.style.border = '1px solid var(--azul)'; }
}

async function cerrarSesion() {
  detenerRealtime();
  if (SB_TOKEN) await SB.logout(SB_TOKEN);
  SB_TOKEN = null;
  usuarioActual = null;
  Object.keys(CACHE).forEach(k => delete CACHE[k]);
  document.getElementById('app').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';
  const el = document.getElementById('login-error');
  if (el) { el.style.color = ''; el.style.background = ''; el.style.border = ''; el.style.display = 'none'; }
}

document.getElementById('login-pass').addEventListener('keydown', e => { if (e.key === 'Enter') iniciarSesion(); });

const PAGINAS = {
  dashboard:     { titulo: 'Dashboard',              sub: 'Resumen general del sistema' },
  stock:         { titulo: 'Stock',                  sub: 'Equipos y SIMs disponibles' },
  remitos:       { titulo: 'Remitos',                sub: 'Ingresos, transferencias e historial' },
  materiales:    { titulo: 'Materiales',              sub: 'Catálogo de modelos y precios' },
  cuentas:       { titulo: 'Cuentas Corrientes',     sub: 'Movimientos por punto de venta' },
  legajos:       { titulo: 'Legajos / SDS',          sub: 'Ventas registradas' },
  vendedores:    { titulo: 'Vendedores',              sub: 'Registro de vendedores y su punto de venta' },
  planes:        { titulo: 'Planes y Promociones',   sub: 'Códigos SPN y planes de Claro AMX' },
  'puntos-venta':{ titulo: 'Puntos de Venta',        sub: 'Gestión de sucursales' },
  usuarios:      { titulo: 'Usuarios',               sub: 'Control de acceso' },
  comodatos:     { titulo: 'Sincronización — Vencimientos', sub: 'Control de días en consignación Claro AMX' },
  conciliacion:  { titulo: 'Conciliación SAP',       sub: 'Comparar stock propio vs inventario Claro' },
  sistemas:      { titulo: 'Configuración Sistemas AMX', sub: 'Credenciales y parámetros de conexión con Claro' },
};

function navegar(pagina) {
  // Detener polling del bot si salimos de conciliacion
  if (pagina !== 'conciliacion' && botPollingInterval) {
    clearInterval(botPollingInterval);
    botPollingInterval = null;
  }

  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
  let itemActivo = null;
  document.querySelectorAll('.nav-item').forEach(el => {
    if (el.getAttribute('onclick') === `navegar('${pagina}')`) { el.classList.add('active'); itemActivo = el; }
  });

  // Si el item activo está dentro de una sección colapsada, la expandimos
  if (itemActivo) {
    const seccion = itemActivo.closest('.nav-section');
    if (seccion) {
      seccion.querySelector('.nav-section-body')?.classList.remove('collapsed');
      seccion.querySelector('.nav-section-toggle')?.classList.remove('collapsed');
    }
  }

  const info = PAGINAS[pagina] || { titulo: pagina, sub: '' };
  document.getElementById('page-title').textContent = info.titulo;
  document.getElementById('page-subtitle').textContent = info.sub;

  const content = document.getElementById('page-content');
  switch (pagina) {
    case 'dashboard':
      content.innerHTML = renderDashboard();
      break;
    case 'stock':
      content.innerHTML = '<div style="padding:32px;text-align:center;color:var(--gris-500)">Cargando...</div>';
      Promise.all([dbGet('dispositivos'),dbGet('puntos_venta'),dbGet('stock_sap_conciliado'),dbGet('equipos_sap_transito')]).then(() => { content.innerHTML = renderStock(); });
      break;
    case 'remitos':
      content.innerHTML = '<div style="padding:32px;text-align:center;color:var(--gris-500)">Cargando...</div>';
      Promise.all([dbGet('remitos'),dbGet('puntos_venta'),dbGet('dispositivos'),dbGet('materiales')]).then(() => { remitosVista = 'menu'; content.innerHTML = renderRemitos(); });
      break;
    case 'materiales':
      content.innerHTML = '<div style="padding:32px;text-align:center;color:var(--gris-500)">Cargando...</div>';
      dbGet('materiales').then(() => { content.innerHTML = renderMateriales(); });
      break;
    case 'cuentas':
      content.innerHTML = '<div style="padding:32px;text-align:center;color:var(--gris-500)">Cargando...</div>';
      Promise.all([dbGet('cuentas_corrientes'),dbGet('puntos_venta')]).then(() => { content.innerHTML = renderCuentas(); });
      break;
    case 'legajos':
      content.innerHTML = '<div style="padding:32px;text-align:center;color:var(--gris-500)">Cargando...</div>';
      Promise.all([dbGet('legajos'),dbGet('puntos_venta'),dbGet('dispositivos'),dbGet('vendedores'),dbGet('materiales'),dbGet('planes_promociones')]).then(() => {
        content.innerHTML = renderLegajos();
      });
      break;
    case 'vendedores':
      content.innerHTML = '<div style="padding:32px;text-align:center;color:var(--gris-500)">Cargando...</div>';
      Promise.all([dbGet('vendedores'), dbGet('puntos_venta')]).then(() => { content.innerHTML = renderVendedores(); });
      break;
    case 'planes':
      content.innerHTML = '<div style="padding:32px;text-align:center;color:var(--gris-500)">Cargando...</div>';
      dbGet('planes_promociones').then(() => { content.innerHTML = renderPlanes(); });
      break;
    case 'usuarios':
      content.innerHTML = '<div style="padding:32px;text-align:center;color:var(--gris-500)">Cargando...</div>';
      dbGet('usuarios').then(() => { content.innerHTML = renderUsuarios(); });
      break;
    case 'control-sds':
      content.innerHTML = '<div style="padding:32px;text-align:center;color:var(--gris-500)">Cargando...</div>';
      Promise.all([dbGet('legajos'), dbGet('dispositivos'), dbGet('puntos_venta'), dbGet('materiales')]).then(() => {
        content.innerHTML = renderControlSDS();
      });
      break;
    case 'comodatos':
      content.innerHTML = '<div style="padding:32px;text-align:center;color:var(--gris-500)">Cargando...</div>';
      Promise.all([dbGet('dispositivos'),dbGet('puntos_venta')]).then(() => { content.innerHTML = renderComodatos(); });
      break;
    case 'conciliacion':
      content.innerHTML = renderConciliacion();
      getConfigSistemasAMX().then(cfg => {
        if (cfg.ghUser && cfg.ghRepo && cfg.ghToken) {
          actualizarProgresoBotEnVivo(cfg);
          if (botPollingInterval) clearInterval(botPollingInterval);
          botPollingInterval = setInterval(() => actualizarProgresoBotEnVivo(cfg), 8000);
        } else {
          const logEl = document.getElementById('bot-log-vivo');
          if (logEl) logEl.textContent = 'Configurá GitHub en Configuración → Sistemas AMX para ver el estado del bot.';
        }
      });
      break;
    case 'sistemas':
      content.innerHTML = '<div style="padding:32px;text-align:center;color:var(--gris-500)">Cargando configuración desde Supabase...</div>';
      renderSistemas().then(html => { content.innerHTML = html; });
      break;
    case 'puntos-venta':
      content.innerHTML = '<div style="padding:32px;text-align:center;color:var(--gris-500)">Cargando...</div>';
      dbGet('puntos_venta').then(() => { content.innerHTML = renderPuntosVenta(); });
      break;
    default: content.innerHTML = `<div class="empty-state"><p>Módulo en construcción</p></div>`;
  }

  // Cerrar sidebar en mobile
  document.getElementById('sidebar').classList.remove('open');
}

function toggleNavSection(btn) {
  const seccion = btn.closest('.nav-section');
  const body = seccion.querySelector('.nav-section-body');
  btn.classList.toggle('collapsed');
  body.classList.toggle('collapsed');
}

function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
}

function toast(msg, tipo = 'success') {
  const c = document.getElementById('toast-container');
  const t = document.createElement('div');
  t.className = `toast ${tipo}`;
  t.innerHTML = `<span>${msg}</span>`;
  c.appendChild(t);
  setTimeout(() => t.remove(), 3000);
}

function renderDashboard() {
  const dispositivos = DB.get('dispositivos');
  const disponibles = dispositivos.filter(d => d.estado === 'disponible').length;
  const vendidos = dispositivos.filter(d => d.estado === 'vendido').length;
  const remitos = DB.get('remitos');
  const cuentas = DB.get('cuentas_corrientes');
  const totalHaber = cuentas.filter(c => c.tipo === 'haber').reduce((a, c) => a + c.importe, 0);
  const pvs = DB.get('puntos_venta').filter(p => !p.es_deposito);

  return `
    <div class="stats-grid">
      <div class="stat-card verde">
        <div class="label">Equipos Disponibles</div>
        <div class="valor">${disponibles}</div>
        <div class="sub">En todos los puntos de venta</div>
      </div>
      <div class="stat-card rojo">
        <div class="label">Equipos Vendidos</div>
        <div class="valor">${vendidos}</div>
        <div class="sub">Total histórico</div>
      </div>
      <div class="stat-card azul">
        <div class="label">Remitos Registrados</div>
        <div class="valor">${remitos.length}</div>
        <div class="sub">Ingresos procesados</div>
      </div>
      <div class="stat-card naranja">
        <div class="label">Total Facturado</div>
        <div class="valor">$${(totalHaber/1000).toFixed(0)}K</div>
        <div class="sub">Suma de haberes</div>
      </div>
    </div>

    <div class="dashboard-grid">
      <div class="card">
        <div class="card-header">
          <h3>Stock por Punto de Venta</h3>
          <button class="btn btn-sm btn-secondary" onclick="navegar('stock')">Ver todo</button>
        </div>
        <div class="card-body" style="padding:0">
          <table>
            <thead><tr><th>Punto de Venta</th><th>Disponibles</th><th>Vendidos</th><th>Reservados</th></tr></thead>
            <tbody>
              ${pvs.map(pv => {
                const disps = dispositivos.filter(d => d.punto_venta_id === pv.id);
                const disp = disps.filter(d => d.estado === 'disponible').length;
                const vend = disps.filter(d => d.estado === 'vendido').length;
                const res = disps.filter(d => d.estado === 'reservado').length;
                return `<tr>
                  <td><strong>${pv.nombre}</strong></td>
                  <td><span class="badge badge-verde">${disp}</span></td>
                  <td><span class="badge badge-gris">${vend}</span></td>
                  <td><span class="badge badge-amarillo">${res}</span></td>
                </tr>`;
              }).join('')}
            </tbody>
          </table>
        </div>
      </div>

      <div class="card">
        <div class="card-header">
          <h3>Últimos Remitos</h3>
          <button class="btn btn-sm btn-secondary" onclick="navegar('remitos')">Ver todo</button>
        </div>
        <div class="card-body" style="padding:0">
          <table>
            <thead><tr><th>Remito</th><th>PV</th><th>Items</th><th>Fecha</th></tr></thead>
            <tbody>
              ${remitos.slice(-5).reverse().map(r => `
                <tr>
                  <td><span style="font-family:monospace;font-weight:600">${r.nro_remito}</span></td>
                  <td>${r.punto_venta_nombre}</td>
                  <td><span class="badge badge-azul">${r.cantidad_items}</span></td>
                  <td>${r.fecha}</td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      </div>

      ${(() => {
        const vends = (CACHE['vendedores'] || []).filter(v => v.total_ventas > 0);
        if (!vends.length) return '';

        // Agrupar por punto de venta
        const porPV = {};
        for (const v of vends) {
          const pvKey   = v.punto_venta_id || '_sin_pv';
          const pvNombre = v.punto_venta_nombre || v.entidad_id || 'Sin PV asignado';
          if (!porPV[pvKey]) porPV[pvKey] = { nombre: pvNombre, vendedores: [] };
          porPV[pvKey].vendedores.push(v);
        }

        // Ordenar vendedores dentro de cada PV y PVs por total
        const pvOrdenados = Object.values(porPV)
          .map(pv => ({
            ...pv,
            vendedores: pv.vendedores.sort((a,b) => (b.total_ventas||0) - (a.total_ventas||0)),
            total: pv.vendedores.reduce((s,v) => s + (v.total_ventas||0), 0),
          }))
          .sort((a,b) => b.total - a.total);

        const medallas = ['🥇','🥈','🥉','4️⃣','5️⃣'];
        const colores  = ['#6366f1','#0891b2','#16a34a','#d97706','#dc2626'];

        return `
        <div class="card">
          <div class="card-header" style="display:flex;justify-content:space-between;align-items:center">
            <h3>🏆 Ranking de Vendedores por PV</h3>
            <button class="btn btn-sm btn-secondary" onclick="navegar('vendedores')">Ver todos</button>
          </div>
          <div class="card-body" style="padding:0">
            ${pvOrdenados.map((pv, pi) => {
              const top = pv.vendedores.slice(0, 5);
              const maxV = top[0]?.total_ventas || 1;
              const color = colores[pi % colores.length];
              return `
                <div style="border-bottom:2px solid var(--gris-200)">
                  <div style="padding:8px 14px;background:var(--gris-100);display:flex;justify-content:space-between;align-items:center">
                    <span style="font-size:12px;font-weight:700;color:${color}">${pv.nombre}</span>
                    <span style="font-size:11px;color:var(--gris-500)">${pv.total} ventas · ${pv.vendedores.length} vendedor(es)</span>
                  </div>
                  ${top.map((v, i) => `
                    <div style="display:flex;align-items:center;gap:10px;padding:7px 14px;border-top:1px solid var(--gris-200)">
                      <span style="font-size:14px;min-width:22px;text-align:center">${medallas[i] || (i+1)+'.'}</span>
                      <div style="flex:1">
                        <p style="font-size:12px;font-weight:600;margin:0">${v.nombre || '—'}</p>
                        ${v.dni ? `<p style="font-size:10px;color:var(--gris-500);margin:0">DNI: ${v.dni}</p>` : ''}
                      </div>
                      <div style="text-align:right;min-width:70px">
                        <p style="font-size:12px;font-weight:700;color:${color};margin:0">${v.total_ventas} ventas</p>
                        <div style="background:var(--gris-200);border-radius:4px;height:3px;margin-top:3px">
                          <div style="background:${color};height:100%;width:${Math.round((v.total_ventas/maxV)*100)}%;border-radius:4px"></div>
                        </div>
                      </div>
                    </div>
                  `).join('')}
                </div>
              `;
            }).join('')}
          </div>
        </div>`;
      })()}
    </div>
  `;
}

function renderStock() {
  const equiposTransito = DB.get('equipos_sap_transito') || [];
  const stockConciliado = DB.get('stock_sap_conciliado') || [];
  return `
    <div class="tabs">

function switchTabStock(tab) {
  ['general','conciliado','transito'].forEach(t => {
    document.getElementById(`stock-tab-${t}`).style.display = t === tab ? 'block' : 'none';
    document.getElementById(`tab-btn-stock-${t}`).classList.toggle('active', t === tab);
  });
}

function renderStockConciliadoSAP() {
  const stock = DB.get('stock_sap_conciliado') || [];
  if (!stock.length) return `<div class="empty-state"><svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg><p>No hay stock conciliado todavía. Importalo desde Conciliación SAP.</p></div>`;

  return `
    <div style="margin-bottom:14px;display:flex;gap:10px;flex-wrap:wrap;align-items:center">
      <div class="search-bar">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="sap-conc-search" placeholder="Buscar por IMEI, material, descripción..." oninput="filtrarStockConciliado()"
          style="padding:9px 9px 9px 34px;border:1.5px solid var(--gris-300);border-radius:6px;width:280px;font-size:13px;outline:none" />
      </div>
      <select id="sap-conc-origen" onchange="filtrarStockConciliado()" style="padding:8px 12px;border:1.5px solid var(--gris-300);border-radius:6px;font-size:13px;outline:none;background:white">

        <option value="principal">Solo Stock Disponible</option>
        <option value="reingreso">Solo Reingreso</option>
      </select>
      <span style="font-size:12px;color:var(--gris-500)">${stock.length} equipos conciliados</span>
    </div>
    <div class="tabla-wrapper" id="sap-conc-tabla">
      ${tablaStockConciliado(stock)}
    </div>
  `;

function tablaStockConciliado(items) {
  if (!items.length) return `<div class="empty-state"><p>Sin resultados</p></div>`;
  return `
    <table>
      <thead>
        <tr>
          <th>IMEI / Serial</th>
          <th>Material</th>
          <th>Descripción</th>
          <th>Días</th>
          <th>Vencimiento</th>
          <th>Fecha Antig.</th>
          <th>Origen</th>
          <th style="text-align:right">Precio</th>
        </tr>
      </thead>
      <tbody>
        ${items.map(s => {
          const dias = parseInt(s.dias) || 0;
          const sem = semaforoDias(dias);
          const diasParaVencer = Math.max(0, 140 - dias);
          const origenBadge = s.origen === 'reingreso'
            ? `<span class="badge badge-naranja">Reingreso</span>`
            : `<span class="badge badge-gris">Disponible</span>`;
          return `<tr>
            <td style="font-family:monospace;font-size:11px;font-weight:700">${s.serial}</td>
            <td style="font-family:monospace;font-size:11px">${s.material}</td>
            <td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${s.texto}">${s.texto}</td>
            <td>
              <span style="font-weight:700;color:${sem.color}">${dias}d</span>
            </td>
            <td>
              <span style="display:inline-flex;align-items:center;padding:3px 8px;border-radius:20px;font-size:11px;font-weight:600;background:${sem.bg};color:${sem.color};border:1px solid ${sem.border}">
                ${sem.label}
              </span>
              <span style="font-size:10px;color:var(--gris-500);margin-left:4px">${dias < 140 ? diasParaVencer + 'd para facturar' : ''}</span>
            </td>
            <td style="font-size:11px;color:var(--gris-500)">${s.fec_antiguedad || '—'}</td>
            <td>${origenBadge}</td>
            <td style="text-align:right">$${(s.precio || 0).toLocaleString('es-AR')}</td>
          </tr>`;
        }).join('')}
      </tbody>
    </table>
  `;
}

function filtrarStockConciliado() {
  const b = (document.getElementById('sap-conc-search')?.value || '').toLowerCase();
  const origen = document.getElementById('sap-conc-origen')?.value || '';
  let items = DB.get('stock_sap_conciliado') || [];
  if (b) items = items.filter(s =>
    s.serial?.toLowerCase().includes(b) ||
    s.material?.toLowerCase().includes(b) ||
    s.texto?.toLowerCase().includes(b)
  );
  if (origen) items = items.filter(s => s.origen === origen);
  document.getElementById('sap-conc-tabla').innerHTML = tablaStockConciliado(items);
}

// ══════════════════════════════════════════
// EQUIPOS EN TRÁNSITO (SAP) — agrupados por Nro. Pedido
// ══════════════════════════════════════════

function renderEquiposTransitoSAP() {
  const equipos = DB.get('equipos_sap_transito') || [];

  if (!equipos.length) {
    return `<div class="empty-state">
      <svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
      <p>No hay equipos en tránsito todavía. Importalos desde Configuración → Conciliación SAP.</p>
    </div>`;
  }

  // Agrupar por nro_pedido
  const grupos = {};
  for (const e of equipos) {
    const key = e.nro_pedido || '(sin número de pedido)';
    if (!grupos[key]) grupos[key] = [];
    grupos[key].push(e);
  }
  const pedidos = Object.keys(grupos).sort();

  return `
    <p style="font-size:12px;color:var(--gris-500);margin-bottom:16px">
      Estos son los equipos que SAP indica como "en tránsito" (todavía no recibidos en la agencia), agrupados por número de pedido.
      Cuando lleguen físicamente, generá el remito de ingreso correspondiente — el sistema ya trae IMEI, material, descripción y precio.
    </p>
    <div style="display:flex;flex-direction:column;gap:14px">
      ${pedidos.map(pedido => {
        const items = grupos[pedido];
        const total = items.reduce((s, i) => s + (i.precio || 0), 0);
        const safeId = pedido.replace(/[^a-zA-Z0-9]/g, '_');
        return `
        <div class="card">
          <div class="card-header" style="flex-wrap:wrap;gap:8px">
            <div>
              <h3 style="font-family:monospace">📦 Pedido: ${pedido}</h3>
              <p style="font-size:11px;color:var(--gris-500);margin-top:2px">${items.length} equipo(s) · Total: $${total.toLocaleString('es-AR')}</p>
            </div>
            ${pedido !== '(sin número de pedido)' ? `<button class="btn btn-primary btn-sm" onclick="abrirModalRemitoDesdeTransito('${pedido.replace(/'/g, "\\'")}')">📥 Generar Remito de Ingreso</button>` : ''}
          </div>
          <div class="card-body" style="padding:0">
            <div class="tabla-wrapper" style="border:none;border-radius:0">
              <table>
                <thead><tr><th>IMEI / Serial</th><th>Material</th><th>Descripción</th><th style="text-align:right">Precio</th></tr></thead>
                <tbody>
                  ${items.map(i => `
                    <tr>
                      <td style="font-family:monospace;font-size:11px;font-weight:600">${i.serial}</td>
                      <td style="font-family:monospace;font-size:11px">${i.material}</td>
                      <td>${i.texto}</td>
                      <td style="text-align:right">$${(i.precio || 0).toLocaleString('es-AR')}</td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      `;
      }).join('')}
    </div>
  `;
}

function abrirModalRemitoDesdeTransito(nroPedido) {
  const equipos = (DB.get('equipos_sap_transito') || []).filter(e => e.nro_pedido === nroPedido);
  const pvs = DB.get('puntos_venta');

  const modal = document.createElement('div');
  modal.className = 'modal-overlay';
  modal.id = 'modal-remito-transito';

async function confirmarRemitoDesdeTransito(nroPedido) {
  const nroRemito = document.getElementById('trans-rem-nro').value.trim();
  const pvId = document.getElementById('trans-rem-pv').value;
  if (!nroRemito || !pvId) { toast('Completá número de remito y punto de venta', 'error'); return; }

  const pvs = await dbGet('puntos_venta');
  const pv = pvs.find(p => p.id === pvId);
  const equipos = (DB.get('equipos_sap_transito') || []).filter(e => e.nro_pedido === nroPedido);
  const hoy = new Date().toLocaleDateString('es-AR');

  const nuevosDisp = equipos.map(e => ({
    id: DB.genId(), nro_serie: e.serial, material: e.material,
    texto: e.texto, marca: detectarMarcaPorPrefijo(e.texto),
    precio: e.precio || 0, estado: 'disponible',
    punto_venta_id: pvId, punto_venta_nombre: pv?.nombre || '',
    nro_remito: nroRemito, nro_pedido: nroPedido,
    centro: e.centro || '', fecha_ingreso: hoy,
  }));

  const total = equipos.reduce((s, e) => s + (e.precio || 0), 0);

  await SB.insert('dispositivos', nuevosDisp, SB_TOKEN);
  await SB.insert('remitos', [{
    id: DB.genId(), nro_remito: nroRemito, nro_pedido: nroPedido, tipo: 'ingreso',
    punto_venta_id: pvId, punto_venta_nombre: pv?.nombre || '',
    fecha: hoy, cantidad_items: equipos.length, total, estado: 'procesado',
  }], SB_TOKEN);

  // Eliminar estos equipos de la tabla de tránsito en Supabase
  const transito = DB.get('equipos_sap_transito') || [];
  const idsEliminar = transito.filter(e => e.nro_pedido === nroPedido).map(e => e.id);
  for (const eid of idsEliminar) {
    await SB.delete('equipos_sap_transito', eid, SB_TOKEN);
  }

  dbInvalidate('dispositivos');
  dbInvalidate('remitos');
  dbInvalidate('equipos_sap_transito');

  toast(`Remito ${nroRemito} generado con ${equipos.length} equipo(s) del pedido ${nroPedido}`);
  cerrarModal('modal-remito-transito');
  navegar('stock');
}

function filtrarStock() {
  const busqueda = (document.getElementById('stock-search')?.value || '').toLowerCase();
  const estadoFiltro = document.getElementById('stock-filtro-estado')?.value || '';
  const pvFiltro = document.getElementById('stock-filtro-pv')?.value || '';

  let dispositivos = DB.get('dispositivos');
  if (busqueda) dispositivos = dispositivos.filter(d =>
    d.nro_serie?.toLowerCase().includes(busqueda) ||
    d.texto?.toLowerCase().includes(busqueda) ||
    d.nro_remito?.toLowerCase().includes(busqueda) ||
    d.marca?.toLowerCase().includes(busqueda)
  );
  if (estadoFiltro) dispositivos = dispositivos.filter(d => d.estado === estadoFiltro);
  if (pvFiltro) dispositivos = dispositivos.filter(d => d.punto_venta_id === pvFiltro);

  document.getElementById('stock-tabla').innerHTML = tablaStock(dispositivos);
}

async function guardarRemito() {
  const nro      = document.getElementById('rem-nro')?.value.trim();
  const nroPedido= document.getElementById('rem-pedido')?.value.trim() || '';
  const pvId     = document.getElementById('rem-pv')?.value;
  const pvs      = CACHE['puntos_venta'] || [];
  const pv       = pvs.find(p => p.id === pvId);

  const filasValidas = remitoManualFilas.filter(f => f.material.trim() && contarSeries(f.series) > 0);

  if (!nro || !pvId || !filasValidas.length) { toast('Completá remito, punto de venta y al menos un material con un IMEI', 'error'); return; }

  // Detectar materiales nuevos antes de guardar
  const itemsParaDetectar = filasValidas.map(f => ({ material: f.material, texto: f.material }));
  const matsNuevos = detectarMaterialesNuevos(itemsParaDetectar);
  if (matsNuevos.length) {
    mostrarAvisoMaterialesNuevos('aviso-materiales-nuevos', matsNuevos);
    toast(`⚠️ Hay ${matsNuevos.length} material(es) nuevo(s). Podés guardarlos desde el aviso amarillo.`, 'warning');
    // No bloqueamos el guardado — el usuario puede guardar igual y registrar los materiales después
  }

  const hoy = new Date().toLocaleDateString('es-AR');
  const nuevosDisp = [];
  let total = 0;
  let cantidadEquipos = 0;

  for (const f of filasValidas) {
    const mat    = buscarMaterialPorCodigo(f.material);
    const precio = mat?.precio || 0;
    const series = f.series.split('\n').map(s => s.trim()).filter(Boolean);
    for (const serie of series) {
      total += precio;
      cantidadEquipos++;
      nuevosDisp.push({
        id: DB.genId(), nro_serie: serie, material: f.material.trim(),
        texto: f.descripcion || mat?.nombre || 'Equipo ingresado', marca: mat?.marca || detectarMarcaPorPrefijo(f.descripcion || '') || '',
        precio, estado: 'disponible', punto_venta_id: pvId,
        punto_venta_nombre: pv?.nombre || '', nro_remito: nro,
        nro_pedido: nroPedido, fecha_ingreso: hoy,
      });
    }
  }

  await sbUpsertMany('dispositivos', nuevosDisp);
  await sbUpsert('remitos', {
    id: DB.genId(), nro_remito: nro, nro_pedido: nroPedido, tipo: 'ingreso',
    punto_venta_id: pvId, punto_venta_nombre: pv?.nombre || '',
    fecha: hoy, cantidad_items: cantidadEquipos, total, estado: 'procesado',
  });
  dbInvalidate('dispositivos');
  dbInvalidate('remitos');
  await Promise.all([dbGet('dispositivos'), dbGet('remitos')]);
  toast(`Remito ${nro} guardado con ${cantidadEquipos} equipo(s)`);
  irARemitos('historial');
}

async function procesarTransferencia() {
  const origenId = document.getElementById('trans-origen').value;
  const destinoId = document.getElementById('trans-destino').value;
  const series = document.getElementById('trans-series').value.split('\n').map(s => s.trim()).filter(Boolean);
  const pvs = await dbGet('puntos_venta');
  const destino = pvs.find(p => p.id === destinoId);

  if (!origenId || !destinoId || !series.length) { toast('Completá todos los campos', 'error'); return; }
  if (origenId === destinoId) { toast('El origen y destino no pueden ser iguales', 'error'); return; }

  const dispositivos = await dbGet('dispositivos');
  let transferidos = 0;
  for (const serie of series) {
    const disp = dispositivos.find(d => d.nro_serie === serie && d.punto_venta_id === origenId);
    if (disp) {
      await SB.update('dispositivos', disp.id, {
        punto_venta_id: destinoId,
        punto_venta_nombre: destino?.nombre || '',
        estado: 'disponible',
      }, SB_TOKEN);
      transferidos++;
    }
  }
  dbInvalidate('dispositivos');
  toast(`${transferidos} equipo(s) transferido(s) correctamente`);
  document.getElementById('trans-series').value = '';
}

function renderCuentas(pvSeleccionado) {
  const pvs = DB.get('puntos_venta').filter(p => !p.es_deposito);
  const movimientos = DB.get('cuentas_corrientes');

  if (pvSeleccionado) {
    const pv = pvs.find(p => p.id === pvSeleccionado);
    const movsPV = movimientos.filter(m => m.punto_venta_id === pvSeleccionado);
    const totalHaber = movsPV.filter(m => m.tipo === 'haber').reduce((a, m) => a + m.importe, 0);
    const totalDebe = movsPV.filter(m => m.tipo === 'debe').reduce((a, m) => a + m.importe, 0);
    const saldo = movsPV.length ? movsPV[movsPV.length - 1].saldo_acumulado : 0;

    return `
      <button class="btn btn-secondary" onclick="navegar('cuentas')" style="margin-bottom:16px">← Volver</button>
      <div class="stats-grid" style="grid-template-columns:repeat(3,1fr);max-width:600px">
        <div class="stat-card verde"><div class="label">Total Haber</div><div class="valor" style="font-size:20px">$${totalHaber.toLocaleString('es-AR')}</div></div>
        <div class="stat-card rojo"><div class="label">Total Debe</div><div class="valor" style="font-size:20px">$${totalDebe.toLocaleString('es-AR')}</div></div>
        <div class="stat-card azul"><div class="label">Saldo</div><div class="valor" style="font-size:20px">$${saldo.toLocaleString('es-AR')}</div></div>
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
        <h3 style="font-weight:700">${pv?.nombre} — ${movsPV.length} movimientos</h3>
        <button class="btn btn-primary btn-sm" onclick="abrirModalMovimiento('${pvSeleccionado}')">+ Movimiento</button>
      </div>
      <div class="tabla-wrapper">
        <table>
          <thead><tr><th>Fecha</th><th>Concepto</th><th>IMEI</th><th>SDS</th><th style="text-align:right;color:var(--verde)">Haber</th><th style="text-align:right;color:var(--rojo)">Debe</th><th style="text-align:right">Saldo</th></tr></thead>
          <tbody>
            ${movsPV.map(m => `
              <tr>
                <td>${m.fecha || '—'}</td>
                <td>${m.concepto}</td>
                <td style="font-family:monospace;font-size:11px">${m.imei || '—'}</td>
                <td style="font-family:monospace;font-size:11px">${m.numero_sds || '—'}</td>
                <td style="text-align:right;color:var(--verde);font-weight:600">${m.tipo === 'haber' ? '$' + m.importe.toLocaleString('es-AR') : ''}</td>
                <td style="text-align:right;color:var(--rojo);font-weight:600">${m.tipo === 'debe' ? '$' + m.importe.toLocaleString('es-AR') : ''}</td>

              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>
    `;
  }

  // Vista general por PV
  const saldosPV = {};
  for (const m of movimientos) {
    if (!saldosPV[m.punto_venta_id]) saldosPV[m.punto_venta_id] = { haber: 0, debe: 0, saldo: 0, cantidad: 0 };
    if (m.tipo === 'haber') saldosPV[m.punto_venta_id].haber += m.importe;
    if (m.tipo === 'debe') saldosPV[m.punto_venta_id].debe += m.importe;
    saldosPV[m.punto_venta_id].saldo = m.saldo_acumulado;
    saldosPV[m.punto_venta_id].cantidad++;
  }

  return `
    <div class="stats-grid" style="grid-template-columns:repeat(auto-fit,minmax(220px,1fr))">

function guardarMovimiento(pvId) {
  const tipo = document.getElementById('mov-tipo').value;
  const importe = parseFloat(document.getElementById('mov-importe').value) || 0;
  const concepto = document.getElementById('mov-concepto').value.trim();
  const imei = document.getElementById('mov-imei').value.trim();
  const sds = document.getElementById('mov-sds').value.trim();

  if (!concepto || !importe) { toast('Completá concepto e importe', 'error'); return; }

  const cuentas = DB.get('cuentas_corrientes');
  const anteriores = cuentas.filter(c => c.punto_venta_id === pvId);
  const saldoAnterior = anteriores.length ? anteriores[anteriores.length - 1].saldo_acumulado : 0;
  const pvs = DB.get('puntos_venta');
  const pv = pvs.find(p => p.id === pvId);

  cuentas.push({
    id: DB.genId(), punto_venta_id: pvId, punto_venta_nombre: pv?.nombre || '',
    tipo, concepto, importe, imei, numero_sds: sds,
    saldo_acumulado: tipo === 'haber' ? saldoAnterior + importe : saldoAnterior - importe,
    fecha: new Date().toLocaleDateString('es-AR'),
  });
  DB.set('cuentas_corrientes', cuentas);
  toast('Movimiento registrado');
  cerrarModal('modal-movimiento');
  document.getElementById('page-content').innerHTML = renderCuentas(pvId);
}

function filtrarLegajos() {
  const busq    = (document.getElementById('legajo-search')?.value || '').toLowerCase();
  const pvFil   = document.getElementById('legajo-filtro-pv')?.value || '';
  const pgFil   = document.getElementById('legajo-filtro-pago')?.value || '';
  const vendFil = document.getElementById('legajo-filtro-vendedor')?.value || '';
  const tipoFil = document.getElementById('legajo-filtro-tipo')?.value || '';
  let leg = CACHE['legajos'] || [];

  if (busq) leg = leg.filter(l =>
    l.sds_id?.toLowerCase().includes(busq)     ||
    l.numero_sds?.toLowerCase().includes(busq) ||
    l.imei?.toLowerCase().includes(busq)       ||
    l.dni?.toLowerCase().includes(busq)        ||
    l.apellido?.toLowerCase().includes(busq)   ||
    l.vendedor?.toLowerCase().includes(busq)   ||
    l.linea?.toLowerCase().includes(busq)

  if (pvFil)   leg = leg.filter(l => l.punto_venta_id === pvFil);
  if (pgFil)   leg = leg.filter(l => l.tipo_pago === pgFil);
  if (vendFil) leg = leg.filter(l => l.vendedor === vendFil);
  if (tipoFil) leg = leg.filter(l => l.tipo_sds === tipoFil);

  document.getElementById('legajos-tabla').innerHTML = tablaLegajos(leg);

// Importar desde JSON generado por el script Python
async function importarLegajosJSON(file) {
  if (!file) return;
  mostrarIndicadorSync('📂 Procesando JSON...');
  try {
    const texto   = await file.text();
    const datos   = JSON.parse(texto);
    const pvs     = CACHE['puntos_venta'] || [];
    const disps   = CACHE['dispositivos'] || [];

    const legajos = datos.map(d => {
      // Resolver punto de venta por entidad
      let pvMatch = null;
      if (d.entidad_pv) {
        pvMatch = pvs.find(p =>
          (p.entidades || []).some(e => String(e) === String(d.entidad_pv))
        );
      }

      // Marcar equipo como vendido si el IMEI existe en nuestro stock
      const dispMatch = d.imei ? disps.find(di => di.nro_serie === d.imei) : null;

      return {
        id:                DB.genId(),
        sds_id:            d.sds_id || '',
        numero_sds:        d.sds_id || '',
        dni:               d.dni || '',
        cuit:              d.cuit || '',
        apellido:          d.apellido || '',
        nombre:            d.nombre || '',
        telefono:          d.telefono || '',
        domicilio:         d.domicilio || '',
        nro_domicilio:     d.nro_domicilio || '',
        ciudad:            d.ciudad || '',
        cond_iva:          d.cond_iva || '',
        linea:             d.linea || '',
        nro_cuenta:        d.nro_cuenta || '',
        fecha_activacion:  d.fecha_activacion || '',
        imei:              d.imei || '',
        sim:               d.sim || '',
        modelo:            d.modelo || '',
        cod_producto:      d.cod_producto || '',
        agencia:           d.agencia || '',
        subagente:         d.subagente || '',
        vendedor_dni:      d.vendedor_dni || '',
        tipo_venta:        d.tipo_venta || '',
        entidad_pv:        d.entidad_pv || '',
        punto_venta_id:    pvMatch?.id || '',
        punto_venta_nombre:pvMatch?.nombre || '',
        tipo_pago:         d.tipo_pago || '',
        entidad_pago:      d.entidad_pago || '',
        forma_pago:        d.forma_pago || '',
        cuotas:            d.cuotas || '',
        importe:           d.importe || 0,
        cod_autorizacion:  d.cod_autorizacion || '',
        bill_number:       d.bill_number || '',
        estado:            d.estado || '',
        equipo_id:         dispMatch?.id || '',
        equipo_vendido:    dispMatch ? true : false,
      };
    });

    // Marcar equipos como vendidos en Supabase
    const vendidos = legajos.filter(l => l.equipo_id);
    let marcados = 0;
    for (const l of vendidos) {
      const disp = disps.find(d => d.id === l.equipo_id);
      if (disp && disp.estado !== 'vendido') {
        await sbUpsert('dispositivos', { ...disp, estado: 'vendido' });
        marcados++;
      }
    }

    // Guardar legajos en Supabase
    await sbUpsertMany('legajos', legajos);
    dbInvalidate('legajos');
    dbInvalidate('dispositivos');
    await Promise.all([dbGet('legajos'), dbGet('dispositivos')]);

    mostrarIndicadorSync(`✅ ${legajos.length} legajos importados. ${marcados} equipos marcados como vendidos.`, 'ok');
    toast(`✅ ${legajos.length} legajos importados, ${marcados} equipos vendidos`);
    navegar('legajos');

  } catch(e) {
    mostrarIndicadorSync('❌ Error al importar: ' + e.message, 'error');
    toast('Error: ' + e.message, 'error');
  }
}
