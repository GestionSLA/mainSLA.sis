      </button>`:''}
      <label style="display:flex;align-items:center;gap:6px;cursor:pointer;font-size:12px;color:var(--gris-600);margin-left:auto"
        title="Excluye SPNs marcados como 'excluir del tablero' en Planes y Promociones">
        <div onclick="_tv.excluirSPN=!_tv.excluirSPN;navegar('tablero-ventas')" style="
          width:36px;height:20px;border-radius:10px;
          background:${_tv.excluirSPN?'#7c3aed':'#cbd5e1'};
          position:relative;cursor:pointer;transition:background .2s;flex-shrink:0">
          <div style="position:absolute;top:2px;left:${_tv.excluirSPN?'18px':'2px'};width:16px;height:16px;border-radius:50%;background:white;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)"></div>
        </div>
        Excluir SPNs
      </label>
    </div>
  </div>

  <!-- COMPARAR -->
  ${_tv.modo==='comparar'&&base2?`
  <div style="background:white;border-radius:12px;border:2px solid var(--azul);padding:16px;margin-bottom:16px">
    <h3 style="margin:0 0 12px;color:var(--azul)">📊 ${labelMes(_tv.mes1)} vs ${labelMes(_tv.mes2)}</h3>
    <div style="display:flex;gap:20px;align-items:center;flex-wrap:wrap">
      <div style="text-align:center">
        <div style="font-size:11px;font-weight:700;color:var(--azul);text-transform:uppercase">${labelMes(_tv.mes1)}</div>
        <div style="font-size:48px;font-weight:900;line-height:1">${totalOp}</div>
      </div>
      <div style="font-size:28px;font-weight:800;color:${delta>=0?'var(--verde)':'var(--acento)'};text-align:center">
        ${delta>=0?'▲':'▼'} ${Math.abs(delta||0)}
      </div>
      <div style="text-align:center">
        <div style="font-size:11px;font-weight:700;color:var(--gris-400);text-transform:uppercase">${labelMes(_tv.mes2)}</div>
        <div style="font-size:48px;font-weight:900;line-height:1;color:var(--gris-400)">${base2.length}</div>
      </div>
      <div>
        <div style="font-size:11px;color:var(--gris-400)">Efectivo</div>
        <div style="display:flex;gap:8px;align-items:center">
          <span style="font-weight:700;color:var(--verde)">$${totalEfect.toLocaleString('es-AR',{minimumFractionDigits:0})}</span>
          <span style="color:var(--gris-400)">vs $${totalEfect2.toLocaleString('es-AR',{minimumFractionDigits:0})}</span>
        </div>
      </div>
    </div>
  </div>`:`
  <!-- KPIs -->
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:16px">
    <div style="background:linear-gradient(135deg,#6366f1,#7c3aed);border-radius:12px;padding:16px;color:white;cursor:pointer"
      onclick="abrirDetalleTV('ops')">
      <div style="font-size:11px;opacity:.8;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px">Total Operaciones</div>
      <div style="font-size:40px;font-weight:900;line-height:1">${totalOp}</div>
      <div style="font-size:11px;opacity:.7;margin-top:4px">${opTipos.portabilidad||0} port. · ${opTipos.linea_nueva||0} nuevas · ${opTipos.venta||0} ventas</div>
    </div>
    <div style="background:linear-gradient(135deg,#16a34a,#059669);border-radius:12px;padding:16px;color:white;cursor:pointer"
      onclick="abrirDetalleTV('efect')">
      <div style="font-size:11px;opacity:.8;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px">Efectivo</div>
      <div style="font-size:28px;font-weight:900;line-height:1">$${(totalEfect/1000).toFixed(0)}K</div>
      <div style="font-size:11px;opacity:.7;margin-top:4px">${opConEfect} operaciones en efectivo</div>
    </div>
    <div style="background:linear-gradient(135deg,#0891b2,#0e7490);border-radius:12px;padding:16px;color:white;cursor:pointer"
      onclick="abrirDetalleTV('equipos')">
      <div style="font-size:11px;opacity:.8;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px">Con Equipo</div>
      <div style="font-size:40px;font-weight:900;line-height:1">${conEquipo.length}</div>
      <div style="font-size:11px;opacity:.7;margin-top:4px">${totalOp?Math.round(conEquipo.length/totalOp*100):0}% del total</div>
    </div>
    <div style="background:linear-gradient(135deg,#d97706,#b45309);border-radius:12px;padding:16px;color:white">
      <div style="font-size:11px;opacity:.8;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px">Puntos de Venta</div>
      <div style="font-size:40px;font-weight:900;line-height:1">${rankPVs.length}</div>
    </div>

function abrirDetalleEntidadesTV(pvId) {
  const pvs  = CACHE['puntos_venta'] || [];
  const pv   = pvs.find(p=>p.id===pvId) || { nombre: pvId };
  const base = _tvData.base;
  const enPV = base.filter(l => l.punto_venta_id === pvId);
  const esCc = (pv.nombre||'').toLowerCase().includes('call');

  // Agrupar por entidad
  const entidades = {};
  for (const l of enPV) {
    const ent = l.entidad_pv || '_sin';
    if (!entidades[ent]) entidades[ent] = {
      id: ent, vendedor: l.vendedor||'Sin nombre', dni: l.vendedor_dni||'', total: 0, tipos: {}, legajos: []
    };
    entidades[ent].total++;
    entidades[ent].tipos[l.tipo_sds||'otro'] = (entidades[ent].tipos[l.tipo_sds||'otro']||0)+1;
    entidades[ent].legajos.push(l);
  }
  const listaEnt = Object.values(entidades).sort((a,b)=>b.total-a.total);
  const maxEnt   = listaEnt[0]?.total||1;

  const panel = document.getElementById('tablero-detalle-panel');
  if (!panel) return;

  function badgeTipo(tipo,n){const c={venta:'#6366f1',portabilidad:'#16a34a',linea_nueva:'#7c3aed',ctc:'#ea580c',otro:'#6b7280'};const l={venta:'Venta',portabilidad:'Port.',linea_nueva:'L.Nueva',ctc:'CTC',otro:'Otro'};return n>0?`<span style="background:${c[tipo]||'#888'}18;color:${c[tipo]||'#888'};border-radius:4px;padding:1px 6px;font-size:10px;font-weight:700;margin-right:2px">${l[tipo]||tipo}: ${n}</span>`:'';}
  function barraH(val,max,color,h=12){const pct=max>0?Math.max(2,Math.round((val/max)*100)):0;return `<div style="background:var(--gris-100);border-radius:4px;height:${h}px;flex:1;overflow:hidden"><div style="width:${pct}%;height:100%;background:${color};border-radius:4px"></div></div>`;}

  panel.innerHTML = '<div class="card" style="border:2px solid var(--azul)">'
    + '<div class="card-header" style="background:var(--azul-suave);display:flex;justify-content:space-between;align-items:center">'
    + '<h3 style="color:var(--azul)">🏪 ' + pv.nombre + ' — ' + enPV.length + ' operaciones · ' + listaEnt.length + ' entidad' + (listaEnt.length!==1?'es':'') + '</h3>'
    + '<button class="btn btn-sm btn-secondary" onclick="document.getElementById(\'tablero-detalle-panel\').innerHTML=\'\'">✕</button>'
    + '</div>'
    + '<div class="card-body">'
    + listaEnt.map(e => '<div style="margin-bottom:16px;padding-bottom:16px;border-bottom:1px solid var(--gris-100)">'
        + '<div style="display:flex;align-items:center;gap:10px;margin-bottom:6px">'
        + '<div style="flex:1">'
        + '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">'
        + '<div>'
        + '<span style="font-size:13px;font-weight:700">' + e.vendedor + '</span>'
        + (e.dni ? '<span style="font-size:11px;color:var(--gris-400);margin-left:6px">DNI: ' + e.dni + '</span>' : '')
        + '<span style="font-size:11px;color:var(--gris-400);margin-left:6px">Entidad: ' + e.id + '</span>'
        + '</div>'
        + '<span style="font-size:16px;font-weight:800;color:var(--azul)">' + e.total + '</span>'
        + '</div>'
        + barraH(e.total, maxEnt, '#6366f1')
        + '<div style="margin-top:4px">' + Object.entries(e.tipos).map(([t,n])=>badgeTipo(t,n)).join('') + '</div>'
        + '</div>'
        + '<button onclick="abrirDetalleEntidadLegajosTV(\'' + e.id + '\')" class="btn btn-sm btn-secondary" style="font-size:11px">Ver legajos →</button>'
        + '</div></div>'
      ).join('')
    + '</div></div>';
  panel.scrollIntoView({behavior:'smooth',block:'start'});
}

// ── Abrir detalles genéricos desde KPIs ──────────────────────────────────
function abrirDetalleTV(tipo) {
  const base    = _tvData.base;
  const panel   = document.getElementById('tablero-detalle-panel');
  if (!panel) return;
  let lista, titulo, color;
  if (tipo === 'ops') { lista = base; titulo = 'Todas las operaciones'; color = '#6366f1'; }
  else if (tipo === 'efect') { lista = base.filter(l=>parseFloat(l.partida_importe||l.monto_eft||0)>0||(parseFloat(l.importe||0)>0&&(l.forma_pago||'').toUpperCase().includes('EFECT'))); titulo = 'Operaciones en efectivo'; color = '#16a34a'; }
  else if (tipo === 'equipos') { lista = base.filter(l=>l.imei&&l.imei!=='999999999999556'); titulo = 'Con equipo'; color = '#0891b2'; }
  else if (tipo.startsWith('tipo_')) { const t=tipo.slice(5); lista=base.filter(l=>(l.tipo_sds||'otro')===t); titulo='Tipo: '+t; color='#7c3aed'; }
  else if (tipo.startsWith('equipos_pv_')) { const pvId=tipo.slice(11); lista=base.filter(l=>l.punto_venta_id===pvId&&l.imei&&l.imei!=='999999999999556'); titulo='Equipos PV'; color='#0891b2'; }
  else if (tipo.startsWith('efect_pv_')) { const pvId=tipo.slice(9); lista=base.filter(l=>l.punto_venta_id===pvId&&(parseFloat(l.partida_importe||l.monto_eft||0)>0||(parseFloat(l.importe||0)>0&&(l.forma_pago||'').toUpperCase().includes('EFECT')))); titulo='Efectivo PV'; color='#16a34a'; }
  else { lista = base; titulo = 'Detalle'; color = '#6366f1'; }
  panel.innerHTML = '<div class="card" style="border:2px solid '+color+'">'
    + '<div class="card-header" style="display:flex;justify-content:space-between;align-items:center">'
    + '<h3 style="color:'+color+'">📋 '+titulo+' ('+lista.length+')</h3>'
    + '<button class="btn btn-sm btn-secondary" onclick="document.getElementById(\'tablero-detalle-panel\').innerHTML=\'\'">✕</button>'
    + '</div><div class="card-body" style="padding:0"><div class="tabla-wrapper">'
    + (tipo==='equipos'||tipo.startsWith('equipos_pv_') ? _tableroTablaEquipos(lista) : tipo==='efect'||tipo.startsWith('efect_pv_') ? _tableroTablaEfectivo(lista) : tableroTablaVentas(lista))
    + '</div></div></div>';
  panel.scrollIntoView({behavior:'smooth',block:'start'});
}

    +_thSort('tab-equipos','imei','IMEI')+_thSort('tab-equipos','modelo','Modelo')+_thSort('tab-equipos','marca','Marca')
    +_thSort('tab-equipos','vendedor','Vendedor')+_thSort('tab-equipos','pv','PV')+_thSort('tab-equipos','fecha','Fecha')

      +'<td>'+(() => { const t=v.tipo_sds||'otro'; const c={venta:'#6366f1',portabilidad:'#16a34a',linea_nueva:'#7c3aed',ctc:'#ea580c',otro:'#6b7280'}; const lb={venta:'🛒 Venta',portabilidad:'📞 Port.',linea_nueva:'📱 Línea Nueva',ctc:'🔄 CTC',otro:'❓ Otro'}; return '<span style="background:'+c[t]+'18;color:'+c[t]+';border-radius:4px;padding:2px 8px;font-size:11px;font-weight:700">'+lb[t]+'</span>'; })()+'</td>'
      +'<td style="font-size:12px">'+(v.vendedor||'—')+'</td>'
      +'<td style="font-size:12px">'+(v.punto_venta_nombre||'—')+'</td>'

      +'</tr>').join('')

const PEDIDO_ESTADOS = {
  nuevo:       { label: 'Pedido nuevo',    color: '#d97706', bg: '#fef3c7', emoji: '🟡' },
  procesando:  { label: 'Procesando',      color: '#7c3aed', bg: '#ede9fe', emoji: '🔄' },
  transito:    { label: 'En tránsito',     color: '#0891b2', bg: '#e0f2fe', emoji: '🔵' },
  demorado:    { label: 'Demorado',        color: '#dc2626', bg: '#fee2e2', emoji: '🔴' },
  parcial:     { label: 'Parcial',         color: '#9333ea', bg: '#ede9fe', emoji: '⚠️' },
  recibido:    { label: 'Recibido',        color: '#16a34a', bg: '#dcfce7', emoji: '✅' },
};

function renderPedidos() {
  const pedidos = CACHE['pedidos'] || DB.get('pedidos') || [];
  const pvs     = CACHE['puntos_venta'] || [];
  const hoy     = new Date();

  // Calcular estado demorado automáticamente
  const pedidosConEstado = pedidos.map(p => {
    let estado = p.estado || 'nuevo';
    if (estado === 'transito' && p.fecha_transito) {
      const ft = new Date(p.fecha_transito.split('/').reverse().join('-'));
      const dias = Math.floor((hoy - ft) / 86400000);
      if (dias >= 5) estado = 'demorado';
    }
    return { ...p, estado };
  }).sort((a, b) => {
    // Ordenar: demorado > nuevo > transito > parcial > recibido
    const orden = { demorado: 0, nuevo: 1, transito: 2, parcial: 3, recibido: 4 };
    return (orden[a.estado] ?? 5) - (orden[b.estado] ?? 5);
  });

  const activos   = pedidosConEstado.filter(p => !['recibido'].includes(p.estado));
  const recibidos = pedidosConEstado.filter(p => p.estado === 'recibido');

  // KPIs
  const kpis = Object.entries(PEDIDO_ESTADOS).map(([key, est]) => {
    const cnt = pedidosConEstado.filter(p => p.estado === key).length;
    return cnt > 0 ? `
      <div class="stat-card" style="background:${est.bg};border-color:${est.color}30;padding:10px 14px">
        <div class="label" style="color:${est.color}">${est.emoji} ${est.label}</div>
        <div class="valor" style="color:${est.color};font-size:22px">${cnt}</div>
      </div>` : '';
  }).join('');

  return `
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:10px">
      <div>
        <h2 style="font-size:18px;font-weight:700;margin:0">📦 Pedidos</h2>
        <p style="font-size:12px;color:var(--gris-500);margin:2px 0 0">${activos.length} pedido${activos.length!==1?'s':''} activo${activos.length!==1?'s':''}</p>
      </div>
      <button class="btn btn-secondary" onclick="actualizarDisponibilidadBot()">
        🤖 Actualizar Disponibilidad
      </button>
    </div>

    ${kpis ? `<div class="stats-grid" style="margin-bottom:16px">${kpis}</div>` : ''}

    ${activos.length ? `
    <div class="card" style="margin-bottom:16px">
      <div class="card-header"><h3>📋 Pedidos activos</h3></div>
      <div class="card-body" style="padding:0">
        <table>
          <thead><tr>
            <th>Fecha</th><th>Punto de Venta</th><th>Items</th>
            <th style="text-align:center">Estado</th>
            <th>Nro Pedido SAP</th>
            <th>Acciones</th>
          </tr></thead>
          <tbody>
            ${activos.map(p => {
              const est = PEDIDO_ESTADOS[p.estado] || PEDIDO_ESTADOS.nuevo;
              const items = (() => { try { return JSON.parse(p.items || '[]'); } catch { return []; } })();
              const agotados = items.filter(i => i.agotado).length;
              return `<tr>
                <td style="font-size:12px">${p.fecha_pedido || '—'}</td>
                <td style="font-weight:600">${p.punto_venta_nombre || '—'}</td>
                <td style="font-size:12px">
                  <button class="btn btn-sm btn-secondary" onclick="verItemsPedido('${p.id}')"
                    style="font-size:11px;padding:2px 8px">
                    📋 ${items.length} item${items.length!==1?'s':''}
                    ${agotados ? `<span style="color:var(--acento);margin-left:4px">(${agotados} agotado${agotados!==1?'s':''})</span>` : ''}
                  </button>
                </td>
                <td style="text-align:center">
                  <span style="background:${est.bg};color:${est.color};border:1px solid ${est.color}30;border-radius:20px;padding:3px 10px;font-size:11px;font-weight:700">
                    ${est.emoji} ${est.label}
                  </span>
                </td>
                <td>
                  ${p.nro_pedido_sap
                    ? `<span style="font-family:monospace;font-size:12px;font-weight:700;color:var(--azul)">${p.nro_pedido_sap}</span>`
                    : `<span style="font-size:11px;color:var(--gris-400)">—</span>`
                  }
                </td>
                <td>
                  <div style="display:flex;gap:4px;flex-wrap:wrap">
                    ${p.estado === 'nuevo' ? `
                    <button class="btn btn-sm btn-primary" style="background:#7c3aed;border-color:#7c3aed"
                      onclick="procesarPedido('${p.id}')" title="Procesar pedido">
                      🔄 Procesar
                    </button>` : ''}
                    <button class="btn btn-sm btn-secondary" style="color:var(--amarillo);border-color:var(--amarillo)"
                      onclick="cancelarPedido('${p.id}')" title="Cancelar pedido">🚫</button>
                    <button class="btn btn-sm btn-secondary" style="color:var(--acento);border-color:var(--acento)"
                      onclick="eliminarPedido('${p.id}')" title="Eliminar pedido">🗑️</button>
                  </div>
                </td>
              </tr>`;
            }).join('')}
          </tbody>
        </table>
      </div>
    </div>` : `
    <div class="empty-state" style="margin-bottom:16px">
      <p>No hay pedidos activos. Los pedidos aparecen aquí cuando los puntos de venta los solicitan desde PedidosSLA.</p>
    </div>`}

    ${recibidos.length ? `
    <details>
      <summary style="cursor:pointer;font-size:13px;color:var(--gris-500);padding:8px 0">
        Ver pedidos recibidos (${recibidos.length})
      </summary>
      <div class="card" style="margin-top:8px">
        <div class="card-body" style="padding:0">
          <table>
            <thead><tr><th>Fecha</th><th>PV</th><th>Items</th><th>Nro SAP</th><th>Recibido</th></tr></thead>
            <tbody>
              ${recibidos.map(p => {
                const items = (() => { try { return JSON.parse(p.items || '[]'); } catch { return []; } })();
                return `<tr>
                  <td style="font-size:12px">${p.fecha_pedido||'—'}</td>
                  <td>${p.punto_venta_nombre||'—'}</td>
                  <td style="font-size:12px">${items.length} equipos</td>
                  <td style="font-family:monospace;font-size:11px">${p.nro_pedido_sap||'—'}</td>
                  <td style="font-size:12px;color:var(--gris-500)">${p.fecha_recibido||'—'}</td>
                </tr>`;
              }).join('')}
            </tbody>
          </table>
        </div>
      </div>
    </details>` : ''}
  `;
}

async function actualizarDisponibilidadBot() {
  const cfg = await getConfigSistemasAMX();
  if (!cfg.ghToken || !cfg.ghUser || !cfg.ghRepo) {
    toast('Configurá GitHub en Sistemas AMX → Bot SAP', 'error');
    return;
  }

  const ghWorkflowUrl = 'https://api.github.com/repos/' + cfg.ghUser + '/' + cfg.ghRepo + '/actions/workflows/bot_dispo.yml/dispatches';

  // Modal de log
  const modal = document.createElement('div');
  modal.className = 'modal-overlay';
  modal.id = 'modal-dispo-bot';
  modal.innerHTML = '<div class="modal" style="max-width:480px">'
    + '<div class="modal-header" style="display:flex;justify-content:space-between;align-items:center">'
    + '<h3>🤖 Actualizando disponibilidad SAP</h3>'
    + '<button class="btn btn-icon btn-secondary" onclick="cerrarModal(\'modal-dispo-bot\')">✕</button>'
    + '</div>'
    + '<div class="modal-body">'
    + '<div id="dispo-bot-log" style="background:#0F172A;border-radius:8px;padding:12px 14px;font-family:monospace;font-size:12px;color:#94A3B8;min-height:100px;max-height:260px;overflow-y:auto;line-height:1.8">🚀 Iniciando...</div>'
    + '<p style="font-size:11px;color:var(--gris-500);margin-top:10px">El proceso corre en segundo plano — podés cerrar este modal.</p>'
    + '</div>'
    + '<div class="modal-footer">'
    + '<button class="btn btn-secondary" onclick="cerrarModal(\'modal-dispo-bot\')">Cerrar</button>'
    + '</div></div>';
  document.body.appendChild(modal);

  function logDispo(msg, color) {
    const el = document.getElementById('dispo-bot-log');
    if (el) el.innerHTML += '<br><span style="color:'+(color||'#94A3B8')+'">'+msg+'</span>';
  }

  // Marcar como "actualizando" en Supabase para que el Dashboard lo muestre
  try {
    await fetch(SUPABASE_URL + '/rest/v1/configuracion?id=eq.global', {
      method: 'PATCH',
      headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + (SB_TOKEN||SUPABASE_KEY), 'Content-Type': 'application/json', 'Prefer': 'return=minimal' },
      body: JSON.stringify({ dispo_bot_estado: 'actualizando', dispo_bot_mensaje: 'Bot corriendo...' }),
    });
  } catch(e) {}

  try {
    logDispo('📡 Disparando workflow en GitHub Actions...', '#94A3B8');

    const r = await fetch(ghWorkflowUrl, {
        method: 'POST',
        headers: {
          'Authorization': 'Bearer ' + cfg.ghToken,
          'Accept': 'application/vnd.github+json',
          'Content-Type': 'application/json',
        },
        body: JSON.stringify({ ref: 'main' }),
      }
    );

    if (r.status === 204 || r.ok) {
      logDispo('✅ Bot iniciado correctamente', '#4ADE80');
      logDispo('⏳ Tardará ~4 minutos en completarse', '#94A3B8');
      logDispo('📋 El semáforo se actualizará automáticamente al terminar', '#94A3B8');
      // Cerrar modal automáticamente a los 5 segundos
      setTimeout(() => cerrarModal('modal-dispo-bot'), 5000);
    } else {
      const err = await r.text();
      logDispo('❌ Error ' + r.status + ': ' + err.substring(0,100), '#f87171');
      logDispo('Verificá que el token tenga permiso "Actions" sobre el repo', '#f59e0b');
      // Revertir estado actualizando
      await fetch(SUPABASE_URL + '/rest/v1/configuracion?id=eq.global', {
        method: 'PATCH',
        headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + (SB_TOKEN||SUPABASE_KEY), 'Content-Type': 'application/json', 'Prefer': 'return=minimal' },
        body: JSON.stringify({ dispo_bot_estado: 'error', dispo_bot_mensaje: 'No se pudo iniciar el bot' }),
      }).catch(() => {});
    }
  } catch(e) {
    logDispo('❌ Error: ' + e.message, '#f87171');
  }
}

// ── BARRA DE NOTIFICACIONES ────────────────────────────────────────────────
const _notifState = {
  mensajes: [],      // [{texto, color, parpadea}]
  idx: 0,
  animFrame: null,
  pausaTimer: null,
  parpadeoTimer: null,
};

function notifAgregarMensaje(id, texto, color = '#94a3b8', parpadea = false) {
  // Reemplaza si ya existe el id, agrega si no
  const existe = _notifState.mensajes.findIndex(m => m.id === id);
  if (existe >= 0) {
    _notifState.mensajes[existe] = { id, texto, color, parpadea };
  } else {
    _notifState.mensajes.push({ id, texto, color, parpadea });
  }
  _notifActualizar();
}

function notifQuitarMensaje(id) {
  _notifState.mensajes = _notifState.mensajes.filter(m => m.id !== id);
  if (_notifState.idx >= _notifState.mensajes.length) _notifState.idx = 0;
  _notifActualizar();
}

function _notifActualizar() {
  const bar  = document.getElementById('notif-bar');
  const txt  = document.getElementById('notif-text');
  const dot  = document.getElementById('notif-dot');
  if (!bar || !txt || !dot) return;

  if (!_notifState.mensajes.length) {
    bar.style.display = 'none';
    _notifDetener();
    return;
  }

  bar.style.display = 'block';
  _notifMostrarActual();
}

function _notifMostrarActual() {
  const txt = document.getElementById('notif-text');
  const dot = document.getElementById('notif-dot');
  const bar = document.getElementById('notif-bar');
  if (!txt || !dot || !bar) return;

  _notifDetener();

  const msgs = _notifState.mensajes;
  if (!msgs.length) return;
  if (_notifState.idx >= msgs.length) _notifState.idx = 0;

  const msg = msgs[_notifState.idx];
  txt.textContent = msg.texto;
  txt.style.color = msg.color;
  dot.style.background = msg.color;
  bar.style.borderColor = msg.color + '40';

  // Parpadeo al inicio si corresponde
  if (msg.parpadea) {
    let visible = true;
    let count = 0;
    _notifState.parpadeoTimer = setInterval(() => {
      bar.style.opacity = visible ? '0.3' : '1';
      visible = !visible;
      count++;
      if (count >= 8) {  // 4 parpadeos = 2 segundos
        clearInterval(_notifState.parpadeoTimer);
        bar.style.opacity = '1';
        _notifScroll(msg);
      }
    }, 250);
  } else {
    _notifScroll(msg);
  }
}

function _notifScroll(msg) {
  const txt      = document.getElementById('notif-text');
  const contenedor = txt?.parentElement;
  if (!txt || !contenedor) return;

  const anchoContenedor = contenedor.offsetWidth;
  const anchoTexto      = txt.scrollWidth;
  const distancia       = anchoTexto + anchoContenedor;
  const duracionMs      = Math.max(4000, distancia * 20); // ~20ms por pixel

  // Arrancar desde la derecha
  txt.style.transition = 'none';
  txt.style.transform  = `translateX(${anchoContenedor}px)`;

  // Forzar reflow
  txt.getBoundingClientRect();

  txt.style.transition = `transform ${duracionMs}ms linear`;
  txt.style.transform  = `translateX(-${anchoTexto}px)`;

  // Al terminar el scroll → pausa 4s → siguiente mensaje
  _notifState.animFrame = setTimeout(() => {
    _notifState.pausaTimer = setTimeout(() => {
      _notifState.idx = (_notifState.idx + 1) % _notifState.mensajes.length;
      _notifMostrarActual();
    }, 4000);
  }, duracionMs);
}

function _notifDetener() {
  clearTimeout(_notifState.animFrame);
  clearTimeout(_notifState.pausaTimer);
  clearInterval(_notifState.parpadeoTimer);
  const txt = document.getElementById('notif-text');
  if (txt) { txt.style.transition = 'none'; txt.style.transform = ''; }
}

function actualizarBadgePedidos() {
  const pedidos = CACHE['pedidos'] || [];
  const nuevos  = pedidos.filter(p => p.estado === 'nuevo').length;
  const badge   = document.getElementById('badge-pedidos-nav');
  if (badge) {
    if (nuevos > 0) {
      badge.textContent = nuevos > 9 ? '9+' : String(nuevos);
      badge.style.display = 'block';
    } else {
      badge.style.display = 'none';
    }
  }
  // Actualizar barra de notificaciones
  if (nuevos > 0) {
    notifAgregarMensaje('pedidos-nuevos',
      `🛒 TENES ${nuevos} PEDIDO${nuevos !== 1 ? 'S' : ''} NUEVO${nuevos !== 1 ? 'S' : ''} SIN PROCESAR`,
      '#4ADE80', true);
  } else {
    notifQuitarMensaje('pedidos-nuevos');
  }
}

async function procesarPedido(pedidoId) {
  // Cambiar estado a "procesando" y abrir modal de detalle
  const pedidos = CACHE['pedidos'] || DB.get('pedidos') || [];
  const pedido  = pedidos.find(p => p.id === pedidoId);
  if (!pedido) return;

  // Actualizar estado en Supabase
  await sbUpsert('pedidos', { ...pedido, estado: 'procesando' });
  dbInvalidate('pedidos');
  await dbGet('pedidos');
  actualizarBadgePedidos();

  // Abrir modal de detalle para ver/marcar items
  verItemsPedido(pedidoId);

  // Refrescar tabla en segundo plano
  setTimeout(() => {
    const content = document.getElementById('main-content');
    if (content && document.querySelector('.nav-item.active')?.getAttribute('onclick')?.includes('pedidos')) {
      content.innerHTML = renderPedidos();
      actualizarBadgePedidos();
    }
  }, 500);
}

async function confirmarPedidoSAP(pedidoId) {
  const nro = (document.getElementById('modal-nro-pedido-' + pedidoId)?.value ||
               document.getElementById('nro-pedido-' + pedidoId)?.value || '').trim();
  if (!nro) { toast('Ingresá el número de pedido SAP', 'error'); return; }

  const pedidos = CACHE['pedidos'] || DB.get('pedidos') || [];
  const pedido  = pedidos.find(p => p.id === pedidoId);
  if (!pedido) return;

  const hoy = new Date().toLocaleDateString('es-AR');
  await sbUpsert('pedidos', {
    ...pedido,
    nro_pedido_sap: nro,
    estado:         'transito',
    fecha_transito: hoy,
  });

  dbInvalidate('pedidos');
  await dbGet('pedidos');
  toast('✅ Pedido confirmado — Nro SAP: ' + nro);
  actualizarBadgePedidos();
  cerrarModal('modal-items-pedido');
  navegar('pedidos');
}

async function cancelarPedido(pedidoId) {
  if (!confirm('¿Cancelar este pedido? Se marcará como cancelado pero quedará en el historial.')) return;
  const pedidos = CACHE['pedidos'] || DB.get('pedidos') || [];
  const pedido  = pedidos.find(p => p.id === pedidoId);
  if (!pedido) return;
  await sbUpsert('pedidos', { ...pedido, estado: 'cancelado' });
  dbInvalidate('pedidos');
  await dbGet('pedidos');
  toast('Pedido cancelado');
  actualizarBadgePedidos();
  cerrarModal('modal-items-pedido');
  navegar('pedidos');
}

async function eliminarPedido(pedidoId) {

async function toggleAgotado(pedidoId, itemIdx, agotado) {
  const pedidos = CACHE['pedidos'] || DB.get('pedidos') || [];
  const pedido  = pedidos.find(p => p.id === pedidoId);
  if (!pedido) return;

  const items = (() => { try { return JSON.parse(pedido.items || '[]'); } catch { return []; } })();
  items[itemIdx] = { ...items[itemIdx], agotado };

  // Actualizar en Supabase
  await sbUpsert('pedidos', { ...pedido, items: JSON.stringify(items) });
  dbInvalidate('pedidos');
  await dbGet('pedidos');

  // Actualizar la fila visualmente sin cerrar el modal
  const row = document.getElementById(`agot-${itemIdx}`)?.closest('tr');
  if (row) {
    row.style.opacity = agotado ? '.6' : '1';
    const nombre = row.querySelector('p');
    if (nombre) nombre.style.cssText = agotado
      ? 'font-size:13px;font-weight:600;margin:0;text-decoration:line-through;color:var(--gris-400)'
      : 'font-size:13px;font-weight:600;margin:0';
    const label = document.getElementById(`agot-${itemIdx}`)?.nextElementSibling;
    if (label) label.textContent = agotado ? 'Agotado' : '';
  }
  toast(agotado ? '🔴 Marcado como agotado' : '✅ Marcado como disponible');
}

// Auto-registrar/actualizar vendedores al importar SDS
async function sincronizarVendedoresDesdeImport(fichas) {
  const vendExistentes = CACHE['vendedores'] || await dbGet('vendedores');
  const pvs = CACHE['puntos_venta'] || [];

  // Índice por DNI de los existentes en la base (incluyendo aliases)
  const idxExistentes = {};
  for (const v of vendExistentes) {
    if (v.dni) idxExistentes[v.dni] = { ...v };
    const aliases = (() => { try { return JSON.parse(v.dni_aliases||'[]'); } catch { return []; } })();
    aliases.forEach(d => { if (d) idxExistentes[d] = { ...v }; });
  }

  // Contar ventas por DNI en el lote importado
  const conteoLote = {};
  for (const f of fichas) {
    const dni = f.vendedor_dni || '';
    if (!dni || !f.vendedor) continue;
    if (!conteoLote[dni]) {
      // Detectar PV: primero por entidad_pv (entidad hija), luego por punto_venta_id ya calculado
      const pvMatch = pvs.find(p => (p.entidades||[]).some(e => String(e) === String(f.entidad_pv||'')))
        || pvs.find(p => p.id === f.punto_venta_id);
      conteoLote[dni] = {
        nombre:             f.vendedor || '',
        dni,
        entidad_id:         f.entidad_pv || '',
        punto_venta_id:     pvMatch?.id || f.punto_venta_id || '',
        punto_venta_nombre: pvMatch?.nombre || f.punto_venta_nombre || '',
        agente:             f.agencia || '',
        store:              f.store || '',
        count:              0,
      };
    }
    conteoLote[dni].count++;
  }

  const nuevos      = [];
  const actualizados = [];

  for (const [dni, datos] of Object.entries(conteoLote)) {
    if (idxExistentes[dni]) {
      // Existente: actualizar total_ventas sumando el conteo del lote
      // y completar PV si faltaba
      const existente = idxExistentes[dni];
      const pvActual  = existente.punto_venta_id || datos.punto_venta_id;
      const pvNombre  = existente.punto_venta_nombre || datos.punto_venta_nombre;
      actualizados.push({
        ...existente,
        total_ventas:       (existente.total_ventas || 0) + datos.count,
        punto_venta_id:     pvActual,
        punto_venta_nombre: pvNombre,
        // Completar nombre si faltaba
        nombre: existente.nombre || datos.nombre,
      });
    } else {
      // Nuevo vendedor
      nuevos.push({
        id:                 DB.genId(),
        nombre:             datos.nombre,
        dni,
        entidad_id:         datos.entidad_id,
        punto_venta_id:     datos.punto_venta_id,
        punto_venta_nombre: datos.punto_venta_nombre,
        agente:             datos.agente,
        store:              datos.store,
        total_ventas:       datos.count,
      });
    }
  }

  const LOTE = 50;
  if (nuevos.length) {
    for (let i = 0; i < nuevos.length; i += LOTE)
      await sbUpsertMany('vendedores', nuevos.slice(i, i+LOTE));
  }
  if (actualizados.length) {
    for (let i = 0; i < actualizados.length; i += LOTE)
      await sbUpsertMany('vendedores', actualizados.slice(i, i+LOTE));
  }
  dbInvalidate('vendedores');
  return { nuevos: nuevos.length, actualizados: actualizados.length };
}

              <option value="true"  ${p?.requiere_imei===true ?'selected':''}>✅ Sí requiere equipo</option>
            </select>
          </div></div>
          <input type="hidden" id="plan-excluir" value="${p?.excluir_del_tablero===true?'true':'false'}" />
          ${p ? `<div class="full" style="font-size:11px;color:var(--gris-500);margin-top:-6px">
            💡 Para excluir este código de ventas/operaciones, usá el switch en la columna "Excluir de ventas/operaciones" de la tabla.
          </div>` : ''}
          ` : `
          <input type="hidden" id="plan-categoria" value="otro" />
          <input type="hidden" id="plan-imei" value="true" />
          <input type="hidden" id="plan-excluir" value="false" />
          `}
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="cerrarModal('modal-plan')">Cancelar</button>
        <button class="btn btn-primary" onclick="guardarPlan('${id||''}')">💾 Guardar</button>
      </div>
    </div>
  `;
  document.body.appendChild(modal);
}

async function guardarPlan(id) {
  const codigo = document.getElementById('plan-codigo')?.value.trim();
  const tipo   = document.getElementById('plan-tipo')?.value;
  if (!codigo) { toast('El código es requerido', 'error'); return; }
  const datos = {
    id:           id || DB.genId(),
    codigo,
    tipo,
    descripcion:  document.getElementById('plan-desc')?.value.trim() || '',
    categoria:    document.getElementById('plan-categoria')?.value || 'otro',
    requiere_imei: document.getElementById('plan-imei')?.value === 'true',
    excluir_del_tablero: document.getElementById('plan-excluir')?.value === 'true',
    activo:       true,
  };
  try {
    await sbUpsert('planes_promociones', datos);
  } catch (e) {
    if (String(e.message||'').includes('excluir_del_tablero')) {
      toast('Falta crear la columna "excluir_del_tablero" en Supabase (tabla planes_promociones). Pedile a tu admin de base de datos que corra el ALTER TABLE.', 'error');
    } else {
      toast('No se pudo guardar: ' + e.message, 'error');
    }
    return;
  }
  dbInvalidate('planes_promociones');
  await dbGet('planes_promociones');
  toast('Guardado ✓');
  cerrarModal('modal-plan');
  navegar('planes');
}

async function eliminarPlan(id) {
  if (!confirm('¿Eliminar este registro?')) return;
  await SB.delete('planes_promociones', id, SB_TOKEN);
  dbInvalidate('planes_promociones');
  await dbGet('planes_promociones');
  navegar('planes');
}

// Determinar tipo de SDS a partir del código SPN y contexto
function clasificarSDS(spnCodigo, pvMatch, imei, dispMatch) {
  const planes = CACHE['planes_promociones'] || [];
  const spn    = planes.find(p => p.tipo === 'spn' && p.codigo === String(spnCodigo||'').trim());

  // Si el código SPN está registrado, usar su configuración
  if (spn) {
    return {
      tipo_sds:      spn.categoria === 'venta_equipo' ? 'venta' : spn.categoria,
      requiere_imei: spn.requiere_imei,
      spn_desc:      spn.descripcion || '',
    };
  }

  // Sin registro SPN: si tiene IMEI en stock → venta; si no tiene IMEI → otro (necesita revisión manual)
  // NUNCA asumir portabilidad si no hay código configurado — puede ser cualquier cosa
  return {
    tipo_sds:      dispMatch ? 'venta' : (imei && imei !== '999999999999556' ? 'venta' : 'otro'),
    requiere_imei: true,
    spn_desc:      '',
  };
}

// Detecta si un legajo es CTC/CTP (cambio de titularidad) por sufijo del ID
function esCambioTitularidad(leg) {
  const id = String(leg.sds_id || leg.identificador || '').toUpperCase();
  return id.endsWith('CTC') || id.endsWith('CTP');
}

// Un CTC/CTP es "gestión a eliminar" cuando NO tiene IMEI en stock
function esCTCGestion(leg) {
  if (!esCambioTitularidad(leg)) return false;
  const disp = CACHE['dispositivos'] || [];
  const imei = leg.imei;
  if (!imei || imei === '999999999999556') return true; // sin IMEI → gestión
  const enStock = disp.some(d => d.nro_serie === imei);
  return !enStock; // IMEI no en stock → gestión
}

// Helper de UI: estima si un tipo requiere IMEI cuando no hay plan cargado
// SOLO para filtros visuales — la lógica real usa clasificacion.requiere_imei del plan
function tipoRequiereImei(tipo_sds) {
  return !['portabilidad','linea_nueva','ctc'].includes(tipo_sds);
}

// Función central: dada una SDS del cache, re-evalúa su estado con la config actual
function reClasificarLegajo(l) {
  const pvs  = CACHE['puntos_venta'] || [];
  const disp = CACHE['dispositivos'] || [];

  // Doble chequeo de PV:
  // 1. Por entidad_pv directa
  let pvMatch = pvs.find(p => (p.entidades||[]).some(e => String(e) === String(l.entidad_pv||'')));
  // 2. Por vendedor si no encontró por entidad
  if (!pvMatch && l.vendedor_dni) {
    const vendedor = (CACHE['vendedores'] || []).find(v => v.dni === l.vendedor_dni);
    if (vendedor?.punto_venta_id) pvMatch = pvs.find(p => p.id === vendedor.punto_venta_id);
  }

  const dispMatch     = l.imei && l.imei !== '999999999999556' ? disp.find(d => d.nro_serie === l.imei) : null;
  const clasificacion = clasificarSDS(l.spn_codigo, pvMatch, l.imei, dispMatch);
  // Usar requiere_imei del plan configurado — es la fuente de verdad
  const reqImei   = clasificacion.requiere_imei;
  const tieneImei = !!(l.imei && l.imei !== '999999999999556');
  const imeiEnStock = !!dispMatch;

  // Necesita control SOLO si el plan indica que requiere IMEI y no está en stock
  const necesitaCtrl = reqImei && (!tieneImei || !imeiEnStock);
  const ctrl_motivo  = necesitaCtrl ? (!tieneImei ? 'sin_imei' : 'imei_no_en_stock') : '';

  return {
    ...l,
    tipo_sds:            clasificacion.tipo_sds,
    spn_desc:            clasificacion.spn_desc || l.spn_desc || '',
    punto_venta_id:      pvMatch?.id     || l.punto_venta_id     || '',
    punto_venta_nombre:  pvMatch?.nombre || l.punto_venta_nombre || '',
    equipo_id:           dispMatch?.id   || l.equipo_id          || '',
    equipo_vendido:      !!dispMatch,
    necesita_control:    necesitaCtrl,
    ctrl_motivo,
    pv_detectado_id:     pvMatch?.id     || '',
    pv_detectado_nombre: pvMatch?.nombre || '',
  };
}

// ── Re-verificar SDS individual ───────────────────────────────────────────────
// ── Verificación de integridad ───────────────────────────────────────────────
// Dado un legajo "a controlar", busca si ya existe en la base un registro
// completo con el mismo sds_id. Si existe → el que está en error es duplicado.
function buscarDuplicadoCompleto(legajo, todosLosLegajos) {
  if (!legajo.sds_id) return null;
  const candidatos = todosLosLegajos.filter(l =>
    l.id !== legajo.id &&
    l.sds_id === legajo.sds_id
  );
  // Buscar uno que tenga datos más completos (IMEI o tipo resuelto)
  return candidatos.find(l =>
    !l.necesita_control ||
    (l.imei && l.imei !== '999999999999556') ||
    !tipoRequiereImei(l.tipo_sds)
  ) || (candidatos.length > 0 ? candidatos[0] : null);
}

// Post-importación: eliminar duplicados automáticamente
// Criterio: si dos legajos tienen el mismo sds_id, eliminar el que tiene menos datos
async function limpiarDuplicadosPostImport(legajosNuevos) {
  const todosLosLegajos = CACHE['legajos'] || [];
  const aEliminar = [];

  for (const nuevo of legajosNuevos) {
    if (!nuevo.sds_id) continue;
    const duplicado = buscarDuplicadoCompleto(nuevo, todosLosLegajos);
    if (!duplicado) continue;

    // Determinar cuál es más completo
    const puntosNuevo = [nuevo.imei, nuevo.modelo, nuevo.vendedor, nuevo.punto_venta_id, nuevo.linea].filter(Boolean).length;
    const puntosDup   = [duplicado.imei, duplicado.modelo, duplicado.vendedor, duplicado.punto_venta_id, duplicado.linea].filter(Boolean).length;

    // Eliminar el menos completo (generalmente el nuevo si el viejo ya estaba bien)
    if (puntosDup >= puntosNuevo) {
      aEliminar.push(nuevo.id);
    } else {
      aEliminar.push(duplicado.id);
    }
  }

  // Eliminar duplicados en Supabase
  const unicos = [...new Set(aEliminar)];
  for (const id of unicos) {
    await SB.delete('legajos', id, SB_TOKEN);
  }
  if (unicos.length > 0) {
    dbInvalidate('legajos');
    await dbGet('legajos');
  }
  return unicos.length;
}

async function reverificarSDS(id) {
  const legajos = CACHE['legajos'] || [];
  const l       = legajos.find(x => x.id === id);
  if (!l) return;

  // ── Paso 1: verificar si es un duplicado ─────────────────────────
  const duplicado = buscarDuplicadoCompleto(l, legajos);
  if (duplicado) {
    const modal = document.createElement('div');
    modal.className = 'modal-overlay';
    modal.id = 'modal-reverificar';
    modal.innerHTML = `
      <div class="modal" style="max-width:500px">
        <div class="modal-header">
          <h3>🔄 Re-verificar SDS ${l.sds_id}</h3>
          <button class="btn btn-icon btn-secondary" onclick="cerrarModal('modal-reverificar')">✕</button>
        </div>
        <div class="modal-body">
          <div style="padding:10px 14px;background:var(--azul-suave);border:1px solid var(--azul);border-radius:8px;margin-bottom:12px;font-size:13px;color:var(--azul)">
            📋 Este registro es un <strong>duplicado</strong> de la SDS <strong>${duplicado.sds_id}</strong>
            que ya está correctamente importada en el sistema.
          </div>
          <p style="font-size:12px;color:var(--gris-600)">
            El registro duplicado fue generado porque los mismos datos aparecen en más de un archivo de importación.
            Se puede eliminar sin pérdida de información.
          </p>
          <div style="border:1px solid var(--gris-200);border-radius:6px;padding:10px;font-size:12px;margin-top:10px">
            <p style="font-weight:700;margin-bottom:6px">Registro completo existente:</p>
            <p>Cliente: ${duplicado.apellido||''} ${duplicado.nombre||''}</p>
            <p>IMEI: ${duplicado.imei||'—'} · PV: ${duplicado.punto_venta_nombre||'—'}</p>
            <p>Tipo: ${duplicado.tipo_sds||'—'} · Estado: ${duplicado.necesita_control ? '⚠️ A controlar' : '✅ OK'}</p>
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary" onclick="cerrarModal('modal-reverificar')">Cancelar</button>
          <button class="btn btn-primary" onclick="eliminarDuplicadoYCerrar('${l.id}')">
            🗑️ Eliminar duplicado
          </button>
        </div>
      </div>
    `;
    document.body.appendChild(modal);
    return;
  }

  // ── Paso 2: re-clasificar con config actual ───────────────────────
  const actualizado = reClasificarLegajo(l);

  const CAMPOS_CLAVE = ['tipo_sds','necesita_control','punto_venta_id',
    'punto_venta_nombre','equipo_id','equipo_vendido'];
  const LABEL = {
    tipo_sds: 'Tipo SDS', necesita_control: 'Necesita Control',
    punto_venta_id: 'PV (ID)', punto_venta_nombre: 'Punto de Venta',
    equipo_id: 'Equipo ID', equipo_vendido: 'Equipo Vendido',
  };

  const diffs = CAMPOS_CLAVE.filter(k =>
    String(actualizado[k]||'') !== String(l[k]||'')
  );

  const sinProblema = !actualizado.necesita_control;

  const modal = document.createElement('div');
  modal.className = 'modal-overlay';
  modal.id = 'modal-reverificar';
  const htmlEstado = sinProblema
    ? '<div style="padding:8px 12px;background:var(--verde-suave);border:1px solid var(--verde);border-radius:8px;margin-bottom:12px;font-size:13px;color:var(--verde)">\u2705 Esta SDS puede resolverse. Tipo: <strong>' + actualizado.tipo_sds + '</strong></div>'
    : '<div style="padding:8px 12px;background:var(--amarillo-suave);border:1px solid var(--amarillo);border-radius:8px;margin-bottom:12px;font-size:13px;color:var(--amarillo)">\u26a0\ufe0f La SDS sigue sin poder resolverse autom\u00e1ticamente.</div>';
  const htmlDiffs = diffs.length
    ? '<p style="font-size:12px;font-weight:600;margin-bottom:8px">Cambios que se aplicar\u00e1n:</p>'
      + '<table style="width:100%;font-size:12px;border-collapse:collapse"><thead><tr style="background:var(--gris-100)"><th style="padding:5px 8px;text-align:left">Campo</th><th style="padding:5px 8px;text-align:left;color:var(--acento)">Actual</th><th style="padding:5px 8px;text-align:left;color:var(--verde)">Nuevo</th></tr></thead><tbody>'
      + diffs.map(function(k) { return '<tr style="border-top:1px solid var(--gris-200)"><td style="padding:5px 8px;font-weight:600">' + (LABEL[k]||k) + '</td><td style="padding:5px 8px;color:var(--acento)">' + String(l[k]||'\u2014') + '</td><td style="padding:5px 8px;color:var(--verde)">' + String(actualizado[k]||'\u2014') + '</td></tr>'; }).join('')
      + '</tbody></table>'
    : '<p style="font-size:12px;color:var(--gris-600)">Sin diferencias detectadas con la configuraci\u00f3n actual.</p>';
  const htmlAviso = !sinProblema ? '<p style="font-size:11px;color:var(--gris-500);margin-top:10px">Si es un duplicado o dato incorrecto, pod\u00e9s eliminarlo.</p>' : '';
  const sdsIdLimpio = (l.sds_id||'').replace(/['"]/g,'');
  const btnElim = '<button class="btn btn-secondary" style="color:var(--acento)" onclick="eliminarSDS(\'' + l.id + '\',\'' + sdsIdLimpio + '\');cerrarModal(\'modal-reverificar\')">\uD83D\uDDD1\uFE0F Eliminar SDS</button>';

  document.body.appendChild(modal);
  window._reverificacion = { id, actualizado };
}

async function aplicarReverificacion(id) {
  const { actualizado } = window._reverificacion || {};
  if (!actualizado) return;
  cerrarModal('modal-reverificar');
  await sbUpsert('legajos', actualizado);
  dbInvalidate('legajos');
  await dbGet('legajos');
  toast(actualizado.necesita_control ? '⚠️ SDS actualizada (sigue requiriendo control manual)' : '✅ SDS resuelta correctamente');
  navegar('legajos');
}

// ── Re-verificar TODAS las en error ──────────────────────────────────────────
async function reverificarTodasLasEnError() {
  // Asegurar que los planes estén cargados antes de reclasificar
  if (!(CACHE['planes_promociones']?.length)) await dbGet('planes_promociones');
  if (!(CACHE['vendedores']?.length))         await dbGet('vendedores');

  const legajos   = CACHE['legajos'] || [];
  const disp      = CACHE['dispositivos'] || [];
  const imeiStock = new Set(disp.map(d => d.nro_serie).filter(Boolean));

  // "En error" = requiere IMEI (tipo no es sin-equipo) Y el IMEI no está en stock
  const enError = legajos.filter(l => {
    if (!tipoRequiereImei(l.tipo_sds)) return false; // portabilidad/linea_nueva/ctc → OK
    if (!l.imei || l.imei === '999999999999556') return true; // sin IMEI real
    if (!imeiStock.has(l.imei)) return true;                  // IMEI no en stock
    return l.necesita_control;
  });

  if (!enError.length) { toast('No hay SDS en error para reverificar', 'warning'); return; }

  // Re-clasificar cada una
  const actualizadas   = enError.map(l => reClasificarLegajo(l));

  // Detectar duplicados dentro de los "en error" — si tienen sds_id igual
  // a otro legajo ya existente y completo, son duplicados a eliminar
  const todosLosLegajos = legajos;
  const duplicadosAEliminar = [];
  const aReclasificar = [];

  for (const l of enError) {
    const dup = buscarDuplicadoCompleto(l, todosLosLegajos);
    if (dup) {
      duplicadosAEliminar.push(l.id);
    } else {
      aReclasificar.push(reClasificarLegajo(l));
    }
  }

  const resueltas   = aReclasificar.filter(l => !l.necesita_control);
  const sinResolver = aReclasificar.filter(l => l.necesita_control);

  const modal = document.createElement('div');
  modal.className = 'modal-overlay';
  modal.id = 'modal-reverif-masivo';
  modal.innerHTML = `
    <div class="modal" style="max-width:480px">
      <div class="modal-header">
        <h3>🔄 Re-verificación masiva</h3>
        <button class="btn btn-icon btn-secondary" onclick="cerrarModal('modal-reverif-masivo')">✕</button>
      </div>
      <div class="modal-body">
        <div style="display:flex;flex-direction:column;gap:8px">
          ${duplicadosAEliminar.length ? `
          <div style="padding:10px 14px;background:var(--azul-suave);border:1px solid var(--azul);border-radius:8px;font-size:13px;color:var(--azul)">
            🗑️ <strong>${duplicadosAEliminar.length}</strong> registros son duplicados de SDS ya existentes y serán eliminados.
          </div>` : ''}
          ${resueltas.length ? `
          <div style="padding:10px 14px;background:var(--verde-suave);border:1px solid var(--verde);border-radius:8px;font-size:13px;color:var(--verde)">
            ✅ <strong>${resueltas.length}</strong> SDS se resolverán automáticamente con la configuración actual.
          </div>` : ''}
          ${sinResolver.length ? `
          <div style="padding:10px 14px;background:var(--amarillo-suave);border:1px solid var(--amarillo);border-radius:8px;font-size:13px;color:var(--amarillo)">
            ⚠️ <strong>${sinResolver.length}</strong> SDS siguen sin resolverse automáticamente.
          </div>` : ''}
          ${!duplicadosAEliminar.length && !resueltas.length ? `
          <div style="padding:10px 14px;background:var(--gris-100);border:1px solid var(--gris-300);border-radius:8px;font-size:13px;color:var(--gris-600)">
            Sin cambios disponibles con la configuración actual.
          </div>` : ''}
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="cerrarModal('modal-reverif-masivo')">Cancelar</button>
        ${(duplicadosAEliminar.length || resueltas.length) ? `
        <button class="btn btn-primary" onclick="aplicarReverificacionMasiva()">
          ✅ Aplicar (${duplicadosAEliminar.length ? duplicadosAEliminar.length+' eliminar · ' : ''}${resueltas.length} resolver)
        </button>` : ''}
      </div>
    </div>
  `;
  document.body.appendChild(modal);
  window._reverificacionMasiva = { actualizadas: aReclasificar, duplicados: duplicadosAEliminar };
}

async function aplicarReverificacionMasiva() {
  const { actualizadas = [], duplicados = [] } = window._reverificacionMasiva || {};
  if (!actualizadas.length && !duplicados.length) return;
  cerrarModal('modal-reverif-masivo');

  // Popup de progreso
  const progEl = document.createElement('div');
  progEl.id = 'prog-reverif';
  progEl.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.45);z-index:9999;display:flex;align-items:center;justify-content:center';
  progEl.innerHTML = `
    <div style="background:white;border-radius:12px;padding:28px 32px;min-width:360px;box-shadow:0 8px 32px rgba(0,0,0,.2)">
      <p style="font-weight:700;font-size:15px;margin-bottom:16px;color:var(--azul)">🔄 Aplicando cambios...</p>
      <div style="background:var(--gris-200);border-radius:6px;height:10px;overflow:hidden;margin-bottom:10px">
        <div id="prog-bar-reverif" style="background:var(--azul);height:100%;width:0%;transition:width .3s;border-radius:6px"></div>
      </div>
      <p id="prog-txt-reverif" style="font-size:12px;color:var(--gris-600);text-align:center">Iniciando...</p>
    </div>
  `;
  document.body.appendChild(progEl);

  const total = actualizadas.length + duplicados.length;
  let hecho = 0;
  const upd = (msg) => {
    const pct = total ? Math.round((hecho/total)*100) : 100;
    const bar = document.getElementById('prog-bar-reverif');
    const txt = document.getElementById('prog-txt-reverif');
    if (bar) bar.style.width = pct + '%';
    if (txt) txt.textContent = msg + ` (${pct}%)`;
  };

  // 1. Eliminar duplicados
  for (const id of duplicados) {
    await SB.delete('legajos', id, SB_TOKEN);
    hecho++;
    upd(`Eliminando duplicados ${hecho} de ${duplicados.length}...`);
  }

  // 2. Actualizar re-clasificados en lotes
  const LOTE = 50;
  for (let i = 0; i < actualizadas.length; i += LOTE) {
    const lote = actualizadas.slice(i, i + LOTE).map(normalizarLegajo);
    await sbUpsertMany('legajos', lote);
    hecho += lote.length;
    upd(`Actualizando ${Math.min(i+LOTE, actualizadas.length)} de ${actualizadas.length}...`);
    await new Promise(r => setTimeout(r, 20));
  }

  document.getElementById('prog-reverif')?.remove();
  dbInvalidate('legajos');
  await dbGet('legajos');

  const resueltas = actualizadas.filter(l => !l.necesita_control).length;
  toast(`✅ ${duplicados.length ? duplicados.length+' duplicados eliminados · ' : ''}${resueltas} SDS resueltas`);
  navegar('legajos');
}

// ── Ingresar IMEI al stock desde Control SDS ─────────────────────────────────
async function abrirModalIngresarAlStock(legajoId) {
  const leg = (CACHE['legajos'] || []).find(l => l.id === legajoId);
  if (!leg) return;
  const pvs  = CACHE['puntos_venta'] || [];
  const mats = CACHE['materiales'] || [];

  // PV detectado por doble chequeo (entidad o vendedor)
  let pvDetectado = pvs.find(p => (p.entidades||[]).some(e => String(e) === String(leg.entidad_pv||'')));
  if (!pvDetectado && leg.vendedor_dni) {
    const vend = (CACHE['vendedores']||[]).find(v => v.dni === leg.vendedor_dni);
    if (vend?.punto_venta_id) pvDetectado = pvs.find(p => p.id === vend.punto_venta_id);
  }
  const matSugerido = mats.find(m => m.codigo === leg.cod_producto) ||
                      mats.find(m => m.nombre?.toLowerCase().includes((leg.modelo||'').toLowerCase().substring(0,8)));

  const modal = document.createElement('div');
  modal.className = 'modal-overlay';
  modal.id = 'modal-ingresar-stock';
  modal.innerHTML = `
    <div class="modal" style="max-width:500px">
      <div class="modal-header">
        <h3>📦 Ingresar equipo al stock</h3>
        <button class="btn btn-icon btn-secondary" onclick="cerrarModal('modal-ingresar-stock')">✕</button>
      </div>
      <div class="modal-body">
        <div style="background:var(--verde-suave);border:1px solid var(--verde);border-radius:8px;padding:10px 14px;margin-bottom:14px;font-size:12px;color:var(--verde)">
          📋 SDS <strong>${leg.sds_id||leg.sds_form||'—'}</strong> —
          ${leg.apellido ? leg.apellido+', '+(leg.nombre||'') : ''}
          ${leg.dni ? `· DNI: ${leg.dni}` : ''}
        </div>
        <div class="form-grid">
          <div class="full"><div class="form-group">
            <label>IMEI a ingresar</label>
            <input type="text" id="ist-imei" value="${leg.imei||''}"
              placeholder="15 dígitos" maxlength="15"
              style="font-family:monospace;font-weight:700;font-size:14px" />
          </div></div>
          <div class="full"><div class="form-group">
            <label>Punto de Venta
              <span style="color:${pvDetectado?'var(--verde)':'var(--amarillo)'};font-size:10px">
                ${pvDetectado?'✓ detectado automáticamente':'⚠️ no detectado — seleccioná manualmente'}
              </span>
            </label>
            <select id="ist-pv">
              <option value="">Seleccionar...</option>
              ${pvs.map(p=>`<option value="${p.id}" ${pvDetectado?.id===p.id?'selected':''}>${p.nombre}</option>`).join('')}
            </select>
          </div></div>
          <div><div class="form-group">
            <label>Nro. Remito</label>
            <input type="text" id="ist-remito" placeholder="Ej: R-0001234" style="font-family:monospace" />
          </div></div>
          <div><div class="form-group">
            <label>Material (código)</label>
            <select id="ist-material" onchange="actualizarModeloDesdeMatEnStock()">
              <option value="">Sin material registrado</option>
              ${mats.map(m=>`<option value="${m.codigo}" data-nombre="${m.nombre||''}" data-precio="${m.precio||0}"
                ${(m.codigo===leg.cod_producto||m.id===matSugerido?.id)?'selected':''}>${m.codigo} — ${m.nombre}</option>`).join('')}
            </select>
          </div></div>
          <div class="full"><div class="form-group">
            <label>Modelo / Descripción</label>
            <input type="text" id="ist-modelo" value="${matSugerido?.nombre||leg.modelo||''}" placeholder="Motorola G15..." />
          </div></div>
          <div class="full"><div class="form-group">
            <label>Precio</label>
            <input type="number" id="ist-precio" value="${matSugerido?.precio||''}" placeholder="0.00" step="0.01" />
          </div></div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="cerrarModal('modal-ingresar-stock')">Cancelar</button>
        <button class="btn btn-primary" style="background:var(--verde);border-color:var(--verde)"
          onclick="confirmarIngresarAlStock('${legajoId}')">
          📦 Crear remito e ingresar al stock
        </button>
      </div>
    </div>
  `;
  document.body.appendChild(modal);
}

function actualizarModeloDesdeMatEnStock() {
  const sel = document.getElementById('ist-material');
  const opt = sel?.selectedOptions[0];
  if (!opt || !opt.value) return;
  const nombre = opt.dataset.nombre || '';
  const precio = opt.dataset.precio || '';
  if (nombre) document.getElementById('ist-modelo').value = nombre;
  if (precio) document.getElementById('ist-precio').value = precio;
}

function generarNroRemitoInterno() {
  const hoy   = new Date();
  const fecha = hoy.getFullYear().toString()
    + String(hoy.getMonth()+1).padStart(2,'0')
    + String(hoy.getDate()).padStart(2,'0');
  const remitos  = CACHE['remitos'] || [];
  const hoyStr   = new Date().toLocaleDateString('es-AR');
  const hoyCount = remitos.filter(r => r.fecha === hoyStr && r.nro_remito?.startsWith('INT-')).length + 1;
  return 'INT-' + fecha + '-' + String(hoyCount).padStart(4,'0');
}

async function confirmarIngresarAlStock(legajoId) {
  const leg  = (CACHE['legajos']||[]).find(l => l.id === legajoId);
  if (!leg) return;
  const imei          = document.getElementById('ist-imei')?.value.trim();
  const pvId          = document.getElementById('ist-pv')?.value;
  const remitoIngresado = document.getElementById('ist-remito')?.value.trim();
  // Si no pusieron número, generar uno interno automáticamente
  const remito        = remitoIngresado || generarNroRemitoInterno();
  const matCod        = document.getElementById('ist-material')?.value || leg.cod_producto || '';
  const modelo        = document.getElementById('ist-modelo')?.value.trim();
  const precio        = parseFloat(document.getElementById('ist-precio')?.value)||0;
  if (!imei || imei.length < 10) { toast('IMEI inválido','error'); return; }
  if (!pvId) { toast('Seleccioná un punto de venta','error'); return; }
  const pvs = CACHE['puntos_venta']||[];
  const pv  = pvs.find(p=>p.id===pvId);
  const hoy = new Date().toLocaleDateString('es-AR');
  const nuevoDisp = {
    id: DB.genId(), nro_serie: imei,
    texto: modelo||leg.modelo||'', material: matCod,
    marca: detectarMarcaPorPrefijo(modelo||leg.modelo||''),
    precio, estado: 'vendido',
    punto_venta_id: pvId, punto_venta_nombre: pv?.nombre||'',
    nro_remito: remito, fecha_ingreso: hoy,
  };
  await sbUpsert('dispositivos', nuevoDisp);

  // Si el material no estaba en catálogo, crearlo
  if (matCod && modelo) {
    const matsCache = CACHE['materiales']||[];
    if (!matsCache.find(m => m.codigo === matCod)) {
      await sbUpsert('materiales', {
        id: DB.genId(), codigo: matCod, nombre: modelo,
        marca: detectarMarcaPorPrefijo(modelo), precio,
      });
      dbInvalidate('materiales');
      await dbGet('materiales');
    }
  }

  // Siempre crear el remito (automático o manual)
  await sbUpsert('remitos', {
    id: DB.genId(), nro_remito: remito, nro_pedido: '',
    tipo: 'ingreso',
    punto_venta_id: pvId, punto_venta_nombre: pv?.nombre||'',
    fecha: hoy, cantidad_items: 1, total: precio, estado: 'procesado',
  });

  await sbUpsert('legajos', {
    ...leg, imei, equipo_id: nuevoDisp.id, equipo_vendido: true,
    necesita_control: false, ctrl_motivo: '',
  });
  dbInvalidate('dispositivos'); dbInvalidate('remitos'); dbInvalidate('legajos');
  await Promise.all([dbGet('dispositivos'), dbGet('remitos'), dbGet('legajos')]);
  cerrarModal('modal-ingresar-stock');
  toast('✅ Equipo ingresado · Remito ' + remito + ' creado');
  navegar('legajos');
}

async function eliminarSDS(id, sdsId) {
  if (!confirm(`⚠️ La SDS ${sdsId} será eliminada del sistema.\n¿Confirmás?`)) return;
  await SB.delete('legajos', id, SB_TOKEN);
  dbInvalidate('legajos');
  await dbGet('legajos');
  toast('SDS eliminada');
  navegar('legajos');
}

// ── Eliminar TODAS las en error ───────────────────────────────────────────────
async function eliminarTodasLasEnError() {
  const legajos   = CACHE['legajos'] || [];
  const disp      = CACHE['dispositivos'] || [];
  const imeiStock = new Set(disp.map(d => d.nro_serie).filter(Boolean));

  const enError = legajos.filter(l => {
    if (!tipoRequiereImei(l.tipo_sds)) return false; // sin-equipo → OK
    if (!l.imei || l.imei === '999999999999556') return true;
    if (!imeiStock.has(l.imei)) return true;
    return l.necesita_control;
  });

  if (!enError.length) { toast('No hay SDS en error', 'warning'); return; }
  if (!confirm(`⚠️ Se eliminarán ${enError.length} SDS marcadas como "A Controlar".\nEsta acción no se puede deshacer. ¿Confirmás?`)) return;

  // Mostrar barra de progreso
  const progEl = document.createElement('div');
  progEl.id = 'prog-masivo';
  progEl.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.45);z-index:9999;display:flex;align-items:center;justify-content:center';
  progEl.innerHTML = `
    <div style="background:white;border-radius:12px;padding:28px 32px;min-width:360px;box-shadow:0 8px 32px rgba(0,0,0,.2)">
      <p style="font-weight:700;font-size:15px;margin-bottom:16px;color:var(--acento)">🗑️ Eliminando SDS...</p>
      <div style="background:var(--gris-200);border-radius:6px;height:10px;overflow:hidden;margin-bottom:10px">
        <div id="prog-bar-elim" style="background:var(--acento);height:100%;width:0%;transition:width .3s;border-radius:6px"></div>
      </div>
      <p id="prog-txt-elim" style="font-size:12px;color:var(--gris-600);text-align:center">Iniciando...</p>
    </div>
  `;
  document.body.appendChild(progEl);

  let procesados = 0;
  for (const l of enError) {
    await SB.delete('legajos', l.id, SB_TOKEN);
    procesados++;
    const pct = Math.round((procesados / enError.length) * 100);
    const bar = document.getElementById('prog-bar-elim');
    const txt = document.getElementById('prog-txt-elim');
    if (bar) bar.style.width = pct + '%';
    if (txt) txt.textContent = `Eliminando ${procesados} de ${enError.length} SDS... (${pct}%)`;
  }

  document.getElementById('prog-masivo')?.remove();
  dbInvalidate('legajos');
  await dbGet('legajos');
  toast(`✅ ${enError.length} SDS eliminadas`);
  navegar('legajos');
}

function renderControlSDS() {

  // Clasificar: necesitan control = imei faltante en stock, o sin PV, o sin material
  const conProblema = legajos.filter(l => {
    const planesCache = CACHE['planes_promociones'] || [];
    const spn = planesCache.find(p => p.tipo === 'spn' && p.codigo === String(l.spn_codigo||'').trim());
    const requiereImei = spn ? spn.requiere_imei : tipoRequiereImei(l.tipo_sds);
    if (!requiereImei) return false;
    if (!l.imei || l.imei === '999999999999556') return true;
    if (!imeiStock.has(l.imei)) return true;
    return l.necesita_control;
  });
  const aControlar = legajos.filter(l => l.necesita_control || l.estado_control === 'controlar');

  return `

      </div>
      <div class="stat-card" style="padding:12px 14px;background:#ede9fe;border-color:#c4b5fd">
        <div class="label" style="color:#7c3aed">Sin equipo</div>
        <div class="valor" style="font-size:22px;color:#7c3aed">${legajos.filter(l=>!tipoRequiereImei(l.tipo_sds)).length}</div>
      </div>
      <div class="stat-card verde" style="padding:12px 14px">
        <div class="label">OK</div>
        <div class="valor" style="font-size:22px">${total - conProblema.length - legajos.filter(l=>!tipoRequiereImei(l.tipo_sds)).length}</div>
      </div>
    </div>

    <!-- Filtros + acciones masivas -->
    <div style="display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;align-items:center">
      <input type="text" id="ctrl-search"

        <option value="">Todas las SDS</option>
        <option value="controlar">⚠️ Solo a Controlar</option>
        <option value="ok">✅ Solo OK</option>
        <option value="portabilidad">📞 Sin equipo (porta/LN/CTC)</option>
      </select>
      ${conProblema.length ? `
      <div style="margin-left:auto;display:flex;gap:8px">
        <button class="btn btn-primary" style="background:#16a34a;border-color:#16a34a"
          onclick="ingresarMasivoIMEI()">
          📦 Ingresar todos al stock (${conProblema.filter(l => l.imei && l.imei !== '999999999999556' && !imeiStock.has(l.imei)).length})
        </button>
        <button class="btn btn-secondary" style="color:var(--azul);border-color:var(--azul)"
          onclick="reverificarTodasLasEnError()">

        <button class="btn btn-secondary" style="color:var(--acento);border-color:var(--acento)"

// ── Ingreso masivo de IMEI al stock agrupado por PV ──────────────────────────
async function ingresarMasivoIMEI() {
  const legajos  = CACHE['legajos'] || [];
  const pvs      = CACHE['puntos_venta'] || [];
  const disp     = CACHE['dispositivos'] || DB.get('dispositivos') || [];
  const imeiStock = new Set(disp.map(d => d.nro_serie).filter(Boolean));

  // Filtrar legajos con IMEI válido no en stock
  const pendientes = legajos.filter(l =>
    l.imei && l.imei !== '999999999999556' &&
    !imeiStock.has(l.imei)
  );

  if (!pendientes.length) {
    toast('No hay equipos pendientes de ingresar al stock', 'warning');
    return;
  }

  // Agrupar por punto de venta
  const porPV = {};
  for (const l of pendientes) {
    const pvId  = l.punto_venta_id || l.pv_detectado_id || '_sin_pv';
    const pvNom = l.punto_venta_nombre || pvs.find(p => p.id === pvId)?.nombre || 'Sin PV';
    if (!porPV[pvId]) porPV[pvId] = { nombre: pvNom, items: [] };
    porPV[pvId].items.push(l);
  }

  const pvList = Object.entries(porPV);

  // Mostrar modal de confirmación con resumen por PV
  const resumen = pvList.map(([pvId, pv]) =>
    `<div style="padding:8px 12px;border:1px solid var(--gris-200);border-radius:6px;margin-bottom:6px">
      <p style="font-weight:700;margin:0">${pv.nombre}</p>
      <p style="font-size:12px;color:var(--gris-500);margin:2px 0 0">${pv.items.length} equipo${pv.items.length!==1?'s':''} → 1 remito automático</p>
    </div>`
  ).join('');

  const modal = document.createElement('div');
  modal.className = 'modal-overlay';
  modal.id = 'modal-ingreso-masivo';
  modal.innerHTML = `
    <div class="modal" style="max-width:480px">
      <div class="modal-header" style="display:flex;justify-content:space-between;align-items:center">
        <h3>📦 Ingreso masivo al stock</h3>
        <button class="btn btn-icon btn-secondary" onclick="cerrarModal('modal-ingreso-masivo')">✕</button>
      </div>
      <div class="modal-body">
        <p style="font-size:13px;margin-bottom:12px">
          Se crearán <strong>${pvList.length} remito${pvList.length!==1?'s':''}</strong> automáticos,
          uno por cada punto de venta:
        </p>
        ${resumen}
        <p style="font-size:11px;color:var(--gris-500);margin-top:10px">
          Cada remito tendrá número automático (INT-YYYYMMDD-NNNN).
        </p>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="cerrarModal('modal-ingreso-masivo')">Cancelar</button>
        <button class="btn btn-primary" style="background:#16a34a;border-color:#16a34a"
          onclick="confirmarIngresaMasivo()">
          📦 Confirmar ingreso
        </button>
      </div>
    </div>`;
  document.body.appendChild(modal);
}

async function confirmarIngresaMasivo() {
  cerrarModal('modal-ingreso-masivo');

  const legajos   = CACHE['legajos'] || [];
  const pvs       = CACHE['puntos_venta'] || [];
  const disp      = CACHE['dispositivos'] || DB.get('dispositivos') || [];
  const mats      = CACHE['materiales'] || DB.get('materiales') || [];
  const imeiStock = new Set(disp.map(d => d.nro_serie).filter(Boolean));

  const pendientes = legajos.filter(l =>
    l.imei && l.imei !== '999999999999556' && !imeiStock.has(l.imei)
  );

  // Agrupar por PV
  const porPV = {};
  for (const l of pendientes) {
    const pvId  = l.punto_venta_id || l.pv_detectado_id || '_sin_pv';
    const pvNom = l.punto_venta_nombre || pvs.find(p => p.id === pvId)?.nombre || 'Sin PV';
    if (!porPV[pvId]) porPV[pvId] = { nombre: pvNom, pvId, items: [] };
    porPV[pvId].items.push(l);
  }

  // Crear modal de progreso
  const modalProg = document.createElement('div');
  modalProg.className = 'modal-overlay';
  modalProg.id = 'modal-progreso-masivo';
  modalProg.innerHTML = `
    <div class="modal" style="max-width:420px">
      <div class="modal-header"><h3>📦 Ingresando equipos al stock...</h3></div>
      <div class="modal-body">
        <div id="prog-texto" style="font-size:13px;margin-bottom:10px;color:var(--gris-600)">Iniciando...</div>
        <div style="background:var(--gris-200);border-radius:6px;height:10px;overflow:hidden">
          <div id="prog-barra" style="background:var(--verde);height:100%;width:0%;border-radius:6px;transition:width .3s"></div>
        </div>
        <div id="prog-detalle" style="font-size:11px;color:var(--gris-400);margin-top:6px">0 / ${pendientes.length} equipos</div>
      </div>
    </div>`;
  document.body.appendChild(modalProg);

  const setProgreso = (pct, texto, detalle) => {
    const b = document.getElementById('prog-barra');
    const t = document.getElementById('prog-texto');
    const d = document.getElementById('prog-detalle');
    if (b) b.style.width = pct + '%';
    if (t) t.textContent = texto;
    if (d) d.textContent = detalle;
  };

  const LOTE = 50;
  let remitosCreados   = 0;
  let equiposIngresados = 0;
  const pvEntries = Object.entries(porPV);
  const totalPVs  = pvEntries.length;

  try {
    for (let pi = 0; pi < pvEntries.length; pi++) {
      const [pvId, pv] = pvEntries[pi];
      const nroRemito = await generarNroRemitoInterno();
      const hoy = new Date().toLocaleDateString('es-AR');
      const nuevosDisp   = [];

      setProgreso(
        Math.round(pi / totalPVs * 80),
        `Procesando: ${pv.nombre}`,
        `${equiposIngresados} / ${pendientes.length} equipos`
      );

      for (const l of pv.items) {
        const mat = mats.find(m =>
          m.codigo === l.material ||
          m.nombre?.toLowerCase().includes((l.modelo||'').toLowerCase())
        );
        nuevosDisp.push({
          id:                 DB.genId(),
          nro_serie:          l.imei,
          texto:              l.modelo || mat?.nombre || 'Equipo',
          material:           l.material || mat?.codigo || '',
          marca:              l.marca || mat?.marca || '',
          precio:             l.precio || mat?.precio || 0,
          estado:             'disponible',
          punto_venta_id:     pvId !== '_sin_pv' ? pvId : null,
          punto_venta_nombre: pv.nombre !== 'Sin PV' ? pv.nombre : null,
          nro_remito:         nroRemito,
          fecha_ingreso:      hoy,
        });
      }

      // Guardar dispositivos en lotes
      for (let i = 0; i < nuevosDisp.length; i += LOTE) {
        await sbUpsertMany('dispositivos', nuevosDisp.slice(i, i + LOTE));
        equiposIngresados += Math.min(LOTE, nuevosDisp.length - i);
        setProgreso(
          Math.round((pi / totalPVs + (i / nuevosDisp.length) / totalPVs) * 80),
          `Guardando equipos: ${pv.nombre}`,
          `${equiposIngresados} / ${pendientes.length} equipos`
        );
      }

      // Crear remito con schema correcto
      await sbUpsert('remitos', {
        id:                 DB.genId(),
        nro_remito:         nroRemito,
        tipo:               'ingreso_masivo_sds',
        punto_venta_id:     pvId !== '_sin_pv' ? pvId : null,
        punto_venta_nombre: pv.nombre,
        fecha:              hoy,
        cantidad_items:     nuevosDisp.length,
        total:              0,
        estado:             'procesado',
      });

      remitosCreados++;
    }

    setProgreso(90, 'Actualizando caché...', `${equiposIngresados} equipos procesados`);
    dbInvalidate('dispositivos');
    dbInvalidate('remitos');
    dbInvalidate('legajos');
    await Promise.all([dbGet('dispositivos'), dbGet('remitos'), dbGet('legajos')]);
    setProgreso(100, '✅ ¡Completado!', `${equiposIngresados} equipos en ${remitosCreados} remitos`);

    await new Promise(r => setTimeout(r, 1200));
    cerrarModal('modal-progreso-masivo');
    toast(`✅ ${equiposIngresados} equipo${equiposIngresados!==1?'s':''} ingresados en ${remitosCreados} remito${remitosCreados!==1?'s':''}`);

  } catch(e) {
    cerrarModal('modal-progreso-masivo');
    toast('❌ Error: ' + e.message, 'error');
    console.error('confirmarIngresaMasivo error:', e);
  }
}

function tablaControlSDS(legajos, imeiStock, pvs, mats) {
  // Mismo filtro que conProblema
  const soloProblemas = legajos.filter(l => {
    const planesCache = CACHE['planes_promociones'] || [];
    const spn = planesCache.find(p => p.tipo === 'spn' && p.codigo === String(l.spn_codigo||'').trim());
    const requiereImei = spn ? spn.requiere_imei : tipoRequiereImei(l.tipo_sds);
    if (!requiereImei) return false;
    if (!l.imei || l.imei === '999999999999556') return true;
    if (!imeiStock.has(l.imei)) return true;
    return l.necesita_control === true;
  });

  // Separar CTC/CTP gestión del resto
  const gestionCTC  = soloProblemas.filter(l => esCTCGestion(l));
  const conError    = soloProblemas.filter(l => !esCTCGestion(l));

  if (!soloProblemas.length) return `
    <div class="empty-state" style="padding:40px;text-align:center;color:var(--verde)">
      <p style="font-size:32px;margin-bottom:8px">✅</p>
      <p style="font-size:15px;font-weight:700;color:var(--verde)">¡Todo en orden!</p>
      <p style="font-size:13px;color:var(--gris-500)">No hay SDS con problemas pendientes.</p>
    </div>`;

  return `
    <table>
      <thead>
        <tr>
          <th>N° SDS</th>
          <th>Cliente</th>
          <th>IMEI</th>
          <th>Modelo</th>
          <th>Punto de Venta</th>
          <th>Problema</th>
          <th></th>
        </tr>
      </thead>
      <tbody>
        ${conError.map(l => {
          const sinImei    = !l.imei || l.imei === '999999999999556';
          const imeiNoStock = l.imei && l.imei !== '999999999999556' && !imeiStock.has(l.imei);
          const sinPV      = !l.punto_venta_id && !l.punto_venta_nombre;
          const sinModelo  = !l.modelo;

          const motivo = l.ctrl_motivo || (sinImei ? 'sin_imei' : imeiNoStock ? 'imei_no_en_stock' : '');

          const problemas = [];
          if (l.ctrl_motivo === 'sin_vendedor') problemas.push('Sin DNI vendedor');
          else if (l.ctrl_motivo === 'sin_pv')  problemas.push('Sin PV detectado');
          else if (l.ctrl_motivo === 'sin_sds') problemas.push('Sin ID de SDS');
          else {
            if (sinImei)      problemas.push('Sin IMEI real');
            if (imeiNoStock)  problemas.push('IMEI no ingresado al stock');
            if (sinPV)        problemas.push('Sin PV detectado');
            if (sinModelo)    problemas.push('Sin modelo');
          }
          if (!problemas.length) problemas.push('Requiere revisión');

          return `
            <tr style="background:#fff8f8;cursor:pointer" onclick="verDetalleLegajo('${l.id}')">
              <td style="font-family:monospace;font-weight:700;color:var(--azul);font-size:11px">${l.sds_id||l.identificador||'—'}</td>
              <td style="font-size:12px">${l.apellido ? l.apellido+', '+(l.nombre||'') : '—'}</td>
              <td style="font-family:monospace;font-size:10px;color:var(--acento)">${l.imei||'—'}</td>
              <td style="font-size:12px">${l.modelo||'—'}</td>
              <td style="font-size:12px">${l.punto_venta_nombre||(l.entidad_pv?'Entidad: '+l.entidad_pv:'<span style="color:var(--acento)">Sin PV</span>')}</td>
              <td style="font-size:11px;color:var(--acento);font-weight:600">${problemas.join(' · ')}</td>
              <td onclick="event.stopPropagation()">
                <div style="display:flex;gap:4px;flex-direction:column">
                  ${imeiNoStock ? '<button class="btn btn-sm btn-primary" style="background:var(--verde);border-color:var(--verde)" onclick="abrirModalIngresarAlStock(\''+l.id+'\')">📦 Ingresar</button>' : ''}
                  ${sinImei    ? '<button class="btn btn-sm btn-primary" onclick="abrirModalIngresarDiferencia(\''+l.id+'\')">📥 Datos</button>' : ''}

                </div>
              </td>
            </tr>`;
        }).join('')}
        ${gestionCTC.length ? `
        <tr><td colspan="7" style="padding:8px 12px;background:var(--verde-suave);font-size:11px;font-weight:700;color:var(--verde)">
          ✅ CTC/CTP — Gestiones sin equipo en stock (${gestionCTC.length}) — Pueden eliminarse o re-verificarse si ingresaron el equipo
        </td></tr>
        ${gestionCTC.map(l => `
            <tr style="background:#f0fdf4;cursor:pointer;opacity:.8" onclick="verDetalleLegajo('${l.id}')">
              <td style="font-family:monospace;font-weight:700;color:var(--verde);font-size:11px">${l.sds_id||l.identificador||'—'}</td>
              <td style="font-size:12px">${l.apellido ? l.apellido+', '+(l.nombre||'') : '—'}</td>

                </div>
              </td>
            </tr>`).join('')}` : ''}
      </tbody>
    </table>
  `;
}


function filtrarControlSDS() {
  const busq   = (document.getElementById('ctrl-search')?.value || '').toLowerCase();
  const filtro = document.getElementById('ctrl-filtro-estado')?.value || '';
  const disp   = CACHE['dispositivos'] || [];
  const pvs    = CACHE['puntos_venta'] || [];
  const mats   = CACHE['materiales'] || [];
  const imeiStock = new Set(disp.map(d => d.nro_serie).filter(Boolean));

  let leg = CACHE['legajos'] || [];

  if (busq) leg = leg.filter(l =>
    l.sds_id?.toLowerCase().includes(busq) ||
    l.imei?.toLowerCase().includes(busq) ||
    l.apellido?.toLowerCase().includes(busq) ||
    l.dni?.toLowerCase().includes(busq)
  );

  if (filtro === 'controlar') {
    leg = leg.filter(l => {
      if (!tipoRequiereImei(l.tipo_sds)) return false; // sin-equipo → OK
      const sinImei    = !l.imei || l.imei === '999999999999556';
      const imeiNoStock = l.imei && !imeiStock.has(l.imei);
      return sinImei || imeiNoStock || !l.punto_venta_id || !l.modelo || l.necesita_control;
    });
  } else if (filtro === 'ok') {
    leg = leg.filter(l => {
      if (!tipoRequiereImei(l.tipo_sds)) return false; // sin-equipo → OK
      const sinImei    = !l.imei || l.imei === '999999999999556';
      const imeiNoStock = l.imei && !imeiStock.has(l.imei);
      return !sinImei && !imeiNoStock && l.punto_venta_id && l.modelo && !l.necesita_control;
    });
  } else if (filtro === 'portabilidad') {
    leg = leg.filter(l => !tipoRequiereImei(l.tipo_sds));
  }

  document.getElementById('control-sds-tabla').innerHTML = tablaControlSDS(leg, imeiStock, pvs, mats);
}

            <p style="font-size:12px;font-weight:700;color:var(--amarillo);margin-bottom:8px">

              <select id="diff-pv">

              </select>

          </div>

            <p style="font-size:12px;font-weight:700;color:var(--amarillo);margin-bottom:8px">
