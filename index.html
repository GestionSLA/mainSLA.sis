<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistema de Gestión SLA</title>
<script>const APP_VERSION = 'v7.10';</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    /* Color principal del sistema: azul/violeta (antes rojo Claro) */
    --rojo: #4F46E5;
    --rojo-oscuro: #4338CA;
    --rojo-suave: #EEF2FF;
    /* Acento ocasional: rojo, reservado para alertas/criticidad */
    --acento: #DC2626;
    --acento-oscuro: #B91C1C;
    --acento-suave: #FEF2F2;
    --gris-900: #1E293B;
    --gris-800: #334155;
    --gris-700: #475569;
    --gris-500: #64748B;
    --gris-300: #CBD5E1;
    --gris-100: #F1F5F9;
    --blanco: #FFFFFF;
    --verde: #16A34A;
    --verde-suave: #F0FDF4;
    --amarillo: #CA8A04;
    --amarillo-suave: #FEFCE8;
    --azul: #2563EB;
    --azul-suave: #EFF6FF;
    --naranja: #7C3AED;
    --naranja-suave: #F5F3FF;
    --sombra: 0 2px 8px rgba(30,41,59,0.07);
    --sombra-md: 0 4px 16px rgba(30,41,59,0.12);
    --radio: 10px;
    --radio-sm: 6px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Nunito', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--gris-100);
    color: var(--gris-900);
    min-height: 100vh;
    font-size: 14px;
  }

  /* ── LOGIN ── */
  #login-screen {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, var(--gris-900) 0%, var(--gris-800) 60%, #3a0000 100%);
  }

  .login-card {
    background: var(--blanco);
    border-radius: 16px;
    padding: 40px 36px;
    width: 100%;
    max-width: 380px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
  }

  .login-logo {
    text-align: center;
    margin-bottom: 28px;
  }

  .login-logo .marca {
    display: inline-flex;
    align-items: center;
    gap: 10px;
  }

  .logo-circulo {
    width: 44px;
    height: 44px;
    background: var(--rojo);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-weight: 900;
    font-size: 18px;
    letter-spacing: -1px;
  }

  .login-logo h1 {
    font-size: 22px;
    font-weight: 800;
    color: var(--gris-900);
    letter-spacing: -0.5px;
  }

  .login-logo p {
    font-size: 11px;
    color: var(--gris-500);
    margin-top: 4px;
    text-align: center;
  }

  .form-group { margin-bottom: 16px; }
  .form-group label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: var(--gris-700);
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: 0.4px;
  }

  .form-group input, .form-group select, .form-group textarea {
    width: 100%;
    padding: 10px 12px;
    border: 1.5px solid var(--gris-300);
    border-radius: var(--radio-sm);
    font-size: 14px;
    color: var(--gris-900);
    background: var(--blanco);
    outline: none;
    transition: border-color 0.15s;
    font-family: inherit;
  }

  .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
    border-color: var(--rojo);
  }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 10px 18px;
    border-radius: var(--radio-sm);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    border: none;
    transition: all 0.15s;
    font-family: inherit;
    text-decoration: none;
  }

  .btn-primary {
    background: var(--rojo);
    color: white;
  }
  .btn-primary:hover { background: var(--rojo-oscuro); }

  .btn-secondary {
    background: var(--gris-100);
    color: var(--gris-700);
    border: 1.5px solid var(--gris-300);
  }
  .btn-secondary:hover { background: var(--gris-300); }

  .btn-success { background: var(--verde); color: white; }
  .btn-success:hover { background: #15803d; }

  .btn-outline {
    background: transparent;
    color: var(--rojo);
    border: 1.5px solid var(--rojo);
  }
  .btn-outline:hover { background: var(--rojo-suave); }

  .btn-full { width: 100%; }
  .btn-sm { padding: 6px 12px; font-size: 12px; }
  .btn-icon { padding: 7px; }

  .btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .error-msg {
    background: var(--rojo-suave);
    color: var(--rojo);
    border: 1px solid #fca5a5;
    border-radius: var(--radio-sm);
    padding: 10px 12px;
    font-size: 13px;
    margin-bottom: 14px;
  }

  /* ── LAYOUT PRINCIPAL ── */
  #app { display: none; height: 100vh; overflow: hidden; }

  .app-layout {
    display: flex;
    height: 100vh;
  }

  /* ── SIDEBAR ── */
  .sidebar {
    width: 240px;
    background: var(--gris-900);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
    overflow-y: auto;
  }

  .sidebar-brand {
    padding: 20px 16px 16px;
    border-bottom: 1px solid rgba(255,255,255,0.08);
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .sidebar-brand .logo-circulo {
    width: 36px;
    height: 36px;
    font-size: 15px;
    flex-shrink: 0;
  }

  .sidebar-brand-text h2 {
    color: white;
    font-size: 15px;
    font-weight: 800;
    letter-spacing: -0.3px;
  }

  .sidebar-brand-text p {
    color: rgba(255,255,255,0.4);
    font-size: 10px;
    margin-top: 1px;
  }

  .sidebar-user {
    padding: 12px 16px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .user-avatar {
    width: 30px;
    height: 30px;
    background: var(--rojo);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 12px;
    font-weight: 700;
    flex-shrink: 0;
  }

  .user-info p { color: rgba(255,255,255,0.85); font-size: 12px; font-weight: 600; }
  .user-info span { color: rgba(255,255,255,0.35); font-size: 10px; }

  .sidebar-nav { flex: 1; padding: 10px 8px; }

  .nav-section { margin-bottom: 2px; }

  .nav-section-toggle {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    padding: 10px 10px 10px 8px;
    background: none;
    border: none;
    cursor: pointer;
    color: rgba(255,255,255,0.4);
    font-size: 10.5px;
    font-weight: 800;
    letter-spacing: 1px;
    text-transform: uppercase;
    font-family: inherit;
    border-radius: 8px;
    transition: background 0.12s, color 0.12s;
  }

  .nav-section-toggle:hover {
    background: rgba(255,255,255,0.05);
    color: rgba(255,255,255,0.7);
  }

  .nav-section-toggle .chevron {
    transition: transform 0.18s ease;
    flex-shrink: 0;
  }

  .nav-section-toggle.collapsed .chevron {
    transform: rotate(-90deg);
  }

  .nav-section-body {
    display: flex;
    flex-direction: column;
    overflow: hidden;
    max-height: 600px;
    transition: max-height 0.22s ease;
  }

  .nav-section-body.collapsed {
    max-height: 0;
  }

  .nav-item {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 9px 10px;
    border-radius: 8px;
    cursor: pointer;
    color: rgba(255,255,255,0.55);
    font-size: 13px;
    font-weight: 500;
    transition: all 0.12s;
    margin-bottom: 1px;
    border: none;
    background: none;
    width: 100%;
    text-align: left;
    font-family: inherit;
  }

  .nav-item:hover {
    background: rgba(255,255,255,0.06);
    color: rgba(255,255,255,0.85);
  }

  .nav-item.active {
    background: var(--rojo);
    color: white;
  }

  .nav-item svg { width: 16px; height: 16px; flex-shrink: 0; }

  .sidebar-footer {
    padding: 12px 8px;
    border-top: 1px solid rgba(255,255,255,0.06);
  }

  /* ── CONTENIDO PRINCIPAL ── */
  .main-content {
    flex: 1;
    overflow-y: auto;
    background: var(--gris-100);
  }

  .page-header {
    background: var(--blanco);
    border-bottom: 1px solid #e5e7eb;
    padding: 16px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 10;
  }

  .page-header h1 {
    font-size: 18px;
    font-weight: 700;
    color: var(--gris-900);
  }

  .page-header p {
    font-size: 12px;
    color: var(--gris-500);
    margin-top: 2px;
  }

  .page-body { padding: 24px; }

  /* ── CARDS ── */
  .card {
    background: var(--blanco);
    border-radius: var(--radio);
    border: 1px solid #e5e7eb;
    box-shadow: var(--sombra);
  }

  .card-header {
    padding: 16px 20px;
    border-bottom: 1px solid #f0f0f0;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .card-header h3 { font-size: 14px; font-weight: 700; }
  .card-body { padding: 20px; }

  /* ── ESTADÍSTICAS ── */
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 14px;
    margin-bottom: 24px;
  }

  .stat-card {
    background: var(--blanco);
    border-radius: var(--radio);
    padding: 18px 20px;
    border: 1px solid #e5e7eb;
    box-shadow: var(--sombra);
  }

  .stat-card .label {
    font-size: 11px;
    font-weight: 600;
    color: var(--gris-500);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 8px;
  }

  .stat-card .valor {
    font-size: 26px;
    font-weight: 800;
    color: var(--gris-900);
    letter-spacing: -1px;
  }

  .stat-card .sub {
    font-size: 11px;
    color: var(--gris-500);
    margin-top: 4px;
  }

  .stat-card.rojo .valor { color: var(--rojo); }
  .stat-card.verde .valor { color: var(--verde); }
  .stat-card.azul .valor { color: var(--azul); }
  .stat-card.naranja .valor { color: var(--naranja); }

  /* ── TABLAS ── */
  .tabla-wrapper {
    overflow-x: auto;
    border-radius: var(--radio);
    border: 1px solid #e5e7eb;
    background: white;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }

  thead tr {
    background: var(--gris-100);
    border-bottom: 1px solid #e5e7eb;
  }

  th {
    padding: 10px 14px;
    text-align: left;
    font-size: 11px;
    font-weight: 700;
    color: var(--gris-500);
    text-transform: uppercase;
    letter-spacing: 0.4px;
    white-space: nowrap;
  }

  td {
    padding: 10px 14px;
    border-bottom: 1px solid #f5f5f5;
    color: var(--gris-800);
  }

  tr:last-child td { border-bottom: none; }
  tr:hover td { background: var(--gris-100); }

  /* ── BADGES ── */
  .badge {
    display: inline-flex;
    align-items: center;
    padding: 3px 8px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 600;
    white-space: nowrap;
  }

  .badge-verde { background: var(--verde-suave); color: var(--verde); }
  .badge-rojo { background: var(--rojo-suave); color: var(--rojo); }
  .badge-morado { background: #ede9fe; color: #7c3aed; border: 1px solid #c4b5fd; }
  .badge-amarillo { background: var(--amarillo-suave); color: var(--amarillo); }
  .badge-azul { background: var(--azul-suave); color: var(--azul); }
  .badge-naranja { background: var(--naranja-suave); color: var(--naranja); }
  .badge-gris { background: var(--gris-100); color: var(--gris-500); border: 1px solid var(--gris-300); }

  /* ── BÚSQUEDA ── */
  .search-bar {
    position: relative;
    max-width: 360px;
  }

  .search-bar input {
    padding-left: 34px;
  }

  .search-bar svg {
    position: absolute;
    left: 10px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--gris-500);
    width: 15px;
    height: 15px;
    pointer-events: none;
  }

  /* ── MODAL ── */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .modal {
    background: var(--blanco);
    border-radius: 14px;
    width: 100%;
    max-width: 520px;
    max-height: 90vh;
    overflow-y: auto;
    box-shadow: var(--sombra-md);
  }

  .modal-header {
    padding: 18px 20px;
    border-bottom: 1px solid #f0f0f0;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .modal-header h3 { font-size: 15px; font-weight: 700; }
  .modal-body { padding: 20px; }
  .modal-footer {
    padding: 16px 20px;
    border-top: 1px solid #f0f0f0;
    display: flex;
    gap: 8px;
    justify-content: flex-end;
  }

  /* ── GRID FORM ── */
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .form-grid .full { grid-column: 1 / -1; }

  /* ── TOAST ── */
  #toast-container {
    position: fixed;
    top: 20px;
    right: 20px;
    z-index: 999;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .toast {
    background: var(--gris-900);
    color: white;
    padding: 12px 16px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 500;
    box-shadow: var(--sombra-md);
    display: flex;
    align-items: center;
    gap: 8px;
    animation: slideIn 0.2s ease;
    max-width: 320px;
  }

  .toast.success { background: var(--verde); }
  .toast.error { background: var(--rojo); }
  .toast.warning { background: var(--amarillo); }

  @keyframes pulse-dot {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.4; transform: scale(0.7); }
  }

  @keyframes version-rgb-shift {
    0%   { background-position: 0% 50%; }
    100% { background-position: 300% 50%; }
  }

  #app-version-display.version-completa {
    background: linear-gradient(90deg, #ff3b3b, #ff9d3b, #f4ff3b, #3bff5c, #3bd4ff, #6b3bff, #ff3bd8, #ff3b3b);
    background-size: 300% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: version-rgb-shift 4s linear infinite;
    font-weight: 800;
    letter-spacing: 1.5px;
  }

  @keyframes slideIn {
    from { transform: translateX(40px); opacity: 0; }
    to { transform: translateX(0); opacity: 1; }
  }

  /* ── EMPTY STATE ── */
  .empty-state {
    text-align: center;
    padding: 48px 20px;
    color: var(--gris-500);
  }

  .empty-state svg { width: 48px; height: 48px; color: var(--gris-300); margin: 0 auto 12px; display: block; }
  .empty-state p { font-size: 14px; }

  /* ── TABS ── */
  .tabs {
    display: flex;
    gap: 2px;
    background: var(--gris-100);
    border-radius: 8px;
    padding: 3px;
    margin-bottom: 20px;
    width: fit-content;
  }

  .tab-btn {
    padding: 7px 16px;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    border: none;
    background: none;
    color: var(--gris-500);
    font-family: inherit;
    transition: all 0.12s;
  }

  .tab-btn.active {
    background: var(--blanco);
    color: var(--gris-900);
    font-weight: 600;
    box-shadow: var(--sombra);
  }

  /* ── DASHBOARD GRID ── */
  .dashboard-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }

  /* ── SEPARADOR ── */
  .divider { height: 1px; background: #f0f0f0; margin: 16px 0; }

  /* ── TOGGLE SIDEBAR MOBILE ── */
  .mobile-menu-btn {
    display: none;
    background: none;
    border: none;
    cursor: pointer;
    padding: 4px;
  }

  @media (max-width: 768px) {
    .sidebar { position: fixed; left: -240px; top: 0; height: 100%; z-index: 50; transition: left 0.25s; }
    .sidebar.open { left: 0; }
    .mobile-menu-btn { display: block; }
    .form-grid { grid-template-columns: 1fr; }
    .stats-grid { grid-template-columns: 1fr 1fr; }
    .dashboard-grid { grid-template-columns: 1fr; }
    .page-body { padding: 16px; }
  }
</style>
</head>
<body>

<!-- TOAST CONTAINER -->
<div id="toast-container"></div>

<!-- ══════════════════════════════════════════
     PANTALLA DE LOGIN
══════════════════════════════════════════ -->
<div id="login-screen">
  <div class="login-card">
    <div class="login-logo">
      <div class="marca">
        <div class="logo-circulo">GC</div>
        <div>
          <h1>Sistema de Gestión SLA</h1>
        </div>
      </div>
      <p>Sistema de Gestión — Agente Oficial Claro</p>
    </div>

    <div id="login-error" class="error-msg" style="display:none"></div>

    <div class="form-group">
      <label>Usuario</label>
      <input type="email" id="login-email" placeholder="tu@email.com" value="admin@gesticlaro.com" />
    </div>
    <div class="form-group">
      <label>Contraseña</label>
      <input type="password" id="login-pass" placeholder="••••••••" value="admin123" />
    </div>
    <button class="btn btn-primary btn-full" onclick="iniciarSesion()">Ingresar al sistema</button>

    <p style="text-align:center; font-size:11px; color:var(--gris-500); margin-top:16px;">
      Demo: admin@gesticlaro.com / admin123
    </p>
  </div>
</div>

<!-- ══════════════════════════════════════════
     APP PRINCIPAL
══════════════════════════════════════════ -->
<div id="app">
  <div class="app-layout">

    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <div class="logo-circulo">GC</div>
        <div class="sidebar-brand-text">
          <h2>Sistema de Gestión SLA</h2>
          <p>Agente Oficial Claro</p>
        </div>
      </div>

      <!-- Barra de notificaciones — estilo Glyph Matrix (LED/dot-matrix) -->
      <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');
        #notif-text {
          font-family: 'Share Tech Mono', 'Courier New', monospace !important;
          letter-spacing: 2px;
          text-shadow: 0 0 8px currentColor;
        }
        #notif-bar {
          background: #1e1030 !important;
          border: 1px solid var(--gris-500) !important;
          box-shadow: inset 0 0 12px rgba(100,116,139,.25), 0 0 6px rgba(100,116,139,.15);
        }
      </style>
      <div class="sidebar-user" style="padding:10px 10px;border-bottom:1px solid rgba(255,255,255,0.06);display:block">
        <div id="notif-bar" style="
          margin:0;
          width:100%;
          border-radius:8px;
          overflow:hidden;
          height:32px;
          background:#1e1030;
          border:1px solid var(--gris-500);
          display:none;
          position:relative;
        ">
          <div id="notif-bar-inner" style="
            display:flex;
            align-items:center;
            height:100%;
            padding:0 10px;
            gap:8px;
          ">
            <span id="notif-dot" style="
              width:7px;height:7px;border-radius:50%;
              background:#ffffff;flex-shrink:0;
            "></span>
            <div style="overflow:hidden;flex:1;position:relative;height:100%">
              <div id="notif-text" style="
                position:absolute;white-space:nowrap;
                font-size:11px;font-weight:600;
                line-height:32px;
                color:#ffffff;
                text-shadow: 0 0 8px rgba(255,255,255,.8), 0 0 16px rgba(148,163,184,.5);
              "></div>
            </div>
          </div>
        </div>
      </div>

      <nav class="sidebar-nav">
        <button class="nav-item active" onclick="navegar('dashboard')">
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
          Dashboard
        </button>

        <div class="nav-section">

// Una versión es "completa"/hito cuando todos los números después del mayor son 0
// (ej: 8.0, 9.0, 1.0.0) — se destaca con el efecto RGB animado en el panel.
function _esVersionCompleta(v) {
  const partes = String(v).replace(/^v/i, '').split('.');
  if (partes.length < 2) return false;
  return partes.slice(1).every(p => parseInt(p, 10) === 0);
}

const SUPABASE_URL = 'https://iebfyjbkmjuicrrbezbi.supabase.co';
const SUPABASE_KEY = 'sb_publishable_zi7bb1bTdazL5dwGu7-t8w_xp-MoPnl';

// Cliente liviano sin SDK — usa la REST API directamente
const SB = {
  headers(token) {
    const h = {
      'apikey': SUPABASE_KEY,
      'Content-Type': 'application/json',
      'Prefer': 'return=representation',
    };
    if (token) h['Authorization'] = `Bearer ${token}`;
    return h;
  },

  async getAll(tabla, token) {
    const r = await fetch(`${SUPABASE_URL}/rest/v1/${tabla}?select=*`, {
      headers: this.headers(token),
    });
    if (!r.ok) { console.error('SB.getAll error', tabla, await r.text()); return []; }
    return r.json();
  },

  async insert(tabla, data, token) {
    const body = Array.isArray(data) ? data : [data];
    const r = await fetch(`${SUPABASE_URL}/rest/v1/${tabla}`, {
      method: 'POST',
      headers: this.headers(token),
      body: JSON.stringify(body),
    });
    if (!r.ok) { console.error('SB.insert error', tabla, await r.text()); return null; }
    const res = await r.json();
    return Array.isArray(data) ? res : res[0];
  },

  async update(tabla, id, data, token) {
    const r = await fetch(`${SUPABASE_URL}/rest/v1/${tabla}?id=eq.${id}`, {
      method: 'PATCH',
      headers: this.headers(token),
      body: JSON.stringify(data),
    });
    if (!r.ok) { console.error('SB.update error', tabla, await r.text()); return null; }
    const res = await r.json();
    return res[0];
  },

  async delete(tabla, id, token) {
    const r = await fetch(`${SUPABASE_URL}/rest/v1/${tabla}?id=eq.${id}`, {
      method: 'DELETE',
      headers: { ...this.headers(token), 'Prefer': '' },
    });
    return r.ok;
  },

  async upsertAll(tabla, rows, token) {
    // Borra todo y reinsertar (para tablas SAP que se reemplazan completas)
    await fetch(`${SUPABASE_URL}/rest/v1/${tabla}?id=neq.00000000-0000-0000-0000-000000000000`, {
      method: 'DELETE',
      headers: { ...this.headers(token), 'Prefer': '' },
    });
    if (!rows.length) return;
    const r = await fetch(`${SUPABASE_URL}/rest/v1/${tabla}`, {
      method: 'POST',
      headers: { ...this.headers(token), 'Prefer': 'return=minimal' },
      body: JSON.stringify(rows),
    });
    if (!r.ok) console.error('SB.upsertAll error', tabla, await r.text());
  },

  async login(email, password) {
    const r = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`, {
      method: 'POST',
      headers: { 'apikey': SUPABASE_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password }),
    });
    if (!r.ok) return null;
    return r.json(); // { access_token, user, ... }
  },

  async logout(token) {
    await fetch(`${SUPABASE_URL}/auth/v1/logout`, {
      method: 'POST',
      headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${token}` },
    });
  },
};

// Cache local en memoria para no recargar Supabase en cada operación
// (se refresca al navegar entre módulos o al hacer cambios)
const CACHE = {};

// Mapeo de claves del sistema a nombres de tablas en Supabase
const TABLA_MAP = {
  'pedidos':           'pedidos',
  'dispositivos':          'dispositivos',
  'remitos':               'remitos',
  'puntos_venta':          'puntos_venta',
  'usuarios':              'usuarios',
  'cuentas_corrientes':    'cuentas_corrientes',
  'legajos':               'legajos',
  'materiales':            'materiales',
  'vendedores':            'vendedores',
  'planes_promociones':    'planes_promociones',
  'stock_sap_conciliado':  'stock_sap_conciliado',
  'equipos_sap_transito':  'equipos_sap_transito',
  'inventario_sap':        'stock_sap_conciliado', // alias
  'distribucion_cajas':    'distribucion_cajas',
  'distribucion_sims':     'distribucion_sims',
};

async function dbGet(tabla) {
  const t = TABLA_MAP[tabla] || tabla;
  if (CACHE[tabla]) return CACHE[tabla];

  // Legajos puede tener más de 1000 rows — paginar
  if (tabla === 'legajos') {
    const PAGE = 1000;
    let todos = [], offset = 0, seguir = true;
    while (seguir) {
      const r = await fetch(
        `${SUPABASE_URL}/rest/v1/${t}?select=*&order=created_at.desc&offset=${offset}&limit=${PAGE}`,
        { headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SB_TOKEN}`, 'Range-Unit': 'items' } }
      );
      if (!r.ok) break;
      const data = await r.json();
      todos = todos.concat(data);
      if (data.length < PAGE) seguir = false;
      else offset += PAGE;
    }
    CACHE[tabla] = todos;
    return todos;
  }

  const data = await SB.getAll(t, SB_TOKEN);
  CACHE[tabla] = data;
  return data;
}

function dbInvalidate(tabla) {
  delete CACHE[tabla];
}

// Upsert de un registro individual (crea o actualiza por id)
async function sbUpsert(tabla, registro) {
  if (!SB_TOKEN) return null;
  const t = TABLA_MAP[tabla] || tabla;
  const r = await fetch(`${SUPABASE_URL}/rest/v1/${t}`, {
    method: 'POST',
    headers: {
      'apikey': SUPABASE_KEY,
      'Authorization': `Bearer ${SB_TOKEN}`,
      'Content-Type': 'application/json',
      'Prefer': 'resolution=merge-duplicates,return=representation',
    },
    body: JSON.stringify(registro),
  });
  if (!r.ok) { const e = await r.text(); console.error('sbUpsert error', tabla, e); throw new Error(e); }
  const res = await r.json();
  return Array.isArray(res) ? res[0] : res;
}

// Upsert de múltiples registros (en chunks de 200)
async function sbUpsertMany(tabla, registros) {
  if (!SB_TOKEN || !registros.length) return;
  const t = TABLA_MAP[tabla] || tabla;
  const CHUNK = 200;
  for (let i = 0; i < registros.length; i += CHUNK) {
    const chunk = registros.slice(i, i + CHUNK);
    const r = await fetch(`${SUPABASE_URL}/rest/v1/${t}`, {
      method: 'POST',
      headers: {
        'apikey': SUPABASE_KEY,
        'Authorization': `Bearer ${SB_TOKEN}`,
        'Content-Type': 'application/json',
        'Prefer': 'resolution=merge-duplicates,return=minimal',
      },
      body: JSON.stringify(chunk),
    });
    if (!r.ok) { const e = await r.text(); console.error('sbUpsertMany error', tabla, e); throw new Error(e); }
  }
}

const DB = {
  get(key) {
    return CACHE[key] || [];
  },
  set(key, val) {
    CACHE[key] = val;
    // Sincroniza en background usando upsert por registro (no DELETE+INSERT)
    if (TABLA_MAP[key] && SB_TOKEN) {
      sbUpsertMany(key, val).catch(e => console.error('DB.set sync error', key, e.message));
    }
  },
  genId() {
    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
      const r = Math.random() * 16 | 0;
      return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
    });
  },
};

// Indicador flotante de sincronización
function mostrarIndicadorSync(msg, tipo = 'loading') {
  let el = document.getElementById('sync-indicator');
  if (!el) {
    el = document.createElement('div');
    el.id = 'sync-indicator';
    el.style.cssText = `

      padding:10px 16px;font-size:13px;font-family:Nunito,sans-serif;
      display:flex;align-items:center;gap:10px;
      box-shadow:0 4px 20px rgba(0,0,0,0.3);
      transition:opacity .3s;
    `;
    document.body.appendChild(el);
  }
  const icons = { loading: '⏳', ok: '✅', error: '❌' };
  el.innerHTML = `<span>${icons[tipo] || '⏳'}</span><span>${msg}</span>`;
  el.style.opacity = '1';
  el.style.display = 'flex';
  if (tipo !== 'loading') {
    setTimeout(() => {
      el.style.opacity = '0';
      setTimeout(() => { el.style.display = 'none'; }, 300);
    }, 2500);
  }
}

// Token de sesión activo (se setea al hacer login)
let SB_TOKEN = null;

// ── Detección de sesión expirada (401 en cualquier request a Supabase) ──────
let _sesionExpiradaMostrada = false;
(function() {
  const _fetchOriginal = window.fetch.bind(window);
  window.fetch = async function(...args) {
    const resp = await _fetchOriginal(...args);
    try {
      const urlArg = args[0];
      const url = typeof urlArg === 'string' ? urlArg : (urlArg && urlArg.url) || '';
      if (resp.status === 401 && url.indexOf(SUPABASE_URL) === 0 && SB_TOKEN && document.getElementById('app')?.style.display !== 'none') {
        manejarSesionExpirada();
      }
    } catch (e) {}
    return resp;
  };
})();

// ── TABLAS ORDENABLES (tipo Excel) ───────────────────────────────────────────
const _sortState = {};

function _thSort(tableId, col, label) {
  const st = _sortState[tableId] || { col: '', dir: 1 };
  const activo = st.col === col;
  const arrow  = activo ? (st.dir === 1 ? ' ↑' : ' ↓') : ' ↕';
  return `<th style="cursor:pointer;user-select:none;white-space:nowrap"
    onclick="_sortTabla('${tableId}','${col}')">${label}<span style="opacity:${activo?'1':'0.3'};font-size:10px">${arrow}</span></th>`;
}

function _sortTabla(tableId, col) {
  if (!_sortState[tableId]) _sortState[tableId] = { col: '', dir: 1 };
  const st = _sortState[tableId];
  if (st.col === col) st.dir *= -1;
  else { st.col = col; st.dir = 1; }
  // Re-render según el tableId
  if (tableId === 'tablero-ventas' || tableId.startsWith('tab-')) navegar('tablero-ventas');
  else if (tableId === 'legajos') filtrarLegajos();
  else if (tableId === 'stock-general') filtrarStock();
  else if (tableId === 'stock-conciliado') filtrarStockConciliado();
}

function _sortLista(lista, tableId, colMap) {
  const st = _sortState[tableId];
  if (!st || !st.col || !colMap[st.col]) return lista;
  const fn = colMap[st.col];
  return [...lista].sort((a,b) => {
    const va = fn(a) ?? '', vb = fn(b) ?? '';
    if (typeof va === 'number' && typeof vb === 'number') return (va - vb) * st.dir;
    return String(va).localeCompare(String(vb), 'es') * st.dir;
  });
}

// ── FILTROS DE COLUMNA TIPO EXCEL ────────────────────────────────────────────
// (además del ordenamiento de _thSort/_sortTabla de arriba)
const _colFilterState  = {}; // { tableId: { col: Set(valores seleccionados) } }
const _colValoresCache = {}; // { tableId: { col: [valores únicos disponibles] } }
let _colFilterTemp = null;   // Set en edición mientras el panel está abierto
let _colFilterCtx  = null;   // { tableId, col }

const _TABLA_REFRESH = {
  'stock-general':    () => filtrarStock(),
  'stock-conciliado': () => filtrarStockConciliado(),
};

function _registrarValoresColumna(tableId, col, valores) {
  if (!_colValoresCache[tableId]) _colValoresCache[tableId] = {};
  const limpios = valores.map(v => (v === '' || v == null) ? '—' : String(v));
  _colValoresCache[tableId][col] = [...new Set(limpios)].sort((a,b) => a.localeCompare(b, 'es', { numeric: true }));
}

function _colFiltroActivo(tableId, col) {
  return !!(_colFilterState[tableId] && _colFilterState[tableId][col]);
}

function _pasaFiltrosColumna(tableId, valoresFila) {
  const filtros = _colFilterState[tableId];
  if (!filtros) return true;
  for (const col in filtros) {
    if (!filtros[col].has(valoresFila[col])) return false;
  }
  return true;
}

// Encabezado con ordenamiento (flecha) + filtro tipo Excel (embudo)
function _thCol(tableId, col, label) {
  const st = _sortState[tableId] || { col: '', dir: 1 };
  const sortActivo = st.col === col;
  const arrow = sortActivo ? (st.dir === 1 ? '↑' : '↓') : '↕';
  const filtActivo = _colFiltroActivo(tableId, col);
  return `<th style="white-space:nowrap">
    <span style="cursor:pointer;user-select:none" onclick="_sortTabla('${tableId}','${col}')">${label} <span style="opacity:${sortActivo ? 1 : 0.3};font-size:10px">${arrow}</span></span>
    <span onclick="_abrirFiltroColumna(event,'${tableId}','${col}')" title="Filtrar ${label}"
      style="cursor:pointer;display:inline-block;margin-left:4px;padding:0 4px;border-radius:3px;font-size:10px;font-weight:700;${filtActivo ? 'background:var(--rojo);color:white' : 'color:var(--gris-500)'}">▾</span>
  </th>`;
}

function _abrirFiltroColumna(evt, tableId, col) {
  evt.stopPropagation();
  _cerrarFiltroColumna();
  const valores = (_colValoresCache[tableId] && _colValoresCache[tableId][col]) || [];
  const seleccionActual = (_colFilterState[tableId] && _colFilterState[tableId][col]) || new Set(valores);
  _colFilterTemp = new Set(seleccionActual);
  _colFilterCtx  = { tableId, col };

  const rect = evt.target.getBoundingClientRect();
  const left = Math.min(rect.left, window.innerWidth - 260);
  const panel = document.createElement('div');
  panel.id = 'col-filter-panel';
  panel.style.cssText = `position:fixed;top:${rect.bottom + 4}px;left:${Math.max(8, left)}px;
    width:240px;max-height:340px;background:white;border:1px solid var(--gris-300);border-radius:8px;
    box-shadow:var(--sombra-md);z-index:9999;display:flex;flex-direction:column;overflow:hidden;font-size:12px`;
  panel.innerHTML = `
    <div style="padding:8px;border-bottom:1px solid var(--gris-100)">
      <input type="text" placeholder="Buscar valor..." oninput="_buscarFiltroColumna(this)"
        style="width:100%;padding:6px 8px;border:1px solid var(--gris-300);border-radius:6px;font-size:12px;outline:none;font-family:inherit">
    </div>
    <div style="padding:6px 10px;border-bottom:1px solid var(--gris-100);display:flex;gap:12px">
      <a href="#" onclick="_marcarTodosFiltro(true);return false" style="color:var(--rojo);font-size:11px;font-weight:600;text-decoration:none">Seleccionar todo</a>
      <a href="#" onclick="_marcarTodosFiltro(false);return false" style="color:var(--gris-500);font-size:11px;font-weight:600;text-decoration:none">Ninguno</a>
    </div>
    <div id="col-filter-lista" style="overflow-y:auto;flex:1;padding:4px 10px">
      ${valores.map(v => `
        <label data-val="${_escHtml(v)}" style="display:flex;align-items:center;gap:6px;padding:4px 0;cursor:pointer">
          <input type="checkbox" onchange="_marcarValorFiltro('${_escJs(v)}',this.checked)" ${_colFilterTemp.has(v) ? 'checked' : ''}>
          <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${_escHtml(v)}</span>
        </label>
      `).join('')}
    </div>
    <div style="display:flex;gap:6px;padding:8px;border-top:1px solid var(--gris-100)">
      <button class="btn btn-sm btn-secondary" style="flex:1" onclick="_limpiarFiltroColumna()">Limpiar</button>
      <button class="btn btn-sm btn-primary" style="flex:1" onclick="_aplicarFiltroColumna()">Aplicar</button>
    </div>
  `;
  document.body.appendChild(panel);
  setTimeout(() => document.addEventListener('click', _clickFueraFiltro), 0);
}

function _clickFueraFiltro(e) {
  const panel = document.getElementById('col-filter-panel');
  if (panel && !panel.contains(e.target)) _cerrarFiltroColumna();
}

function _cerrarFiltroColumna() {
  const panel = document.getElementById('col-filter-panel');
  if (panel) panel.remove();
  document.removeEventListener('click', _clickFueraFiltro);
  _colFilterTemp = null;
  _colFilterCtx  = null;
}

function _buscarFiltroColumna(input) {
  const q = input.value.toLowerCase();
  document.querySelectorAll('#col-filter-lista label').forEach(l => {
    l.style.display = l.dataset.val.toLowerCase().includes(q) ? 'flex' : 'none';
  });
}

function _marcarValorFiltro(valor, checked) {
  if (!_colFilterTemp) return;
  if (checked) _colFilterTemp.add(valor); else _colFilterTemp.delete(valor);
}

function _marcarTodosFiltro(marcar) {
  if (!_colFilterCtx) return;
  const valores = (_colValoresCache[_colFilterCtx.tableId] && _colValoresCache[_colFilterCtx.tableId][_colFilterCtx.col]) || [];
  _colFilterTemp = marcar ? new Set(valores) : new Set();
  document.querySelectorAll('#col-filter-lista input[type=checkbox]').forEach(cb => cb.checked = marcar);
}

function _aplicarFiltroColumna() {
  if (!_colFilterCtx) return;
  const { tableId, col } = _colFilterCtx;
  const valores = (_colValoresCache[tableId] && _colValoresCache[tableId][col]) || [];
  if (!_colFilterState[tableId]) _colFilterState[tableId] = {};
  if (_colFilterTemp.size >= valores.length) {
    delete _colFilterState[tableId][col];
  } else {
    _colFilterState[tableId][col] = new Set(_colFilterTemp);
  }
  _cerrarFiltroColumna();
  (_TABLA_REFRESH[tableId] || (() => {}))();
}

function _limpiarFiltroColumna() {
  if (!_colFilterCtx) return;
  const { tableId, col } = _colFilterCtx;
  if (_colFilterState[tableId]) delete _colFilterState[tableId][col];
  _cerrarFiltroColumna();
  (_TABLA_REFRESH[tableId] || (() => {}))();
}

function _escHtml(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function _escJs(s) { return String(s).replace(/\\/g, '\\\\').replace(/'/g, "\\'"); }

let _dispoPollingTimer = null;

async function actualizarKPIDispo() {
  const el = document.getElementById('kpi-dispo-sap');
  if (!el) { clearInterval(_dispoPollingTimer); _dispoPollingTimer = null; return; }

  try {
    const r = await fetch(`${SUPABASE_URL}/rest/v1/configuracion?id=eq.global&select=dispo_ultima_actualizacion,dispo_bot_estado,dispo_bot_mensaje`, {
      headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SB_TOKEN || SUPABASE_KEY}` }
    });
    const data = await r.json();
    const d = data?.[0];
    if (!d) return;

    const estado = d.dispo_bot_estado || '';

    if (estado === 'actualizando') {
      el.className = 'stat-card amarillo';
      el.innerHTML = '<div class="label">Disponibilidad SAP</div>'
        + gaugeAguja(50)
        + '<div class="valor" style="font-size:13px;margin-top:2px">🔄 Actualizando...</div>'
        + '<div class="sub">El bot está corriendo, esperá unos minutos</div>';
      // Polling cada 30 segundos
      if (!_dispoPollingTimer) {
        _dispoPollingTimer = setInterval(actualizarKPIDispo, 30000);
      }
      return;
    }

    // Ya no está actualizando — detener polling
    if (_dispoPollingTimer) { clearInterval(_dispoPollingTimer); _dispoPollingTimer = null; }

    if (estado === 'error') {
      el.className = 'stat-card rojo';
      el.innerHTML = '<div class="label">Disponibilidad SAP</div>'
        + gaugeAguja(100)
        + '<div class="valor" style="font-size:13px;margin-top:2px">❌ Error</div>'
        + '<div class="sub">' + (d.dispo_bot_mensaje || 'El bot falló') + '</div>';
      return;
    }
    if (d.dispo_ultima_actualizacion) {
      const horas = (new Date() - new Date(d.dispo_ultima_actualizacion)) / 3600000;
      const color = horas < 3 ? 'verde' : horas < 6 ? 'amarillo' : 'rojo';
      const pctGauge = Math.max(0, Math.min(100, (horas / 8) * 100));
      const label = horas < 1 ? 'Hace menos de 1hs' : 'Hace ' + Math.floor(horas) + 'hs';
      const msg   = horas < 3 ? 'Lista actualizada' : horas < 6 ? 'Puede haber diferencias' : 'Diferencias significativas posibles';
      el.className = 'stat-card ' + color;
      el.innerHTML = '<div class="label">Disponibilidad SAP</div>'
        + gaugeAguja(pctGauge)
        + '<div class="valor" style="font-size:13px;margin-top:2px">' + label + '</div>'
        + '<div class="sub">' + msg + '</div>';
    } else {
      el.className = 'stat-card rojo';
      el.innerHTML = '<div class="label">Disponibilidad SAP</div>'
        + gaugeAguja(100)
        + '<div class="sub">Nunca actualizada</div>';
    }
  } catch(e) {}
}

// ── Gauge tipo semáforo con aguja (velocímetro) ──────────────────────────────
// pct: 0 (verde, óptimo) a 100 (rojo, crítico)
function gaugeAguja(pct, w, h) {
  w = w || 120; h = h || 68;
  const p = Math.max(0, Math.min(100, pct)) / 100;
  const cx = w / 2, cy = h - 6, r = w / 2 - 8;
  const toXY = (t, radio) => {
    const ang = (180 - t * 180) * Math.PI / 180;
    return [cx + radio * Math.cos(ang), cy - radio * Math.sin(ang)];
  };
  const colores = ['#16a34a', '#84cc16', '#eab308', '#f97316', '#dc2626'];
  let segs = '';
  for (let i = 0; i < 5; i++) {
    const [x0, y0] = toXY(i / 5, r);
    const [x1, y1] = toXY((i + 1) / 5, r);
    segs += `<path d="M ${x0.toFixed(1)} ${y0.toFixed(1)} A ${r} ${r} 0 0 1 ${x1.toFixed(1)} ${y1.toFixed(1)}" stroke="${colores[i]}" stroke-width="9" fill="none" stroke-linecap="butt"/>`;
  }
  const [nx, ny] = toXY(p, r - 12);
  return `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" style="display:block;margin:2px auto 0">
    ${segs}
    <line x1="${cx}" y1="${cy}" x2="${nx.toFixed(1)}" y2="${ny.toFixed(1)}" stroke="#1E293B" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="${cx}" cy="${cy}" r="4.5" fill="#1E293B"/>
  </svg>`;
}

// Dígito verificador Luhn para ICCID (base de 19 dígitos -> dígito verificador 0-9)
function _luhnCheckDigit(base19) {
  const digits = String(base19).split('').map(Number);
  let total = 0;
  const rev = digits.slice().reverse();
  for (let i = 0; i < rev.length; i++) {
    let d = rev[i];
    if (i % 2 === 0) { d *= 2; if (d > 9) d -= 9; }
    total += d;
  }
  return (10 - (total % 10)) % 10;
}

// Genera el array completo de ICCIDs entre sim_desde y sim_hasta (ambos incluidos).
// Las SIMs son consecutivas en sus primeros 18 dígitos; el dígito 19 (último) es el verificador Luhn.
function generarRangoICCID(simDesde, simHasta) {
  simDesde = String(simDesde).trim();
  simHasta = String(simHasta).trim();
  if (simDesde.length !== 19 || simHasta.length !== 19 || !/^\d{19}$/.test(simDesde) || !/^\d{19}$/.test(simHasta)) {
    throw new Error('Los ICCID deben tener 19 dígitos numéricos');
  }
  const baseDesde = BigInt(simDesde.slice(0, 18));
  const baseHasta = BigInt(simHasta.slice(0, 18));
  if (baseHasta < baseDesde) throw new Error('El rango "hasta" es menor que el rango "desde"');
  const cantidad = Number(baseHasta - baseDesde) + 1;
  if (cantidad > 5000) throw new Error('El rango generaría ' + cantidad + ' SIMs — revisá los valores desde/hasta (máx. 5000 por caja)');
  const resultado = [];
  for (let b = baseDesde; b <= baseHasta; b++) {
    const baseStr = b.toString().padStart(18, '0');
    resultado.push(baseStr + _luhnCheckDigit(baseStr));
  }
  return resultado;
}

// Suma N meses a una fecha, ajustando al último día del mes destino si no existe
// (ej: 31/08 + 8 meses -> 30/04, no 01/05)
function sumarMesesConAjuste(fechaISO, meses) {
  const f = new Date(fechaISO + 'T00:00:00');
  const diaOriginal = f.getDate();
  const destino = new Date(f.getFullYear(), f.getMonth() + meses, 1);
  const ultimoDiaDestino = new Date(destino.getFullYear(), destino.getMonth() + 1, 0).getDate();
  destino.setDate(Math.min(diaOriginal, ultimoDiaDestino));
  const yyyy = destino.getFullYear();
  const mm = String(destino.getMonth() + 1).padStart(2, '0');
  const dd = String(destino.getDate()).padStart(2, '0');
  return `${yyyy}-${mm}-${dd}`;
}

async function getConfigDistribucion() {

    if (cfg && cfg.distribucion_config) {

async function guardarCajaDistribucion() {
  const numeroCaja = document.getElementById('caja-numero').value.trim();
  const material   = document.getElementById('caja-material').value.trim();
  const codArea    = document.getElementById('caja-cod-area').value;
  const simDesde   = document.getElementById('caja-sim-desde').value.trim();
  const simHasta   = document.getElementById('caja-sim-hasta').value.trim();

  if (!numeroCaja) { toast('Ingresá el número de caja', 'error'); return; }
  if (!/^\d{19}$/.test(simDesde) || !/^\d{19}$/.test(simHasta)) {
    toast('Los ICCID desde/hasta deben tener 19 dígitos numéricos', 'error'); return;
  }

  const cajasExistentes = CACHE['distribucion_cajas'] || [];
  if (cajasExistentes.some(c => c.numero_caja === numeroCaja)) {
    toast(`Ya existe una caja cargada con el número ${numeroCaja}`, 'error'); return;
  }

  let rango;
  try {
    rango = generarRangoICCID(simDesde, simHasta);
  } catch (e) {
    toast(e.message, 'error'); return;
  }

  // Validar solapamiento de rango contra TODAS las cajas existentes (a nivel de base numérica)
  const baseDesde = BigInt(simDesde.slice(0, 18));
  const baseHasta = BigInt(simHasta.slice(0, 18));
  for (const c of cajasExistentes) {
    if (!c.sim_desde || !c.sim_hasta) continue;
    const cBaseDesde = BigInt(String(c.sim_desde).slice(0, 18));
    const cBaseHasta = BigInt(String(c.sim_hasta).slice(0, 18));
    const solapa = baseDesde <= cBaseHasta && cBaseDesde <= baseHasta;
    if (solapa) {
      toast(`El rango se solapa con la caja N° ${c.numero_caja} (${c.sim_desde} — ${c.sim_hasta}). No se puede repetir ni solapar ninguna SIM.`, 'error');
      return;
    }
  }

  const btn = document.querySelector('#modal-nueva-caja .btn-primary');
  if (btn) { btn.disabled = true; btn.textContent = 'Guardando ' + rango.length + ' SIMs...'; }

  try {
    const cajaId = DB.genId();
    await sbUpsert('distribucion_cajas', {
      id: cajaId,
      numero_caja: numeroCaja,
      material: material || _DISTRIBUCION_DEFAULTS.material_default,
      cod_area: codArea,
      sim_desde: simDesde,
      sim_hasta: simHasta,
      cantidad: rango.length,
      estado: 'presuspendida',
      fecha_creacion: new Date().toISOString(),
      usuario_creacion: usuarioActual?.nombre || '',
    });

    const simsRows = rango.map(iccid => ({
      id: DB.genId(),
      caja_id: cajaId,
      numero_caja: numeroCaja,
      iccid,
      estado: 'presuspendida',
    }));
    await sbUpsertMany('distribucion_sims', simsRows);

    dbInvalidate('distribucion_cajas');
    await dbGet('distribucion_cajas');
    toast(`Caja ${numeroCaja} guardada con ${rango.length} SIMs ✓`);
    cerrarModal('modal-nueva-caja');
    navegar('distribucion');
  } catch (e) {
    toast('Error al guardar: ' + e.message, 'error');
    if (btn) { btn.disabled = false; btn.textContent = 'Guardar caja'; }
  }
}

function _csvRow(vals) { return vals.join(';'); }

// Arma el contenido del CSV + nombre de archivo para una caja (no descarga ni sube nada)
async function _construirCSVNexo(caja) {
  const cfg = CACHE['_cfg_distribucion'] || await getConfigDistribucion();
  const header = _csvRow(['SIM','SIM_HASTA','COD_AREA','TIPO_DOC','NRO_DOC','SEXO','COMPANIA','ENTIDAD','POS']);
  const fila   = _csvRow([caja.sim_desde, caja.sim_hasta, caja.cod_area, cfg.tipo_doc, cfg.nro_doc, cfg.sexo, cfg.compania, cfg.entidad, cfg.pos]);
  const contenido = header + '\r\n' + fila + '\r\n';
  const ts = new Date().toISOString().replace(/[-:T]/g,'').slice(0,14);
  const nombreArchivo = caja.nombre_archivo || `Presuspension_${caja.numero_caja}_${ts}.csv`;
  return { contenido, nombreArchivo };
}

// Botón "Descargar CSV" — solo descarga el archivo local, no toca el estado ni dispara nada
async function descargarCSVNexo(cajaId) {
  const caja = (CACHE['distribucion_cajas']||[]).find(c => c.id === cajaId);
  if (!caja) return;
  const { contenido, nombreArchivo } = await _construirCSVNexo(caja);
  const blob = new Blob([contenido], { type: 'text/csv;charset=utf-8' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href = url; a.download = nombreArchivo;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  toast('CSV descargado ✓ (esto no dispara el bot ni cambia el estado de la caja)');
}

// Botón "Generar archivo NEXO" — sube el CSV al repo y dispara el Bot NEXO. NO descarga nada localmente.
async function generarArchivoNexo(cajaId) {
  const caja = (CACHE['distribucion_cajas']||[]).find(c => c.id === cajaId);
  if (!caja) return;
  if (caja.estado === 'pendiente') {
    toast(`La caja ${caja.numero_caja} ya está Procesando, esperando el resultado de NEXO. No se puede volver a enviar hasta que se resuelva.`, 'error');
    return;
  }
  if (caja.estado === 'activa') {
    toast(`La caja ${caja.numero_caja} ya está Activa. Si necesitás el CSV, usá el botón "Descargar CSV".`, 'error');
    return;
  }
  const accion = caja.estado === 'error' ? 'reintentar el envío' : 'enviar por primera vez';
  if (!confirm(`Se va a enviar la caja ${caja.numero_caja} (${caja.cantidad} SIMs) a NEXO para ${accion}. La caja pasará a estado "Procesando" hasta que el Bot NEXO confirme el resultado. ¿Confirmás?`)) return;

  const cfgS = await getConfigSistemasAMX(); // reusa gh_user/gh_repo/gh_token y usuario/contraseña de SAP
  const cfg  = CACHE['_cfg_distribucion'] || await getConfigDistribucion();
  const { contenido, nombreArchivo } = await _construirCSVNexo(caja);

  if (!cfgS.ghUser || !cfgS.ghRepo || !cfgS.ghToken) {
    toast('Falta configurar el repositorio de GitHub en Configuración → Sistemas AMX → Bot SAP para poder disparar el Bot NEXO.', 'error');
    return;
  }
  if (!cfg.email_resultado || !cfg.email_password_app) {
    toast('Falta configurar el email de resultados en Configuración → Sistemas AMX → Distribución.', 'error');
    return;
  }

  try {
    // 1) Subir el CSV al repo (mismo mecanismo que ya usan para stock_sap.json)
    const path = `nexo_uploads/${nombreArchivo}`;
    const apiUrl = `https://api.github.com/repos/${cfgS.ghUser}/${cfgS.ghRepo}/contents/${path}`;
    await fetch(apiUrl, {
      method: 'PUT',
      headers: { 'Authorization': `Bearer ${cfgS.ghToken}`, 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: `Presuspensión NEXO caja ${caja.numero_caja}`, content: btoa(unescape(encodeURIComponent(contenido))) }),
    }).then(r => { if (!r.ok) return r.text().then(t => { throw new Error(t); }); });

    // 2) Disparar el workflow del Bot NEXO
    const dispatchUrl = `https://api.github.com/repos/${cfgS.ghUser}/${cfgS.ghRepo}/actions/workflows/bot_nexo_subir.yml/dispatches`;
    const dispatchResp = await fetch(dispatchUrl, {
      method: 'POST',
      headers: { 'Authorization': `Bearer ${cfgS.ghToken}`, 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json' },
      body: JSON.stringify({ ref: 'main', inputs: { caja_id: cajaId, numero_caja: caja.numero_caja, nombre_archivo: nombreArchivo } }),
    });
    if (!dispatchResp.ok) throw new Error(await dispatchResp.text());

    await sbUpsert('distribucion_cajas', {
      ...caja,
      estado: 'pendiente',
      nombre_archivo: nombreArchivo,
      fecha_envio_nexo: new Date().toISOString(),
      error_mensaje: null,
    });
    const sims = await obtenerSimsDeCaja(cajaId);
    const actualizadas = sims.map(s => ({ ...s, estado: 'pendiente' }));
    await sbUpsertMany('distribucion_sims', actualizadas);
    dbInvalidate('distribucion_cajas');
    await dbGet('distribucion_cajas');
    toast(`Bot NEXO disparado ✓. Caja ${caja.numero_caja} en estado "Procesando".`);
    navegar('distribucion');
  } catch (e) {
    toast('Error al disparar el Bot NEXO: ' + e.message, 'error');
  }
}

// ── Resolución manual del resultado de NEXO (por si el bot falla o para ajustes puntuales) ──
async function marcarCajaComoActiva(cajaId) {
  const caja = (CACHE['distribucion_cajas']||[]).find(c => c.id === cajaId);
  if (!caja) return;
  if (!confirm(`¿Confirmás que NEXO devolvió resultado exitoso para la caja ${caja.numero_caja}? Esto la va a pasar a estado "Activa" y va a estampar fecha de activación y vencimiento en las ${caja.cantidad} SIMs.`)) return;

  const hoy = new Date().toISOString().slice(0,10);
  const vencimiento = sumarMesesConAjuste(hoy, 8);
  await sbUpsert('distribucion_cajas', { ...caja, estado: 'activa', error_mensaje: null });
  const sims = await obtenerSimsDeCaja(cajaId);
  const actualizadas = sims.map(s => ({ ...s, estado: 'activa', fecha_activacion: new Date().toISOString(), fecha_vencimiento: vencimiento }));
  await sbUpsertMany('distribucion_sims', actualizadas);
  dbInvalidate('distribucion_cajas');
  await dbGet('distribucion_cajas');
  toast(`Caja ${caja.numero_caja} activada ✓ (vence ${vencimiento})`);
  navegar('distribucion');
}

// Descarga el resultado COMPLETO de una caja ya Activa: N° caja, ICCID, NIM, Lote, Vencimiento
async function descargarResultadoCompleto(cajaId) {
  const caja = (CACHE['distribucion_cajas']||[]).find(c => c.id === cajaId);
  if (!caja) return;
  if (caja.estado !== 'activa') {
    toast('El resultado completo solo se puede descargar cuando la caja está Activa (bots terminaron de trabajar).', 'error');
    return;
  }
  try {
    await cargarXLSX();
    const sims = await obtenerSimsDeCaja(cajaId);
    const filas = sims.map(s => ({
      'N° Caja':            caja.numero_caja,
      'ICCID':              s.iccid,
      'NIM':                s.nim || '',
      'Lote':                s.lote || '',
      'Fecha Activación':   s.fecha_activacion ? new Date(s.fecha_activacion).toLocaleDateString('es-AR') : '',
      'Fecha Vencimiento':  s.fecha_vencimiento ? new Date(s.fecha_vencimiento + 'T00:00:00').toLocaleDateString('es-AR') : '',
    }));
    const ws = XLSX.utils.json_to_sheet(filas);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Resultado');
    XLSX.writeFile(wb, `Resultado_${caja.numero_caja}.xlsx`);
    toast('Resultado descargado ✓');
  } catch (e) {
    toast('Error al generar el XLSX: ' + e.message, 'error');
  }
}

async function marcarCajaComoError(cajaId) {
  const caja = (CACHE['distribucion_cajas']||[]).find(c => c.id === cajaId);
  if (!caja) return;
  const motivo = prompt(`¿Por qué falló el envío a NEXO de la caja ${caja.numero_caja}? (se guarda como referencia)`, '');
  if (motivo === null) return;

  await sbUpsert('distribucion_cajas', { ...caja, estado: 'error', error_mensaje: motivo || 'Sin especificar' });
  const sims = await obtenerSimsDeCaja(cajaId);
  const actualizadas = sims.map(s => ({ ...s, estado: 'error' }));
  await sbUpsertMany('distribucion_sims', actualizadas);
  dbInvalidate('distribucion_cajas');
  await dbGet('distribucion_cajas');
  toast(`Caja ${caja.numero_caja} marcada como Error`, 'error');
  navegar('distribucion');
}

async function enviarMailVencimientos() {
  const { mensajeTxt, asunto, fechaProceso, tipoProceso, equipos } = window._vencimientosMsg || {};
  if (!fechaProceso) return;

  toast('📧 Enviando mail...', 'info');
  try {
    const resp = await fetch(`${SUPABASE_URL}/functions/v1/send-mail`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + SB_TOKEN,
      },
      body: JSON.stringify({
        to:          'usbgestionsla@gmail.com',
        subject:     asunto,
        fechaProceso,
        tipoProceso,
        equipos,
      })
    });
    if (resp.ok) {
      toast('✅ Mail enviado correctamente a usbgestionsla@gmail.com');
    } else {
      const err = await resp.json();
      throw new Error(err.error || 'Error desconocido');
    }
  } catch(e) {
    toast('❌ Error al enviar mail: ' + e.message, 'error');
  }
}

function enviarWhatsAppVencimientos() {
  const { mensajeTxt } = window._vencimientosMsg || {};
  if (!mensajeTxt) return;
  const encoded = encodeURIComponent(mensajeTxt);
  window.open('https://wa.me/?text=' + encoded, '_blank');
}

  const noSap       = dispositivos.filter(d => d.estado === 'no_sap' || d.estado === 'reservado').length;
  const homologados = dispositivos.filter(d => d.estado === 'homologado').length;
  const vendidos = dispositivos.filter(d => d.estado === 'vendido').length;
  const remitos = DB.get('remitos');
  const cuentas = DB.get('cuentas_corrientes');
  const pvs = DB.get('puntos_venta').filter(p => !p.es_deposito);

  // Calcular alertas de vencimiento
  const { diasFondo, diasSalida, diasAviso } = getConfigPlazos();
  const hoy = new Date();
  const porVencer = dispositivos.filter(d => {
    if (d.estado !== 'disponible') return false;
    const dias = d.dias_antiguedad || (() => {
      if (!d.fecha_ingreso) return 0;
      const p = d.fecha_ingreso.split('/');
      const fi = p.length === 3 ? new Date(p[2], p[1]-1, p[0]) : new Date(d.fecha_ingreso);
      return isNaN(fi) ? 0 : Math.floor((hoy - fi) / 86400000);
    })();
    return dias >= (diasFondo - diasAviso);
  });
  const yaVencidos   = porVencer.filter(d => (d.dias_antiguedad||0) >= diasSalida);
  const enFondo      = porVencer.filter(d => { const di = d.dias_antiguedad||0; return di >= diasFondo && di < diasSalida; });
  const proximoFondo = porVencer.filter(d => { const di = d.dias_antiguedad||0; return di >= (diasFondo-diasAviso) && di < diasFondo; });

  // Determinar mes en curso para el mensaje
  const mesActual = new Date().toLocaleDateString('es-AR', { month: 'long', year: 'numeric' });

  const alertaVenc = (yaVencidos.length || enFondo.length || proximoFondo.length) ? `
    <div class="card" style="border:2px solid var(--acento);margin-bottom:16px;cursor:pointer"
         onclick="abrirModalVencimientos()">
      <div class="card-header" style="background:#fff1f2;display:flex;justify-content:space-between;align-items:center">
        <h3 style="color:var(--acento)">⏱️ Alertas de Vencimiento de Consignación</h3>
        <span style="font-size:12px;color:var(--acento);font-weight:600">Ver detalle + Notificar →</span>
      </div>
      <div class="card-body" onclick="abrirModalVencimientos()">
        <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px">
          ${yaVencidos.length ? '<div class="stat-card rojo" style="padding:10px 14px;flex:1;min-width:140px"><div class="label">Vencidos (>'+diasSalida+'d)</div><div class="valor" style="font-size:22px">'+yaVencidos.length+'</div></div>' : ''}
          ${enFondo.length ? '<div class="stat-card amarillo" style="padding:10px 14px;flex:1;min-width:140px"><div class="label">Fondo Garantía ('+diasFondo+'-'+diasSalida+'d)</div><div class="valor" style="font-size:22px">'+enFondo.length+'</div></div>' : ''}
          ${proximoFondo.length ? '<div class="stat-card naranja" style="padding:10px 14px;flex:1;min-width:140px"><div class="label">Próx. a Fondo (<'+diasAviso+'d)</div><div class="valor" style="font-size:22px">'+proximoFondo.length+'</div></div>' : ''}
        </div>
        <p style="font-size:12px;color:var(--gris-500)">Hacé click para ver el detalle completo y enviar notificaciones por mail o WhatsApp.</p>
      </div>
    </div>` : `
    <div class="card" style="border:2px solid var(--verde);margin-bottom:16px">
      <div class="card-header" style="background:var(--verde-suave);display:flex;align-items:center;gap:12px">
        <span style="font-size:24px">✅</span>
        <div>
          <h3 style="color:var(--verde);margin:0">Consignación al día</h3>
          <p style="font-size:12px;color:var(--verde);opacity:.8;margin:2px 0 0">
            No hay equipos en riesgo de vencimiento para ${mesActual}.
          </p>
        </div>
        <button class="btn btn-secondary" style="margin-left:auto;font-size:12px" onclick="navegar('conciliacion');setTimeout(()=>switchTabConciliacion('cronograma'),400)">
          📅 Ver cronograma →
        </button>
      </div>
    </div>`;

  return `
    ${alertaVenc}
    <div class="stats-grid">
      <div class="stat-card verde">
        <div class="label">Equipos Disponibles</div>
        <div class="valor">${disponibles}</div>
        <div class="sub">En todos los puntos de venta</div>
      </div>
      <div class="stat-card rojo">
        <div class="label">Ventas del mes</div>
        <div class="valor">${(() => {
          const mesKey = hoy.getFullYear()+'-'+String(hoy.getMonth()+1).padStart(2,'0');
          return dispositivos.filter(d => {
            if (d.estado !== 'vendido') return false;
            const m = fechaVentaAMes ? fechaVentaAMes(d.fecha_ingreso||'') : '';
            return m === mesKey;
          }).length || legajos.filter(l => {
            const m = l.fecha_venta ? (l.fecha_venta.split('/')[2]?.split(' ')[0]+'-'+(l.fecha_venta.split('/')[1]||'').padStart(2,'0')) : '';
            return m === mesKey;
          }).length;
        })()}</div>
        <div class="sub">Mes en curso</div>
      </div>
      ${(() => {
        const ultimaSync = CACHE['_ultima_sync_sap'];
        if (!ultimaSync) return `
          <div class="stat-card rojo" style="cursor:pointer" onclick="navegar('conciliacion')">
            <div class="label">Sincronización SAP</div>
            ${gaugeAguja(100)}
            <div class="sub" style="color:var(--acento)">Nunca sincronizado — Conciliar ahora</div>
          </div>`;
        const diasSinSync = Math.floor((new Date() - new Date(ultimaSync)) / 86400000);
        const color  = diasSinSync < 2 ? 'verde' : diasSinSync < 5 ? 'amarillo' : 'rojo';
        const pctGauge = Math.max(0, Math.min(100, (diasSinSync / 7) * 100));
        const msg    = diasSinSync < 2
          ? 'Stock actualizado'
          : diasSinSync < 5
            ? 'Recomendable sincronizar'
            : 'Debe conciliar el stock con SAP/Sinergía';
        const label  = diasSinSync === 0 ? 'Hoy' : diasSinSync === 1 ? 'Ayer' : 'Hace ' + diasSinSync + ' días';
        return '<div class="stat-card '+color+'" style="cursor:pointer" onclick="navegar(\'conciliacion\')">'
          + '<div class="label">Sincronización SAP</div>'
          + gaugeAguja(pctGauge)
          + '<div class="valor" style="font-size:13px;margin-top:2px">'+label+'</div>'
          + '<div class="sub">'+msg+'</div>'
          + '</div>';
      })()}
      ${(() => {
        const ultimaWebcom = CACHE['_cfg_sistemas']?.webcomUltimaImportacion || '';
        if (!ultimaWebcom) return `
          <div class="stat-card rojo" style="cursor:pointer" onclick="navegar('sistemas');setTimeout(()=>switchTabSistemas('webcom'),400)">
            <div class="label">Bot Webcom</div>
            ${gaugeAguja(100)}
            <div class="sub" style="color:var(--acento)">Nunca ejecutado</div>
          </div>`;
        const dias  = Math.floor((new Date() - new Date(ultimaWebcom)) / 86400000);
        const color = dias < 2 ? 'verde' : dias < 5 ? 'amarillo' : 'rojo';
        const pctGauge = Math.max(0, Math.min(100, (dias / 7) * 100));
        const msg   = dias < 2 ? 'Legajos actualizados' : dias < 5 ? 'Recomendable actualizar' : 'Debe correr el bot Webcom';
        const label = dias === 0 ? 'Hoy' : dias === 1 ? 'Ayer' : 'Hace ' + dias + ' días';
        return '<div class="stat-card '+color+'" style="cursor:pointer" onclick="navegar(\'sistemas\');setTimeout(()=>switchTabSistemas(\'webcom\'),400)">'
          + '<div class="label">Bot Webcom</div>'
          + gaugeAguja(pctGauge)
          + '<div class="valor" style="font-size:13px;margin-top:2px">'+label+'</div>'
          + '<div class="sub">'+msg+'</div>'
          + '</div>';
      })()}
      ${(() => {
        // Semáforo Dispo — se actualiza en tiempo real desde Supabase (ver case 'dashboard')
        return '<div class="stat-card" id="kpi-dispo-sap">'
          + '<div class="label">Disponibilidad SAP</div>'
          + gaugeAguja(50)
          + '<div class="sub">Verificando...</div>'
          + '</div>';
      })()}
      ${homologados ? '<div class="stat-card" style="background:#ede9fe;border-color:#c4b5fd"><div class="label" style="color:#7c3aed">Homologados</div><div class="valor" style="color:#7c3aed">'+homologados+'</div><div class="sub" style="color:#7c3aed">Por vencimiento de plazo</div></div>' : ''}
      <div class="stat-card" id="kpi-resumen-bots">
        <div class="label">Estado de Bots</div>
        <div class="sub">Cargando estado...</div>
      </div>
      ${(() => {
        const pvsCC = (CACHE['puntos_venta']||[]).filter(p => p.es_call_center).map(p => p.id);
        const mesActual = new Date().toISOString().slice(0,7);
        const legsCC = (CACHE['legajos']||[]).filter(l => pvsCC.includes(l.punto_venta_id) && fechaVentaOMes(l) === mesActual);
        const total = legsCC.length;
        const tipos = {};
        for (const l of legsCC) tipos[l.tipo_sds||'otro'] = (tipos[l.tipo_sds||'otro']||0) + 1;
        const colores = { venta:'#6366f1', portabilidad:'#16a34a', linea_nueva:'#7c3aed', ctc:'#ea580c', otro:'#6b7280' };
        const labels  = { venta:'Venta', portabilidad:'Portabilidad', linea_nueva:'Línea Nueva', ctc:'CTC', otro:'Otro' };
        let acc = 0;
        const partes = Object.entries(tipos).map(([t,n]) => {
          const pct = total ? (n/total*100) : 0;
          const desde = acc; acc += pct;
          return `${colores[t]||'#6b7280'} ${desde}% ${acc}%`;
        }).join(', ');
        const gradient = total ? `conic-gradient(${partes})` : 'var(--gris-200)';
        return `
        <div class="stat-card">
          <div class="label">Operaciones Call Center</div>
          <div style="display:flex;align-items:center;gap:12px;margin-top:6px">
            <div style="width:60px;height:60px;border-radius:50%;background:${gradient};position:relative;flex-shrink:0">
              <div style="position:absolute;inset:9px;background:white;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;color:var(--gris-900)">${total}</div>
            </div>
            <div style="display:flex;flex-direction:column;gap:2px;overflow:hidden">
              ${Object.entries(tipos).length ? Object.entries(tipos).map(([t,n]) =>
                `<div style="display:flex;align-items:center;gap:5px;font-size:10px;white-space:nowrap"><span style="width:7px;height:7px;border-radius:2px;background:${colores[t]||'#6b7280'};display:inline-block;flex-shrink:0"></span>${labels[t]||t}: <strong>${n}</strong></div>`
              ).join('') : '<span style="font-size:10px;color:var(--gris-400)">Sin operaciones este mes</span>'}
            </div>
          </div>
          <div class="sub" style="margin-top:6px">Mes en curso · ${pvsCC.length} PV Call Center</div>
        </div>`;
      })()}
    </div>

    <div class="dashboard-grid">
      <div class="card">
        <div class="card-header">
          <h3>Stock por Punto de Venta</h3>
          <button class="btn btn-sm btn-secondary" onclick="navegar('stock')">Ver todo</button>
        </div>
        <div class="card-body" style="padding:0">
          <table>
            <thead><tr><th>Punto de Venta</th><th>Disponibles</th><th>Vendidos</th><th>NO SAP</th></tr></thead>
            <tbody>
              ${pvs.map(pv => {
                const disps = dispositivos.filter(d => d.punto_venta_id === pv.id);
                const disp = disps.filter(d => d.estado === 'disponible').length;
                const vend = disps.filter(d => d.estado === 'vendido').length;
                const noSap = disps.filter(d => d.estado === 'no_sap' || d.estado === 'reservado').length;
                return `<tr>
                  <td><strong>${pv.nombre}</strong></td>
                  <td><span class="badge badge-verde">${disp}</span></td>
                  <td><span class="badge badge-gris">${vend}</span></td>
                  <td>${noSap ? '<span class="badge badge-rojo">'+noSap+'</span>' : '<span style="color:var(--gris-400)">—</span>'}</td>
                </tr>`;
              }).join('')}
            </tbody>
          </table>
        </div>
      </div>

      <div class="card" id="card-ventas-mes">
        <div class="card-header" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">
          <h3>📊 Ventas del mes — ${new Date().toLocaleString('es-AR',{month:'long',year:'numeric'})}</h3>
          <select id="sel-pv-dashboard" onchange="cambiarPVDashboard(this.value)"
            style="padding:4px 10px;border:1.5px solid var(--gris-200);border-radius:6px;font-size:12px;font-family:inherit;max-width:180px">
            <option value="">Seleccioná un PV</option>
            ${(CACHE['puntos_venta']||[]).map(p =>
              `<option value="${p.id}" ${CACHE['_dashboard_pv_id']===p.id?'selected':''}>${p.nombre}${p.es_call_center?' 📞':''}</option>`
            ).join('')}
          </select>
        </div>
        <div class="card-body" id="ventas-mes-body">
          ${(() => {
            const pvId = CACHE['_dashboard_pv_id'] || '';
            if (!pvId) return '<p style="color:var(--gris-400);font-size:13px;text-align:center;padding:16px 0">Seleccioná un punto de venta para ver las ventas del mes.</p>';

            const mesActual = new Date().toISOString().slice(0,7); // YYYY-MM
            const pvObj     = (CACHE['puntos_venta']||[]).find(p => p.id === pvId);
            const esCC      = pvObj?.es_call_center || false;

            const legajosDelMes = (CACHE['legajos']||[]).filter(l => {
              if (l.punto_venta_id !== pvId) return false;
              return fechaVentaOMes(l) === mesActual;
            });

            // Para PV normal: solo contar ventas con IMEI válido
            // Para Call Center: contar todas las operaciones
            const legajos = esCC
              ? legajosDelMes
              : legajosDelMes.filter(l => l.imei && l.imei !== '999999999999556');

            if (!legajos.length) return '<p style="color:var(--gris-400);font-size:13px;text-align:center;padding:16px 0">Sin ventas registradas este mes.</p>';

            // Totales
            const total    = legajos.length;
            const conImei  = legajos.filter(l => l.imei && l.imei !== '999999999999556').length;
            const sinEquipo= legajos.filter(l => !l.imei || l.imei === '999999999999556').length;
            const importe  = legajos.reduce((s,l) => s + (parseFloat(l.importe)||0), 0);

            // Por vendedor
            const porVend = {};
            for (const l of legajos) {
              const k = l.vendedor || l.vendedor_dni || 'Sin asignar';
              if (!porVend[k]) porVend[k] = 0;
              porVend[k]++;
            }
            const vendOrden = Object.entries(porVend).sort((a,b)=>b[1]-a[1]);

            return `
              <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px">
                <div style="text-align:center;padding:10px;background:var(--gris-100);border-radius:8px">
                  <div style="font-size:22px;font-weight:800;color:var(--azul)">${total}</div>
                  <div style="font-size:11px;color:var(--gris-400)">Total ventas</div>
                </div>
                <div style="text-align:center;padding:10px;background:var(--verde-suave);border-radius:8px">
                  <div style="font-size:22px;font-weight:800;color:var(--verde)">${conImei}</div>
                  <div style="font-size:11px;color:var(--gris-400)">Con equipo</div>
                </div>
                <div style="text-align:center;padding:10px;background:var(--gris-100);border-radius:8px">
                  <div style="font-size:22px;font-weight:800;color:var(--gris-600)">${sinEquipo}</div>
                  <div style="font-size:11px;color:var(--gris-400)">Sin equipo</div>
                </div>
              </div>
              <div style="margin-bottom:12px;padding:10px 12px;background:var(--azul-suave);border-radius:8px">
                <span style="font-size:11px;color:var(--gris-400)">Importe total:</span>
                <span style="font-size:14px;font-weight:800;color:var(--azul);margin-left:8px">$${importe.toLocaleString('es-AR',{minimumFractionDigits:0})}</span>
              </div>
              <div style="font-size:11px;font-weight:700;color:var(--gris-400);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px">Por vendedor</div>
              ${vendOrden.map(([vend,cant],i) => `
                <div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--gris-100)">
                  <span style="font-size:13px">${['🥇','🥈','🥉'][i]||'·'} ${vend}</span>
                  <span style="background:var(--azul-suave);color:var(--azul);border-radius:20px;padding:2px 10px;font-size:12px;font-weight:700">${cant}</span>
                </div>`).join('')}`;
          })()}
        </div>
      </div>

      ${(() => {
        const vends = (CACHE['vendedores'] || []).filter(v => v.total_ventas > 0);
        if (!vends.length) return '';
        const pvsTodos = CACHE['puntos_venta'] || [];

        // Agrupar por punto de venta
        const porPV = {};
        for (const v of vends) {
          const pvKey   = v.punto_venta_id || '_sin_pv';
          const pvNombre = v.punto_venta_nombre || v.entidad_id || 'Sin PV asignado';
          if (!porPV[pvKey]) porPV[pvKey] = { id: pvKey, nombre: pvNombre, vendedores: [] };
          porPV[pvKey].vendedores.push(v);
        }

        // Dentro de cada PV: si NO es Call Center, unificar vendedores con el mismo
        // alias (nombre) aunque tengan distinto DNI — mismo vendedor, dos legajos con
        // DNI diferente. Los Call Center quedan sin unificar (se ven por entidad hija).
        for (const pvKey in porPV) {
          const pvObj = pvsTodos.find(p => p.id === pvKey);
          if (pvObj?.es_call_center) continue; // no unificar Call Center
          const unificados = {};
          for (const v of porPV[pvKey].vendedores) {
            const alias = (v.nombre || '').trim().toUpperCase() || `_dni_${v.dni}`;
            if (!unificados[alias]) {
              unificados[alias] = { ...v, dnis: [v.dni].filter(Boolean) };
            } else {
              unificados[alias].total_ventas = (unificados[alias].total_ventas||0) + (v.total_ventas||0);
              if (v.dni && !unificados[alias].dnis.includes(v.dni)) unificados[alias].dnis.push(v.dni);
            }
          }
          porPV[pvKey].vendedores = Object.values(unificados);
        }

        // Ordenar vendedores dentro de cada PV y PVs por total
        const pvOrdenados = Object.values(porPV)
          .map(pv => ({
            ...pv,
            esCC: pvsTodos.find(p => p.id === pv.id)?.es_call_center || false,
            vendedores: pv.vendedores.sort((a,b) => (b.total_ventas||0) - (a.total_ventas||0)),
            total: pv.vendedores.reduce((s,v) => s + (v.total_ventas||0), 0),
          }))
          .sort((a,b) => b.total - a.total);

        const medallas = ['🥇','🥈','🥉','4️⃣','5️⃣'];
        const colores  = ['#6366f1','#0891b2','#16a34a','#d97706','#dc2626'];

        return `
        <div class="card">
          <div class="card-header" style="display:flex;justify-content:space-between;align-items:center">
            <h3>🏆 Ranking de Vendedores por PV</h3>
            <button class="btn btn-sm btn-secondary" onclick="navegar('vendedores')">Ver todos</button>
          </div>
          <div class="card-body" style="padding:0">
            ${pvOrdenados.map((pv, pi) => {
              const top = pv.vendedores.slice(0, 5);
              const maxV = top[0]?.total_ventas || 1;
              const color = colores[pi % colores.length];
              return `
                <div style="border-bottom:2px solid var(--gris-200)">
                  <div style="padding:8px 14px;background:var(--gris-100);display:flex;justify-content:space-between;align-items:center">
                    <span style="font-size:12px;font-weight:700;color:${color}">${pv.nombre}${pv.esCC ? ' <span style="font-size:9px;background:#f3e8ff;color:#7c3aed;border-radius:4px;padding:1px 6px;margin-left:4px">📞 Call Center · por entidad</span>' : ''}</span>
                    <span style="font-size:11px;color:var(--gris-500)">${pv.total} ventas · ${pv.vendedores.length} vendedor(es)</span>
                  </div>
                  ${top.map((v, i) => `
                    <div style="display:flex;align-items:center;gap:10px;padding:7px 14px;border-top:1px solid var(--gris-200)">
                      <span style="font-size:14px;min-width:22px;text-align:center">${medallas[i] || (i+1)+'.'}</span>
                      <div style="flex:1">
                        <p style="font-size:12px;font-weight:600;margin:0">${v.nombre || '—'}</p>
                        ${v.dnis?.length ? `<p style="font-size:10px;color:var(--gris-500);margin:0">DNI: ${v.dnis.join(' / ')}</p>` : (v.dni ? `<p style="font-size:10px;color:var(--gris-500);margin:0">DNI: ${v.dni}</p>` : '')}
                      </div>
                      <div style="text-align:right;min-width:70px">
                        <p style="font-size:12px;font-weight:700;color:${color};margin:0">${v.total_ventas} ventas</p>
                        <div style="background:var(--gris-200);border-radius:4px;height:3px;margin-top:3px">
                          <div style="background:${color};height:100%;width:${Math.round((v.total_ventas/maxV)*100)}%;border-radius:4px"></div>
                        </div>
                      </div>
                    </div>
                  `).join('')}
                </div>
              `;
            }).join('')}
          </div>
        </div>`;
      })()}
    </div>
  `;
}

function renderStock() {
  const disp  = CACHE['dispositivos'] || DB.get('dispositivos') || [];
  const stock  = CACHE['stock_sap_conciliado'] || DB.get('stock_sap_conciliado') || [];
  const trans  = CACHE['equipos_sap_transito'] || DB.get('equipos_sap_transito') || [];
  const totalActivo = disp.filter(d => d.estado === 'disponible').length;

  return `
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:10px">
      <div>
        <h2 style="font-size:18px;font-weight:700;margin:0">Stock</h2>
        <p style="font-size:12px;color:var(--gris-500);margin:2px 0 0">${totalActivo} equipo${totalActivo !== 1 ? 's' : ''} disponible${totalActivo !== 1 ? 's' : ''} en stock activo</p>
      </div>
      <button class="btn btn-primary" onclick="navegar('conciliacion')">⚡ Actualizar Stock SAP</button>
    </div>

    <div class="tabs" style="margin-bottom:16px">
      <button class="tab-btn active" id="tab-btn-stock-pv"           onclick="switchTabStock('pv')">📍 Por PV</button>
      <button class="tab-btn"        id="tab-btn-stock-vencimientos" onclick="switchTabStock('vencimientos')">⏱️ Vencimientos</button>
      <button class="tab-btn"        id="tab-btn-stock-conciliado"   onclick="switchTabStock('conciliado')">
        🔄 Conciliado SAP ${stock.length ? '<span class="badge badge-azul" style="margin-left:4px">'+stock.length+'</span>' : ''}
      </button>
      <button class="tab-btn"        id="tab-btn-stock-transito"     onclick="switchTabStock('transito')">
        🚛 Tránsito SAP ${trans.length ? '<span class="badge badge-azul" style="margin-left:4px">'+trans.length+'</span>' : ''}
      </button>
    </div>
    <div id="stock-tab-pv">          ${renderStockPorPV()}</div>
    <div id="stock-tab-general"      style="display:none">${renderStockGeneral()}</div>
    <div id="stock-tab-vencimientos" style="display:none">${renderVencimientosEnStock()}</div>
    <div id="stock-tab-conciliado"   style="display:none">${renderStockConciliadoSAP()}</div>
    <div id="stock-tab-transito"     style="display:none">${renderEquiposTransitoSAP()}</div>
  `;
}

function switchTabStock(tab) {
  const tabs = ['pv','general','vencimientos','conciliado','transito'];
  tabs.forEach(t => {
    const btn = document.getElementById('tab-btn-stock-'+t);
    const el  = document.getElementById('stock-tab-'+t);
    if (btn) btn.classList.toggle('active', t === tab);
    if (el)  el.style.display = t === tab ? '' : 'none';
  });
  if (tab !== 'pv') {
    const det = document.getElementById('stock-pv-detalle');
    if (det) det.innerHTML = '';
  }
}

function renderStockConciliadoSAP() {
  const stock = DB.get('stock_sap_conciliado') || [];
  if (!stock.length) return `<div class="empty-state"><svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg><p>No hay stock conciliado todavía. Importalo desde Conciliación SAP.</p></div>`;

  return `

        <input type="text" id="sap-conc-search" placeholder="Buscar por IMEI, material, descripción..." oninput="filtrarStockConciliado()"
          style="padding:9px 9px 9px 34px;border:1.5px solid var(--gris-300);border-radius:6px;width:280px;font-size:13px;outline:none" />
      </div>
      <select id="sap-conc-origen" onchange="filtrarStockConciliado()" style="padding:8px 12px;border:1.5px solid var(--gris-300);border-radius:6px;font-size:13px;outline:none;background:white">
        <option value="">Todos</option>
