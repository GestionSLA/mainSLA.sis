                onchange="document.getElementById('lbl-${a.key}').textContent = this.files[0]?.name || 'Sin archivo'; document.getElementById('lbl-${a.key}').style.color = this.files[0] ? 'var(--verde)' : 'var(--gris-400)'"
                style="font-size:12px;color:var(--gris-700);cursor:pointer" />
            </div>
          </div>
        `).join('')}

        <div id="sds-import-estado" style="margin-top:12px"></div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="cerrarModal('modal-import-sds')">Cancelar</button>
        <button class="btn btn-primary" onclick="procesarExcel5()">⚡ Procesar e Importar</button>
      </div>
    </div>
  `;
  document.body.appendChild(modal);
}

function cargarXLSX() {
  return new Promise((resolve, reject) => {
    if (window.XLSX) { resolve(); return; }
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    s.onload = resolve;
    s.onerror = () => reject(new Error('No se pudo cargar la librería XLSX'));
    document.head.appendChild(s);
  });
}

// Convierte fecha Excel (serial numérico o string) a DD/MM/YYYY HH:MM
function parseFechaExcel(val) {
  if (!val || val === '') return '';
  const str = String(val).trim();

  // Ya es fecha legible con formato DD/MM/YY o DD/MM/YYYY
  if (/^\d{1,2}\/\d{1,2}\/\d{2,4}/.test(str)) {
    // Normalizar a DD/MM/YYYY
    const parts = str.split(' ');
    const dateParts = parts[0].split('/');
    if (dateParts[2]?.length === 2) dateParts[2] = '20' + dateParts[2];
    return dateParts.join('/') + (parts[1] ? ' ' + parts[1].substring(0,5) : '');
  }

  // Formato MM/DD/YYYY (de Solicitudes: "7/25/2026 4:58:23 PM")
  if (/^\d{1,2}\/\d{1,2}\/\d{4}/.test(str)) {
    const parts = str.split(' ');
    const [mm, dd, yyyy] = parts[0].split('/');
    let hora = parts[1] ? parts[1].substring(0,5) : '';
    if (parts[2] === 'PM' && hora) {
      const [h, m] = hora.split(':');
      const h24 = (parseInt(h) % 12) + 12;
      hora = `${h24}:${m}`;
    }
    return `${dd.padStart(2,'0')}/${mm.padStart(2,'0')}/${yyyy}${hora ? ' ' + hora : ''}`;
  }

  // Número serial Excel (ej: 46228.7072106482)
  const num = parseFloat(str);
  if (!isNaN(num) && num > 1000) {
    // Excel epoch: 1 = 1/1/1900, con bug de 1900 bisiesto
    const d = new Date((num - 25569) * 86400 * 1000);
    if (!isNaN(d.getTime())) {
      const dd  = String(d.getUTCDate()).padStart(2,'0');
      const mm  = String(d.getUTCMonth()+1).padStart(2,'0');
      const yyyy = d.getUTCFullYear();
      const hh  = String(d.getUTCHours()).padStart(2,'0');
      const min = String(d.getUTCMinutes()).padStart(2,'0');
      return `${dd}/${mm}/${yyyy} ${hh}:${min}`;
    }
  }

  return str; // devolver tal cual si no se pudo parsear
}

async function procesarExcel5() {
  const archivos = {
    rep:   document.getElementById('xl-Reportes')?.files[0],
    solic: document.getElementById('xl-Solicitudes')?.files[0],
    sant:  document.getElementById('xl-Solicitantes')?.files[0],
    venta: document.getElementById('xl-Venta')?.files[0],
    term:  document.getElementById('xl-Terminales')?.files[0],
    pagos: document.getElementById('xl-Pagos')?.files[0],
  };

  const cargados = Object.values(archivos).filter(Boolean).length;
  if (!cargados) { toast('Seleccioná al menos un archivo', 'error'); return; }

  const estadoEl = document.getElementById('sds-import-estado');

  const progreso = (paso, total, msg) => {
    const pct = total ? Math.round((paso / total) * 100) : 0;
    if (!estadoEl) return;
    estadoEl.innerHTML = `
      <div style="padding:10px 12px;background:var(--azul-suave);border:1px solid var(--azul);border-radius:8px;font-size:12px;color:var(--azul)">
        <div style="display:flex;justify-content:space-between;margin-bottom:6px">
          <span>🔄 ${msg}</span>
          <span style="font-weight:700">${pct}%</span>
        </div>
        <div style="background:#dbeafe;border-radius:4px;height:6px;overflow:hidden">
          <div style="background:var(--azul);height:100%;width:${pct}%;transition:width .3s"></div>
        </div>
      </div>`;
  };

  try {
    progreso(1, 10, 'Cargando librería Excel...');
    await cargarXLSX();

    const leer = async (file, nombre) => {
      if (!file) return [];
      progreso(null, null, `Leyendo ${nombre}...`);
      const buf = await file.arrayBuffer();
      const wb  = XLSX.read(buf, { type: 'array' });
      const ws  = wb.Sheets[wb.SheetNames[0]];
      return XLSX.utils.sheet_to_json(ws, { defval: '' });
    };

    const clean = rows => rows.map(r => {
      const o = {};
      for (const [k,v] of Object.entries(r))
        o[k.trim()] = String(v === null || v === undefined ? '' : v).trim().replace(/^(nan|None)$/,'');
      return o;
    // Filtrar filas vacías o que sean metadatos del archivo ("Filtros aplicados:")
    }).filter(r => {
      const vals = Object.values(r);
      const primera = vals[0] || '';
      if (primera.toLowerCase().includes('filtros aplicados')) return false;
      if (vals.every(v => !v || v === '')) return false;
      return true;
    });

    const toFloat = v => { try { return parseFloat(String(v).replace(',','.').replace(/[^0-9.-]/g,'')) || 0; } catch { return 0; } };

    progreso(1, 10, 'Leyendo Reportes (1/6)...');
    const rep   = clean(await leer(archivos.rep,   'Reportes'));
    progreso(2, 10, 'Leyendo Solicitudes (2/6)...');
    const solic = clean(await leer(archivos.solic,  'Solicitudes'));
    progreso(3, 10, 'Leyendo Solicitantes (3/6)...');
    const sant  = clean(await leer(archivos.sant,   'Solicitantes'));
    progreso(4, 10, 'Leyendo Venta de Equipo (4/6)...');
    const venta = clean(await leer(archivos.venta,  'Venta de Equipo'));
    progreso(5, 10, 'Leyendo Terminales (5/6)...');
    const term  = clean(await leer(archivos.term,   'Terminales'));
    progreso(6, 10, 'Leyendo Pagos (6/6)...');
    const pagos = clean(await leer(archivos.pagos,  'Pagos'));

    progreso(7, 10, `Cruzando datos (${solic.length} SDS + ${venta.length} CATER)...`);
    await new Promise(r => setTimeout(r, 30));

    // Índices
    const idx_term = Object.fromEntries(term.map(r => [r['IMEI'], r]).filter(([k]) => k));
    const idx_sant = Object.fromEntries(sant.map(r => [r['Srf Id'], r]).filter(([k]) => k));
    const idx_rep  = Object.fromEntries(rep.map(r => [r['SDS'], r]).filter(([k]) => k));

    const pagos_sds = {}, pagos_bill = {};
    for (const p of pagos) {
      if (p['Id Sds'])      pagos_sds[p['Id Sds']]       = (pagos_sds[p['Id Sds']]       || []).concat(p);
      if (p['Bill Number']) pagos_bill[p['Bill Number']]  = (pagos_bill[p['Bill Number']]  || []).concat(p);
    }

    const agg = lista => {
      if (!lista?.length) return {};
      return {
        tipo_pago:        [...new Set(lista.map(p=>p['Tipo Pago']).filter(Boolean))].join(' / '),
        entidad_pago:     [...new Set(lista.map(p=>p['Entidad Pago']).filter(Boolean))].join(' / '),
        forma_pago:       lista[0]['Forma Pago'] || '',
        cuotas:           lista[0]['Cuotas'] || '',
        cod_autorizacion: lista[0]['Cod Aut'] || '',
        bill_number:      lista[0]['Bill Number'] || '',
        importe:          lista.reduce((s,p) => s + toFloat(p['Importe']), 0),
      };
    };

    const pvs  = CACHE['puntos_venta'] || [];
    const disp = CACHE['dispositivos'] || [];

    // ── FICHAS SDS ──
    const fichas_sds = solic.map(s => {
      const srf_id  = s['Srf Id'] || '';
      const form    = s['Srf Form Number'] || '';
      const rep_d   = idx_rep[form] || {};
      const sant_d  = idx_sant[srf_id] || {};
      const imei    = rep_d['IMEI'] || '';
      const nim     = rep_d['Nim'] || s['Srf Cellular Number3'] || '';
      const term_d  = idx_term[imei] || {};
      const pago_d  = agg(pagos_sds[srf_id]);
      const titular = rep_d['Titular'] || '';
      const [ape_r='', nom_r=''] = titular.includes(',') ? titular.split(',',2).map(x=>x.trim()) : [titular,''];
      // Entidad correcta: Entidad Id de Solicitudes o Solicitantes (NO de Reportes que trae el padre)
      const entidadVenta = s['Entidad Id'] || sant_d['Entidad Id'] || term_d['Entidad'] || '';
      const pvMatch   = pvs.find(p => (p.entidades||[]).some(e => String(e) === String(entidadVenta)));
      const dispMatch = imei ? disp.find(d => d.nro_serie === imei) : null;
      // Fecha de activación — parsear correctamente desde cualquier formato
      const fechaRaw  = rep_d['Fecha-Activ'] || s['Srf Activation Date'] || sant_d['Srf Activation Date'] || '';
      const fechaActiv = parseFechaExcel(fechaRaw);
      // Portabilidad: si el PV es Call Center, la SDS no requiere IMEI
      const spnCodigo = s['Srf Spn Spc Id'] || s['Srf Spn Spc Id_sol'] || '';
      const planCodigo = s['Srf Rpl Id'] || s['Srf Rpl Id_sol'] || '';
      const clasificacion = clasificarSDS(spnCodigo, pvMatch, imei, dispMatch);
      const esPortabilidad = clasificacion.tipo_sds !== 'venta';
      return {
        id: DB.genId(),
        // sds_id = número REAL de SDS (Srf Form Number, ej: "34592098SEC")
        sds_id:        form || rep_d['SDS'] || '',
        // identificador = Srf Id, es la clave interna de cruce entre archivos
        identificador: srf_id,
        sds_form:      form, fuente: 'SDS',
        dni: sant_d['Srf Identification Number']||'', cuit: sant_d['Srf Cuit']||'',
        apellido: sant_d['Srf Client Last Name']||ape_r, nombre: sant_d['Srf Client First Name']||nom_r,
        telefono: sant_d['Srf Client Phone']||'', domicilio: sant_d['Srf Billing Street']||'',
        nro_domicilio: sant_d['Srf Billing Number']||'',
        ciudad: sant_d['Srf Billing City']||sant_d['Geu Description']||rep_d['Ciudad-POS']||'',
        cond_iva: sant_d['Srf Vat Id']||'',
        linea: nim, nse: rep_d['NSE']||s['Srf Hex Esn']||'',
        nro_cuenta: rep_d['Cuenta']||s['Srf Account Number1']||'',
        fecha_activacion: parseFechaExcel(rep_d['Fecha-Activ']||s['Srf Activation Date']||sant_d['Srf Activation Date']||''),
        fecha_venta: parseFechaExcel(rep_d['Fecha-Venta']||''),
        imei, sim: rep_d['NSE']||s['Srf Hex Esn']||'',
        modelo: term_d['Descripción']||rep_d['Equipo']||s['Srf Pro Id']||'',
        cod_producto: term_d['Cod. Producto']||s['Srf Pro Id']||'',
        agencia: s['Agente']||'', subagente: s['Subagente']||'',
        vendedor: rep_d['Vendedor']||'', vendedor_dni: rep_d['DNI Vendedor']||s['Srf Vendedor Dni']||'',
        coordinador: rep_d['Coordinador']||'', store: rep_d['Store']||'',
        tipo_venta: s['Pro Type']||'',
        entidad_pv: entidadVenta,
        punto_venta_id: pvMatch?.id||'', punto_venta_nombre: pvMatch?.nombre||'',
        tipo_pago: pago_d.tipo_pago||rep_d['Forma-pago']||'',
        entidad_pago: pago_d.entidad_pago||'', forma_pago: pago_d.forma_pago||rep_d['Forma-pago']||'',
        cuotas: pago_d.cuotas||'', importe: pago_d.importe||0,
        cod_autorizacion: pago_d.cod_autorizacion||'', bill_number: pago_d.bill_number||'',
        estado: s['Decode Srf Est Id']||'',
        bloque: rep_d['Bloque']||'', mercado: rep_d['Mercado']||'',
        plan: rep_d['Plan']||'', promocion: rep_d['Promoción']||'',
        presuspendida: rep_d['Presuspendida']||'',
        equipo_id: dispMatch?.id||'', equipo_vendido: !!dispMatch,
        tipo_sds: clasificacion.tipo_sds,
        spn_codigo: spnCodigo, spn_desc: clasificacion.spn_desc,
        plan_codigo: planCodigo,
        necesita_control: !esPortabilidad && (!imei || imei === '999999999999556' || !pvMatch || !(term_d['Descripción']||rep_d['Equipo']||s['Srf Pro Id'])),
        monto_eft:'', monto_ch:'', monto_tc:'', monto_td:'',
      };
    });

    // ── FICHAS CATER ──
    const fichas_cater = venta.map(v => {
      const imei    = v['IMEI'] || '';
      const bill    = v['Bill-Number'] || '';
      const term_d  = idx_term[imei] || {};
      const pago_d  = agg(pagos_bill[bill]);
      const pvMatch   = pvs.find(p => (p.entidades||[]).some(e => String(e) === String(v['Entidad Hija']||'')));
      const dispMatch = imei ? disp.find(d => d.nro_serie === imei) : null;
      return {
        id: DB.genId(),
        sds_id: v['Cater Sds Id']||'',
        identificador: v['Id Sds']||v['ID']||v['Cater Sds Id']||'',
        sds_form: '', fuente: 'CATER',
        dni:'', cuit:'', apellido: v['Apellido']||'', nombre: v['Nombre']||'',
        telefono:'', domicilio:'', nro_domicilio:'', ciudad:'', cond_iva: v['Cond-IVA']||'',
        linea: v['Nim']||'', nse:'', nro_cuenta: v['Cuenta']||'',
        fecha_activacion: parseFechaExcel(v['Fecha-Migracion']||''),
        fecha_venta: parseFechaExcel(v['Fecha-Migracion']||''),
        imei, sim: v['SIM']||'',
        modelo: v['Pro Model']||term_d['Descripción']||'', cod_producto: term_d['Cod. Producto']||'',
        agencia: v['Agencia']||'', subagente:'', vendedor:'', vendedor_dni: v['DNI-Vendedor']||'',
        coordinador:'', store:'', tipo_venta: v['TipoVenta']||'',
        entidad_pv: v['Entidad Hija']||'',
        punto_venta_id: pvMatch?.id||'', punto_venta_nombre: pvMatch?.nombre||'',
        tipo_pago: pago_d.tipo_pago||v['Forma-Pago Description']||'',
        entidad_pago: pago_d.entidad_pago||'', forma_pago: pago_d.forma_pago||v['Forma-Pago']||'',
        cuotas: pago_d.cuotas||'', importe: pago_d.importe||toFloat(v['Monto-Partida'])||0,
        cod_autorizacion: pago_d.cod_autorizacion||'', bill_number: bill,
        estado: term_d['Estado ID']||'', bloque:'', mercado:'', plan:'', promocion:'', presuspendida:'',
        equipo_id: dispMatch?.id||'', equipo_vendido: !!dispMatch,
        necesita_control: !imei || !pvMatch || !(v['Pro Model']||term_d['Descripción']),
        monto_eft: v['Eft']||'', monto_ch: v['Ch']||'', monto_tc: v['Tc']||'', monto_td: v['Td']||'',
      };
    });

    const todas = [...fichas_sds, ...fichas_cater];

    progreso(8, 10, 'Comparando contra base de datos...');
    await new Promise(r => setTimeout(r, 30));

    // ── Detectar códigos SPN y Plan nuevos ────────────────────────
    const planesConocidos = CACHE['planes_promociones'] || [];
    const spnsConocidos   = new Set(planesConocidos.filter(p=>p.tipo==='spn').map(p=>p.codigo));
    const planesConocidosSet = new Set(planesConocidos.filter(p=>p.tipo==='plan').map(p=>p.codigo));

    const spnsNuevos  = [...new Set(todas.map(f=>f.spn_codigo).filter(Boolean))].filter(c => !spnsConocidos.has(c));
    const planesNuevos = [...new Set(todas.map(f=>f.plan_codigo).filter(Boolean))].filter(c => !planesConocidosSet.has(c));

    // Si hay códigos nuevos, mostrar modal de configuración primero
    if (spnsNuevos.length || planesNuevos.length) {
      window._importPendiente = { ...window._importPendiente, todas, disp, spnsNuevos, planesNuevos };
      await mostrarModalCodigosNuevos(spnsNuevos, planesNuevos, todas, disp);
      return;
    }
    await new Promise(r => setTimeout(r, 30));

    // ── Detectar nuevas vs existentes con cambios ──────────────────
    const legajosExistentes = CACHE['legajos'] || await dbGet('legajos');
    const idxExistentes = Object.fromEntries(legajosExistentes.map(l => [l.sds_id, l]));

    // Campos clave a comparar para detectar cambios
    const CAMPOS_CLAVE = ['imei','modelo','punto_venta_id','punto_venta_nombre',
      'vendedor','vendedor_dni','fecha_activacion','linea','nro_cuenta',
      'tipo_pago','importe','entidad_pv','estado'];

    const nuevas   = todas.filter(f => f.sds_id && !idxExistentes[f.sds_id]);
    const cambios  = []; // { nueva, vieja, diferencias[] }

    for (const f of todas.filter(x => x.sds_id && idxExistentes[x.sds_id])) {
      const vieja = idxExistentes[f.sds_id];
      const diffs = CAMPOS_CLAVE.filter(k => {
        const vNew = String(f[k]||'').trim();
        const vOld = String(vieja[k]||'').trim();
        return vNew && vOld !== vNew; // solo si hay dato nuevo y es diferente
      });
      if (diffs.length > 0) cambios.push({ nueva: f, vieja, diferencias: diffs });
    }

    progreso(9, 10, `${nuevas.length} nuevas · ${cambios.length} con cambios...`);
    await new Promise(r => setTimeout(r, 30));

    // Si hay cambios, mostrar modal de preview antes de continuar
    if (cambios.length > 0 || nuevas.length === 0) {
      // Guardar estado para que los botones del modal puedan acceder
      window._importPendiente = { nuevas, cambios, disp, marcados: 0 };
      mostrarModalPreviewImport(nuevas, cambios);
      return; // El modal se encarga de llamar a confirmarImportacion()
    }

    // Sin cambios — solo nuevas, guardar directo
    await _ejecutarImportacion(nuevas, [], disp);

  } catch(e) {
    if (estadoEl) estadoEl.innerHTML = `<div style="padding:10px;background:var(--acento-suave);border:1px solid var(--acento);border-radius:8px;font-size:12px;color:var(--acento)">❌ Error: ${e.message}</div>`;
    toast('Error: ' + e.message, 'error');
    console.error('procesarExcel5:', e);
  }
}

        <button class="btn btn-primary" onclick="guardarCodigosYContinuar()">💾 Guardar y continuar</button>
      </div>
    </div>
  `;
  document.body.appendChild(modal);
}

async function guardarCodigosYContinuar() {
  const { spnsNuevos = [], planesNuevos = [] } = window._importPendiente || {};

  const nuevosPlanes = [];

  for (const c of spnsNuevos) {
    nuevosPlanes.push({
      id:            DB.genId(),
      codigo:        c,
      tipo:          'spn',
      descripcion:   document.getElementById(`spn-desc-${c}`)?.value.trim() || '',
      categoria:     document.getElementById(`spn-cat-${c}`)?.value || 'otro',
      requiere_imei: document.getElementById(`spn-imei-${c}`)?.value === 'true',
      activo:        true,
    });
  }

  for (const c of planesNuevos) {
    nuevosPlanes.push({
      id:            DB.genId(),
      codigo:        c,
      tipo:          'plan',
      descripcion:   document.getElementById(`plan-desc-${c}`)?.value.trim() || '',
      categoria:     'otro',
      requiere_imei: true,
      activo:        true,
    });
  }

  cerrarModal('modal-codigos-nuevos');

  if (nuevosPlanes.length) {
    try {
      await sbUpsertMany('planes_promociones', nuevosPlanes);
      dbInvalidate('planes_promociones');
      await dbGet('planes_promociones');
      toast(`✅ ${nuevosPlanes.length} códigos guardados`);
    } catch(e) {
      toast('Error al guardar códigos: ' + e.message, 'error');
    }
  }

  await continuarImportSinCodigos();
}

async function continuarImportSinCodigos() {
  cerrarModal('modal-codigos-nuevos');
  const { todas, disp } = window._importPendiente || {};
  if (!todas) return;

  // Continuar con el flujo normal de comparación
  const legajosExistentes = CACHE['legajos'] || await dbGet('legajos');
  const idxExistentes = Object.fromEntries(legajosExistentes.map(l => [l.sds_id, l]));
  const CAMPOS_CLAVE = ['imei','modelo','punto_venta_id','punto_venta_nombre',
    'vendedor','vendedor_dni','fecha_activacion','linea','nro_cuenta',
    'tipo_pago','importe','entidad_pv','estado','tipo_sds'];

  const nuevas  = todas.filter(f => f.sds_id && !idxExistentes[f.sds_id]);
  const cambios = [];
  for (const f of todas.filter(x => x.sds_id && idxExistentes[x.sds_id])) {
    const vieja = idxExistentes[f.sds_id];
    const diffs = CAMPOS_CLAVE.filter(k => {
      const vNew = String(f[k]||'').trim();
      const vOld = String(vieja[k]||'').trim();
      return vNew && vOld !== vNew;
    });
    if (diffs.length > 0) cambios.push({ nueva: f, vieja, diferencias: diffs });
  }

  if (cambios.length > 0 || nuevas.length === 0) {
    window._importPendiente = { ...window._importPendiente, nuevas, cambios };
    mostrarModalPreviewImport(nuevas, cambios);
    return;
  }
  await _ejecutarImportacion(nuevas, [], disp);
}

async function confirmarImportacion() {
  const { nuevas, cambios, disp } = window._importPendiente || {};
  if (!nuevas && !cambios) return;

  // Leer checkboxes ANTES de cerrar el modal
  const seleccionados = new Set(
    [...document.querySelectorAll('.chk-actualizar:checked')]
      .map(c => c.dataset.sds)
  );
  const todosMarcados = document.querySelectorAll('.chk-actualizar').length;
  // Si no hay checkboxes visibles (todos seleccionados por defecto), actualizar todos
  const aActualizar = todosMarcados > 0
    ? cambios.filter(c => seleccionados.has(c.nueva.sds_id))
    : cambios;

  cerrarModal('modal-preview-import');

  const estadoEl = document.getElementById('sds-import-estado');
  if (estadoEl) estadoEl.innerHTML = `<div style="padding:10px;background:var(--azul-suave);border:1px solid var(--azul);border-radius:8px;font-size:12px;color:var(--azul)">🔄 Guardando ${nuevas.length} nuevas + ${aActualizar.length} actualizaciones...</div>`;

  await _ejecutarImportacion(nuevas, aActualizar, disp);
}

async function _ejecutarImportacion(nuevas, aActualizar, disp) {
  const estadoEl = document.getElementById('sds-import-estado');

  const progreso = (paso, total, msg) => {
    if (!estadoEl) return;
    const pct = total ? Math.round((paso / total) * 100) : 0;
    estadoEl.innerHTML = `
      <div style="padding:10px 12px;background:var(--azul-suave);border:1px solid var(--azul);border-radius:8px;font-size:12px;color:var(--azul)">
        <div style="display:flex;justify-content:space-between;margin-bottom:6px">
          <span>🔄 ${msg}</span>
          <span style="font-weight:700">${pct}%</span>
        </div>
        <div style="background:#dbeafe;border-radius:4px;height:6px">
          <div style="background:var(--azul);height:100%;width:${pct}%;transition:width .3s;border-radius:4px"></div>
        </div>
      </div>`;
  };

  const dispCache = disp || CACHE['dispositivos'] || [];
  let marcados = 0;
  const LOTE = 50; // registros por lote
  let paso = 0;
  const total = (nuevas?.length || 0) + (aActualizar?.length || 0) + 2;

  // ── 1. Guardar nuevas en lotes ─────────────────────────────────
  if (nuevas?.length) {
    progreso(paso, total, `Guardando ${nuevas.length} legajos nuevos...`);

    // Marcar equipos vendidos de las nuevas
    for (const l of nuevas.filter(x => x.equipo_id)) {
      const d = dispCache.find(x => x.id === l.equipo_id);
      if (d && d.estado !== 'vendido') {
        await sbUpsert('dispositivos', { ...d, estado: 'vendido' });
        marcados++;
      }
    }

    // Guardar en lotes
    for (let i = 0; i < nuevas.length; i += LOTE) {
      const lote = nuevas.slice(i, i + LOTE);
      progreso(paso + i, total, `Guardando nuevas ${i+1}–${Math.min(i+LOTE, nuevas.length)} de ${nuevas.length}...`);
      await sbUpsertMany('legajos', lote);
      await new Promise(r => setTimeout(r, 20));
    }
    paso += nuevas.length;
  }

  // ── 2. Actualizar existentes en lotes ─────────────────────────
  if (aActualizar?.length) {
    progreso(paso, total, `Actualizando ${aActualizar.length} registros existentes...`);

    // Construir registros merged
    const legajosActuales = CACHE['legajos'] || [];
    const idxActuales = Object.fromEntries(legajosActuales.map(l => [l.sds_id, l]));

    const registrosAGuardar = aActualizar.map(c => {
      const existente = idxActuales[c.nueva.sds_id] || {};
      return { ...existente, ...c.nueva, id: existente.id || c.nueva.id };
    });

    // Marcar equipos vendidos si cambió el IMEI
    for (const c of aActualizar) {
      if (c.nueva.imei && c.nueva.imei !== c.vieja?.imei) {
        const d = dispCache.find(x => x.nro_serie === c.nueva.imei);
        if (d && d.estado !== 'vendido') {
          await sbUpsert('dispositivos', { ...d, estado: 'vendido' });
          marcados++;
        }
      }
    }

    // Guardar en lotes
    for (let i = 0; i < registrosAGuardar.length; i += LOTE) {
      const lote = registrosAGuardar.slice(i, i + LOTE);
      progreso(paso + i, total, `Actualizando ${i+1}–${Math.min(i+LOTE, registrosAGuardar.length)} de ${registrosAGuardar.length}...`);
      await sbUpsertMany('legajos', lote);
      await new Promise(r => setTimeout(r, 20));
    }
    paso += aActualizar.length;
  }

  // ── 3. Sincronizar vendedores ──────────────────────────────────
  progreso(paso + 1, total, 'Sincronizando vendedores...');
  const todasLasFichas = [...(nuevas||[]), ...(aActualizar||[]).map(c=>c.nueva)];
  const resVend = await sincronizarVendedoresDesdeImport(todasLasFichas);

  // ── 4. Refrescar cache ─────────────────────────────────────────
  progreso(total - 1, total, 'Actualizando datos locales...');
  dbInvalidate('legajos'); dbInvalidate('dispositivos');
  await Promise.all([dbGet('legajos'), dbGet('dispositivos')]);

  progreso(total, total, 'Completado');

  // ── 5. Resultado final ─────────────────────────────────────────
  const conImei    = (nuevas||[]).filter(f => f.imei && f.imei !== '999999999999556').length;
  const actualizados = aActualizar?.length || 0;
  const msgActual  = actualizados > 0 ? ` · <strong>${actualizados}</strong> actualizadas` : '';
  const msgVend    = resVend.nuevos ? ` · ${resVend.nuevos} vendedores nuevos` : '';

  if (estadoEl) estadoEl.innerHTML = `
    <div style="padding:10px 12px;background:var(--verde-suave);border:1px solid var(--verde);border-radius:8px;font-size:12px;color:var(--verde)">
      <p style="font-weight:700;margin-bottom:4px">✅ Importación completada</p>
      <p style="margin:0">
        ${(nuevas||[]).length} nuevas · ${conImei} con IMEI · ${marcados} equipos vendidos${msgActual}${msgVend}
      </p>
    </div>`;

  toast(`✅ ${(nuevas||[]).length} nuevas${actualizados ? ` · ${actualizados} actualizadas` : ''}`);
  setTimeout(() => { cerrarModal('modal-import-sds'); navegar('legajos'); }, 2000);
}

// Auto-registrar/actualizar vendedores al importar SDS
async function sincronizarVendedoresDesdeImport(fichas) {
  const vendExistentes = CACHE['vendedores'] || await dbGet('vendedores');
  const pvs = CACHE['puntos_venta'] || [];

  // Índice por DNI — clave de deduplicación
  const idx = Object.fromEntries(vendExistentes.map(v => [v.dni, { ...v }]));

  const dniNuevos = new Set();
  const dniActualizados = new Set();

  for (const f of fichas) {
    if (!f.vendedor && !f.vendedor_dni) continue;
    const dni = f.vendedor_dni || '';
    if (!dni) continue;

    if (idx[dni]) {
      // Acumular ventas — el idx ya tiene la última versión, solo sumamos 1
      idx[dni].total_ventas = (idx[dni].total_ventas || 0) + 1;
      dniActualizados.add(dni);
    } else {
      // Nuevo vendedor — crearlo en el índice la primera vez
      if (!dniNuevos.has(dni)) {
        const pvMatch = pvs.find(p => (p.entidades||[]).some(e => String(e) === String(f.entidad_pv||'')));
        idx[dni] = {
          id:                 DB.genId(),
          nombre:             f.vendedor || '',
          dni,
          entidad_id:         f.entidad_pv || '',
          punto_venta_id:     pvMatch?.id || f.punto_venta_id || '',
          punto_venta_nombre: pvMatch?.nombre || f.punto_venta_nombre || '',
          agente:             f.agencia || '',
          store:              f.store || '',
          total_ventas:       1,
        };
        dniNuevos.add(dni);
      } else {
        // Ya lo creamos en este lote — solo sumar venta
        idx[dni].total_ventas = (idx[dni].total_ventas || 0) + 1;
      }
    }
  }

  // Construir arrays únicos por id (sin duplicados)
  const nuevos      = [...dniNuevos].map(dni => idx[dni]);
  const actualizados = [...dniActualizados].map(dni => idx[dni]);

  if (nuevos.length)       await sbUpsertMany('vendedores', nuevos);
  if (actualizados.length) await sbUpsertMany('vendedores', actualizados);
  dbInvalidate('vendedores');
  return { nuevos: nuevos.length, actualizados: actualizados.length };
}

// Determinar tipo de SDS a partir del código SPN y contexto
function clasificarSDS(spnCodigo, pvMatch, imei, dispMatch) {
  const planes = CACHE['planes_promociones'] || [];
  const spn    = planes.find(p => p.tipo === 'spn' && p.codigo === String(spnCodigo||'').trim());

  // Si el PV es Call Center, siempre es portabilidad/línea nueva (sin IMEI)
  if (pvMatch?.es_call_center) {
    const cat = spn?.categoria || 'portabilidad';
    return { tipo_sds: cat === 'venta_equipo' ? 'venta' : cat, requiere_imei: false, spn_desc: spn?.descripcion || '' };
  }

  // Si el código SPN está registrado, usar su configuración
  if (spn) {
    return {
      tipo_sds:     spn.categoria === 'venta_equipo' ? 'venta' : spn.categoria,
      requiere_imei: spn.requiere_imei,
      spn_desc:     spn.descripcion || '',
    };
  }

  // Sin registro: si hay IMEI en stock es venta, si no es a controlar
  return {
    tipo_sds:     dispMatch ? 'venta' : (imei ? 'venta' : 'portabilidad'),
    requiere_imei: true,
    spn_desc:     '',
  };
}

// Función central: dada una SDS del cache, re-evalúa su estado con la config actual
function reClasificarLegajo(l) {
  const pvs  = CACHE['puntos_venta'] || [];
  const disp = CACHE['dispositivos'] || [];

  // Doble chequeo de PV:
  // 1. Por entidad_pv directa
  let pvMatch = pvs.find(p => (p.entidades||[]).some(e => String(e) === String(l.entidad_pv||'')));
  // 2. Por vendedor si no encontró por entidad
  if (!pvMatch && l.vendedor_dni) {
    const vendedor = (CACHE['vendedores'] || []).find(v => v.dni === l.vendedor_dni);
    if (vendedor?.punto_venta_id) pvMatch = pvs.find(p => p.id === vendedor.punto_venta_id);
  }

  const dispMatch    = l.imei && l.imei !== '999999999999556' ? disp.find(d => d.nro_serie === l.imei) : null;
  const clasificacion = clasificarSDS(l.spn_codigo, pvMatch, l.imei, dispMatch);

  const tipoSinImei  = ['portabilidad','linea_nueva','ctc'].includes(clasificacion.tipo_sds);
  const tieneImeiReal = !!(l.imei && l.imei !== '999999999999556');
  const imeiEnStock   = !!dispMatch;

  // Necesita control SOLO si el tipo requiere equipo Y el IMEI no está en stock
  const necesitaCtrl = !tipoSinImei && (!tieneImeiReal || !imeiEnStock);

  // Motivo específico para mostrar en UI
  let ctrl_motivo = '';
  if (necesitaCtrl) {
    ctrl_motivo = !tieneImeiReal ? 'sin_imei' : 'imei_no_en_stock';
  }

  return {
    ...l,
    tipo_sds:            clasificacion.tipo_sds,
    spn_desc:            clasificacion.spn_desc || l.spn_desc || '',
    punto_venta_id:      pvMatch?.id     || l.punto_venta_id     || '',
    punto_venta_nombre:  pvMatch?.nombre || l.punto_venta_nombre || '',
    equipo_id:           dispMatch?.id   || l.equipo_id          || '',
    equipo_vendido:      !!dispMatch,
    necesita_control:    necesitaCtrl,
    ctrl_motivo,
    pv_detectado_id:     pvMatch?.id     || '',
    pv_detectado_nombre: pvMatch?.nombre || '',
  };
}

// ── Re-verificar SDS individual ───────────────────────────────────────────────
async function reverificarSDS(id) {
  const legajos = CACHE['legajos'] || [];
  const l       = legajos.find(x => x.id === id);
  if (!l) return;

  const actualizado = reClasificarLegajo(l);

  const CAMPOS_CLAVE = ['tipo_sds','necesita_control','punto_venta_id',
    'punto_venta_nombre','equipo_id','equipo_vendido'];
  const LABEL = {
    tipo_sds: 'Tipo SDS', necesita_control: 'Necesita Control',
    punto_venta_id: 'PV (ID)', punto_venta_nombre: 'Punto de Venta',
    equipo_id: 'Equipo ID', equipo_vendido: 'Equipo Vendido',
  };

  const diffs = CAMPOS_CLAVE.filter(k =>
    String(actualizado[k]||'') !== String(l[k]||'')
  );

  const sinProblema = !actualizado.necesita_control;

  // Mostrar modal con resultado
  const modal = document.createElement('div');
  modal.className = 'modal-overlay';
  modal.id = 'modal-reverificar';
  modal.innerHTML = `
    <div class="modal" style="max-width:560px">
      <div class="modal-header">
        <h3>🔄 Re-verificar SDS ${l.sds_id}</h3>
        <button class="btn btn-icon btn-secondary" onclick="cerrarModal('modal-reverificar')">✕</button>
      </div>
      <div class="modal-body">
        <div style="padding:8px 12px;background:${sinProblema ? 'var(--verde-suave)' : 'var(--amarillo-suave)'};
          border:1px solid ${sinProblema ? 'var(--verde)' : 'var(--amarillo)'};border-radius:8px;margin-bottom:12px;font-size:13px;
          color:${sinProblema ? 'var(--verde)' : 'var(--amarillo)'}">
          ${sinProblema
            ? `✅ Esta SDS puede resolverse automáticamente. Tipo: <strong>${actualizado.tipo_sds}</strong>`
            : `⚠️ La SDS sigue sin poder resolverse — no tiene IMEI real y no es portabilidad/línea nueva/CTC.`}
        </div>
        ${diffs.length ? `
          <p style="font-size:12px;font-weight:600;margin-bottom:8px">Cambios que se aplicarán:</p>
          <table style="width:100%;font-size:12px;border-collapse:collapse">
            <thead><tr style="background:var(--gris-100)">
              <th style="padding:6px 8px;text-align:left">Campo</th>
              <th style="padding:6px 8px;text-align:left;color:var(--acento)">Valor actual</th>
              <th style="padding:6px 8px;text-align:left;color:var(--verde)">Valor nuevo</th>
            </tr></thead>
            <tbody>
              ${diffs.map(k => `
                <tr style="border-top:1px solid var(--gris-200)">
                  <td style="padding:6px 8px;font-weight:600">${LABEL[k]||k}</td>
                  <td style="padding:6px 8px;color:var(--acento)">${String(l[k]??'—')}</td>
                  <td style="padding:6px 8px;color:var(--verde)">${String(actualizado[k]??'—')}</td>
                </tr>`).join('')}
            </tbody>
          </table>` : `<p style="font-size:12px;color:var(--gris-600)">No se detectaron diferencias con la configuración actual.</p>`}

        ${!sinProblema ? `<p style="font-size:11px;color:var(--gris-500);margin-top:10px">
          Si esta SDS es un duplicado o dato incorrecto, podés eliminarla con el botón de abajo.
        </p>` : ''}
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" style="color:var(--acento)"
          onclick="eliminarSDS('${l.id}','${(l.sds_id||'').replace(/'/g,'')}');cerrarModal('modal-reverificar')">
          🗑️ Eliminar SDS
        </button>
        <button class="btn btn-primary" onclick="aplicarReverificacion('${l.id}')">
          ✅ ${sinProblema ? 'Resolver y actualizar' : 'Aplicar cambios disponibles'}
        </button>
      </div>
    </div>
  `;
  document.body.appendChild(modal);
  window._reverificacion = { id, actualizado };
}

async function aplicarReverificacion(id) {
  const { actualizado } = window._reverificacion || {};
  if (!actualizado) return;
  cerrarModal('modal-reverificar');
  await sbUpsert('legajos', actualizado);
  dbInvalidate('legajos');
  await dbGet('legajos');
  toast(actualizado.necesita_control ? '⚠️ SDS actualizada (sigue requiriendo control manual)' : '✅ SDS resuelta correctamente');
  navegar('legajos');
}

// ── Re-verificar TODAS las en error ──────────────────────────────────────────
async function reverificarTodasLasEnError() {
  const legajos   = CACHE['legajos'] || [];
  const disp      = CACHE['dispositivos'] || [];
  const imeiStock = new Set(disp.map(d => d.nro_serie).filter(Boolean));

  const enError = legajos.filter(l => {
    if (l.tipo_sds === 'portabilidad') return false;
    if (!l.imei || l.imei === '999999999999556') return true;
    if (!imeiStock.has(l.imei)) return true;
    return l.necesita_control;
  });

  if (!enError.length) { toast('No hay SDS en error para reverificar', 'warning'); return; }

  // Re-clasificar cada una
  const actualizadas   = enError.map(l => reClasificarLegajo(l));
  const resueltas      = actualizadas.filter(l => !l.necesita_control);
  const sinResolver    = actualizadas.filter(l => l.necesita_control);

  const modal = document.createElement('div');
  modal.className = 'modal-overlay';
  modal.id = 'modal-reverif-masivo';
  modal.innerHTML = `
    <div class="modal" style="max-width:480px">
      <div class="modal-header">
        <h3>🔄 Re-verificación masiva</h3>
        <button class="btn btn-icon btn-secondary" onclick="cerrarModal('modal-reverif-masivo')">✕</button>
      </div>
      <div class="modal-body">
        <div style="display:flex;flex-direction:column;gap:8px">
          ${resueltas.length ? `
          <div style="padding:10px 14px;background:var(--verde-suave);border:1px solid var(--verde);border-radius:8px;font-size:13px;color:var(--verde)">
            ✅ <strong>${resueltas.length}</strong> SDS se resolverán automáticamente con la configuración actual.
          </div>` : `
          <div style="padding:10px 14px;background:var(--gris-100);border:1px solid var(--gris-300);border-radius:8px;font-size:13px;color:var(--gris-600)">
            Sin cambios disponibles con la configuración actual.
          </div>`}
          ${sinResolver.length ? `
          <div style="padding:10px 14px;background:var(--amarillo-suave);border:1px solid var(--amarillo);border-radius:8px;font-size:13px;color:var(--amarillo)">
            ⚠️ <strong>${sinResolver.length}</strong> SDS siguen sin resolverse automáticamente.
            Requieren IMEI real o configuración de tipo SDS.
          </div>` : ''}
        </div>
        ${resueltas.length ? `<p style="font-size:12px;color:var(--gris-500);margin-top:12px">
          ¿Aplicar los cambios a las <strong>${resueltas.length}</strong> SDS resolubles?
        </p>` : ''}
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="cerrarModal('modal-reverif-masivo')">Cancelar</button>
        ${resueltas.length ? `
        <button class="btn btn-primary" onclick="aplicarReverificacionMasiva()">
          ✅ Resolver ${resueltas.length} SDS
        </button>` : ''}
      </div>
    </div>
  `;
  document.body.appendChild(modal);
  window._reverificacionMasiva = actualizadas;
}

async function aplicarReverificacionMasiva() {
  const actualizadas = window._reverificacionMasiva || [];
  if (!actualizadas.length) return;
  cerrarModal('modal-reverif-masivo');

  const content = document.getElementById('content-area');
  if (content) content.innerHTML = '<div style="padding:40px;text-align:center;color:var(--gris-500)">🔄 Aplicando cambios...</div>';

  const LOTE = 50;
  for (let i = 0; i < actualizadas.length; i += LOTE) {
    await sbUpsertMany('legajos', actualizadas.slice(i, i + LOTE));
  }
  dbInvalidate('legajos');
  await dbGet('legajos');
  const resueltas = actualizadas.filter(l => !l.necesita_control).length;
  toast(`✅ ${resueltas} SDS resueltas · ${actualizadas.length - resueltas} siguen en control`);
  navegar('legajos');
}

async function confirmarIngresarAlStock(legajoId) {
  const leg  = (CACHE['legajos']||[]).find(l => l.id === legajoId);
  if (!leg) return;
  const imei   = document.getElementById('ist-imei')?.value.trim();
  const pvId   = document.getElementById('ist-pv')?.value;
  const remito = document.getElementById('ist-remito')?.value.trim();
  const modelo = document.getElementById('ist-modelo')?.value.trim();
  const precio = parseFloat(document.getElementById('ist-precio')?.value)||0;
  if (!imei || imei.length < 10) { toast('IMEI inválido','error'); return; }
  if (!pvId) { toast('Seleccioná un punto de venta','error'); return; }
  const pvs = CACHE['puntos_venta']||[];
  const pv  = pvs.find(p=>p.id===pvId);
  const hoy = new Date().toLocaleDateString('es-AR');
  const nuevoDisp = {
    id: DB.genId(), nro_serie: imei,
    texto: modelo||leg.modelo||'', material: leg.cod_producto||'',
    marca: detectarMarcaPorPrefijo(modelo||leg.modelo||''),
    precio, estado: 'vendido',
    punto_venta_id: pvId, punto_venta_nombre: pv?.nombre||'',
    nro_remito: remito||'', fecha_ingreso: hoy,
  };
  await sbUpsert('dispositivos', nuevoDisp);
  if (remito) {
    await sbUpsert('remitos', {
      id: DB.genId(), nro_remito: remito, tipo: 'ingreso',
      punto_venta_id: pvId, punto_venta_nombre: pv?.nombre||'',
      fecha: hoy, cantidad_items: 1, total: precio, estado: 'procesado',
      observaciones: `Ingreso desde Control SDS — SDS ${leg.sds_id||''}`,
    });
  }
  await sbUpsert('legajos', {
    ...leg, imei, equipo_id: nuevoDisp.id, equipo_vendido: true,
    necesita_control: false, ctrl_motivo: '',
  });
  dbInvalidate('dispositivos'); dbInvalidate('remitos'); dbInvalidate('legajos');
  await Promise.all([dbGet('dispositivos'), dbGet('legajos')]);
  cerrarModal('modal-ingresar-stock');
  toast('✅ Equipo ingresado al stock y SDS resuelta');
  navegar('legajos');
}

async function eliminarSDS(id, sdsId) {
  if (!confirm(`⚠️ La SDS ${sdsId} será eliminada del sistema.\n¿Confirmás?`)) return;
  await SB.delete('legajos', id, SB_TOKEN);
  dbInvalidate('legajos');
  await dbGet('legajos');
  toast('SDS eliminada');
  navegar('control-sds');
}

// ── Eliminar TODAS las en error ───────────────────────────────────────────────
async function eliminarTodasLasEnError() {
  const legajos   = CACHE['legajos'] || [];
  const disp      = CACHE['dispositivos'] || [];
  const imeiStock = new Set(disp.map(d => d.nro_serie).filter(Boolean));

  const enError = legajos.filter(l => {
    if (l.tipo_sds === 'portabilidad') return false;
    if (!l.imei || l.imei === '999999999999556') return true;
    if (!imeiStock.has(l.imei)) return true;
    return l.necesita_control;
  });

  if (!enError.length) { toast('No hay SDS en error', 'warning'); return; }

  if (!confirm(`⚠️ Se eliminarán ${enError.length} SDS marcadas como "A Controlar".\nEsta acción no se puede deshacer. ¿Confirmás?`)) return;

  const estadoEl = document.querySelector('#content-area');
  if (estadoEl) estadoEl.innerHTML = '<div style="padding:40px;text-align:center;color:var(--gris-500)">🔄 Eliminando...</div>';

  for (const l of enError) {
    await SB.delete('legajos', l.id, SB_TOKEN);
  }
  dbInvalidate('legajos');
  await dbGet('legajos');
  toast(`✅ ${enError.length} SDS eliminadas`);
  navegar('control-sds');
}

function tablaControlSDS(legajos, imeiStock, pvs, mats) {
  if (!legajos.length) return `<div class="empty-state"><p>No hay legajos importados. Importalos desde el módulo Legajos/SDS.</p></div>`;

  return `
    <table>
      <thead>
        <tr>
          <th>Estado</th>
          <th>N° SDS</th>
          <th>Apellido y Nombre</th>
          <th>IMEI</th>
          <th>Modelo / Material</th>
          <th>Punto de Venta</th>
          <th>Problema</th>
          <th></th>
        </tr>
      </thead>
      <tbody>
        ${legajos.map(l => {
          const sinImei    = !l.imei || l.imei === '999999999999556';
          const imeiNoStock = l.imei && l.imei !== '999999999999556' && !imeiStock.has(l.imei);
          const sinPV      = !l.punto_venta_id && !l.punto_venta_nombre;
          const sinModelo  = !l.modelo;
          const esPortab   = l.tipo_sds === 'portabilidad';
          const controlar  = !esPortab && (sinImei || imeiNoStock || sinPV || sinModelo || l.necesita_control);

          const problemas = [];
          if (!esPortab) {
            if (sinImei)     problemas.push('Sin IMEI real');
            if (imeiNoStock) problemas.push('IMEI no encontrado en stock');
            if (sinPV)       problemas.push('Sin PV detectado');
            if (sinModelo)   problemas.push('Sin modelo');
          }

          const badge = esPortab
            ? `<span class="badge" style="background:#ede9fe;color:#7c3aed;border:1px solid #c4b5fd;font-weight:700">📞 Portabilidad</span>`
            : controlar
              ? `<span class="badge" style="background:#fee2e2;color:#dc2626;border:1px solid #fca5a5;font-weight:700">⚠️ Controlar</span>`
              : `<span class="badge badge-verde">✅ OK</span>`;

          return `
            <tr style="cursor:pointer;background:${controlar ? '#fff8f8' : ''}" onclick="verDetalleLegajo('${l.id}')">
              <td>${badge}</td>
              <td style="font-family:monospace;font-weight:700;color:var(--azul);font-size:11px">${l.sds_id || l.numero_sds || '—'}</td>
              <td style="font-size:12px">${l.apellido ? l.apellido+', '+(l.nombre||'') : '—'}</td>
              <td style="font-family:monospace;font-size:10px;color:${imeiNoStock||sinImei ? 'var(--acento)' : 'inherit'}">${l.imei || '—'}</td>
              <td style="font-size:12px">${l.modelo || '<span style="color:var(--amarillo)">Sin modelo</span>'}</td>
              <td style="font-size:12px">${l.punto_venta_nombre || (l.entidad_pv ? `<span style="color:var(--amarillo)">Entidad: ${l.entidad_pv}</span>` : '<span style="color:var(--acento)">Sin PV</span>')}</td>
              <td style="font-size:11px;color:var(--acento)">${problemas.join(' · ') || '—'}</td>
              <td onclick="event.stopPropagation()">
                ${controlar && !esPortab ? `
                  <div style="display:flex;gap:4px;flex-direction:column">
                    <button class="btn btn-sm btn-primary" onclick="event.stopPropagation();abrirModalIngresarDiferencia('${l.id}')">📥 Ingresar</button>
                    <button class="btn btn-sm btn-secondary" style="color:var(--azul);border-color:var(--azul)" onclick="event.stopPropagation();reverificarSDS('${l.id}')">🔄 Re-verificar</button>
                    <button class="btn btn-sm btn-secondary" style="color:var(--acento)" onclick="event.stopPropagation();eliminarSDS('${l.id}','${(l.sds_id||'').replace(/'/g,'')}')">🗑️ Eliminar</button>
                  </div>` : ''}
              </td>
            </tr>
          `;
        }).join('')}
      </tbody>
    </table>
  `;
}

function filtrarControlSDS() {
  const busq   = (document.getElementById('ctrl-search')?.value || '').toLowerCase();
  const filtro = document.getElementById('ctrl-filtro-estado')?.value || '';
  const disp   = CACHE['dispositivos'] || [];
  const pvs    = CACHE['puntos_venta'] || [];
  const mats   = CACHE['materiales'] || [];
  const imeiStock = new Set(disp.map(d => d.nro_serie).filter(Boolean));

  let leg = CACHE['legajos'] || [];

  if (busq) leg = leg.filter(l =>
    l.sds_id?.toLowerCase().includes(busq) ||
    l.imei?.toLowerCase().includes(busq) ||
    l.apellido?.toLowerCase().includes(busq) ||
    l.dni?.toLowerCase().includes(busq)
  );

  if (filtro === 'controlar') {
    leg = leg.filter(l => {
      if (l.tipo_sds === 'portabilidad') return false;
      const sinImei    = !l.imei || l.imei === '999999999999556';
      const imeiNoStock = l.imei && !imeiStock.has(l.imei);
      return sinImei || imeiNoStock || !l.punto_venta_id || !l.modelo || l.necesita_control;
    });
  } else if (filtro === 'ok') {
    leg = leg.filter(l => {
      if (l.tipo_sds === 'portabilidad') return false;
      const sinImei    = !l.imei || l.imei === '999999999999556';
      const imeiNoStock = l.imei && !imeiStock.has(l.imei);
      return !sinImei && !imeiNoStock && l.punto_venta_id && l.modelo && !l.necesita_control;
    });
  } else if (filtro === 'portabilidad') {
    leg = leg.filter(l => l.tipo_sds === 'portabilidad');
  }

  document.getElementById('control-sds-tabla').innerHTML = tablaControlSDS(leg, imeiStock, pvs, mats);
}

async function guardarDiferenciaControl(legajoId) {
  const leg    = (CACHE['legajos'] || []).find(l => l.id === legajoId);
  if (!leg) return;

  const pvs    = CACHE['puntos_venta'] || [];
  const disp   = CACHE['dispositivos'] || [];
  const imeiNuevo = document.getElementById('diff-imei')?.value.trim() || leg.imei || '';
  const pvId      = document.getElementById('diff-pv')?.value || leg.punto_venta_id || '';
  const matCod    = document.getElementById('diff-material')?.value || leg.cod_producto || '';
  const modeloNew = document.getElementById('diff-modelo')?.value.trim() || leg.modelo || '';
  const pv        = pvs.find(p => p.id === pvId);

  // Si hay IMEI nuevo y existe en el stock, marcar ese dispositivo como vendido
  let equipo_id = leg.equipo_id || '';
  if (imeiNuevo && imeiNuevo !== leg.imei) {
    const dispMatch = disp.find(d => d.nro_serie === imeiNuevo);
    if (dispMatch) {
      equipo_id = dispMatch.id;
      if (dispMatch.estado !== 'vendido') {
        await sbUpsert('dispositivos', { ...dispMatch, estado: 'vendido' });
      }
    }
  }

  const actualizado = {
    ...leg,
    imei:              imeiNuevo,
    punto_venta_id:    pvId,
    punto_venta_nombre: pv?.nombre || leg.punto_venta_nombre || '',
    cod_producto:      matCod,
    modelo:            modeloNew,
    equipo_id,
    equipo_vendido:    !!equipo_id,
    necesita_control:  false,
  };

  await sbUpsert('legajos', actualizado);
  dbInvalidate('legajos');
  dbInvalidate('dispositivos');
  await Promise.all([dbGet('legajos'), dbGet('dispositivos')]);
  cerrarModal('modal-ingresar-diferencia');
  toast('✅ Diferencia resuelta');
  navegar('control-sds');
}

// Lee un archivo Excel y devuelve { headers, data }
function leerExcel(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const XLSX = window.XLSX;
        const wb = XLSX.read(e.target.result, { type: 'array', cellDates: false });
        const ws = wb.Sheets[wb.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '' });
        if (rows.length < 2) { resolve({ headers: [], data: [] }); return; }
        const headers = rows[0].map(h => String(h).trim());
        const data = rows.slice(1).filter(r => r.some(c => c !== ''));
        resolve({ headers, data });
      } catch(err) { reject(err); }
    };
    reader.onerror = reject;
    reader.readAsArrayBuffer(file);
  });
}

function parsearFechaExcel(valor) {
  if (!valor) return '';
  if (typeof valor === 'number') {
    // Serial de Excel
    const epoch = new Date(1899, 11, 30);
    const d = new Date(epoch.getTime() + valor * 86400000);
    return d.toLocaleDateString('es-AR');
  }
  const s = String(valor).trim();
  if (/^\d{2}\/\d{2}\/\d{4}$/.test(s)) return s;
  const iso = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (iso) return `${iso[3]}/${iso[2]}/${iso[1]}`;
  return s;
}

function findCol(headers, ...candidatos) {
  const norm = s => String(s || '').trim().toLowerCase();
  for (const c of candidatos) {
    const idx = headers.findIndex(h => norm(h) === norm(c));
    if (idx !== -1) return idx;
  }
  for (const c of candidatos) {
    const idx = headers.findIndex(h => norm(h).includes(norm(c)));
    if (idx !== -1) return idx;
  }
  return -1;
}

function detectarMarca(texto) {
  const t = (texto || '').toUpperCase();
  if (t.includes('SAMSUNG')) return 'Samsung';
  if (t.includes('APPLE') || t.includes('IPHONE')) return 'Apple';
  if (t.includes('MOTOROLA') || t.includes('MOTO')) return 'Motorola';
  if (t.includes('XIAOMI') || t.includes('REDMI')) return 'Xiaomi';
  if (t.includes('LG')) return 'LG';
  if (t.includes('HUAWEI')) return 'Huawei';
  if (t.includes('TCL')) return 'TCL';
  if (t.includes('NOKIA')) return 'Nokia';
  if (t.includes('ZTE')) return 'ZTE';
  if (t.includes('ALCATEL')) return 'Alcatel';
  return '';
}

// Detecta marca por prefijo del código de material (estándar Claro AMX)
function detectarMarcaPorPrefijo(nombreOCodigo) {
  const t = (nombreOCodigo || '').toUpperCase();
  if (t.includes('USIM')) return 'SIM Card';
  if (t.includes('MOT'))  return 'Motorola';
  if (t.includes('SMG'))  return 'Samsung';
  if (t.includes('HUA'))  return 'Huawei';
  if (t.includes('HOR'))  return 'Honor';
  if (t.includes('TCL'))  return 'TCL';
  if (t.includes('APP'))  return 'Apple';
  // Fallback a detectarMarca por nombre completo
  return detectarMarca(nombreOCodigo);
}

// Busca un material por código en el cache
function buscarMaterialPorCodigo(codigo) {
  if (!codigo) return null;
  const mats = CACHE['materiales'] || [];
  return mats.find(m => m.codigo === codigo.trim()) || null;
}

// Detecta materiales nuevos (no están en el catálogo) dado un array de items
// Cada item debe tener: { material, texto } 
// Devuelve array de { codigo, nombre, marca } sin duplicados
function detectarMaterialesNuevos(items) {
  const existentes = new Set((CACHE['materiales'] || []).map(m => m.codigo));
  const vistos = new Set();
  const nuevos = [];
  for (const it of items) {
    const cod = (it.material || '').trim();
    if (!cod || existentes.has(cod) || vistos.has(cod)) continue;
    vistos.add(cod);
    nuevos.push({
      codigo: cod,
      nombre: it.texto || it.nombre || cod,
      marca:  detectarMarcaPorPrefijo(it.texto || it.nombre || cod),
      precio: it.precio || 0,
    });
  }
  return nuevos;
}

async function eliminarMaterial(id) {
  if (!confirm('¿Eliminar este material del catálogo?')) return;
  await SB.delete('materiales', id, SB_TOKEN);
  dbInvalidate('materiales');
  await dbGet('materiales');
  toast('Material eliminado');
  navegar('materiales');
}

async function guardarMaterialesNuevosDetectados(count) {
  const nuevos = [];
  for (let i = 0; i < count; i++) {
    const codigo = document.getElementById(`mat-nuevo-codigo-${i}`)?.value.trim();
    const nombre = document.getElementById(`mat-nuevo-nombre-${i}`)?.value.trim();
    const precio = parseFloat(document.getElementById(`mat-nuevo-precio-${i}`)?.value) || 0;
    if (!codigo) continue;
    nuevos.push({ id: DB.genId(), codigo, nombre: nombre || codigo, marca: detectarMarcaPorPrefijo(nombre || codigo), precio, notas: 'Detectado automáticamente' });
  }
  if (!nuevos.length) return;
  await sbUpsertMany('materiales', nuevos);
  dbInvalidate('materiales');
  await dbGet('materiales');
  cerrarModal('modal-mats-nuevos');
  toast(`✅ ${nuevos.length} material(es) guardado(s) en el catálogo`);
}

// Estado global del importador
let importadorState = {
  sheets: {},
  resultado: null,
};


async function cargarRemitoExcel(file) {
  if (!file) return;
  if (!window.XLSX) await cargarXLSX();
  const preview = document.getElementById('remito-preview');
  if (!preview) return;
  preview.innerHTML = '<p style="color:var(--gris-500);font-size:13px">⏳ Leyendo archivo...</p>';

  try {
    const sheet = await leerExcel(file);
    const { headers, data } = sheet;

    // Detectar columnas
    const iSerie  = findCol(headers,'Nro.Serie','NRO.SERIE','IMEI','Serie','serial','nro_serie');
    const iTexto  = findCol(headers,'Texto','TEXTO','texto','Descripcion','modelo','Descripción');
    const iMat    = findCol(headers,'Material','MATERIAL','material','Cod.Material','Cod Material');
    const iPrecio = findCol(headers,'Precio','PRECIO','precio','Valor','Importe','importe');
    const iFec    = findCol(headers,'Fec.Antig','Fecha.Antig','fec_antiguedad','FEC.ANTIG','Fecha Antiguedad');
    const iPedido = findCol(headers,'Nro.Pedido','NRO.PEDIDO','nro_pedido','Pedido','Nro Pedido','nro pedido');

    // Parsear filas
    const items = data.map(row => ({
      nro_serie:     String(row[iSerie]  ?? '').trim(),
      texto:         String(row[iTexto]  ?? '').trim(),
      material:      String(row[iMat]    ?? '').trim(),
      precio:        parseFloat(row[iPrecio]) || 0,
      fec_antiguedad:iFec !== -1 ? parsearFechaExcel(row[iFec]) : '',
      nro_pedido:    iPedido !== -1 ? String(row[iPedido] ?? '').trim() : '',
    })).filter(it => /^\d{10,19}$/.test(it.nro_serie));

    if (!items.length) {
      preview.innerHTML = '<p style="color:var(--acento);font-size:13px">No se encontraron IMEIs válidos en el archivo.</p>';
      return;
    }

    // Agrupar por número de pedido
    const pedidoMap = {};
    for (const it of items) {
      const k = it.nro_pedido || '(sin número de pedido)';
      if (!pedidoMap[k]) pedidoMap[k] = [];
      pedidoMap[k].push(it);
    }

    // Verificar cuáles pedidos ya están en stock
    await dbGet('dispositivos');
    const dispSet = new Set((CACHE['dispositivos'] || []).map(d => d.nro_serie));
    const pvs     = CACHE['puntos_venta'] || [];

    // Detectar materiales nuevos
    await dbGet('materiales');
    const todosItems = Object.values(pedidoMap).flat();
    const matsNuevos = detectarMaterialesNuevos(todosItems.map(it => ({ material: it.material, texto: it.texto, precio: it.precio })));
    const pedidoKeys = Object.keys(pedidoMap);

    preview.innerHTML = `
      ${matsNuevos.length ? `<div id="aviso-mat-excel" style="margin-bottom:12px"></div>` : ''}
      <div style="background:var(--azul-suave);border:1px solid var(--azul);border-radius:8px;padding:10px 14px;margin-bottom:14px;font-size:12px;color:var(--azul)">
        📦 <strong>${items.length}</strong> equipos detectados en
        <strong>${pedidoKeys.length}</strong> pedido(s). Asigná punto de venta y remito a cada uno.
      </div>

      <div id="pedidos-panel" style="display:flex;flex-direction:column;gap:12px;margin-bottom:14px">
        ${pedidoKeys.map((k, i) => {
          const its      = pedidoMap[k];
          const enStock  = its.filter(it => dispSet.has(it.nro_serie));
          const yaEnStock = enStock.length === its.length;

          return `
            <div style="border:1.5px solid ${yaEnStock ? 'var(--acento)' : 'var(--gris-300)'};border-radius:10px;overflow:hidden">
              <div style="background:${yaEnStock ? '#fee2e2' : 'var(--gris-100)'};padding:10px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap">
                ${yaEnStock
                  ? `<span style="font-size:18px">❌</span>
                     <div style="flex:1">
                       <p style="font-weight:700;color:var(--acento);font-size:13px;margin:0">Pedido: ${k}</p>
                       <p style="font-size:11px;color:var(--acento);margin:0">Ya está en stock (${its.length} equipos)</p>
                     </div>`
                  : `<input type="checkbox" id="chk-pedido-${i}" checked
                       style="width:16px;height:16px;cursor:pointer" />
                     <div style="flex:1">
                       <label for="chk-pedido-${i}" style="font-weight:700;font-size:13px;cursor:pointer">
                         Pedido: ${k}
                         <span style="font-weight:400;color:var(--gris-500);font-size:11px">
                           (${its.length} equipos${enStock.length ? ` · ⚠️ ${enStock.length} ya en stock` : ''})
                         </span>
                       </label>
                     </div>
                     <div style="display:flex;gap:8px;flex-wrap:wrap">
                       <select id="pv-pedido-${i}"
                         style="padding:6px 10px;border:1.5px solid var(--gris-300);border-radius:6px;font-size:12px;background:white">
                         <option value="">PV / Depósito...</option>
                         ${pvs.map(p => `<option value="${p.id}">${p.nombre}</option>`).join('')}
                       </select>
                       <input type="text" id="rem-pedido-${i}" placeholder="Nro. Remito"
                         style="padding:6px 10px;border:1.5px solid var(--gris-300);border-radius:6px;font-size:12px;width:130px" />
                     </div>`
                }
              </div>
              <div style="padding:8px 14px;background:white;max-height:140px;overflow-y:auto">
                <table style="width:100%;font-size:11px;border-collapse:collapse">
                  <thead><tr style="color:var(--gris-500)">
                    <th style="text-align:left;padding:3px 6px">IMEI</th>
                    <th style="text-align:left;padding:3px 6px">Descripción</th>
                    <th style="text-align:right;padding:3px 6px">Precio</th>
                    <th style="padding:3px 6px"></th>
                  </tr></thead>
                  <tbody>
                    ${its.map(it => `
                      <tr style="border-top:1px solid var(--gris-200)">
                        <td style="font-family:monospace;padding:3px 6px">${it.nro_serie}</td>
                        <td style="padding:3px 6px">${it.texto || it.material || '—'}</td>
                        <td style="text-align:right;padding:3px 6px">$${it.precio.toLocaleString('es-AR')}</td>
                        <td style="padding:3px 6px;text-align:center">
                          ${dispSet.has(it.nro_serie) ? '<span style="color:var(--acento);font-weight:700">✗</span>' : '<span style="color:var(--verde)">✓</span>'}
                        </td>
                      </tr>
                    `).join('')}
                  </tbody>
                </table>
              </div>
            </div>
          `;
        }).join('')}
      </div>

      <button class="btn btn-primary"
        onclick="importarRemitoExcelPorPedido(${JSON.stringify(pedidoKeys).replace(/"/g,'&quot;')}, ${JSON.stringify(Object.fromEntries(pedidoKeys.map((k,i)=>[k,i]))).replace(/"/g,'&quot;')})">
        📥 Importar pedidos seleccionados
      </button>
      <div id="aviso-mat-excel" style="margin-top:10px"></div>
    `;

    if (matsNuevos.length) mostrarAvisoMaterialesNuevos('aviso-mat-excel', matsNuevos);

    // Guardar datos para importación
    window._remitoExcelData = pedidoMap;

  } catch(e) {
    preview.innerHTML = `<p style="color:var(--acento);font-size:13px">Error al leer el archivo: ${e.message}</p>`;
    console.error(e);
  }
}

async function importarRemitoExcelPorPedido(pedidoKeys, pedidoIdx) {
  const pedidoMap = window._remitoExcelData;
  if (!pedidoMap) { toast('No hay datos para importar', 'error'); return; }

  const pvs  = CACHE['puntos_venta'] || [];
  const hoy  = new Date().toLocaleDateString('es-AR');
  const disp = CACHE['dispositivos'] || [];
  const dispSet = new Set(disp.map(d => d.nro_serie));

  let totalImportados = 0;
  const errores = [];

  for (const k of pedidoKeys) {
    const i   = pedidoIdx[k];
    const chk = document.getElementById(`chk-pedido-${i}`);

    // Si no tiene checkbox (ya en stock) o está desmarcado, saltar
    if (!chk || !chk.checked) continue;

    const pvId     = document.getElementById(`pv-pedido-${i}`)?.value;
    const nroRemito= document.getElementById(`rem-pedido-${i}`)?.value.trim();

    if (!pvId)      { errores.push(`Pedido ${k}: falta punto de venta`); continue; }
    if (!nroRemito) { errores.push(`Pedido ${k}: falta número de remito`); continue; }

    const pv  = pvs.find(p => p.id === pvId);
    const its = pedidoMap[k].filter(it => !dispSet.has(it.nro_serie)); // solo los que no están en stock

    if (!its.length) { errores.push(`Pedido ${k}: todos los equipos ya están en stock`); continue; }

    // Crear dispositivos
    const nuevosDisp = its.map(it => ({
      id:               DB.genId(),
      nro_serie:        it.nro_serie,
      texto:            it.texto || '',
      material:         it.material || '',
      marca:            detectarMarcaPorPrefijo(it.texto || it.material || ''),
      precio:           it.precio || 0,
      estado:           'disponible',
      punto_venta_id:   pvId,
      punto_venta_nombre: pv?.nombre || '',
      nro_remito:       nroRemito,
      nro_pedido:       k === '(sin número de pedido)' ? '' : k,
      fecha_ingreso:    hoy,
      fec_antiguedad:   it.fec_antiguedad || '',
      dias_antiguedad:  it.fec_antiguedad ? calcularDiasDesde(it.fec_antiguedad) : 0,
    }));

    await sbUpsertMany('dispositivos', nuevosDisp);
    await sbUpsert('remitos', {
      id:                DB.genId(),
      nro_remito:        nroRemito,
      nro_pedido:        k === '(sin número de pedido)' ? '' : k,
      tipo:              'ingreso',
      punto_venta_id:    pvId,
      punto_venta_nombre: pv?.nombre || '',
      fecha:             hoy,
      cantidad_items:    nuevosDisp.length,
      total:             nuevosDisp.reduce((s,d) => s + d.precio, 0),
      estado:            'procesado',
    });

    totalImportados += nuevosDisp.length;
  }

  dbInvalidate('dispositivos'); dbInvalidate('remitos');
  await Promise.all([dbGet('dispositivos'), dbGet('remitos')]);

  if (errores.length) {
    toast(`⚠️ ${totalImportados} equipos importados. Errores: ${errores.join(' | ')}`, 'warning');
  } else {
    toast(`✅ ${totalImportados} equipos importados correctamente`);
  }

  // Detectar materiales nuevos tras importar
  const todosItems = Object.values(pedidoMap).flat();
  const matsNuevos = detectarMaterialesNuevos(todosItems.map(it => ({ material: it.material, texto: it.texto, precio: it.precio })));
  if (matsNuevos.length) mostrarAvisoMaterialesNuevos('aviso-mat-excel', matsNuevos);

  irARemitos('historial');
}

function procesarWebcom() {
  const { solicitudes, solicitantes, terminales, pagos } = importadorState.sheets;
  if (!solicitudes || !solicitantes || !terminales || !pagos) {
    toast('Falta algún archivo', 'error'); return;
  }

  // Indexar por ID SDS
  function indexarPorSDS(sheet) {
    const idIdx = findCol(sheet.headers, 'Id Sds', 'id sds', 'IDSDS', 'id_sds');
    if (idIdx === -1) return {};
    const map = {};
    for (const row of sheet.data) {
      const id = String(row[idIdx] || '').trim();
      if (id) map[id] = row;
    }
    return map;
  }

  const pagosMap = indexarPorSDS(pagos);
  const solicitantesMap = indexarPorSDS(solicitantes);
  const terminalesMap = indexarPorSDS(terminales);
  const solicitudesMap = indexarPorSDS(solicitudes);

  const todosIds = new Set([
    ...Object.keys(pagosMap), ...Object.keys(solicitantesMap),
    ...Object.keys(terminalesMap), ...Object.keys(solicitudesMap),
  ]);

  const pvs = DB.get('puntos_venta');
  const pvMap = {};
  for (const pv of pvs) {
    for (const ent of (pv.entidades || [])) pvMap[String(ent).trim()] = pv;
  }

  const dispositivos = DB.get('dispositivos');
  const dispMap = {};
  for (const d of dispositivos) if (d.nro_serie) dispMap[d.nro_serie] = d;

  let legajosOk = 0, legajosError = 0, imeisPendientes = [];
  const legajosNuevos = [];

  for (const idSds of todosIds) {
    const rowPagos = pagosMap[idSds];
    const rowSol = solicitantesMap[idSds];
    const rowTerm = terminalesMap[idSds];
    const rowSolic = solicitudesMap[idSds];

    const errores = [];

    // Fecha activación
    let fechaAct = '';
    if (rowPagos) {
      const i = findCol(pagos.headers, 'Fecha Activación', 'Fecha Activacion', 'fecha activación');
      if (i !== -1) fechaAct = parsearFechaExcel(rowPagos[i]);
    }

    // IMEI
    let imei = '';
    if (rowTerm) {
      const i = findCol(terminales.headers, 'Nro Serie', 'nro serie', 'IMEI', 'Serie');
      if (i !== -1) imei = String(rowTerm[i] || '').trim();
    }

    // NIM
    let nim = '';
    if (rowPagos) {
      const i = findCol(pagos.headers, 'Bill Number', 'Nim', 'NIM', 'nim');
      if (i !== -1) nim = String(rowPagos[i] || '').trim();
    }

    // Entidad
    let entidad = '';
    if (rowSolic) {
      const i = findCol(solicitudes.headers, 'Entidad', 'entidad', 'entity');
      if (i !== -1) entidad = String(rowSolic[i] || '').trim();
    }

    // Importe
    let importe = 0;
    if (rowPagos) {
      const i = findCol(pagos.headers, 'Importe', 'importe', 'monto', 'Amount');
      if (i !== -1) importe = parseFloat(rowPagos[i]) || 0;
    }

    // Datos cliente
    let apellido = '', nombre = '', dni = '', telefono = '';
    if (rowSol) {
      const iAp = findCol(solicitantes.headers, 'Apellido', 'apellido');
      const iNom = findCol(solicitantes.headers, 'Nombre', 'nombre');
      const iDni = findCol(solicitantes.headers, 'Documento', 'documento', 'DNI', 'dni');
      const iTel = findCol(solicitantes.headers, 'Telefono', 'teléfono', 'tel');
      if (iAp !== -1) apellido = String(rowSol[iAp] || '').trim();
      if (iNom !== -1) nombre = String(rowSol[iNom] || '').trim();
      if (iDni !== -1) dni = String(rowSol[iDni] || '').trim();
      if (iTel !== -1) telefono = String(rowSol[iTel] || '').trim();
    }

    // Validaciones
    const pv = pvMap[entidad];
    if (!pv && entidad) errores.push(`Entidad ${entidad} no mapeada a ningún PV`);
    if (!imei) errores.push('IMEI no encontrado en terminales');
    if (imei && !dispMap[imei]) imeisPendientes.push({ imei, tipo: 'equipo', entidad_id: entidad, id_sds: idSds });

    const estado = errores.length === 0 ? 'ok' : (imei && !dispMap[imei] ? 'error_imei' : 'error_entidad');
    if (estado === 'ok') legajosOk++; else legajosError++;

    legajosNuevos.push({
      id: DB.genId(), id_sds: idSds, numero_sds: idSds,
      fecha_activacion: fechaAct, nim, imei, importe,
      entidad_id: entidad, punto_venta_id: pv?.id || '', punto_venta_nombre: pv?.nombre || '',
      apellido, nombre, doc_numero: dni, telefono,
      estado, errores, origen_archivo: 'webcom',
    });

    // Actualizar dispositivo si existe y es ok
    if (estado === 'ok' && dispMap[imei]) {
      const disps = DB.get('dispositivos');
      const idx = disps.findIndex(d => d.nro_serie === imei);
      if (idx !== -1) {
        disps[idx].estado = 'vendido';
        disps[idx].fecha_venta = fechaAct;
        disps[idx].notas = `Vendido - NIM: ${nim} | ${apellido} ${nombre} | SDS: ${idSds}`;
        DB.set('dispositivos', disps);
      }
      // Registrar en cuenta corriente
      if (pv && importe > 0) {
        const cuentas = DB.get('cuentas_corrientes');
        const anteriores = cuentas.filter(c => c.punto_venta_id === pv.id);
        const saldoAnt = anteriores.length ? anteriores[anteriores.length - 1].saldo_acumulado : 0;
        cuentas.push({
          id: DB.genId(), punto_venta_id: pv.id, punto_venta_nombre: pv.nombre,
          tipo: 'haber', concepto: `Venta IMEI ${imei} - SDS ${idSds}`,
          importe, saldo_acumulado: saldoAnt + importe,
          imei, numero_sds: idSds, fecha: fechaAct,
        });
        DB.set('cuentas_corrientes', cuentas);
      }
    }
  }

  // Guardar legajos
  const legajosExistentes = DB.get('legajos') || [];
  DB.set('legajos', [...legajosExistentes, ...legajosNuevos]);

  // Guardar IMEIs pendientes
  const pendExist = DB.get('imeis_pendientes') || [];
  DB.set('imeis_pendientes', [...pendExist, ...imeisPendientes]);

  // Mostrar resultado
  const res = document.getElementById('webcom-resultado');
  const legajosConError = legajosNuevos.filter(l => l.errores && l.errores.length > 0);
  window._ultimoLogImportacion = legajosNuevos; // para descarga de log

  if (res) {
    res.innerHTML = `
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px;margin-top:16px">
        <div class="stat-card" style="padding:14px;text-align:center"><div class="label">Total SDS</div><div class="valor" style="font-size:22px">${legajosNuevos.length}</div></div>
        <div class="stat-card verde" style="padding:14px;text-align:center"><div class="label">Procesados OK</div><div class="valor" style="font-size:22px">${legajosOk}</div></div>
        <div class="stat-card rojo" style="padding:14px;text-align:center"><div class="label">Con errores</div><div class="valor" style="font-size:22px">${legajosError}</div></div>
      </div>

      ${imeisPendientes.length ? `
        <div style="background:var(--amarillo-suave);border:1px solid #fde68a;border-radius:8px;padding:12px;margin-bottom:12px">
          <p style="font-weight:600;color:var(--amarillo);font-size:13px">⚠️ ${imeisPendientes.length} IMEIs no encontrados en stock</p>
          <p style="font-size:12px;color:var(--gris-700);margin-top:4px">Guardados como pendientes. Creá los remitos de ingreso correspondientes.</p>
          <div style="max-height:100px;overflow-y:auto;margin-top:8px;display:flex;flex-wrap:wrap;gap:4px">
            ${imeisPendientes.map(ip => `<span class="badge badge-amarillo" style="font-family:monospace">${ip.imei}</span>`).join('')}
          </div>
        </div>
      ` : ''}

      ${legajosConError.length ? `
        <div style="background:var(--rojo-suave);border:1px solid #fca5a5;border-radius:8px;padding:12px;margin-bottom:12px">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
            <p style="font-weight:600;color:var(--rojo);font-size:13px">❌ ${legajosConError.length} SDS con errores — detalle para corregir</p>
            <button class="btn btn-sm btn-secondary" onclick="descargarLogErrores()">⬇️ Descargar log (.txt)</button>
          </div>
          <div style="max-height:240px;overflow-y:auto;background:white;border-radius:6px">
            <table>
              <thead><tr><th>N° SDS</th><th>IMEI</th><th>Entidad</th><th>NIM</th><th>Errores</th></tr></thead>
              <tbody>
                ${legajosConError.map(l => `
                  <tr>
                    <td style="font-family:monospace;font-weight:600">${l.id_sds}</td>
                    <td style="font-family:monospace;font-size:11px">${l.imei || '—'}</td>
                    <td style="font-family:monospace;font-size:11px">${l.entidad_id || '—'}</td>
                    <td style="font-family:monospace;font-size:11px">${l.nim || '—'}</td>
                    <td>${l.errores.map(e => `<span class="badge badge-rojo" style="margin:1px;font-size:10px">${e}</span>`).join('')}</td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
          <p style="font-size:11px;color:var(--gris-500);margin-top:8px">
            💡 <strong>Error IMEI</strong>: el equipo no está cargado en tu Stock (creá el remito de ingreso correspondiente).
            <strong>Error Entidad</strong>: el código de entidad del archivo no está asociado a ningún Punto de Venta (revisá "Puntos de Venta" → códigos de entidad).
          </p>
        </div>
      ` : ''}

      ${!legajosConError.length && !imeisPendientes.length ? `
        <div style="background:var(--verde-suave);border:1px solid #bbf7d0;border-radius:8px;padding:12px;text-align:center">
          <p style="font-weight:600;color:var(--verde);font-size:13px">✅ Todos los SDS se procesaron correctamente, sin errores.</p>
        </div>
      ` : ''}
    `;
  }

  importadorState.sheets = {};
  toast(`Importación completada: ${legajosOk} OK, ${legajosError} con errores`);
}

function generarPDFRemito(remitoId) {
  console.log('generarPDFRemito llamado con:', remitoId);
  const remitos = CACHE['remitos'] || [];
  // Buscar por id exacto o por nro_remito como fallback
  let remito = remitos.find(r => r.id === remitoId);
  if (!remito) remito = remitos.find(r => r.nro_remito === remitoId);
  if (!remito) {

  function generarBarcode128(texto) {
    const CODE128_B = [
      212222,222122,222221,121223,121322,131222,122213,122312,132212,221213,
      221312,231212,112232,122132,122231,113222,123122,123221,223211,221132,
      221231,213212,223112,312131,311222,321122,321221,312212,322112,322211,
      212123,212321,232121,111323,131123,131321,112313,132113,132311,211313,
      231113,231311,112133,112331,132131,113123,113321,133121,313121,211331,
      231131,213113,213311,213131,311123,311321,331121,312113,312311,332111,
      314111,221411,431111,111224,111422,121124,121421,141122,141221,112214,
      112412,122114,122411,142112,142211,241211,221114,413111,241112,134111,
      111242,121142,121241,114212,124112,124211,411212,421112,421211,212141,
      214121,412121,111143,111341,131141,114113,114311,411113,411311,113141,
      114131,311141,411131,211412,211214,211232,2331112
    ];
    const START_B = 104;
    const STOP = 106;
    const chars = texto.split('').map(c => c.charCodeAt(0) - 32);
    let checksum = START_B;
    chars.forEach((c, i) => checksum += c * (i + 1));
    checksum %= 103;

    const barGroups = [START_B, ...chars, checksum, STOP];
    let svgBars = '';
    let x = 0;
    const h = 50;

    barGroups.forEach((code, gi) => {
      const pattern = String(CODE128_B[code] || 0).padStart(6, '0');
      for (let i = 0; i < pattern.length; i++) {
        const w = parseInt(pattern[i]);
        if (i % 2 === 0) svgBars += `<rect x="${x}" y="0" width="${w * 2}" height="${h}" fill="#000"/>`;
        x += w * 2;
      }
      if (gi === barGroups.length - 1) x += 4; // quiet zone derecha
    });

    const totalWidth = x + 20;
    return `<svg xmlns="http://www.w3.org/2000/svg" width="${totalWidth * 0.5}" height="32" viewBox="0 0 ${totalWidth} 64">
      <rect width="${totalWidth}" height="64" fill="white"/>
      <g transform="translate(10,0)">${svgBars}</g>

  .info-box p { font-size: 12px; font-weight: 600; }
  table { width: 100%; border-collapse: collapse; margin-bottom: 14px; }
  th { background: #DA0000; color: white; padding: 7px 10px; text-align: left; font-size: 10px; text-transform: uppercase; letter-spacing: .4px; }
  td { padding: 6px 10px; border-bottom: 1px solid #eee; font-size: 11px; }

  @media print { body { padding: 0; } button { display: none; } }

</head>
<body>

</table>

<div class="footer">

</body>
</html>`;

  // Mostrar preview en modal con opción de imprimir / guardar / compartir
